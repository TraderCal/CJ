<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>MLB Outcome Predictor</title>
<style>
:root{
  --bg:#0a0e1a;--surface:#111827;--surface2:#1a2236;--surface3:#1f2d45;
  --border:#2a3a55;--accent:#e8192c;--accent2:#0066cc;--gold:#f0a500;
  --text:#e8edf5;--text2:#8fa3be;--text3:#5a7099;
  --green:#22c55e;--red:#ef4444;--blue:#3b82f6;--purple:#a855f7;
  --radius:12px;--sidebar-w:290px;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh;display:flex;flex-direction:column;}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ── HEADER ── */
.header{background:linear-gradient(135deg,#0a0e1a,#0d1829);border-bottom:2px solid var(--accent);padding:12px 16px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:200;box-shadow:0 4px 30px rgba(232,25,44,.15);}
.icon-btn{width:40px;height:40px;border:1px solid var(--border);border-radius:8px;background:var(--surface2);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:18px;transition:all .2s;color:var(--text);}
.icon-btn:hover{border-color:var(--accent);background:var(--surface3);}
.hamburger{flex-direction:column;gap:5px;}
.hamburger span{display:block;width:18px;height:2px;background:var(--text);border-radius:1px;transition:all .3s;}
.hamburger.open span:nth-child(1){transform:rotate(45deg) translate(5px,5px);}
.hamburger.open span:nth-child(2){opacity:0;}
.hamburger.open span:nth-child(3){transform:rotate(-45deg) translate(5px,-5px);}
.logo{display:flex;align-items:center;gap:10px;}
.logo-badge{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,var(--accent),#c0001f);display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:900;color:#fff;box-shadow:0 0 18px rgba(232,25,44,.4);flex-shrink:0;}
.app-title{font-size:18px;font-weight:800;}
.app-title span{color:var(--accent);}
.app-sub{font-size:9px;color:var(--text3);text-transform:uppercase;letter-spacing:1.5px;}
.header-right{display:flex;gap:8px;align-items:center;margin-left:auto;flex-wrap:wrap;}
.ctrl{display:flex;flex-direction:column;}
.ctrl-lbl{font-size:9px;color:var(--text3);text-transform:uppercase;letter-spacing:1px;margin-bottom:2px;}
select,input[type=date]{background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:7px 10px;border-radius:8px;font-size:13px;cursor:pointer;outline:none;appearance:none;-webkit-appearance:none;}
select:focus,input[type=date]:focus{border-color:var(--accent2);}
select option{background:var(--surface2);}
.btn{padding:7px 14px;border:none;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600;display:flex;align-items:center;gap:5px;white-space:nowrap;}
.btn-primary{background:var(--accent);color:#fff;}
.btn-primary:hover{background:#c0001f;}

/* Mobile filter drawer */
.filter-drawer{display:none;}

/* ── BODY LAYOUT ── */
.body-wrap{display:flex;flex:1;min-height:0;}
.backdrop{display:none;position:fixed;inset:0;z-index:250;background:rgba(0,0,0,.55);backdrop-filter:blur(3px);}
.backdrop.on{display:block;}

/* ── SIDEBAR ── */
.sidebar{width:var(--sidebar-w);min-width:var(--sidebar-w);background:var(--surface);border-right:1px solid var(--border);height:calc(100vh - 66px);overflow-y:auto;position:sticky;top:66px;flex-shrink:0;transform:translateX(calc(-1 * var(--sidebar-w)));margin-left:calc(-1 * var(--sidebar-w));transition:transform .3s cubic-bezier(.4,0,.2,1),margin-left .3s cubic-bezier(.4,0,.2,1);}
.sidebar.open{transform:translateX(0);margin-left:0;}
.sb-head{padding:12px 14px 10px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--surface);z-index:5;}
.sb-title{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--text3);}
.acc{border-bottom:1px solid var(--border);}
.acc-btn{width:100%;padding:12px 14px;background:none;border:none;cursor:pointer;display:flex;align-items:center;gap:9px;color:var(--text);font-size:13px;font-weight:600;text-align:left;min-height:48px;}
.acc-btn:hover,.acc-btn.on{background:var(--surface2);}
.acc-label{flex:1;}
.acc-chevron{font-size:10px;color:var(--text3);transition:transform .25s;}
.acc-btn.on .acc-chevron{transform:rotate(180deg);}
.acc-body{display:none;padding:8px 10px 10px;}
.acc-body.on{display:block;}
.lc{background:var(--surface2);border:1px solid var(--border);border-radius:9px;padding:10px 12px;margin-bottom:7px;position:relative;overflow:hidden;transition:all .18s;}
.lc:last-child{margin-bottom:0;}
.lc:hover{border-color:var(--accent2);transform:translateX(2px);}
.lc::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;border-radius:2px 0 0 2px;}
.lc-hr::before{background:var(--purple);}
.lc-hit::before{background:var(--blue);}
.lc-rbi::before{background:var(--green);}
.lc-rank{position:absolute;right:10px;top:8px;font-size:16px;font-weight:900;color:var(--surface3);}
.r1{color:var(--gold)!important;font-size:19px!important;}
.r2{color:var(--text3)!important;}
.r3{color:#cd7f32!important;}
.lc-name{font-size:12px;font-weight:700;padding-right:24px;margin-bottom:2px;}
.lc-team{font-size:9px;color:var(--text3);margin-bottom:6px;}
.lc-stats{display:flex;gap:10px;flex-wrap:wrap;}
.lsv{font-size:14px;font-weight:800;line-height:1.1;}
.lsl{font-size:9px;color:var(--text3);text-transform:uppercase;}
.lc-proj{margin-top:7px;padding-top:7px;border-top:1px solid rgba(255,255,255,.05);display:flex;justify-content:space-between;align-items:center;}
.lc-pv{font-size:12px;font-weight:700;}
.lc-pl{font-size:9px;color:var(--text3);text-transform:uppercase;}
.badge-play{display:inline-block;font-size:9px;font-weight:700;padding:2px 7px;border-radius:8px;margin-top:5px;background:rgba(34,197,94,.12);border:1px solid rgba(34,197,94,.3);color:var(--green);}
.badge-off{display:inline-block;font-size:9px;padding:2px 7px;border-radius:8px;margin-top:5px;background:rgba(90,112,153,.1);border:1px solid rgba(90,112,153,.2);color:var(--text3);}
.sb-spin{padding:16px;text-align:center;color:var(--text3);font-size:12px;}
.mini-sp{width:14px;height:14px;border:2px solid var(--border);border-top-color:var(--accent2);border-radius:50%;animation:spin .8s linear infinite;display:inline-block;vertical-align:middle;margin-right:5px;}

/* ── MAIN ── */
.main-wrap{flex:1;overflow-x:hidden;min-width:0;}
.main{max-width:1200px;margin:0 auto;padding:18px;}

/* STATUS */
.status{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px 16px;margin-bottom:14px;display:flex;align-items:center;gap:10px;font-size:13px;color:var(--text2);}
.sp{width:16px;height:16px;border:2px solid var(--border);border-top-color:var(--accent2);border-radius:50%;animation:spin .8s linear infinite;flex-shrink:0;}

/* GAME GRID */
.game-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:9px;margin-bottom:16px;}
.game-card{background:var(--surface);border:2px solid var(--border);border-radius:var(--radius);padding:12px 13px;cursor:pointer;transition:all .2s;position:relative;overflow:hidden;}
.game-card:hover,.game-card:active{border-color:var(--accent2);transform:translateY(-1px);}
.game-card.sel{border-color:var(--accent);background:var(--surface2);}
.game-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--accent2),var(--accent));opacity:0;transition:opacity .2s;}
.game-card.sel::before,.game-card:hover::before{opacity:1;}
.gc-time{font-size:9px;color:var(--text3);margin-bottom:6px;display:flex;justify-content:space-between;align-items:center;gap:4px;}
.gc-matchup{display:flex;justify-content:space-between;align-items:center;gap:6px;}
.gc-team{display:flex;flex-direction:column;align-items:center;gap:2px;flex:1;}
.gc-abbr{font-size:16px;font-weight:800;}
.gc-rec{font-size:9px;color:var(--text3);}
.gc-sep{font-size:11px;color:var(--text3);}
.gc-venue{font-size:9px;color:var(--text3);margin-top:5px;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.badge{font-size:9px;font-weight:700;padding:2px 6px;border-radius:20px;text-transform:uppercase;flex-shrink:0;}
.b-sched{background:rgba(59,130,246,.15);color:var(--blue);border:1px solid rgba(59,130,246,.3);}
.b-live{background:rgba(239,68,68,.15);color:var(--red);border:1px solid rgba(239,68,68,.3);animation:pulse 1.5s infinite;}
.b-final{background:rgba(34,197,94,.15);color:var(--green);border:1px solid rgba(34,197,94,.3);}

/* DETAIL */
.detail{display:none;animation:fadeIn .3s ease;}
.detail.on{display:block;}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin-bottom:14px;}
.sec-title{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--text3);margin-bottom:14px;display:flex;align-items:center;gap:7px;}
.sec-title::before{content:'';width:3px;height:12px;background:var(--accent);border-radius:2px;flex-shrink:0;}

/* PRED BOX */
.pred-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
.pred-winner{font-size:20px;font-weight:900;}
.pred-conf{font-size:11px;color:var(--text2);margin-top:3px;}
.pred-score{margin-left:auto;text-align:right;}

/* HERO */
.hero-inner{display:flex;justify-content:space-between;align-items:center;gap:12px;position:relative;}
.hero-inner::after{content:'⚾';position:absolute;right:-10px;top:-10px;font-size:90px;opacity:.04;transform:rotate(15deg);pointer-events:none;}
.ht{display:flex;flex-direction:column;align-items:center;gap:4px;flex:1;}
.ht-abbr{font-size:42px;font-weight:900;letter-spacing:-2px;line-height:1;}
.ht-name{font-size:10px;color:var(--text2);}
.ht-rec{font-size:9px;color:var(--text3);}
.hv{display:flex;flex-direction:column;align-items:center;gap:4px;}
.hv-score{font-size:44px;font-weight:900;color:var(--text2);}
.live-dot{background:var(--red);color:#fff;font-size:9px;font-weight:700;padding:2px 8px;border-radius:20px;text-transform:uppercase;animation:pulse 1.5s infinite;}

/* WIN PROB */
.prob-bar-wrap{position:relative;height:44px;margin:8px 0;}
.prob-bg{height:30px;border-radius:8px;overflow:hidden;display:flex;position:absolute;left:0;right:0;top:7px;background:var(--surface2);}
.prob-away{height:100%;transition:width 1s cubic-bezier(.34,1.56,.64,1);background:linear-gradient(90deg,#1d4ed8,#3b82f6);}
.prob-home{height:100%;transition:width 1s cubic-bezier(.34,1.56,.64,1);background:linear-gradient(90deg,#dc2626,#e8192c);margin-left:auto;}
.prob-mid{position:absolute;left:50%;top:2px;bottom:0;width:2px;background:var(--bg);transform:translateX(-50%);}
.prob-nums{display:flex;justify-content:space-between;margin-top:4px;}
.prob-pct{font-size:22px;font-weight:900;line-height:1;}
.prob-tn{font-size:10px;color:var(--text2);margin-top:2px;}
.factors{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:7px;margin-top:12px;}
.factor{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:8px 10px;}
.fn{font-size:9px;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-bottom:4px;}
.fb-bg{height:4px;background:var(--surface3);border-radius:2px;margin-bottom:4px;overflow:hidden;}
.fb-fill{height:100%;border-radius:2px;background:linear-gradient(90deg,var(--accent2),var(--accent));transition:width 1.2s ease;}
.fv{font-size:10px;font-weight:600;display:flex;justify-content:space-between;}

/* PITCHING */
.pitch-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px;}
.pitch-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:15px;}
.pitch-hdr{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
.pitch-num{width:38px;height:38px;border-radius:50%;background:var(--surface2);border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;flex-shrink:0;}
.pitch-info{flex:1;min-width:0;}
.pitch-name{font-size:13px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.pitch-team{font-size:9px;color:var(--text3);margin-top:2px;}
.pitch-hand{background:var(--surface2);border:1px solid var(--border);border-radius:5px;padding:2px 7px;font-size:9px;font-weight:700;color:var(--gold);flex-shrink:0;}
.sg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;}
.sb2{background:var(--surface2);border:1px solid var(--border);border-radius:7px;padding:7px;text-align:center;}
.sv{font-size:15px;font-weight:800;line-height:1.1;}
.sn{font-size:8px;color:var(--text3);text-transform:uppercase;letter-spacing:.7px;margin-top:2px;}
.sv.good{color:var(--green);}
.sv.bad{color:var(--red);}
.sv.avg{color:var(--gold);}
.hr-vuln{margin-top:9px;padding:8px 10px;background:rgba(168,85,247,.07);border:1px solid rgba(168,85,247,.2);border-radius:8px;display:flex;align-items:center;gap:9px;}

/* LINEUP */
.matchup-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:15px;margin-bottom:14px;}
.tabs{display:flex;gap:6px;margin-bottom:11px;flex-wrap:wrap;}
.tab{padding:7px 13px;border-radius:7px;border:1px solid var(--border);background:var(--surface2);color:var(--text2);font-size:12px;font-weight:600;cursor:pointer;transition:all .2s;min-height:38px;}
.tab.on{background:var(--accent);color:#fff;border-color:var(--accent);}
.ltable{width:100%;border-collapse:collapse;}
.ltable th{text-align:left;font-size:9px;color:var(--text3);text-transform:uppercase;letter-spacing:.7px;padding:6px 7px;border-bottom:1px solid var(--border);}
.ltable th.r,.ltable td.r{text-align:right;}
.ltable td{padding:6px 7px;border-bottom:1px solid rgba(255,255,255,.04);font-size:11px;}
.ltable tr:hover td{background:rgba(255,255,255,.03);}
.pill{display:inline-block;font-size:10px;font-weight:700;padding:1px 6px;border-radius:9px;background:var(--surface2);border:1px solid var(--border);}
.pill.great{background:rgba(34,197,94,.12);border-color:rgba(34,197,94,.3);color:var(--green);}
.pill.poor{background:rgba(239,68,68,.12);border-color:rgba(239,68,68,.3);color:var(--red);}
.pill.mid{background:rgba(240,165,0,.12);border-color:rgba(240,165,0,.3);color:var(--gold);}
.pbar{width:44px;height:4px;background:var(--surface3);border-radius:2px;overflow:hidden;display:inline-block;vertical-align:middle;margin-left:3px;}
.pfill{height:100%;border-radius:2px;}

/* ODDS */
.odds-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;}
.odds-box{background:var(--surface2);border:1px solid var(--border);border-radius:9px;padding:10px 12px;}
.odds-lbl{font-size:9px;color:var(--text3);text-transform:uppercase;letter-spacing:.7px;margin-bottom:5px;}
.odds-val{font-size:18px;font-weight:800;}

/* STANDINGS */
.stand-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:11px;margin-bottom:16px;}
.stand-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px;}
.dname{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;color:var(--text3);margin-bottom:8px;}
.srow{display:flex;align-items:center;gap:5px;padding:4px 0;border-bottom:1px solid rgba(255,255,255,.04);font-size:11px;}
.srow:last-child{border-bottom:none;}
.srow.hl{background:rgba(232,25,44,.06);border-radius:5px;}
.sp2{color:var(--text3);width:13px;}
.sname{flex:1;}
.srec{color:var(--text2);width:44px;text-align:right;}
.spct{color:var(--gold);width:38px;text-align:right;font-weight:600;}
.sgb{color:var(--text3);width:28px;text-align:right;font-size:9px;}

/* SOURCES */
.src-bar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:10px;color:var(--text3);margin-top:14px;padding:7px 0;border-top:1px solid var(--border);}
.src{background:var(--surface2);border:1px solid var(--border);border-radius:5px;padding:2px 7px;color:var(--text2);}

/* EMPTY */
.empty{text-align:center;padding:40px 20px;color:var(--text3);}

/* ── MOBILE ── */
@media(max-width:768px){
  /* Sidebar overlays */
  .sidebar{position:fixed;top:0;left:0;bottom:0;height:100vh;z-index:300;margin-left:0;transform:translateX(-100%);}
  .sidebar.open{transform:translateX(0);}

  /* Header */
  .header{padding:10px 12px;}
  .app-sub{display:none;}
  .logo-badge{width:36px;height:36px;font-size:15px;}
  .app-title{font-size:16px;}
  .header-right{display:none;width:100%;}
  /* Show filter drawer instead */
  .filter-drawer{display:flex;flex-direction:column;gap:8px;background:var(--surface);border-bottom:1px solid var(--border);padding:10px 12px;position:sticky;top:62px;z-index:190;}
  .filter-drawer select,.filter-drawer input{width:100%;font-size:14px;padding:10px 12px;}
  .filter-drawer .btn{width:100%;justify-content:center;padding:11px;}

  /* Game grid 2-col */
  .game-grid{grid-template-columns:1fr 1fr;gap:7px;}
  .gc-abbr{font-size:14px;}
  .main{padding:10px;}

  /* Hero */
  .ht-abbr{font-size:28px;}
  .hv-score{font-size:32px;}
  .card{padding:14px;}

  /* Pred box */
  .pred-row{flex-direction:column;align-items:flex-start;}
  .pred-score{margin-left:0;border-top:1px solid var(--border);padding-top:8px;width:100%;}

  /* Win prob */
  .prob-pct{font-size:19px;}
  .factors{grid-template-columns:1fr 1fr;}

  /* Pitching: stack */
  .pitch-grid{grid-template-columns:1fr;}
  .sg{grid-template-columns:repeat(4,1fr);}
  .sv{font-size:13px;}

  /* Tabs */
  .tabs{flex-direction:column;}
  .tab{width:100%;text-align:center;}

  /* Lineup: hide low-priority cols */
  .ltable .col-obp,.ltable .col-hitpct,.ltable .col-kpct,.ltable .col-rbipct{display:none;}
  .ltable th,.ltable td{padding:5px 4px;font-size:10px;}
  .pbar{width:30px;}

  /* Odds, standings */
  .odds-grid{grid-template-columns:1fr 1fr;}
  .stand-grid{grid-template-columns:1fr;}
  .src-bar{flex-direction:column;align-items:flex-start;}
}

@media(max-width:480px){
  .game-grid{grid-template-columns:1fr;}
  .ht-abbr{font-size:24px;}
  .hv-score{font-size:28px;}
  .sg{grid-template-columns:repeat(2,1fr);}
  .factors{grid-template-columns:1fr 1fr;}
  /* Hide RBI col too on tiny screens */
  .ltable .col-rbi{display:none;}
}
</style>
</head>
<body>

<div class="backdrop" id="backdrop" onclick="closeSidebar()"></div>

<!-- HEADER -->
<div class="header">
  <button class="icon-btn hamburger" id="menuBtn" onclick="toggleSidebar()">
    <span></span><span></span><span></span>
  </button>
  <div class="logo">
    <div class="logo-badge">⚾</div>
    <div><div class="app-title">MLB <span>Predictor</span></div><div class="app-sub">Live Outcome Analysis</div></div>
  </div>
  <div class="header-right" id="headerRight">
    <div class="ctrl"><div class="ctrl-lbl">Date</div><input type="date" id="datePicker"></div>
    <div class="ctrl"><div class="ctrl-lbl">Game</div><select id="gameSelect" style="min-width:180px" onchange="if(this.value)selectGame(+this.value)"><option value="">— Pick a game —</option></select></div>
    <button class="btn btn-primary" onclick="loadGames()">⟳ Refresh</button>
  </div>
</div>

<!-- MOBILE FILTER DRAWER (always visible on mobile, hidden on desktop) -->
<div class="filter-drawer" id="filterDrawer">
  <input type="date" id="datePickerM">
  <select id="gameSelectM" onchange="if(this.value)selectGame(+this.value)"><option value="">— Pick a game —</option></select>
  <button class="btn btn-primary" onclick="loadGames()">⟳ Refresh</button>
</div>

<!-- BODY -->
<div class="body-wrap">

  <!-- SIDEBAR -->
  <div class="sidebar" id="sidebar">
    <div class="sb-head"><div class="sb-title">📊 Today's Projected Leaders</div></div>

    <div class="acc">
      <button class="acc-btn on" id="ab-hr" onclick="toggleAcc('hr')">
        <span>💣</span><span class="acc-label">Top 5 HR Projections</span><span class="acc-chevron">▼</span>
      </button>
      <div class="acc-body on" id="body-hr"><div class="sb-spin"><span class="mini-sp"></span>Loading…</div></div>
    </div>
    <div class="acc">
      <button class="acc-btn" id="ab-hit" onclick="toggleAcc('hit')">
        <span>🎯</span><span class="acc-label">Top 5 Hit Projections</span><span class="acc-chevron">▼</span>
      </button>
      <div class="acc-body" id="body-hit"><div class="sb-spin"><span class="mini-sp"></span>Loading…</div></div>
    </div>
    <div class="acc">
      <button class="acc-btn" id="ab-rbi" onclick="toggleAcc('rbi')">
        <span>💥</span><span class="acc-label">Top 5 RBI Projections</span><span class="acc-chevron">▼</span>
      </button>
      <div class="acc-body" id="body-rbi"><div class="sb-spin"><span class="mini-sp"></span>Loading…</div></div>
    </div>
  </div>

  <!-- MAIN -->
  <div class="main-wrap">
    <div class="main">
      <div class="status" id="statusEl"><div class="sp" id="spEl"></div><span id="statusMsg">Connecting to MLB…</span></div>
      <div class="game-grid" id="gameGrid"></div>
      <div class="detail" id="detail">
        <div id="predEl"></div>
        <div id="heroEl"></div>
        <div id="probEl"></div>
        <div class="pitch-grid" id="pitchEl"></div>
        <div id="matchupEl"></div>
        <div id="oddsEl"></div>
      </div>
      <div class="empty" id="emptyEl" style="display:none">
        <div style="font-size:48px;opacity:.4;margin-bottom:12px">⚾</div>
        <div style="font-size:16px;font-weight:600;color:var(--text2);margin-bottom:6px">No games today</div>
        <div>Try another date — MLB season runs April–October</div>
      </div>
      <div id="standEl"></div>
      <div class="src-bar" id="srcBar" style="display:none">
        <span>Sources:</span>
        <span class="src">MLB Stats API</span><span class="src">ESPN</span><span class="src">Multi-factor model</span>
        <span style="margin-left:auto">Updated <span id="updatedEl"></span></span>
      </div>
    </div>
  </div>
</div>

<script>
// ═══════════════════════════════════════════
//  MLB PREDICTOR — COMPLETE APP
// ═══════════════════════════════════════════
const MLB   = 'https://statsapi.mlb.com/api/v1';
const MLB11 = 'https://statsapi.mlb.com/api/v1.1';
const ESPN  = 'https://site.api.espn.com/apis/site/v2/sports/baseball/mlb';
const YR    = new Date().getFullYear();

const S = {
  date:'', games:[], espnGames:[], selPk:null,
  awayPS:null, homePS:null, awayLineup:[], homeLineup:[],
  tab:'home', sidebarOpen:false
};

const $  = id => document.getElementById(id);
const go = fn => { try { fn(); } catch(e) { console.warn(e); } };
const isMobile = () => window.innerWidth <= 768;

async function api(url) {
  try {
    const r = await fetch(url, { headers:{ Accept:'application/json' } });
    if (!r.ok) return null;
    return r.json();
  } catch { return null; }
}

// ── TIME / RECORD HELPERS ─────────────────
function fmtTime(d) {
  if (!d) return '—';
  try { return new Date(d).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit',timeZoneName:'short'}); }
  catch { return '—'; }
}
function fmtRec(r) { return r ? `${r.wins||0}-${r.losses||0}` : ''; }
function animPct(id, val) {
  const el=$(id); if(!el) return; let c=0;
  const t=setInterval(()=>{ c=Math.min(c+val/25,val); el.textContent=Math.round(c)+'%'; if(c>=val)clearInterval(t); },28);
}
const TC={108:'#003263',109:'#A71930',110:'#DF4601',111:'#0C2340',112:'#0E3386',113:'#C6011F',114:'#00385D',115:'#333366',116:'#0C2340',117:'#EB6E1F',118:'#004687',119:'#005A9C',120:'#AB0003',121:'#002D72',133:'#003831',134:'#FDB827',135:'#FFC52F',136:'#005C5C',137:'#FD5A1E',138:'#C41E3A',139:'#092C5C',140:'#003278',141:'#134A8E',142:'#002B5C',143:'#E81828',144:'#13274F',145:'#27251F',146:'#00A3E0',147:'#003087',158:'#002D72'};
const tCol = (id,side) => TC[id]||(side==='away'?'#2563eb':'#dc2626');

// ── STATUS ────────────────────────────────
function setStatus(msg, done=false) {
  const el=$('statusEl'); el.style.display='flex';
  $('statusMsg').textContent = msg;
  $('spEl').style.display = done ? 'none' : 'block';
  if (done) {
    $('srcBar').style.display='flex';
    $('updatedEl').textContent=new Date().toLocaleTimeString();
    setTimeout(()=>{ el.style.display='none'; }, 2500);
  }
}

// ── SIDEBAR ───────────────────────────────
function toggleSidebar() {
  S.sidebarOpen = !S.sidebarOpen;
  $('sidebar').classList.toggle('open', S.sidebarOpen);
  $('menuBtn').classList.toggle('open', S.sidebarOpen);
  $('backdrop').classList.toggle('on', S.sidebarOpen && isMobile());
  document.body.style.overflow = (S.sidebarOpen && isMobile()) ? 'hidden' : '';
}
function closeSidebar() {
  S.sidebarOpen = false;
  $('sidebar').classList.remove('open');
  $('menuBtn').classList.remove('open');
  $('backdrop').classList.remove('on');
  document.body.style.overflow = '';
}
function toggleAcc(key) {
  const btn=$(`ab-${key}`), body=$(`body-${key}`);
  const opening = !body.classList.contains('on');
  body.classList.toggle('on', opening);
  btn.classList.toggle('on', opening);
  btn.querySelector('.acc-chevron').style.transform = opening ? 'rotate(180deg)' : '';
}

// ── LEADERS ───────────────────────────────
async function loadLeaders() {
  const base=`${MLB}/stats?stats=season&group=hitting&gameType=R&season=${YR}&playerPool=All&limit=50`;
  const [hrD,hitD,rbiD] = await Promise.all([
    api(`${base}&sortStat=homeRuns`),
    api(`${base}&sortStat=hits`),
    api(`${base}&sortStat=rbi`),
  ]);
  renderLeaders('hr',  hrD?.stats?.[0]?.splits||[],  'var(--purple)', 'HR',   'homeRuns');
  renderLeaders('hit', hitD?.stats?.[0]?.splits||[], 'var(--blue)',   'Hits', 'hits');
  renderLeaders('rbi', rbiD?.stats?.[0]?.splits||[], 'var(--green)', 'RBI',  'rbi');
}

function renderLeaders(type, splits, color, label, statKey) {
  const body = $(`body-${type}`);
  if (!splits.length) { body.innerHTML=`<div class="sb-spin">No season data yet</div>`; return; }
  const playingTeams = new Set(S.games.flatMap(g=>[g.teams?.away?.team?.id,g.teams?.home?.team?.id]).filter(Boolean));
  const rk = i => i===0?'r1':i===1?'r2':i===2?'r3':'';

  body.innerHTML = splits.slice(0,5).map((sp,i) => {
    const p=sp.player, t=sp.team, s=sp.stat||{};
    const main=s[statKey]||0, avg=s.avg||'—', ops=s.ops||'—', slg=s.slg||'—', ab=s.atBats||0, gp=s.gamesPlayed||1;
    const playing=playingTeams.has(t?.id);
    // Projections
    const hr=s.homeRuns||0;
    const hrRate = ab>0 ? hr/ab : Math.max(.01,(parseFloat(slg)||.42-.28)*.12);
    const projHR  = (hrRate*3.5*(parseFloat(slg)||.42)/.42*100).toFixed(1);
    const projH   = ((parseFloat(avg)||.250)*4*100).toFixed(1);
    const projRBI = ((s.rbi||0)/gp*(i<=1?1.15:1)*100).toFixed(1);
    const projV   = type==='hr'?projHR:type==='hit'?projH:projRBI;
    return `<div class="lc lc-${type}">
      <div class="lc-rank ${rk(i)}">${i+1}</div>
      <div class="lc-name">${p?.fullName||'—'}</div>
      <div class="lc-team">${t?.name||'—'}</div>
      <div class="lc-stats">
        <div><div class="lsv" style="color:${color}">${main}</div><div class="lsl">${label}</div></div>
        <div><div class="lsv">${avg}</div><div class="lsl">AVG</div></div>
        <div><div class="lsv">${ops}</div><div class="lsl">OPS</div></div>
      </div>
      <div class="lc-proj"><span class="lc-pl">📈 Today proj.</span><span class="lc-pv" style="color:${color}">${projV}%</span></div>
      <div>${playing?`<span class="badge-play">✓ Playing today</span>`:`<span class="badge-off">Not scheduled</span>`}</div>
    </div>`;
  }).join('');
}

// ══════════════════════════════════════════
//  SCHEDULE
// ══════════════════════════════════════════
async function loadGames() {
  setStatus('Fetching schedule…');
  $('gameGrid').innerHTML='';
  $('detail').classList.remove('on');
  $('emptyEl').style.display='none';

  // Sync both date pickers
  const d1=$('datePicker').value, d2=$('datePickerM').value;
  S.date = d1||d2||new Date().toISOString().split('T')[0];
  $('datePicker').value=$('datePickerM').value=S.date;

  const [sched, espn] = await Promise.all([
    api(`${MLB}/schedule?sportId=1&date=${S.date}&hydrate=probablePitcher(note),linescore,team,venue,weather`),
    api(`${ESPN}/scoreboard?dates=${S.date.replace(/-/g,'')}`)
  ]);

  S.games     = sched?.dates?.[0]?.games || [];
  S.espnGames = espn?.events || [];

  if (!S.games.length) {
    setStatus('No games found', true);
    $('emptyEl').style.display='block'; return;
  }

  // Sync both game dropdowns
  const optHtml = '<option value="">— Pick a game —</option>' +
    S.games.map(g=>{
      const a=g.teams.away.team.abbreviation||g.teams.away.team.teamName;
      const h=g.teams.home.team.abbreviation||g.teams.home.team.teamName;
      return `<option value="${g.gamePk}">${a} @ ${h}  ·  ${fmtTime(g.gameDate)}</option>`;
    }).join('');
  $('gameSelect').innerHTML = $('gameSelectM').innerHTML = optHtml;

  renderGrid();
  renderLeaders('hr',[], 'var(--purple)','HR','homeRuns'); // trigger playing-today refresh
  loadLeaders(); // reload properly
  setStatus(`${S.games.length} games loaded`, true);
}

function renderGrid() {
  const grid=$('gameGrid'); grid.innerHTML='';
  S.games.forEach(g => {
    const aw=g.teams.away, hw=g.teams.home;
    const st=g.status?.detailedState||'';
    const isLive=/in progress|live/i.test(st), isFinal=/final|completed/i.test(st);
    const bc=isLive?'b-live':isFinal?'b-final':'b-sched';
    const bl=isLive?'🔴 LIVE':isFinal?'FINAL':fmtTime(g.gameDate);
    const div=document.createElement('div');
    div.className=`game-card${S.selPk===g.gamePk?' sel':''}`;
    div.onclick=()=>selectGame(g.gamePk);
    div.innerHTML=`
      <div class="gc-time"><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100px">${g.venue?.name||''}</span><span class="badge ${bc}">${bl}</span></div>
      <div class="gc-matchup">
        <div class="gc-team"><div class="gc-abbr" style="color:${tCol(aw.team.id,'away')}">${aw.team.abbreviation||aw.team.teamName}</div><div class="gc-rec">${fmtRec(aw.leagueRecord)}</div>${isLive||isFinal?`<div style="font-size:18px;font-weight:900;margin-top:2px">${aw.score??0}</div>`:''}</div>
        <div class="gc-sep">${isLive||isFinal?'–':'@'}</div>
        <div class="gc-team"><div class="gc-abbr" style="color:${tCol(hw.team.id,'home')}">${hw.team.abbreviation||hw.team.teamName}</div><div class="gc-rec">${fmtRec(hw.leagueRecord)}</div>${isLive||isFinal?`<div style="font-size:18px;font-weight:900;margin-top:2px">${hw.score??0}</div>`:''}</div>
      </div>
      ${g.teams.away.probablePitcher?`<div class="gc-venue">⚾ ${g.teams.away.probablePitcher.fullName} vs ${g.teams.home.probablePitcher?.fullName||'TBD'}</div>`:''}`;
    grid.appendChild(div);
  });
}

// ══════════════════════════════════════════
//  SELECT GAME
// ══════════════════════════════════════════
async function selectGame(pk) {
  S.selPk=pk;
  $('gameSelect').value=$('gameSelectM').value=pk;
  renderGrid();
  const game=S.games.find(g=>g.gamePk===pk);
  if (!game) return;

  // Close mobile sidebar if open
  if (S.sidebarOpen && isMobile()) closeSidebar();

  // ── STEP 1: Render immediately from schedule data ──────────────────
  S.awayPS=null; S.homePS=null; S.awayLineup=[]; S.homeLineup=[];
  $('detail').classList.add('on');
  $('detail').scrollIntoView({behavior:'smooth',block:'start'});
  setStatus('Loading predictions…');

  go(()=>renderPred(game));
  go(()=>renderHero(game));
  go(()=>renderProb(game));  // works from record alone
  $('pitchEl').innerHTML = pitchCard(game.teams.away.probablePitcher,null,game.teams.away.team,'Away') +
                           pitchCard(game.teams.home.probablePitcher,null,game.teams.home.team,'Home');
  go(()=>renderMatchup(game));

  // ── STEP 2: Fetch pitcher stats & rosters in background ──────────
  const awPkId=game.teams.away.probablePitcher?.id;
  const hwPkId=game.teams.home.probablePitcher?.id;
  const awTId=game.teams.away.team.id, hwTId=game.teams.home.team.id;

  const [live, awPS, hwPS, awRoster, hwRoster] = await Promise.all([
    api(`${MLB11}/game/${pk}/feed/live`),
    awPkId ? api(`${MLB}/people/${awPkId}/stats?stats=season&group=pitching&season=${YR}`) : null,
    hwPkId ? api(`${MLB}/people/${hwPkId}/stats?stats=season&group=pitching&season=${YR}`) : null,
    awTId  ? api(`${MLB}/teams/${awTId}/roster?rosterType=active&season=${YR}&hydrate=person(stats(type=season,group=hitting,season=${YR}))`) : null,
    hwTId  ? api(`${MLB}/teams/${hwTId}/roster?rosterType=active&season=${YR}&hydrate=person(stats(type=season,group=hitting,season=${YR}))`) : null,
  ]);

  S.awayPS = awPS?.stats?.[0]?.splits?.[0]?.stat || null;
  S.homePS = hwPS?.stats?.[0]?.splits?.[0]?.stat || null;

  // Build lineups
  const ld=live?.liveData;
  if (ld?.boxscore) {
    const buildLU = (side) => {
      const order=ld.boxscore.teams[side]?.battingOrder||[];
      const players=ld.boxscore.teams[side]?.players||{};
      return order.map(id=>{const p=players['ID'+id];return{id,name:p?.person?.fullName||'—',pos:p?.position?.abbreviation||'',stats:p?.seasonStats?.batting};});
    };
    S.awayLineup=buildLU('away'); S.homeLineup=buildLU('home');
  }
  if (!S.awayLineup.length) S.awayLineup=rosterLU(awRoster?.roster);
  if (!S.homeLineup.length) S.homeLineup=rosterLU(hwRoster?.roster);

  // ── STEP 3: Re-render with full data ─────────────────────────────
  go(()=>renderPred(game));
  go(()=>renderProb(game));
  $('pitchEl').innerHTML = pitchCard(game.teams.away.probablePitcher,S.awayPS,game.teams.away.team,'Away') +
                           pitchCard(game.teams.home.probablePitcher,S.homePS,game.teams.home.team,'Home');
  go(()=>renderMatchup(game));
  go(()=>renderOdds(game));
  setStatus('All data loaded ✅', true);
}

function rosterLU(roster) {
  return (roster||[]).filter(p=>p.position?.abbreviation!=='P').slice(0,9).map(p=>({
    id:p.person.id, name:p.person.fullName, pos:p.position?.abbreviation||'',
    stats:p.person?.stats?.[0]?.splits?.[0]?.stat||null
  }));
}

// ── WIN PROBABILITY (works without pitcher data) ───────────────────
function calcWP(game) {
  const aw=game.teams.away, hw=game.teams.home;
  const awW=aw.leagueRecord?.wins||0, awL=aw.leagueRecord?.losses||1;
  const hwW=hw.leagueRecord?.wins||0, hwL=hw.leagueRecord?.losses||1;
  const awWP=awW/(awW+awL)||.5, hwWP=hwW/(hwW+hwL)||.5;
  const awERA=parseFloat(S.awayPS?.era)||4.30, hwERA=parseFloat(S.homePS?.era)||4.30;
  const awEraS=Math.round(Math.max(0,100-(awERA/8)*100));
  const hwEraS=Math.round(Math.max(0,100-(hwERA/8)*100));
  const awWHIP=parseFloat(S.awayPS?.whip)||1.30, hwWHIP=parseFloat(S.homePS?.whip)||1.30;
  const awWS=Math.round(Math.max(0,100-(awWHIP/2)*100));
  const hwWS=Math.round(Math.max(0,100-(hwWHIP/2)*100));
  const awRD=Math.round((awWP-.5)*60), hwRD=Math.round((hwWP-.5)*60);
  const hC=hwWP*.35+(hwEraS/100)*.25+(hwWS/100)*.15+(hwRD>0?.05:0)+.03;
  const aC=awWP*.35+(awEraS/100)*.25+(awWS/100)*.15+(awRD>0?.05:0);
  const tot=(hC+aC)||1;
  return {total:Math.max(.38,Math.min(.65,.40+(hC/tot)*.30)),awWP,hwWP,awEraS,hwEraS,awWS,hwWS,awRD,hwRD};
}

// ── PREDICTION BOX ────────────────────────
function renderPred(game) {
  const f=calcWP(game), hp=Math.round(f.total*100), ap=100-hp;
  const isHome=hp>=ap;
  const winner=isHome?game.teams.home.team:game.teams.away.team;
  const prob=isHome?hp:ap;
  const conf=prob>=60?'High Confidence':prob>=55?'Moderate Confidence':'Lean';
  const aERA=parseFloat(S.awayPS?.era)||4.5, hERA=parseFloat(S.homePS?.era)||4.5;
  $('predEl').innerHTML=`
    <div class="card" style="background:linear-gradient(135deg,rgba(232,25,44,.07),rgba(0,102,204,.07))">
      <div class="pred-row">
        <div style="font-size:24px">🏆</div>
        <div>
          <div style="font-size:9px;color:var(--text3);text-transform:uppercase;letter-spacing:1px">Predicted Winner</div>
          <div class="pred-winner" style="color:${isHome?'var(--accent)':'#2563eb'}">${winner.name}</div>
          <div class="pred-conf">${conf} · ${prob}% win probability</div>
        </div>
        <div class="pred-score">
          <div style="font-size:9px;color:var(--text3);text-transform:uppercase;letter-spacing:1px">Projected Score</div>
          <div style="font-size:17px;font-weight:800;margin-top:3px">${game.teams.away.team.abbreviation} ${(hERA*.9).toFixed(1)} – ${(aERA*.9).toFixed(1)} ${game.teams.home.team.abbreviation}</div>
          <div style="font-size:9px;color:var(--text3);margin-top:2px">ERA-based estimate</div>
        </div>
      </div>
    </div>`;
}

// ── HERO ──────────────────────────────────
function renderHero(game) {
  const aw=game.teams.away, hw=game.teams.home;
  const st=game.status?.detailedState||'';
  const isLive=/in progress|live/i.test(st), isFinal=/final|completed/i.test(st);
  const wx=game.weather?`🌡 ${game.weather.temp}°F · ${game.weather.condition}`:'';
  $('heroEl').innerHTML=`
    <div class="card">
      <div class="hero-inner">
        <div class="ht"><div class="ht-abbr" style="color:${tCol(aw.team.id,'away')}">${aw.team.abbreviation||aw.team.teamName}</div><div class="ht-name">${aw.team.name}</div><div class="ht-rec">${fmtRec(aw.leagueRecord)}</div></div>
        <div class="hv">
          ${isLive||isFinal?`<div style="display:flex;align-items:center;gap:8px"><div class="hv-score">${aw.score??0}</div><div style="font-size:14px;color:var(--text3)">–</div><div class="hv-score">${hw.score??0}</div></div>${isLive?'<div class="live-dot">LIVE</div>':'<div style="font-size:10px;color:var(--text3)">FINAL</div>'}`:`<div style="font-size:13px;color:var(--text3);font-weight:600">VS</div><div style="font-size:11px;color:var(--text2)">${fmtTime(game.gameDate)}</div>`}
          <div style="font-size:9px;color:var(--text3);margin-top:4px">${game.venue?.name||''}</div>
          ${wx?`<div style="font-size:9px;color:var(--text3)">${wx}</div>`:''}
        </div>
        <div class="ht"><div class="ht-abbr" style="color:${tCol(hw.team.id,'home')}">${hw.team.abbreviation||hw.team.teamName}</div><div class="ht-name">${hw.team.name}</div><div class="ht-rec">${fmtRec(hw.leagueRecord)}</div></div>
      </div>
    </div>`;
}

// ── WIN PROB SECTION ──────────────────────
function renderProb(game) {
  const aw=game.teams.away, hw=game.teams.home;
  const f=calcWP(game), hp=Math.round(f.total*100), ap=100-hp;
  const hasERA=S.awayPS||S.homePS;
  $('probEl').innerHTML=`
    <div class="card">
      <div class="sec-title">Win Probability${!hasERA?' <span style="font-size:9px;color:var(--text3);font-weight:400;text-transform:none;letter-spacing:0">(record-based — pitcher stats loading)</span>':''}</div>
      <div style="display:flex;justify-content:space-between;margin-bottom:3px"><span style="font-size:9px;color:var(--text3)">${aw.team.abbreviation} Away</span><span style="font-size:9px;color:var(--text3)">${hw.team.abbreviation} Home</span></div>
      <div class="prob-bar-wrap">
        <div class="prob-bg"><div class="prob-away" id="pAway" style="width:0%"></div><div class="prob-home" id="pHome" style="width:0%"></div></div>
        <div class="prob-mid"></div>
      </div>
      <div class="prob-nums">
        <div><div class="prob-pct" style="color:#3b82f6" id="pAwayN">0%</div><div class="prob-tn">${aw.team.name}</div></div>
        <div style="text-align:right"><div class="prob-pct" style="color:var(--accent)" id="pHomeN">0%</div><div class="prob-tn">${hw.team.name}</div></div>
      </div>
      <div class="factors">
        ${[
          {n:'Win % Record', a:Math.round(f.awWP*100), h:Math.round(f.hwWP*100)},
          {n:'Home Field',   a:0, h:3},
          {n:'Pitcher ERA',  a:f.awEraS, h:f.hwEraS},
          {n:'Run Diff',     a:Math.max(0,f.awRD), h:Math.max(0,f.hwRD)},
          {n:'WHIP Factor',  a:f.awWS, h:f.hwWS},
        ].map(fc=>{
          const tot=(fc.a+fc.h)||100, hp2=Math.min(100,Math.round(fc.h/tot*100));
          return `<div class="factor"><div class="fn">${fc.n}</div><div class="fb-bg"><div class="fb-fill" style="width:${hp2}%"></div></div><div class="fv"><span style="color:#3b82f6">${aw.team.abbreviation} ${fc.a}</span><span style="color:var(--accent)">${hw.team.abbreviation} ${fc.h}</span></div></div>`;
        }).join('')}
      </div>
    </div>`;
  setTimeout(()=>{
    const pa=$('pAway'), ph=$('pHome');
    if(pa) pa.style.width=ap+'%';
    if(ph) ph.style.width=hp+'%';
    animPct('pAwayN',ap); animPct('pHomeN',hp);
  },100);
}

// ── PITCHER CARDS ─────────────────────────
function pitchCard(p, s, team, side) {
  if (!p) return `<div class="pitch-card"><div class="sec-title">${side} Pitcher</div><div style="color:var(--text3);text-align:center;padding:16px">TBD</div></div>`;
  const era=s?.era||'—', whip=s?.whip||'—', k9=s?.strikeoutsPer9Inn||'—';
  const ip=s?.inningsPitched||'—', ks=s?.strikeOuts??'—', gs=s?.gamesStarted??'—';
  const baa=s?.avg||s?.battingAvgAgainst||'—';
  const hrA=s?.homeRuns??null, ipN=parseFloat(s?.inningsPitched)||null;
  const hr9n=s?.homeRunsPer9Inn?parseFloat(s.homeRunsPer9Inn):(hrA!==null&&ipN)?(hrA/ipN)*9:null;
  const hr9=hr9n!=null?hr9n.toFixed(2):'—';
  const ec=v=>{const n=parseFloat(v);return isNaN(n)?'':n<3?'good':n<4.5?'avg':'bad';};
  const wc=v=>{const n=parseFloat(v);return isNaN(n)?'':n<1.1?'good':n<1.35?'avg':'bad';};
  const hc=v=>{const n=parseFloat(v);return isNaN(n)?'':n<1?'good':n<1.5?'avg':'bad';};
  const hrVC=hr9!=='—'?(parseFloat(hr9)<1?'var(--green)':parseFloat(hr9)<1.5?'var(--gold)':'var(--red)'):'var(--text3)';
  const hrVT=hr9!=='—'?(parseFloat(hr9)<1?'Low — hard to homer':parseFloat(hr9)<1.5?'Avg HR risk':'High — homer-prone'):'';
  const note=p.note||'';
  return `<div class="pitch-card">
    <div class="sec-title">${side} Starting Pitcher</div>
    <div class="pitch-hdr">
      <div class="pitch-num">${p.primaryNumber||'—'}</div>
      <div class="pitch-info"><div class="pitch-name">${p.fullName}</div><div class="pitch-team">${team.name}${s?` · ${s.wins??'—'}-${s.losses??'—'}`:''}</div></div>
      <div class="pitch-hand">${p.pitchHand?.code||'?'}</div>
    </div>
    <div class="sg">
      <div class="sb2"><div class="sv ${ec(era)}">${era}</div><div class="sn">ERA</div></div>
      <div class="sb2"><div class="sv ${wc(whip)}">${whip}</div><div class="sn">WHIP</div></div>
      <div class="sb2"><div class="sv">${k9}</div><div class="sn">K/9</div></div>
      <div class="sb2"><div class="sv">${ip}</div><div class="sn">IP</div></div>
      <div class="sb2"><div class="sv">${ks}</div><div class="sn">K</div></div>
      <div class="sb2"><div class="sv">${gs}</div><div class="sn">GS</div></div>
      <div class="sb2"><div class="sv ${hc(hr9)}">${hr9}</div><div class="sn">HR/9</div></div>
      <div class="sb2"><div class="sv">${baa}</div><div class="sn">BAA</div></div>
    </div>
    ${hr9!=='—'?`<div class="hr-vuln"><span>💣</span><div><div style="font-size:9px;color:var(--text3);text-transform:uppercase">HR Vulnerability</div><div style="font-size:12px;font-weight:700;color:${hrVC}">${hrVT}</div></div><div style="margin-left:auto;text-align:right"><div style="font-size:16px;font-weight:800;color:var(--purple)">${hr9}</div><div style="font-size:9px;color:var(--text3)">HR/9</div></div></div>`:''}
    ${s?'':`<div style="font-size:10px;color:var(--text3);margin-top:8px;font-style:italic">Season stats loading…</div>`}
    ${note?`<div style="font-size:10px;color:var(--text3);margin-top:8px;padding-top:8px;border-top:1px solid var(--border);font-style:italic">📋 ${note}</div>`:''}
  </div>`;
}

// ── LINEUP MATCHUP ────────────────────────
function renderMatchup(game) {
  const aA=game.teams.away.team.abbreviation, hA=game.teams.home.team.abbreviation;
  $('matchupEl').innerHTML=`
    <div class="matchup-card">
      <div class="sec-title">Lineup vs Pitcher Matchup</div>
      <div class="tabs">
        <button class="tab${S.tab==='home'?' on':''}" onclick="switchTab('home')">${hA} Lineup vs ${aA} Starter</button>
        <button class="tab${S.tab==='away'?' on':''}" onclick="switchTab('away')">${aA} Lineup vs ${hA} Starter</button>
      </div>
      <div id="lineupWrap"></div>
    </div>`;
  renderLineup(game);
}

function switchTab(tab) {
  S.tab=tab;
  document.querySelectorAll('.tab').forEach((b,i)=>b.classList.toggle('on',(i===0&&tab==='home')||(i===1&&tab==='away')));
  const g=S.games.find(g=>g.gamePk===S.selPk);
  if(g) go(()=>renderLineup(g));
}

function renderLineup(game) {
  const wrap=$('lineupWrap'); if(!wrap) return;
  const isHome=S.tab==='home';
  const lineup=isHome?S.homeLineup:S.awayLineup;
  const vsPS=isHome?S.awayPS:S.homePS;
  const vsP=isHome?game.teams.away.probablePitcher:game.teams.home.probablePitcher;

  if (!lineup?.length) {
    wrap.innerHTML=`<div style="padding:18px;text-align:center;color:var(--text3);font-size:12px">📋 Lineup not posted yet</div>`;
    return;
  }
  const pHR9=(()=>{const r=vsPS?.homeRunsPer9Inn,ha=vsPS?.homeRuns??null,ip=parseFloat(vsPS?.inningsPitched)||null;return r?parseFloat(r):(ha!=null&&ip)?(ha/ip)*9:1.20;})();
  const pERA=parseFloat(vsPS?.era)||4.30, pK9=parseFloat(vsPS?.strikeoutsPer9Inn)||8.0;
  const hr9C=pHR9>=1.5?'var(--red)':pHR9<1?'var(--green)':'var(--gold)';

  const rows=lineup.map((b,i)=>{
    const s=b.stats||{};
    const avg=s.avg||'—', obp=s.obp||'—', slg=s.slg||'—', ops=s.ops||'—';
    const hr=s.homeRuns??'—', rbi=s.rbi||'—';
    const ab=parseInt(s.atBats||s.ab)||0, gp=parseInt(s.gamesPlayed)||60;
    const slgN=parseFloat(slg)||.420, opsN=parseFloat(ops)||.720, hrN=parseInt(hr)||0;

    const hitP=Math.round(Math.min(95,Math.max(5,(opsN/.9*50)-(pERA*3)+30)));
    const kP=Math.round(Math.min(85,Math.max(5,(pK9/18)*60)));
    const hrRate=ab>0?hrN/ab:Math.max(.01,(slgN-.28)*.12);
    const hrP=Math.round(Math.min(22,Math.max(1,hrRate*(pHR9/1.2)*(slgN/.420)*100)));
    const rbiPG=parseInt(rbi)>0?parseInt(rbi)/gp:0;
    const rbiP=Math.round(Math.min(80,Math.max(5,rbiPG*(opsN/.720)*100)));
    const hrCol=hrP>=12?'var(--purple)':hrP>=6?'var(--gold)':'var(--text3)';

    const ap=v=>{const n=parseFloat(v);return isNaN(n)?'pill':n>=.300?'pill great':n>=.250?'pill mid':'pill poor';};
    const op=v=>{const n=parseFloat(v);return isNaN(n)?'pill':n>=.850?'pill great':n>=.720?'pill mid':'pill poor';};
    return `<tr>
      <td style="color:var(--text3);font-size:10px;width:18px">${i+1}</td>
      <td style="font-weight:600;white-space:nowrap">${b.name||'—'}<span style="font-size:9px;color:var(--text3);margin-left:3px">${b.pos||''}</span></td>
      <td class="r"><span class="${ap(avg)}">${avg}</span></td>
      <td class="r col-obp"><span class="${ap(obp)}">${obp}</span></td>
      <td class="r"><span class="${op(ops)}">${ops}</span></td>
      <td class="r col-rbi">${hr}</td>
      <td class="r">${rbi}</td>
      <td class="r col-hitpct" style="white-space:nowrap"><span style="color:var(--green);font-size:11px">Hit ${hitP}%</span><div class="pbar"><div class="pfill" style="width:${hitP}%;background:linear-gradient(90deg,var(--accent2),var(--accent))"></div></div></td>
      <td class="r col-kpct" style="white-space:nowrap"><span style="color:var(--red);font-size:11px">K ${kP}%</span></td>
      <td class="r" style="white-space:nowrap"><span style="font-size:12px;font-weight:700;color:${hrCol}">💣${hrP}%</span><div class="pbar" style="background:rgba(168,85,247,.15)"><div class="pfill" style="width:${Math.min(100,hrP*4.5)}%;background:linear-gradient(90deg,#7c3aed,#a855f7)"></div></div></td>
      <td class="r col-rbipct" style="white-space:nowrap"><span style="color:var(--blue);font-size:11px">💥${rbiP}%</span></td>
    </tr>`;
  }).join('');

  wrap.innerHTML=`
    <div style="font-size:11px;color:var(--text3);margin-bottom:9px;padding:7px 9px;background:var(--surface2);border-radius:6px;border:1px solid var(--border)">
      ⚾ vs <strong>${vsP?.fullName||'TBD'}</strong> &nbsp;·&nbsp; ERA <strong>${vsPS?.era||'—'}</strong> &nbsp;·&nbsp; K/9 <strong>${vsPS?.strikeoutsPer9Inn||'—'}</strong> &nbsp;·&nbsp; 💣 HR/9 <strong style="color:${hr9C}">${pHR9.toFixed(2)}</strong>
    </div>
    <div style="overflow-x:auto">
    <table class="ltable">
      <thead><tr>
        <th>#</th><th>Batter</th>
        <th class="r">AVG</th><th class="r col-obp">OBP</th><th class="r">OPS</th>
        <th class="r col-rbi">HR</th><th class="r">RBI</th>
        <th class="r col-hitpct">Hit%</th><th class="r col-kpct">K%</th>
        <th class="r">💣 HR%</th><th class="r col-rbipct">💥 RBI%</th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table></div>
    <div style="font-size:9px;color:var(--text3);margin-top:7px;line-height:1.6">
      * HR% = batter HR/AB × pitcher HR/9 factor × SLG power index. RBI% = season RBI/G × OPS factor. Avg HR rate ~3–4%/AB; 12%+ = elite power vs this pitcher.
    </div>`;
}

// ── ODDS ──────────────────────────────────
function renderOdds(game) {
  const eg=S.espnGames.find(e=>{
    const c=e.competitions?.[0]?.competitors||[];
    return c.some(x=>x.team?.abbreviation===game.teams.away.team.abbreviation||x.team?.abbreviation===game.teams.home.team.abbreviation);
  });
  const odds=eg?.competitions?.[0]?.odds?.[0];
  if (!odds) { $('oddsEl').innerHTML=''; return; }
  const hML=odds.homeTeamOdds?.moneyLine, aML=odds.awayTeamOdds?.moneyLine;
  const pos=v=>v>0?'color:var(--green)':'color:var(--red)';
  $('oddsEl').innerHTML=`
    <div class="card">
      <div class="sec-title">Betting Odds · ${odds.provider?.name||'ESPN'}</div>
      <div class="odds-grid">
        <div class="odds-box"><div class="odds-lbl">${game.teams.home.team.abbreviation} ML</div><div class="odds-val" style="${pos(hML)}">${hML>0?'+':''}${hML||'—'}</div></div>
        <div class="odds-box"><div class="odds-lbl">${game.teams.away.team.abbreviation} ML</div><div class="odds-val" style="${pos(aML)}">${aML>0?'+':''}${aML||'—'}</div></div>
        <div class="odds-box"><div class="odds-lbl">Over/Under</div><div class="odds-val" style="color:var(--gold)">${odds.overUnder||'—'}</div></div>
        ${odds.spread?`<div class="odds-box"><div class="odds-lbl">Run Line</div><div class="odds-val" style="color:var(--purple)">${odds.spread}</div></div>`:''}
      </div>
      <div style="font-size:9px;color:var(--text3);margin-top:8px">For informational purposes only.</div>
    </div>`;
}

// ── STANDINGS ─────────────────────────────
async function loadStandings() {
  const d=await api(`${MLB}/standings?leagueId=103,104&season=${YR}&hydrate=team`);
  if (!d?.records) return;
  const divs=d.records.map(div=>{
    const rows=(div.teamRecords||[]).map((t,i)=>{
      const pct=t.wins+t.losses>0?(t.wins/(t.wins+t.losses)).toFixed(3):'.000';
      return `<div class="srow${i===0?' hl':''}"><div class="sp2">${i+1}</div><div class="sname">${t.team.abbreviation||t.team.teamName}</div><div class="srec">${t.wins}-${t.losses}</div><div class="spct">${pct}</div><div class="sgb">${t.gamesBack==='-'?'—':t.gamesBack}</div></div>`;
    }).join('');
    return `<div class="stand-card"><div class="dname">${div.division?.name||'Division'}</div><div style="display:flex;justify-content:flex-end;gap:4px;font-size:9px;color:var(--text3);margin-bottom:4px"><span style="width:42px;text-align:right">W-L</span><span style="width:38px;text-align:right">PCT</span><span style="width:28px;text-align:right">GB</span></div>${rows}</div>`;
  }).join('');
  $('standEl').innerHTML=`<div style="margin-top:6px"><div class="sec-title" style="margin-bottom:10px">League Standings</div><div class="stand-grid">${divs}</div></div>`;
}

// ══════════════════════════════════════════
//  INIT
// ══════════════════════════════════════════
async function init() {
  const today=new Date().toISOString().split('T')[0];
  S.date=today;
  $('datePicker').value=$('datePickerM').value=today;
  $('datePicker').addEventListener('change',e=>{S.date=e.target.value;$('datePickerM').value=e.target.value;loadGames();});
  $('datePickerM').addEventListener('change',e=>{S.date=e.target.value;$('datePicker').value=e.target.value;loadGames();});
  await Promise.all([loadGames(), loadLeaders()]);
  loadStandings();
}

window.addEventListener('DOMContentLoaded', init);
window.addEventListener('resize', ()=>{
  if (!isMobile() && S.sidebarOpen) {
    $('backdrop').classList.remove('on');
    document.body.style.overflow='';
  }
});
</script>
