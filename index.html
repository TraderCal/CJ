<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MLB Outcome Predictor</title>
<style>
  :root {
    --bg:#0a0e1a;--surface:#111827;--surface2:#1a2236;--surface3:#1f2d45;
    --border:#2a3a55;--accent:#e8192c;--accent2:#0066cc;--gold:#f0a500;
    --text:#e8edf5;--text2:#8fa3be;--text3:#5a7099;
    --green:#22c55e;--red:#ef4444;--blue:#3b82f6;--purple:#a855f7;
    --sidebar-w:300px;--radius:12px;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh;display:flex;flex-direction:column;}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}
  @keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  /* HEADER */
  .header{background:linear-gradient(135deg,#0a0e1a,#0d1829 50%,#0a1520);border-bottom:2px solid var(--accent);padding:14px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;position:sticky;top:0;z-index:200;box-shadow:0 4px 30px rgba(232,25,44,.15);}
  .menu-toggle{width:40px;height:40px;border:1px solid var(--border);border-radius:8px;background:var(--surface2);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;flex-shrink:0;transition:all .2s;}
  .menu-toggle:hover{border-color:var(--accent);}
  .menu-toggle span{display:block;width:18px;height:2px;background:var(--text);border-radius:1px;transition:all .3s;}
  .menu-toggle.open span:nth-child(1){transform:rotate(45deg) translate(5px,5px);}
  .menu-toggle.open span:nth-child(2){opacity:0;}
  .menu-toggle.open span:nth-child(3){transform:rotate(-45deg) translate(5px,-5px);}
  .logo-area{display:flex;align-items:center;gap:10px;}
  .logo-badge{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,var(--accent),#c0001f);display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:900;color:#fff;box-shadow:0 0 20px rgba(232,25,44,.4);flex-shrink:0;}
  .app-title{font-size:20px;font-weight:800;letter-spacing:-.5px;}
  .app-title span{color:var(--accent);}
  .app-sub{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:1.5px;}
  .header-controls{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;margin-left:auto;}
  .ctrl-group{display:flex;flex-direction:column;}
  .ctrl-label{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:1px;margin-bottom:3px;}
  select,input[type=date]{background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:8px 12px;border-radius:8px;font-size:13px;cursor:pointer;outline:none;min-width:150px;appearance:none;-webkit-appearance:none;}
  select:focus,input[type=date]:focus{border-color:var(--accent2);}
  select option{background:var(--surface2);}
  .btn{padding:8px 16px;border:none;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600;transition:all .2s;display:flex;align-items:center;gap:6px;}
  .btn-primary{background:var(--accent);color:#fff;}
  .btn-primary:hover{background:#c0001f;transform:translateY(-1px);}

  /* LAYOUT */
  .body-wrap{display:flex;flex:1;overflow:hidden;}

  /* SIDEBAR */
  .sidebar{width:var(--sidebar-w);min-width:var(--sidebar-w);background:var(--surface);border-right:1px solid var(--border);height:calc(100vh - 74px);overflow-y:auto;position:sticky;top:74px;transform:translateX(calc(-1 * var(--sidebar-w)));transition:transform .3s cubic-bezier(.4,0,.2,1);flex-shrink:0;margin-left:calc(-1 * var(--sidebar-w));}
  .sidebar.open{transform:translateX(0);margin-left:0;}
  .sidebar-header{padding:14px 16px 10px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--surface);z-index:10;}
  .sidebar-title{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--text3);}

  /* ACCORDION */
  .accordion{border-bottom:1px solid var(--border);}
  .accordion-btn{width:100%;padding:13px 16px;background:none;border:none;cursor:pointer;display:flex;align-items:center;gap:10px;color:var(--text);font-size:13px;font-weight:600;text-align:left;transition:background .15s;}
  .accordion-btn:hover,.accordion-btn.active{background:var(--surface2);}
  .acc-icon{font-size:15px;flex-shrink:0;}
  .acc-label{flex:1;}
  .acc-count{font-size:10px;background:var(--surface3);border:1px solid var(--border);border-radius:10px;padding:2px 7px;color:var(--text3);}
  .chevron{font-size:10px;color:var(--text3);transition:transform .25s;flex-shrink:0;}
  .accordion-btn.open .chevron{transform:rotate(180deg);}
  .accordion-body{display:none;padding:8px 10px 12px;}
  .accordion-body.open{display:block;}

  /* LEADER CARDS */
  .leader-card{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:11px 13px;margin-bottom:8px;transition:all .2s;position:relative;overflow:hidden;cursor:default;}
  .leader-card:last-child{margin-bottom:0;}
  .leader-card:hover{border-color:var(--accent2);transform:translateX(2px);}
  .leader-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;border-radius:2px 0 0 2px;}
  .lc-hr::before{background:var(--purple);}
  .lc-hit::before{background:var(--blue);}
  .lc-rbi::before{background:var(--green);}
  .leader-rank{position:absolute;right:10px;top:8px;font-size:17px;font-weight:900;color:var(--surface3);line-height:1;}
  .rank-1{color:var(--gold)!important;font-size:20px!important;}
  .rank-2{color:var(--text3)!important;}
  .rank-3{color:#cd7f32!important;}
  .leader-name{font-size:13px;font-weight:700;padding-right:26px;margin-bottom:2px;}
  .leader-team{font-size:10px;color:var(--text3);margin-bottom:7px;}
  .leader-stats{display:flex;gap:10px;flex-wrap:wrap;}
  .ls{display:flex;flex-direction:column;align-items:center;}
  .ls-val{font-size:15px;font-weight:800;line-height:1.1;}
  .ls-lbl{font-size:9px;color:var(--text3);text-transform:uppercase;letter-spacing:.7px;}
  .playing-badge{display:inline-block;font-size:9px;font-weight:700;padding:2px 7px;border-radius:8px;margin-top:6px;background:rgba(34,197,94,.12);border:1px solid rgba(34,197,94,.3);color:var(--green);}
  .off-badge{display:inline-block;font-size:9px;padding:2px 7px;border-radius:8px;margin-top:6px;background:rgba(90,112,153,.1);border:1px solid rgba(90,112,153,.2);color:var(--text3);}
  .proj-row{margin-top:8px;padding-top:8px;border-top:1px solid rgba(255,255,255,.05);display:flex;align-items:center;justify-content:space-between;}
  .proj-lbl{font-size:9px;color:var(--text3);text-transform:uppercase;letter-spacing:.7px;}
  .proj-val{font-size:12px;font-weight:700;}
  .sb-loading{padding:18px;text-align:center;color:var(--text3);font-size:12px;}
  .mini-spin{width:14px;height:14px;border:2px solid var(--border);border-top-color:var(--accent2);border-radius:50%;animation:spin .8s linear infinite;display:inline-block;vertical-align:middle;margin-right:5px;}

  /* MAIN */
  .main-wrap{flex:1;overflow-x:hidden;min-width:0;}
  .main{max-width:1200px;margin:0 auto;padding:20px;}

  /* STATUS */
  .status-banner{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:13px 16px;margin-bottom:16px;display:flex;align-items:center;gap:10px;font-size:13px;color:var(--text2);}
  .spinner{width:16px;height:16px;border:2px solid var(--border);border-top-color:var(--accent2);border-radius:50%;animation:spin .8s linear infinite;flex-shrink:0;}

  /* GAME GRID */
  .game-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;margin-bottom:18px;}
  .game-card{background:var(--surface);border:2px solid var(--border);border-radius:var(--radius);padding:12px 14px;cursor:pointer;transition:all .2s;position:relative;overflow:hidden;}
  .game-card:hover{border-color:var(--accent2);transform:translateY(-2px);box-shadow:0 8px 25px rgba(0,0,0,.3);}
  .game-card.active{border-color:var(--accent);background:var(--surface2);}
  .game-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--accent2),var(--accent));opacity:0;transition:opacity .2s;}
  .game-card.active::before,.game-card:hover::before{opacity:1;}
  .game-time{font-size:10px;color:var(--text3);margin-bottom:7px;display:flex;justify-content:space-between;align-items:center;}
  .game-matchup{display:flex;justify-content:space-between;align-items:center;gap:8px;}
  .game-team{display:flex;flex-direction:column;align-items:center;gap:3px;flex:1;}
  .team-abbr{font-size:17px;font-weight:800;}
  .team-rec{font-size:9px;color:var(--text3);}
  .game-sep{font-size:11px;color:var(--text3);font-weight:600;}
  .game-venue{font-size:9px;color:var(--text3);margin-top:6px;text-align:center;}
  .game-status-badge{font-size:9px;font-weight:700;padding:2px 6px;border-radius:20px;text-transform:uppercase;}
  .s-sched{background:rgba(59,130,246,.15);color:var(--blue);border:1px solid rgba(59,130,246,.3);}
  .s-live{background:rgba(239,68,68,.15);color:var(--red);border:1px solid rgba(239,68,68,.3);animation:pulse 1.5s infinite;}
  .s-final{background:rgba(34,197,94,.15);color:var(--green);border:1px solid rgba(34,197,94,.3);}

  /* DETAIL PANEL */
  .detail-panel{display:none;animation:fadeIn .3s ease;}
  .detail-panel.visible{display:block;}

  /* LOADING OVERLAY for detail */
  .loading-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:32px;text-align:center;margin-bottom:16px;color:var(--text3);}
  .loading-card .spinner{margin:0 auto 12px;width:28px;height:28px;border-width:3px;}

  /* SECTION TITLE */
  .section-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--text3);margin-bottom:16px;display:flex;align-items:center;gap:8px;}
  .section-title::before{content:'';flex:none;width:3px;height:13px;background:var(--accent);border-radius:2px;}

  /* PREDICTION BOX */
  .pred-box{background:linear-gradient(135deg,rgba(232,25,44,.08),rgba(0,102,204,.08));border:1px solid var(--border);border-radius:var(--radius);padding:18px 22px;margin-bottom:16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
  .pred-icon{font-size:26px;}
  .pred-ttl{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:1px;margin-bottom:3px;}
  .pred-winner{font-size:20px;font-weight:900;}
  .pred-conf{font-size:11px;color:var(--text2);margin-top:3px;}
  .pred-score{margin-left:auto;text-align:right;}
  .pred-score-lbl{font-size:9px;color:var(--text3);text-transform:uppercase;letter-spacing:1px;}
  .pred-score-val{font-size:18px;font-weight:800;margin-top:3px;}

  /* GAME HERO */
  .game-hero{background:linear-gradient(135deg,var(--surface),var(--surface2));border:1px solid var(--border);border-radius:var(--radius);padding:24px 28px;margin-bottom:16px;position:relative;overflow:hidden;}
  .game-hero::after{content:'⚾';position:absolute;right:-18px;top:-18px;font-size:100px;opacity:.04;transform:rotate(15deg);}
  .hero-row{display:flex;justify-content:space-between;align-items:center;gap:16px;}
  .hero-team{display:flex;flex-direction:column;align-items:center;gap:5px;flex:1;}
  .hero-abbr{font-size:46px;font-weight:900;letter-spacing:-2px;line-height:1;}
  .hero-name{font-size:11px;color:var(--text2);}
  .hero-rec{font-size:10px;color:var(--text3);}
  .hero-vs{display:flex;flex-direction:column;align-items:center;gap:5px;}
  .hero-score{font-size:50px;font-weight:900;color:var(--text2);}
  .vs-text{font-size:14px;color:var(--text3);font-weight:600;}
  .live-badge{background:var(--red);color:#fff;font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px;text-transform:uppercase;animation:pulse 1.5s infinite;}

  /* WIN PROBABILITY */
  .prob-section{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;}
  .prob-bar-wrap{position:relative;height:50px;margin-bottom:8px;}
  .prob-bar-bg{height:32px;border-radius:8px;overflow:hidden;display:flex;position:absolute;left:0;right:0;top:9px;background:var(--surface2);}
  .prob-fill-away{height:100%;transition:width 1s cubic-bezier(.34,1.56,.64,1);background:linear-gradient(90deg,#1d4ed8,#2563eb);}
  .prob-fill-home{height:100%;transition:width 1s cubic-bezier(.34,1.56,.64,1);background:linear-gradient(90deg,#dc2626,#e8192c);margin-left:auto;}
  .prob-center-line{position:absolute;left:50%;top:4px;bottom:0;width:2px;background:var(--bg);transform:translateX(-50%);}
  .prob-labels{display:flex;justify-content:space-between;margin-top:6px;}
  .prob-label{display:flex;flex-direction:column;gap:2px;}
  .prob-label.right{align-items:flex-end;}
  .prob-pct{font-size:24px;font-weight:900;line-height:1;}
  .prob-team-name{font-size:11px;color:var(--text2);}
  .prob-factors{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin-top:12px;}
  .prob-factor{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:9px 11px;}
  .factor-name{font-size:9px;color:var(--text3);text-transform:uppercase;letter-spacing:1px;margin-bottom:5px;}
  .factor-bar-bg{height:4px;background:var(--surface3);border-radius:2px;margin-bottom:4px;overflow:hidden;}
  .factor-bar-fill{height:100%;border-radius:2px;background:linear-gradient(90deg,var(--accent2),var(--accent));transition:width 1.2s ease;}
  .factor-value{font-size:11px;font-weight:600;}

  /* PITCHING */
  .pitching-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px;}
  @media(max-width:700px){.pitching-grid{grid-template-columns:1fr;}}
  .pitcher-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;}
  .pitcher-header{display:flex;align-items:center;gap:11px;margin-bottom:13px;}
  .pitcher-num{width:40px;height:40px;border-radius:50%;background:var(--surface2);border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;flex-shrink:0;}
  .pitcher-info{flex:1;min-width:0;}
  .pitcher-name{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .pitcher-team{font-size:10px;color:var(--text3);margin-top:2px;}
  .pitcher-hand{background:var(--surface2);border:1px solid var(--border);border-radius:5px;padding:3px 8px;font-size:10px;font-weight:700;color:var(--gold);flex-shrink:0;}
  .stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;}
  .stat-box{background:var(--surface2);border:1px solid var(--border);border-radius:7px;padding:8px;text-align:center;}
  .stat-val{font-size:17px;font-weight:800;line-height:1.1;}
  .stat-name{font-size:9px;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-top:2px;}
  .stat-val.good{color:var(--green);}
  .stat-val.bad{color:var(--red);}
  .stat-val.avg{color:var(--gold);}
  .hr-vuln{margin-top:10px;padding:9px 11px;background:rgba(168,85,247,.07);border:1px solid rgba(168,85,247,.2);border-radius:8px;display:flex;align-items:center;gap:10px;}

  /* LINEUP */
  .matchup-section{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:16px;}
  .matchup-tabs{display:flex;gap:7px;margin-bottom:12px;}
  .tab-btn{padding:6px 13px;border-radius:7px;border:1px solid var(--border);background:var(--surface2);color:var(--text2);font-size:12px;font-weight:600;cursor:pointer;transition:all .2s;}
  .tab-btn.active{background:var(--accent);color:#fff;border-color:var(--accent);}
  .lineup-table{width:100%;border-collapse:collapse;}
  .lineup-table th{text-align:left;font-size:9px;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;padding:7px 8px;border-bottom:1px solid var(--border);}
  .lineup-table th.r{text-align:right;}
  .lineup-table td{padding:7px 8px;border-bottom:1px solid rgba(255,255,255,.04);font-size:12px;}
  .lineup-table td.r{text-align:right;}
  .lineup-table tr:hover td{background:rgba(255,255,255,.03);}
  .b-ord{color:var(--text3);font-size:11px;width:20px;font-weight:600;}
  .b-name{font-weight:600;}
  .b-pos{font-size:10px;color:var(--text3);margin-left:4px;}
  .spill{display:inline-block;font-size:10px;font-weight:700;padding:2px 6px;border-radius:10px;background:var(--surface2);border:1px solid var(--border);}
  .spill.great{background:rgba(34,197,94,.12);border-color:rgba(34,197,94,.3);color:var(--green);}
  .spill.poor{background:rgba(239,68,68,.12);border-color:rgba(239,68,68,.3);color:var(--red);}
  .spill.mid{background:rgba(240,165,0,.12);border-color:rgba(240,165,0,.3);color:var(--gold);}
  .obar{width:48px;height:5px;background:var(--surface3);border-radius:3px;overflow:hidden;display:inline-block;vertical-align:middle;margin-left:4px;}
  .ofill{height:100%;border-radius:3px;background:linear-gradient(90deg,var(--accent2),var(--accent));}

  /* ODDS */
  .odds-section{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:16px;}
  .odds-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:9px;}
  .odds-box{background:var(--surface2);border:1px solid var(--border);border-radius:9px;padding:11px 13px;}
  .odds-lbl{font-size:9px;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-bottom:5px;}
  .odds-val{font-size:19px;font-weight:800;}
  .odds-pos{color:var(--green);}
  .odds-neg{color:var(--red);}

  /* STANDINGS */
  .standings-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;margin-bottom:18px;}
  .standings-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:13px;}
  .div-name{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;color:var(--text3);margin-bottom:9px;}
  .st-row{display:flex;align-items:center;gap:5px;padding:5px 0;border-bottom:1px solid rgba(255,255,255,.04);font-size:11px;}
  .st-row:last-child{border-bottom:none;}
  .st-pos{color:var(--text3);width:13px;font-weight:600;}
  .st-name{flex:1;}
  .st-rec{color:var(--text2);width:46px;text-align:right;}
  .st-pct{color:var(--gold);width:40px;text-align:right;font-weight:600;}
  .st-gb{color:var(--text3);width:30px;text-align:right;font-size:10px;}
  .st-hl{background:rgba(232,25,44,.06);border-radius:5px;}

  /* EMPTY / SOURCES */
  .empty-state{text-align:center;padding:50px 20px;color:var(--text3);}
  .sources-bar{display:flex;align-items:center;gap:7px;flex-wrap:wrap;font-size:10px;color:var(--text3);margin-top:16px;padding:8px 0;border-top:1px solid var(--border);}
  .src-badge{background:var(--surface2);border:1px solid var(--border);border-radius:5px;padding:2px 8px;color:var(--text2);}

  [data-tip]{position:relative;cursor:help;}
  [data-tip]:hover::after{content:attr(data-tip);position:absolute;bottom:120%;left:50%;transform:translateX(-50%);background:#000;color:#fff;padding:4px 8px;border-radius:5px;font-size:10px;white-space:nowrap;z-index:999;pointer-events:none;}
  ::-webkit-scrollbar{width:5px;height:5px;}
  ::-webkit-scrollbar-track{background:var(--bg);}
  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px;}

  /* ══ SIDEBAR BACKDROP (mobile overlay) ══ */
  .sidebar-backdrop{display:none;position:fixed;inset:0;z-index:250;background:rgba(0,0,0,.55);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);}

  /* ══ TABLET (≤900px) ══ */
  @media(max-width:900px){
    .header-controls{gap:8px;}
    select,input[type=date]{min-width:120px;}
    .standings-grid{grid-template-columns:repeat(auto-fill,minmax(220px,1fr));}
  }

  /* ══ MOBILE (≤768px) ══ */
  @media(max-width:768px){
    /* Sidebar becomes full-screen overlay */
    .sidebar{
      position:fixed;top:0;left:0;bottom:0;
      height:100vh;z-index:300;
      margin-left:0;
      transform:translateX(-100%);
      box-shadow:4px 0 40px rgba(0,0,0,.6);
    }
    .sidebar.open{transform:translateX(0);}
    .sidebar-backdrop.visible{display:block;}

    /* Header: compact, controls stack */
    .header{padding:10px 14px;gap:10px;flex-wrap:nowrap;position:sticky;top:0;}
    .app-sub{display:none;}
    .logo-badge{width:38px;height:38px;font-size:17px;}
    .app-title{font-size:17px;}
    .header-controls{
      width:100%;flex-direction:column;
      gap:7px;margin-left:0;
      position:fixed;top:58px;left:0;right:0;
      background:var(--surface);
      border-bottom:1px solid var(--border);
      padding:10px 14px;
      z-index:190;
      display:none;
    }
    .header-controls.hc-open{display:flex;}
    .ctrl-group{width:100%;}
    select,input[type=date]{width:100%;min-width:unset;font-size:14px;padding:10px 12px;}
    .btn{width:100%;justify-content:center;padding:11px;}
    .filter-toggle{display:flex!important;}

    /* Offset main for sticky header */
    .main{padding:12px;}

    /* Game grid: 2 cols on mobile */
    .game-grid{grid-template-columns:1fr 1fr;gap:8px;}
    .team-abbr{font-size:15px;}

    /* Hero */
    .hero-abbr{font-size:30px;}
    .hero-score{font-size:34px;}
    .hero-name{font-size:10px;}
    .game-hero{padding:16px 14px;}

    /* Prediction box: stack */
    .pred-box{flex-direction:column;align-items:flex-start;gap:10px;}
    .pred-score{margin-left:0;border-top:1px solid var(--border);padding-top:10px;width:100%;}
    .pred-score-val{font-size:15px;}

    /* Win probability */
    .prob-pct{font-size:20px;}
    .prob-team-name{font-size:10px;}
    .prob-section{padding:14px;}
    .prob-factors{grid-template-columns:1fr 1fr;}

    /* Pitcher stat grid: 4 per row but smaller */
    .stat-grid{grid-template-columns:repeat(4,1fr);gap:5px;}
    .stat-val{font-size:14px;}
    .stat-name{font-size:8px;}
    .pitcher-card{padding:13px;}
    .pitcher-name{font-size:13px;}

    /* Lineup tabs: full width */
    .matchup-tabs{flex-direction:column;gap:6px;}
    .tab-btn{width:100%;text-align:center;padding:10px;font-size:13px;}

    /* Lineup table — hide lower-priority columns */
    .lineup-table th:nth-child(4),
    .lineup-table td:nth-child(4),
    .lineup-table th:nth-child(8),
    .lineup-table td:nth-child(8),
    .lineup-table th:nth-child(9),
    .lineup-table td:nth-child(9),
    .lineup-table th:nth-child(11),
    .lineup-table td:nth-child(11){display:none;}
    .lineup-table th,.lineup-table td{padding:6px 5px;font-size:11px;}
    .obar{width:36px;}
    .b-pos{display:none;}

    /* Standings: single column */
    .standings-grid{grid-template-columns:1fr;}

    /* Odds */
    .odds-grid{grid-template-columns:1fr 1fr;}
    .odds-val{font-size:17px;}

    /* Sources */
    .sources-bar{flex-direction:column;align-items:flex-start;gap:5px;}

    /* Touch targets */
    .game-card{padding:12px;min-height:80px;}
    .accordion-btn{padding:14px 16px;min-height:48px;}
    .leader-card{padding:13px;}
  }

  /* ══ SMALL PHONE (≤480px) ══ */
  @media(max-width:480px){
    .game-grid{grid-template-columns:1fr;}
    .hero-abbr{font-size:26px;}
    .hero-score{font-size:28px;}
    .prob-factors{grid-template-columns:1fr 1fr;}
    .stat-grid{grid-template-columns:repeat(2,1fr);}
    .stat-val{font-size:16px;}
    .pitching-grid{gap:10px;}
    /* Further hide columns on very small screens */
    .lineup-table th:nth-child(6),
    .lineup-table td:nth-child(6){display:none;}
    .prob-pct{font-size:18px;}
    .app-title{font-size:15px;}
    .logo-badge{width:34px;height:34px;font-size:15px;}
  }
</style>
</head>
<body>

<!-- SIDEBAR BACKDROP (mobile) -->
<div class="sidebar-backdrop" id="sidebarBackdrop" onclick="toggleSidebar()"></div>

<!-- HEADER -->
<div class="header">
  <button class="menu-toggle" id="menuToggle" onclick="toggleSidebar()" title="Player Leaders">
    <span></span><span></span><span></span>
  </button>
  <div class="logo-area">
    <div class="logo-badge">⚾</div>
    <div>
      <div class="app-title">MLB <span>Predictor</span></div>
      <div class="app-sub">Live Outcome Analysis</div>
    </div>
  </div>

  <!-- Mobile filter toggle (hidden on desktop via JS) -->
  <button class="filter-toggle" id="filterToggle" onclick="toggleFilters()"
    style="display:none;margin-left:auto;width:40px;height:40px;border:1px solid var(--border);border-radius:8px;background:var(--surface2);cursor:pointer;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0;font-size:16px;">
    🔍
  </button>

  <div class="header-controls" id="headerControls">
    <div class="ctrl-group">
      <div class="ctrl-label">Date</div>
      <input type="date" id="datePicker">
    </div>
    <div class="ctrl-group">
      <div class="ctrl-label">Select Game</div>
      <select id="gameSelect" style="min-width:200px" onchange="if(this.value)selectGame(parseInt(this.value))">
        <option value="">— Load games first —</option>
      </select>
    </div>
    <button class="btn btn-primary" onclick="loadGames()">⟳ Refresh</button>
  </div>
</div>

<!-- BODY -->
<div class="body-wrap">

  <!-- SIDEBAR -->
  <div class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-title">📊 Today's Projected Leaders</div>
    </div>
    <div class="accordion">
      <button class="accordion-btn open" id="acc-btn-hr" onclick="toggleAcc('hr')">
        <span class="acc-icon">💣</span><span class="acc-label">Top 5 HR Projections</span>
        <span class="acc-count">5</span><span class="chevron">▼</span>
      </button>
      <div class="accordion-body open" id="acc-body-hr">
        <div class="sb-loading"><span class="mini-spin"></span>Loading…</div>
      </div>
    </div>
    <div class="accordion">
      <button class="accordion-btn" id="acc-btn-hit" onclick="toggleAcc('hit')">
        <span class="acc-icon">🎯</span><span class="acc-label">Top 5 Hit Projections</span>
        <span class="acc-count">5</span><span class="chevron">▼</span>
      </button>
      <div class="accordion-body" id="acc-body-hit">
        <div class="sb-loading"><span class="mini-spin"></span>Loading…</div>
      </div>
    </div>
    <div class="accordion">
      <button class="accordion-btn" id="acc-btn-rbi" onclick="toggleAcc('rbi')">
        <span class="acc-icon">💥</span><span class="acc-label">Top 5 RBI Projections</span>
        <span class="acc-count">5</span><span class="chevron">▼</span>
      </button>
      <div class="accordion-body" id="acc-body-rbi">
        <div class="sb-loading"><span class="mini-spin"></span>Loading…</div>
      </div>
    </div>
  </div>

  <!-- MAIN -->
  <div class="main-wrap">
    <div class="main">
      <div class="status-banner" id="statusBanner">
        <div class="spinner" id="statusSpinner"></div>
        <span id="statusText">Connecting to MLB Stats API…</span>
      </div>
      <div class="game-grid" id="gameGrid"></div>
      <!-- DETAIL PANEL -->
      <div class="detail-panel" id="detailPanel">
        <div id="predBox"></div>
        <div id="gameHero"></div>
        <div id="probSection"></div>
        <div class="pitching-grid" id="pitchingGrid"></div>
        <div id="matchupSection"></div>
        <div id="oddsSection"></div>
      </div>
      <div class="empty-state" id="emptyState" style="display:none">
        <div style="font-size:56px;margin-bottom:14px;opacity:.4">⚾</div>
        <div style="font-size:17px;font-weight:600;color:var(--text2);margin-bottom:6px">No games found</div>
        <div style="font-size:13px">Try another date — MLB season runs April through October</div>
      </div>
      <div id="standingsWrap"></div>
      <div class="sources-bar" id="sourcesBar" style="display:none">
        <span>Sources:</span>
        <span class="src-badge">MLB Stats API</span>
        <span class="src-badge">ESPN Scoreboard</span>
        <span class="src-badge">Multi-factor probability model</span>
        <span style="margin-left:auto">Updated: <span id="lastUpdated"></span></span>
      </div>
    </div>
  </div>
</div>

<script>
// ══════════════════════════════════════════════
//  MLB OUTCOME PREDICTOR
// ══════════════════════════════════════════════
const MLB   = 'https://statsapi.mlb.com/api/v1';
const MLB11 = 'https://statsapi.mlb.com/api/v1.1';
const ESPN  = 'https://site.api.espn.com/apis/site/v2/sports/baseball/mlb';
const YR    = new Date().getFullYear();

const state = {
  date: '', games: [], espnGames: [], selectedPk: null,
  awayPS: null, homePS: null,
  awayLineup: [], homeLineup: [],
  activeTab: 'home', sidebarOpen: false,
  leaders: { hr: [], hit: [], rbi: [] }
};

// ─── UTILS ────────────────────────────────────
const $ = id => document.getElementById(id);
const safe = fn => { try { return fn(); } catch(e) { console.error(e); return null; } };

async function fetchJSON(url) {
  try {
    const r = await fetch(url, { headers: { Accept: 'application/json' } });
    if (!r.ok) return null;
    return await r.json();
  } catch { return null; }
}

function fmtTime(d) {
  if (!d) return '—';
  try { return new Date(d).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit',timeZoneName:'short'}); }
  catch { return '—'; }
}
function fmtRec(r) { return r ? `${r.wins||0}-${r.losses||0}` : '—'; }
function animNum(id, target, sfx='') {
  const el = $(id); if (!el) return;
  let cur = 0; const step = target / 30;
  const t = setInterval(() => { cur = Math.min(cur + step, target); el.textContent = Math.round(cur) + sfx; if (cur >= target) clearInterval(t); }, 25);
}
const TC = {108:'#003263',109:'#A71930',110:'#DF4601',111:'#0C2340',112:'#0E3386',113:'#C6011F',114:'#00385D',115:'#333366',116:'#0C2340',117:'#EB6E1F',118:'#004687',119:'#005A9C',120:'#AB0003',121:'#002D72',133:'#003831',134:'#FDB827',135:'#FFC52F',136:'#005C5C',137:'#FD5A1E',138:'#C41E3A',139:'#092C5C',140:'#003278',141:'#134A8E',142:'#002B5C',143:'#E81828',144:'#13274F',145:'#27251F',146:'#00A3E0',147:'#003087',158:'#002D72'};
const tColor = (id, side) => TC[id] || (side==='away' ? '#2563eb' : '#dc2626');

// ─── STATUS ───────────────────────────────────
function showStatus(msg) {
  const b = $('statusBanner'); b.style.display = 'flex';
  $('statusText').textContent = msg;
  $('statusSpinner').style.display = 'block';
}
function hideStatus() {
  $('statusSpinner').style.display = 'none';
  $('statusText').textContent = 'Data loaded ✅';
  $('sourcesBar').style.display = 'flex';
  $('lastUpdated').textContent = new Date().toLocaleTimeString();
  setTimeout(() => { $('statusBanner').style.display = 'none'; }, 2000);
}

// ─── MOBILE DETECTION ─────────────────────────
const isMobile = () => window.innerWidth <= 768;

// Show filter toggle button on mobile, hide on desktop
function updateMobileUI() {
  const ft = $('filterToggle');
  const hc = $('headerControls');
  if (isMobile()) {
    ft.style.display = 'flex';
    // Keep controls hidden until toggled (unless already open)
    if (!hc.classList.contains('hc-open')) hc.style.display = 'none';
  } else {
    ft.style.display = 'none';
    hc.style.display = '';
    hc.classList.remove('hc-open');
  }
}

function toggleFilters() {
  const hc = $('headerControls');
  const isOpen = hc.classList.toggle('hc-open');
  hc.style.display = isOpen ? 'flex' : 'none';
  $('filterToggle').textContent = isOpen ? '✕' : '🔍';
}

// Close controls & sidebar on game select (mobile UX)
function closeAllOverlays() {
  if (!isMobile()) return;
  const hc = $('headerControls');
  hc.classList.remove('hc-open');
  hc.style.display = 'none';
  $('filterToggle').textContent = '🔍';
}

// ─── SIDEBAR ──────────────────────────────────
function toggleSidebar() {
  state.sidebarOpen = !state.sidebarOpen;
  $('sidebar').classList.toggle('open', state.sidebarOpen);
  $('menuToggle').classList.toggle('open', state.sidebarOpen);
  // Backdrop for mobile overlay mode
  $('sidebarBackdrop').classList.toggle('visible', state.sidebarOpen);
  // Prevent body scroll when sidebar open on mobile
  document.body.style.overflow = (state.sidebarOpen && isMobile()) ? 'hidden' : '';
}
function toggleAcc(key) {
  const btn  = $(`acc-btn-${key}`);
  const body = $(`acc-body-${key}`);
  const opening = !body.classList.contains('open');
  body.classList.toggle('open', opening);
  btn.classList.toggle('open', opening);
}

// ══════════════════════════════════════════════
//  LEADERS
// ══════════════════════════════════════════════
async function loadLeaders() {
  const base = `${MLB}/stats?stats=season&group=hitting&gameType=R&season=${YR}&playerPool=All&limit=50`;
  const [hrD, hitD, rbiD] = await Promise.all([
    fetchJSON(`${base}&sortStat=homeRuns`),
    fetchJSON(`${base}&sortStat=hits`),
    fetchJSON(`${base}&sortStat=rbi`),
  ]);
  state.leaders.hr  = hrD?.stats?.[0]?.splits?.slice(0,10)  || [];
  state.leaders.hit = hitD?.stats?.[0]?.splits?.slice(0,10) || [];
  state.leaders.rbi = rbiD?.stats?.[0]?.splits?.slice(0,10) || [];
  renderLeaders();
}

function renderLeaders() {
  ['hr','hit','rbi'].forEach(t => renderLeaderList(t));
}

function renderLeaderList(type) {
  const body = $(`acc-body-${type}`);
  const list = state.leaders[type];
  if (!list || list.length === 0) {
    body.innerHTML = `<div class="sb-loading">No season data yet</div>`; return;
  }
  const playingTeams = new Set(state.games.flatMap(g => [g.teams?.away?.team?.id, g.teams?.home?.team?.id].filter(Boolean)));
  const cls  = type==='hr'?'lc-hr':type==='hit'?'lc-hit':'lc-rbi';
  const pCol = type==='hr'?'var(--purple)':type==='hit'?'var(--blue)':'var(--green)';
  const rkCls = i => i===0?'rank-1':i===1?'rank-2':i===2?'rank-3':'';

  body.innerHTML = list.slice(0,5).map((sp, i) => {
    const p = sp.player, t = sp.team, s = sp.stat || {};
    const hr  = s.homeRuns  || 0;
    const h   = s.hits      || 0;
    const rbi = s.rbi       || 0;
    const avg = s.avg       || '—';
    const ops = s.ops       || '—';
    const slg = s.slg       || '—';
    const ab  = s.atBats    || 0;
    const gp  = s.gamesPlayed || 1;
    const playing = playingTeams.has(t?.id);

    // Projections
    const hrRate = ab > 0 ? hr/ab : Math.max(0.01,(parseFloat(slg)||0.420-0.280)*0.12);
    const slgF   = (parseFloat(slg)||0.420) / 0.420;
    const projHR  = (hrRate * 3.5 * slgF * 100).toFixed(1);
    const projH   = ((parseFloat(avg)||0.250) * 4.0 * 100).toFixed(1);
    const rbiPG   = rbi / Math.max(gp,1);
    const projRBI = (rbiPG * (i<=1?1.15:1.0) * 100).toFixed(1);

    const mainVal  = type==='hr'?hr:type==='hit'?h:rbi;
    const mainLbl  = type==='hr'?'HR':type==='hit'?'Hits':'RBI';
    const projV    = type==='hr'?projHR:type==='hit'?projH:projRBI;

    return `<div class="leader-card ${cls}">
      <div class="leader-rank ${rkCls(i)}">${i+1}</div>
      <div class="leader-name">${p?.fullName||'—'}</div>
      <div class="leader-team">${t?.name||'—'}</div>
      <div class="leader-stats">
        <div class="ls"><div class="ls-val" style="color:${pCol}">${mainVal}</div><div class="ls-lbl">${mainLbl}</div></div>
        <div class="ls"><div class="ls-val">${avg}</div><div class="ls-lbl">AVG</div></div>
        <div class="ls"><div class="ls-val">${ops}</div><div class="ls-lbl">OPS</div></div>
        ${type!=='hr'?`<div class="ls"><div class="ls-val">${hr}</div><div class="ls-lbl">HR</div></div>`:''}
      </div>
      <div class="proj-row">
        <span class="proj-lbl">📈 Today's proj</span>
        <span class="proj-val" style="color:${pCol}">${projV}%</span>
      </div>
      <div>${playing?`<span class="playing-badge">✓ Playing today</span>`:`<span class="off-badge">Not scheduled</span>`}</div>
    </div>`;
  }).join('');
}

// ══════════════════════════════════════════════
//  SCHEDULE
// ══════════════════════════════════════════════
async function loadGames() {
  showStatus('Fetching schedule…');
  $('gameGrid').innerHTML = '';
  $('detailPanel').classList.remove('visible');
  $('emptyState').style.display = 'none';

  const [sched, espn] = await Promise.all([
    fetchJSON(`${MLB}/schedule?sportId=1&date=${state.date}&hydrate=probablePitcher(note),linescore,team,venue,weather`),
    fetchJSON(`${ESPN}/scoreboard?dates=${state.date.replace(/-/g,'')}`)
  ]);

  state.games    = sched?.dates?.[0]?.games || [];
  state.espnGames = espn?.events || [];

  if (!state.games.length) {
    hideStatus();
    $('emptyState').style.display = 'block'; return;
  }

  // Populate dropdown
  const sel = $('gameSelect');
  sel.innerHTML = '<option value="">— Select a game —</option>';
  state.games.forEach(g => {
    const a = g.teams.away.team.abbreviation || g.teams.away.team.teamName;
    const h = g.teams.home.team.abbreviation || g.teams.home.team.teamName;
    const o = document.createElement('option');
    o.value = g.gamePk; o.textContent = `${a} @ ${h}  ·  ${fmtTime(g.gameDate)}`;
    sel.appendChild(o);
  });

  renderGameGrid();
  renderLeaders(); // refresh playing-today badges
  hideStatus();
}

function renderGameGrid() {
  const grid = $('gameGrid'); grid.innerHTML = '';
  state.games.forEach(g => {
    const aw = g.teams.away, hw = g.teams.home;
    const st = g.status?.detailedState || 'Scheduled';
    const isLive  = /in progress|live/i.test(st);
    const isFinal = /final|completed/i.test(st);
    const sc = isLive?'s-live':isFinal?'s-final':'s-sched';
    const sl = isLive?'🔴 LIVE':isFinal?'FINAL':fmtTime(g.gameDate);
    const card = document.createElement('div');
    card.className = `game-card${state.selectedPk===g.gamePk?' active':''}`;
    card.onclick = () => selectGame(g.gamePk);
    card.innerHTML = `
      <div class="game-time"><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:130px">${g.venue?.name||''}</span><span class="game-status-badge ${sc}">${sl}</span></div>
      <div class="game-matchup">
        <div class="game-team"><div class="team-abbr" style="color:${tColor(aw.team.id,'away')}">${aw.team.abbreviation||aw.team.teamName}</div><div class="team-rec">${fmtRec(aw.leagueRecord)}</div>${isFinal||isLive?`<div style="font-size:19px;font-weight:900;margin-top:2px">${aw.score??0}</div>`:''}</div>
        <div class="game-sep">${isFinal||isLive?'–':'@'}</div>
        <div class="game-team"><div class="team-abbr" style="color:${tColor(hw.team.id,'home')}">${hw.team.abbreviation||hw.team.teamName}</div><div class="team-rec">${fmtRec(hw.leagueRecord)}</div>${isFinal||isLive?`<div style="font-size:19px;font-weight:900;margin-top:2px">${hw.score??0}</div>`:''}</div>
      </div>
      ${g.teams.away.probablePitcher?`<div class="game-venue">⚾ ${g.teams.away.probablePitcher.fullName||'?'} vs ${g.teams.home.probablePitcher?.fullName||'TBD'}</div>`:''}`;
    grid.appendChild(card);
  });
}

// ══════════════════════════════════════════════
//  SELECT GAME
// ══════════════════════════════════════════════
async function selectGame(gamePk) {
  state.selectedPk = gamePk;
  $('gameSelect').value = gamePk;
  renderGameGrid(); // update active card highlight

  const game = state.games.find(g => g.gamePk === gamePk);
  if (!game) return;

  // Close mobile overlays before loading
  closeAllOverlays();
  if (state.sidebarOpen && isMobile()) toggleSidebar();

  // Show panel immediately with loading state
  $('detailPanel').classList.add('visible');
  $('detailPanel').scrollIntoView({ behavior: 'smooth', block: 'start' });
  $('predBox').innerHTML      = loadingCard('Calculating prediction…');
  $('gameHero').innerHTML     = loadingCard('Loading game info…');
  $('probSection').innerHTML  = loadingCard('Computing win probability…');
  $('pitchingGrid').innerHTML = loadingCard('Fetching pitcher stats…') + loadingCard('');
  $('matchupSection').innerHTML = loadingCard('Building lineup matchup…');
  $('oddsSection').innerHTML  = '';
  showStatus('Loading game data…');

  // Fetch all data in parallel
  const awayTeamId = game.teams.away.team.id;
  const homeTeamId = game.teams.home.team.id;
  const awayPkId   = game.teams.away.probablePitcher?.id;
  const homePkId   = game.teams.home.probablePitcher?.id;

  const [live, awayRoster, homeRoster, awayPS, homePS] = await Promise.all([
    fetchJSON(`${MLB11}/game/${gamePk}/feed/live`),
    awayTeamId ? fetchJSON(`${MLB}/teams/${awayTeamId}/roster?rosterType=active&season=${YR}&hydrate=person(stats(type=season,group=hitting,season=${YR}))`) : null,
    homeTeamId ? fetchJSON(`${MLB}/teams/${homeTeamId}/roster?rosterType=active&season=${YR}&hydrate=person(stats(type=season,group=hitting,season=${YR}))`) : null,
    awayPkId   ? fetchJSON(`${MLB}/people/${awayPkId}/stats?stats=season&group=pitching&season=${YR}`) : null,
    homePkId   ? fetchJSON(`${MLB}/people/${homePkId}/stats?stats=season&group=pitching&season=${YR}`) : null,
  ]);

  state.awayPS = awayPS?.stats?.[0]?.splits?.[0]?.stat || null;
  state.homePS = homePS?.stats?.[0]?.splits?.[0]?.stat || null;

  // Build lineups
  const ld = live?.liveData;
  if (ld?.boxscore) {
    const aBo = ld.boxscore.teams?.away?.battingOrder || [];
    const hBo = ld.boxscore.teams?.home?.battingOrder || [];
    const aP  = ld.boxscore.teams?.away?.players || {};
    const hP  = ld.boxscore.teams?.home?.players || {};
    state.awayLineup = aBo.map(id => { const p=aP['ID'+id]; return {id,name:p?.person?.fullName||'—',pos:p?.position?.abbreviation||'',stats:p?.seasonStats?.batting}; });
    state.homeLineup = hBo.map(id => { const p=hP['ID'+id]; return {id,name:p?.person?.fullName||'—',pos:p?.position?.abbreviation||'',stats:p?.seasonStats?.batting}; });
  }
  if (!state.awayLineup.length) state.awayLineup = rosterToLineup(awayRoster?.roster);
  if (!state.homeLineup.length) state.homeLineup = rosterToLineup(homeRoster?.roster);

  // Render all sections (each wrapped in safe())
  safe(() => renderPredBox(game));
  safe(() => renderHero(game));
  safe(() => renderWinProb(game));
  safe(() => renderPitching(game));
  safe(() => renderMatchup(game));
  safe(() => renderOdds(game));
  hideStatus();
}

function loadingCard(msg) {

function rosterToLineup(roster) {

    id:p.person.id, name:p.person.fullName, pos:p.position?.abbreviation||'',

  }));
}

// ─── PREDICTION BOX ───────────────────────────
function renderPredBox(game) {
  const f = calcWP(game);
  const hp = Math.round(f.total*100), ap = 100-hp;
  const isHome = hp >= ap;
  const winner = isHome ? game.teams.home.team : game.teams.away.team;
  const prob   = isHome ? hp : ap;
  const conf   = prob>=60?'High Confidence':prob>=55?'Moderate Confidence':'Lean';
  const aERA   = parseFloat(state.awayPS?.era)||4.5;
  const hERA   = parseFloat(state.homePS?.era)||4.5;
  $('predBox').innerHTML = `
    <div class="pred-box">
      <div class="pred-icon">🏆</div>
      <div>
        <div class="pred-ttl">Predicted Winner</div>
        <div class="pred-winner" style="color:${isHome?'var(--accent)':'#2563eb'}">${winner.name}</div>
        <div class="pred-conf">${conf} · ${prob}% win probability</div>
      </div>
      <div class="pred-score">
        <div class="pred-score-lbl">Projected Score</div>
        <div class="pred-score-val">${game.teams.away.team.abbreviation} ${(hERA*.9).toFixed(1)} – ${(aERA*.9).toFixed(1)} ${game.teams.home.team.abbreviation}</div>
        <div style="font-size:10px;color:var(--text3);margin-top:2px">ERA-based estimate</div>
      </div>
    </div>`;
}

// ─── WIN PROBABILITY ──────────────────────────
function renderWinProb(game) {
  const aw=game.teams.away, hw=game.teams.home;
  const f=calcWP(game);
  const hp=Math.round(f.total*100), ap=100-hp;

  $('probSection').innerHTML = `
    <div class="prob-section">
      <div class="section-title">Win Probability</div>
      <div style="display:flex;justify-content:space-between;margin-bottom:3px">
        <span style="font-size:10px;color:var(--text3)">${aw.team.abbreviation} (Away)</span>
        <span style="font-size:10px;color:var(--text3)">${hw.team.abbreviation} (Home)</span>
      </div>
      <div class="prob-bar-wrap">
        <div class="prob-bar-bg">
          <div class="prob-fill-away" id="awayFill" style="width:0%"></div>
          <div class="prob-fill-home" id="homeFill" style="width:0%"></div>
        </div>
        <div class="prob-center-line"></div>
      </div>
      <div class="prob-labels">
        <div class="prob-label">
          <div class="prob-pct" style="color:#2563eb" id="awayPct">0%</div>
          <div class="prob-team-name">${aw.team.name}</div>
        </div>
        <div class="prob-label right">
          <div class="prob-pct" style="color:var(--accent)" id="homePct">0%</div>
          <div class="prob-team-name">${hw.team.name}</div>
        </div>
      </div>
      <div class="prob-factors">${renderFactors(f,aw,hw)}</div>
    </div>`;

  setTimeout(() => {
    const af = $('awayFill'), hf = $('homeFill');
    if (af) af.style.width = ap+'%';
    if (hf) hf.style.width = hp+'%';
    animNum('awayPct', ap, '%');
    animNum('homePct', hp, '%');

}

function renderFactors(f, aw, hw) {
  return [
    {n:'Win % Record',  a:Math.round((f.awayWP||0)*100), h:Math.round((f.homeWP||0)*100)},
    {n:'Home Field',    a:0, h:3},
    {n:'Pitcher ERA',   a:f.awayEraS||0, h:f.homeEraS||0},
    {n:'Run Diff',      a:Math.max(0,f.awayRD||0), h:Math.max(0,f.homeRD||0)},
    {n:'WHIP Factor',   a:f.awayWhipS||0, h:f.homeWhipS||0},
  ].map(fac => {
    const tot = (fac.a+fac.h)||100;
    const hp  = Math.min(100,Math.round((fac.h/tot)*100));
    return `<div class="prob-factor">
      <div class="factor-name">${fac.n}</div>
      <div class="factor-bar-bg"><div class="factor-bar-fill" style="width:${hp}%"></div></div>
      <div class="factor-value" style="display:flex;justify-content:space-between">
        <span style="color:#2563eb">${aw.team.abbreviation}: ${fac.a}</span>
        <span style="color:var(--accent)">${hw.team.abbreviation}: ${fac.h}</span>
      </div></div>`;
  }).join('');
}

function calcWP(game) {
  const aw=game.teams.away, hw=game.teams.home;
  const awW=aw.leagueRecord?.wins||0, awL=aw.leagueRecord?.losses||1;
  const hwW=hw.leagueRecord?.wins||0, hwL=hw.leagueRecord?.losses||1;
  const awWP=awW/(awW+awL), hwWP=hwW/(hwW+hwL);
  const awERA=parseFloat(state.awayPS?.era)||4.2, hwERA=parseFloat(state.homePS?.era)||4.2;
  const awEraS=Math.round(Math.max(0,100-(awERA/8)*100));
  const hwEraS=Math.round(Math.max(0,100-(hwERA/8)*100));
  const awWHIP=parseFloat(state.awayPS?.whip)||1.3, hwWHIP=parseFloat(state.homePS?.whip)||1.3;
  const awWhipS=Math.round(Math.max(0,100-(awWHIP/2)*100));
  const hwWhipS=Math.round(Math.max(0,100-(hwWHIP/2)*100));
  const awRD=Math.round((awWP-.5)*60), hwRD=Math.round((hwWP-.5)*60);
  const hC=hwWP*.35+(hwEraS/100)*.25+(hwWhipS/100)*.15+(hwRD>0?.05:0)+.03;
  const aC=awWP*.35+(awEraS/100)*.25+(awWhipS/100)*.15+(awRD>0?.05:0);
  const tot=hC+aC||1;
  return {
    total:Math.max(.38,Math.min(.65,.40+(hC/tot)*.30)),
    awayWP:awWP, homeWP:hwWP,
    awayEraS, homeEraS:hwEraS,
    awayWhipS, homeWhipS:hwWhipS,
    awayRD:awRD, homeRD:hwRD
  };
}

// ─── PITCHING ─────────────────────────────────
function renderPitching(game) {
  $('pitchingGrid').innerHTML =
    pitcherCard(game.teams.away.probablePitcher, state.awayPS, game.teams.away.team, 'Away') +
    pitcherCard(game.teams.home.probablePitcher, state.homePS, game.teams.home.team, 'Home');
}

function pitcherCard(p, s, team, side) {
  if (!p) return `<div class="pitcher-card"><div class="section-title">${side} Starting Pitcher</div><div style="color:var(--text3);text-align:center;padding:20px 0">Probable pitcher TBD</div></div>`;
  const era=s?.era||'—', whip=s?.whip||'—', k9=s?.strikeoutsPer9Inn||'—';
  const ip=s?.inningsPitched||'—', ks=s?.strikeOuts??'—';
  const w=s?.wins??'—', l=s?.losses??'—', gs=s?.gamesStarted??'—';
  const baa=s?.avg||s?.battingAvgAgainst||'—';
  const hrA=s?.homeRuns??null, ipN=parseFloat(s?.inningsPitched)||null;
  const hr9n=s?.homeRunsPer9Inn?parseFloat(s.homeRunsPer9Inn):(hrA!==null&&ipN)?(hrA/ipN)*9:null;
  const hr9=hr9n!==null?hr9n.toFixed(2):'—';
  const note=p.note||'';

  const ec=v=>{const n=parseFloat(v);return isNaN(n)?'':n<3?'good':n<4.5?'avg':'bad';};
  const wc=v=>{const n=parseFloat(v);return isNaN(n)?'':n<1.1?'good':n<1.35?'avg':'bad';};
  const hc=v=>{const n=parseFloat(v);return isNaN(n)?'':n<1?'good':n<1.5?'avg':'bad';};
  const hrVuln=hr9!=='—'?(parseFloat(hr9)<1?'Low — hard to go yard':parseFloat(hr9)<1.5?'Average HR risk':'High — prone to homer'):'';
  const hrVC=hr9!=='—'?(parseFloat(hr9)<1?'var(--green)':parseFloat(hr9)<1.5?'var(--gold)':'var(--red)'):'var(--text3)';

  return `<div class="pitcher-card">
    <div class="section-title">${side} Starting Pitcher</div>
    <div class="pitcher-header">
      <div class="pitcher-num">${p.primaryNumber||'—'}</div>
      <div class="pitcher-info">
        <div class="pitcher-name">${p.fullName}</div>
        <div class="pitcher-team">${team.name} · ${s?`${w}-${l}`:'—'}</div>
      </div>
      <div class="pitcher-hand">${p.pitchHand?.code||'?'}</div>
    </div>
    <div class="stat-grid">
      <div class="stat-box"><div class="stat-val ${ec(era)}" data-tip="Earned Run Average">${era}</div><div class="stat-name">ERA</div></div>
      <div class="stat-box"><div class="stat-val ${wc(whip)}" data-tip="WHIP">${whip}</div><div class="stat-name">WHIP</div></div>
      <div class="stat-box"><div class="stat-val" data-tip="Strikeouts per 9">${k9}</div><div class="stat-name">K/9</div></div>
      <div class="stat-box"><div class="stat-val" data-tip="Innings Pitched">${ip}</div><div class="stat-name">IP</div></div>
      <div class="stat-box"><div class="stat-val" data-tip="Strikeouts">${ks}</div><div class="stat-name">K</div></div>
      <div class="stat-box"><div class="stat-val" data-tip="Games Started">${gs}</div><div class="stat-name">GS</div></div>
      <div class="stat-box"><div class="stat-val ${hc(hr9)}" data-tip="HR per 9 innings">${hr9}</div><div class="stat-name">HR/9</div></div>
      <div class="stat-box"><div class="stat-val" data-tip="Batting Avg Against">${baa}</div><div class="stat-name">BAA</div></div>
    </div>
    ${hr9!=='—'?`<div class="hr-vuln">
      <span style="font-size:15px">💣</span>
      <div><div style="font-size:9px;color:var(--text3);text-transform:uppercase;letter-spacing:.8px">HR Vulnerability</div><div style="font-size:12px;font-weight:700;color:${hrVC}">${hrVuln}</div></div>
      <div style="margin-left:auto;text-align:right"><div style="font-size:17px;font-weight:800;color:var(--purple)">${hr9}</div><div style="font-size:9px;color:var(--text3)">HR/9</div></div>
    </div>`:''}
    ${note?`<div style="font-size:10px;color:var(--text3);margin-top:10px;padding-top:10px;border-top:1px solid var(--border);font-style:italic">📋 ${note}</div>`:''}
  </div>`;
}

// ─── LINEUP MATCHUP ───────────────────────────
function renderMatchup(game) {
  const aA=game.teams.away.team.abbreviation, hA=game.teams.home.team.abbreviation;
  $('matchupSection').innerHTML = `
    <div class="matchup-section">
      <div class="section-title">Lineup vs Pitcher Matchup</div>
      <div class="matchup-tabs">
        <button class="tab-btn ${state.activeTab==='home'?'active':''}" onclick="switchTab('home')">${hA} Lineup vs ${aA} Starter</button>
        <button class="tab-btn ${state.activeTab==='away'?'active':''}" onclick="switchTab('away')">${aA} Lineup vs ${hA} Starter</button>
      </div>
      <div id="lineupWrap"></div>
    </div>`;
  renderLineup(game);
}

function switchTab(tab) {
  state.activeTab = tab;
  document.querySelectorAll('.tab-btn').forEach((b,i)=>b.classList.toggle('active',(i===0&&tab==='home')||(i===1&&tab==='away')));
  const g = state.games.find(g=>g.gamePk===state.selectedPk);
  if (g) safe(()=>renderLineup(g));
}

function renderLineup(game) {
  const wrap = $('lineupWrap'); if (!wrap) return;
  const isHome  = state.activeTab==='home';
  const lineup  = isHome ? state.homeLineup : state.awayLineup;
  const vsStats = isHome ? state.awayPS : state.homePS;
  const vsP     = isHome ? game.teams.away.probablePitcher : game.teams.home.probablePitcher;

  if (!lineup || lineup.length===0) {
    wrap.innerHTML=`<div style="padding:20px;text-align:center;color:var(--text3);font-size:12px">📋 Lineup not yet posted — check back closer to game time</div>`;
    return;
  }

  // Pitcher HR/9 for the column
  const pHrN = (() => {
    const r=vsStats?.homeRunsPer9Inn, ha=vsStats?.homeRuns??null, ip=parseFloat(vsStats?.inningsPitched)||null;
    return r?parseFloat(r):(ha!==null&&ip)?(ha/ip)*9:1.20;
  })();
  const pERA = parseFloat(vsStats?.era)||4.20;
  const pK9  = parseFloat(vsStats?.strikeoutsPer9Inn)||8.0;
  const hr9D = pHrN.toFixed(2);
  const hr9C = pHrN>=1.5?'var(--red)':pHrN<1?'var(--green)':'var(--gold)';

  const rows = lineup.map((b,i) => {
    const s   = b.stats || {};
    const avg = s.avg||'—', obp=s.obp||'—', slg=s.slg||'—', ops=s.ops||'—';
    const hr  = s.homeRuns??s.hrs??'—', rbi=s.rbi||'—';
    const ab  = parseInt(s.atBats||s.ab)||0;
    const gp  = parseInt(s.gamesPlayed)||60;
    const slgN=parseFloat(slg)||0.420, opsN=parseFloat(ops)||0.720;
    const hrN =parseInt(hr)||0;

    // Probabilities
    const hitP = Math.round(Math.min(95,Math.max(5,(opsN/0.9*50)-(pERA*3)+30)));
    const kP   = Math.round(Math.min(85,Math.max(5,(pK9/18)*60)));
    const hrRate = ab>0 ? hrN/ab : Math.max(0.01,(slgN-0.280)*0.12);
    const hrP   = Math.round(Math.min(22,Math.max(1, hrRate*(pHrN/1.2)*(slgN/0.420)*100)));
    const rbiPG = parseInt(rbi)>0 ? parseInt(rbi)/gp : 0;
    const rbiP  = Math.round(Math.min(80,Math.max(5, rbiPG*(opsN/0.720)*100)));
    const hrCol = hrP>=12?'var(--purple)':hrP>=6?'var(--gold)':'var(--text3)';

    const ap=v=>{const n=parseFloat(v);if(isNaN(n))return'spill';return n>=.300?'spill great':n>=.250?'spill mid':'spill poor';};
    const op=v=>{const n=parseFloat(v);if(isNaN(n))return'spill';return n>=.850?'spill great':n>=.720?'spill mid':'spill poor';};

    return `<tr>
      <td class="b-ord">${i+1}</td>
      <td class="b-name">${b.name||'—'}<span class="b-pos">${b.pos||''}</span></td>
      <td class="r"><span class="${ap(avg)}">${avg}</span></td>
      <td class="r"><span class="${ap(obp)}">${obp}</span></td>
      <td class="r"><span class="${op(ops)}">${ops}</span></td>
      <td class="r">${hr}</td>
      <td class="r">${rbi}</td>
      <td class="r" style="white-space:nowrap"><span style="font-size:11px;color:var(--green)">Hit ${hitP}%</span><div class="obar"><div class="ofill" style="width:${hitP}%"></div></div></td>
      <td class="r" style="white-space:nowrap"><span style="font-size:11px;color:var(--red)">K ${kP}%</span></td>
      <td class="r" style="white-space:nowrap" data-tip="HR prob vs this pitcher"><span style="font-size:12px;font-weight:700;color:${hrCol}">💣 ${hrP}%</span><div class="obar" style="background:rgba(168,85,247,.15)"><div class="ofill" style="width:${Math.min(100,hrP*4.5)}%;background:linear-gradient(90deg,#7c3aed,#a855f7)"></div></div></td>
      <td class="r" style="white-space:nowrap"><span style="font-size:11px;color:var(--blue)">💥 ${rbiP}%</span></td>
    </tr>`;
  }).join('');

  wrap.innerHTML = `
    <div style="font-size:11px;color:var(--text3);margin-bottom:10px;padding:8px 10px;background:var(--surface2);border-radius:6px;border:1px solid var(--border)">
      ⚾ Facing: <strong>${vsP?.fullName||'TBD'}</strong> &nbsp;·&nbsp;
      ERA: <strong>${vsStats?.era||'—'}</strong> &nbsp;·&nbsp;
      K/9: <strong>${vsStats?.strikeoutsPer9Inn||'—'}</strong> &nbsp;·&nbsp;
      💣 HR/9: <strong style="color:${hr9C}">${hr9D}</strong>
    </div>
    <div style="overflow-x:auto">
    <table class="lineup-table">
      <thead><tr>
        <th>#</th><th>Batter</th>
        <th class="r">AVG</th><th class="r">OBP</th><th class="r">OPS</th>
        <th class="r">HR</th><th class="r">RBI</th>
        <th class="r">Hit%</th><th class="r">K%</th>
        <th class="r">💣 HR%</th><th class="r">💥 RBI%</th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table></div>
    <div style="font-size:10px;color:var(--text3);margin-top:8px;line-height:1.6">
      * <strong style="color:var(--text2)">HR%</strong> = batter HR/AB × pitcher HR/9 factor × SLG power index (per-AB estimate). &nbsp;
      <strong style="color:var(--text2)">RBI%</strong> = season RBI/G × OPS adjustment. League avg HR rate ~3–4%/AB.
    </div>`;
}

// ─── ODDS ─────────────────────────────────────
function renderOdds(game) {
  const eg = state.espnGames.find(e => {
    const c = e.competitions?.[0]?.competitors||[];
    return c.some(x => x.team?.abbreviation===game.teams.away.team.abbreviation || x.team?.abbreviation===game.teams.home.team.abbreviation);
  });
  const odds = eg?.competitions?.[0]?.odds?.[0];
  const sec = $('oddsSection');
  if (!odds) { sec.innerHTML=''; return; }
  const hML=odds.homeTeamOdds?.moneyLine, aML=odds.awayTeamOdds?.moneyLine;
  sec.innerHTML=`<div class="odds-section">
    <div class="section-title">Betting Odds · ${odds.provider?.name||'ESPN'}</div>
    <div class="odds-grid">
      <div class="odds-box"><div class="odds-lbl">${game.teams.home.team.abbreviation} ML</div><div class="odds-val ${hML>0?'odds-pos':'odds-neg'}">${hML>0?'+':''}${hML||'—'}</div></div>
      <div class="odds-box"><div class="odds-lbl">${game.teams.away.team.abbreviation} ML</div><div class="odds-val ${aML>0?'odds-pos':'odds-neg'}">${aML>0?'+':''}${aML||'—'}</div></div>
      <div class="odds-box"><div class="odds-lbl">O/U</div><div class="odds-val" style="color:var(--gold)">${odds.overUnder||'—'}</div></div>
      ${odds.spread?`<div class="odds-box"><div class="odds-lbl">Run Line</div><div class="odds-val" style="color:var(--purple)">${odds.spread}</div></div>`:''}
    </div>
    <div style="font-size:10px;color:var(--text3);margin-top:8px">For informational purposes only.</div>
  </div>`;
}

// ─── STANDINGS ────────────────────────────────
async function loadStandings() {
  const data = await fetchJSON(`${MLB}/standings?leagueId=103,104&season=${YR}&hydrate=team`);
  if (!data?.records) return;
  const divs = data.records.map(div => {
    const rows = (div.teamRecords||[]).map((t,i)=>{
      const pct = t.wins+t.losses>0?(t.wins/(t.wins+t.losses)).toFixed(3):'.000';
      return `<div class="st-row${i===0?' st-hl':''}">
        <div class="st-pos">${i+1}</div>
        <div class="st-name">${t.team.abbreviation||t.team.teamName}</div>
        <div class="st-rec">${t.wins}-${t.losses}</div>
        <div class="st-pct">${pct}</div>
        <div class="st-gb">${t.gamesBack==='-'?'—':t.gamesBack}</div>
      </div>`;
    }).join('');
    return `<div class="standings-card">
      <div class="div-name">${div.division?.name||'Division'}</div>
      <div style="display:flex;justify-content:flex-end;gap:4px;font-size:9px;color:var(--text3);margin-bottom:5px">
        <span style="width:46px;text-align:right">W-L</span><span style="width:40px;text-align:right">PCT</span><span style="width:30px;text-align:right">GB</span>
      </div>${rows}</div>`;
  }).join('');
  $('standingsWrap').innerHTML = `
    <div style="margin-top:8px">
      <div class="section-title" style="margin-bottom:12px">League Standings</div>
      <div class="standings-grid">${divs}</div>
    </div>`;
}
