// ── NRFI / YRFI ──
function calcNRFI(game){
  const awERA=parseFloat(S.awayPS?.era)||4.30;
  const hwERA=parseFloat(S.homePS?.era)||4.30;
  const awOPS=parseFloat(S.awayTeamStats?.ops)||0.720;
  const hwOPS=parseFloat(S.homeTeamStats?.ops)||0.720;
  const parkMult=(S.parkFactor?.run||100)/100;
  // Poisson lambda per half-inning with first-inning premium (1.10)
  const topL=(hwERA/18)*1.10*(awOPS/0.720)*parkMult;
  const botL=(awERA/18)*1.10*(hwOPS/0.720)*parkMult;
  const pTop=Math.exp(-topL);
  const pBot=Math.exp(-botL);
  const pN=pTop*pBot;
  return{nrfi:Math.round(pN*100),yrfi:100-Math.round(pN*100),away0:Math.round(pTop*100),home0:Math.round(pBot*100),awERA,hwERA};
}

// ── F5 Win Probability ──
function calcF5WP(game){
  const aw=game.teams?.away,hw=game.teams?.home;
  const awW=aw?.leagueRecord?.wins||0,awL=aw?.leagueRecord?.losses||0;
  const hwW=hw?.leagueRecord?.wins||0,hwL=hw?.leagueRecord?.losses||0;
  const awWP=awW/(awW+awL)||.5,hwWP=hwW/(hwW+hwL)||.5;
  const awERA=parseFloat(S.awayPS?.era)||4.30;
  const hwERA=parseFloat(S.homePS?.era)||4.30;
  const awWHIP=parseFloat(S.awayPS?.whip)||1.35;
  const hwWHIP=parseFloat(S.homePS?.whip)||1.35;
  const awK9=parseFloat(S.awayPS?.strikeoutsPer9Inn)||8.0;
  const hwK9=parseFloat(S.homePS?.strikeoutsPer9Inn)||8.0;
  const awEraS=Math.max(0,Math.min(100,(6-awERA)/4*100));
  const hwEraS=Math.max(0,Math.min(100,(6-hwERA)/4*100));
  const awWhipS=Math.max(0,Math.min(100,(2-awWHIP)*100));
  const hwWhipS=Math.max(0,Math.min(100,(2-hwWHIP)*100));
  const awK9S=Math.max(0,Math.min(100,(awK9-4)/8*100));
  const hwK9S=Math.max(0,Math.min(100,(hwK9-4)/8*100));
  const awFW=S.awayForm?.filter(g=>g.result==='W').length??5,awFL=S.awayForm?.length||10;
  const hwFW=S.homeForm?.filter(g=>g.result==='W').length??5,hwFL=S.homeForm?.length||10;
  const awFS=(awFW/awFL),hwFS=(hwFW/hwFL);
  // F5: heavy SP weight, smaller home edge
  const hC=hwWP*.18+(hwEraS/100)*.37+(hwWhipS/100)*.18+(hwK9S/100)*.13+(hwFS*.10)+.02;
  const aC=awWP*.18+(awEraS/100)*.37+(awWhipS/100)*.18+(awK9S/100)*.13+(awFS*.10);
  const tot=hC+aC||1;
  const hwF=Math.max(.35,Math.min(.65,.40+(hC/tot-.5)*.50));
  return{home:Math.round(hwF*100),away:Math.round((1-hwF)*100),awERA,hwERA};
}

// ── EV Calculator ──
function calcEV(americanLine,modelPct){
  const l=parseInt(americanLine);if(!l||isNaN(l)||l===0)return null;
  const p=modelPct/100;
  const profit=l>0?l/100:100/Math.abs(l);
  return Math.round((p*profit-(1-p)*1)*1000)/10;
}
function impliedProb(americanLine){
  const l=parseInt(americanLine);if(!l||isNaN(l)||l===0)return null;
  return l>0?Math.round(100/(l+100)*1000)/10:Math.round(Math.abs(l)/(Math.abs(l)+100)*1000)/10;
}

function updateEV(side,modelProb){
  const inp=$('evLine-'+side),res=$('evResult-'+side),impl=$('evImpl-'+side);
  if(!inp||!res)return;
  const line=parseInt(inp.value);
  if(!line||isNaN(line)){res.innerHTML='<span class="ev-neutral">Enter a line above</span>';if(impl)impl.innerHTML='';return;}
  const ev=calcEV(line,modelProb);
  const ip=impliedProb(line);
  const edge=Math.round((modelProb-ip)*10)/10;
  if(ev===null){res.innerHTML='<span class="ev-neutral">—</span>';return;}
  const cls=ev>0?'ev-pos':ev<0?'ev-neg':'ev-neutral';
  const lbl=ev>0?'✅ +EV':'❌ -EV';
  res.innerHTML=`<span class="${cls}">${lbl}: ${ev>0?'+':''}${ev}% per $100</span>`;
  if(impl)impl.innerHTML=`Implied: ${ip}% · Model: ${modelProb}% · Edge: ${edge>0?'+':''}${edge}%`;
}

// ── Parlay Builder ──
function calcParlayOdds(picks){
  if(!picks.length)return{prob:0,american:0,decimal:1};
  const cp=picks.reduce((p,x)=>p*(x.prob/100),1);
  const dec=1/cp;
  const am=dec>=2?Math.round((dec-1)*100):-Math.round(100/(dec-1));
  return{prob:Math.round(cp*1000)/10,american:am,decimal:Math.round(dec*100)/100};
}

    S.parlay.push(pick);

function fbStepWeek(dir){

function renderFBGrid(){
  const el=$(FBC.p+'Grid');if(!el)return;
  let games=FBS().games;
  if(FBC.conf&&FBS().conf&&FBS().conf!=='all')games=games.filter(g=>(g.competitions?.[0]?.competitors||[]).some(c=>String(c.team?.conferenceId)===String(FBS().conf)));
  if(FBS().upcomingOnly)games=games.filter(g=>g.competitions?.[0]?.status?.type?.state!=='post');
  if(!games.length){
    el.innerHTML=`<div class="no-games"><div style="font-size:48px">🏈</div><div>${FBS().upcomingOnly?'No upcoming games this week':'No games scheduled for this week'}</div></div>`;
    return;
  }
  // Sort: live first, then upcoming by time, then finals
  games=[...games].sort((a,b)=>{
    const rank=g=>{const s=g.competitions?.[0]?.status?.type?.state;return s==='in'?0:s==='post'?2:1;};
    const r=rank(a)-rank(b);
    return r!==0?r:new Date(a.date)-new Date(b.date);
  });
  el.innerHTML=games.map(g=>{
    const comp=g.competitions?.[0];
    const home=comp?.competitors?.find(c=>c.homeAway==='home');
    const away=comp?.competitors?.find(c=>c.homeAway==='away');
    const status=comp?.status?.type;
    const odds=comp?.odds?.[0];
    const isLive=status?.state==='in';
    const isFinal=status?.state==='post';
    const awAbbr=away?.team?.abbreviation||'?',hwAbbr=home?.team?.abbreviation||'?';
    const awRec=away?.records?.[0]?.summary||'',hwRec=home?.records?.[0]?.summary||'';
    const dt=g.date?new Date(g.date):null;
    const t=dt?dt.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'}):'TBD';
    const dayLbl=dt?dt.toLocaleDateString([],{weekday:'short',month:'numeric',day:'numeric'}):'';
    const scoreOrTime=isLive
      ?`<div class="nfl-live-score">${away?.score||0} - ${home?.score||0}</div><div class="nfl-vs" style="color:var(--green);font-size:10px">${status?.shortDetail||'LIVE'}</div>`
      :isFinal
      ?`<div class="nfl-final-score">${away?.score||0} - ${home?.score||0}</div><div class="nfl-vs">FINAL</div>`
      :`<div class="nfl-vs" style="font-size:10px;color:var(--gold);font-weight:700">${dayLbl}</div><div class="nfl-time">${t}</div>`;
    const spread=odds?.details||'',ou=odds?.overUnder?`O/U ${odds.overUnder}`:'';
    const tv=comp?.broadcasts?.[0]?.names?.[0]||'';
    return`<div class="nfl-game-card${g.id===FBS().selId?' active':''}${isLive?' live-game':''}" onclick="selectFBGame('${g.id}')">
  ${isLive?`<div class="nfl-live-badge">🔴 LIVE</div>`:''}
  <div class="nfl-card-teams">
    <div class="nfl-team"><img class="nfl-team-logo" src="${fbLogo(away,awAbbr)}" onerror="this.style.display='none'"><div class="nfl-team-abbr">${fbRank(away)}${awAbbr}</div><div class="nfl-team-rec">${awRec}</div></div>
    <div class="nfl-score-center">${scoreOrTime}</div>
    <div class="nfl-team"><img class="nfl-team-logo" src="${fbLogo(home,hwAbbr)}" onerror="this.style.display='none'"><div class="nfl-team-abbr">${fbRank(home)}${hwAbbr}</div><div class="nfl-team-rec">${hwRec}</div></div>
  </div>
  <div class="nfl-card-chips">
    ${spread?`<span class="nfl-chip">📊 ${spread}</span>`:''}
    ${ou?`<span class="nfl-chip">📈 ${ou}</span>`:''}
    ${tv?`<span class="nfl-chip">📺 ${tv}</span>`:''}
    ${comp?.venue?.indoor?`<span class="nfl-chip">🏟️ Dome</span>`:''}
    ${comp?.venue?.address?.city?`<span class="nfl-chip" style="color:var(--text3)">${comp.venue.address.city}</span>`:''}
  </div>
</div>`;
  }).join('');
}

  const status=comp?.status?.type;
  $(FBC.p+'MatchupEl').innerHTML='<div class="day-hr-loading"><div class="spinner"></div>Loading team stats…</div>';
  $(FBC.p+'PropsEl').innerHTML='';$(FBC.p+'CoverageEl').innerHTML='';FBS().props=null;
  renderFBHero(g,home,away,venue,status);
  renderFBOdds(home,away,odds);
  renderFBWinProb(home,away,odds);
  renderFBOU(odds,weather,venue);
  renderFBWeather(weather,venue);
  renderFBUpset(home,away,odds);
  go(()=>renderFBHighlights(g));
  go(async()=>loadFBBoxscore(g));
  const homeId=home?.team?.id,awayId=away?.team?.id;
  if(homeId&&awayId){
    try{
      const[hs,as]=await Promise.all([api(`${FBC.api}/teams/${homeId}/statistics`),api(`${FBC.api}/teams/${awayId}/statistics`)]);
      renderFBMatchup(away,home,as,hs);
      go(async()=>loadFBProps(away,home,as,hs,odds));
    }catch(e){$(FBC.p+'MatchupEl').innerHTML='';$(FBC.p+'PropsEl').innerHTML='';$(FBC.p+'CoverageEl').innerHTML='';}
  } else {$(FBC.p+'MatchupEl').innerHTML='';$(FBC.p+'PropsEl').innerHTML='';$(FBC.p+'CoverageEl').innerHTML='';}
}

function renderFBOdds(home,away,odds){

function renderFBWinProb(home,away,odds){
  const awA=away?.team?.abbreviation||'AWY',hwA=home?.team?.abbreviation||'HME';
  let homeWP=52,src='home field edge';
  if(odds?.details){
    const sp=parseFloat(odds.details);
    if(!isNaN(sp)){homeWP=Math.round(Math.min(90,Math.max(10,50+(-sp)*2.4)));src='Vegas spread';}
  } else if(odds?.homeTeamOdds?.moneyLine){
    const ml=odds.homeTeamOdds.moneyLine;
    const imp=ml>0?(100/(ml+100)):((-ml)/((-ml)+100));
    homeWP=Math.round(Math.min(90,Math.max(10,imp*100)));src='moneyline';
  } else {
    const awRec=away?.records?.[0]?.summary||'0-0',hwRec=home?.records?.[0]?.summary||'0-0';
    const[awW,awL]=awRec.split('-').map(Number),[hwW,hwL]=hwRec.split('-').map(Number);
    const awWP=(awW||0)/Math.max(1,(awW||0)+(awL||0)),hwWP=(hwW||0)/Math.max(1,(hwW||0)+(hwL||0));
    homeWP=Math.round(Math.min(82,Math.max(18,(hwWP/(awWP+hwWP||1))*100+3)));src='team records';
  }
  const awayWP=100-homeWP;
  $(FBC.p+'WPEl').innerHTML=`<div class="prob-card"><div class="prob-title">⚡ Win Probability <span style="font-size:10px;color:var(--text3);font-weight:400">via ${src}</span></div>
  <div class="prob-bar-wrap"><div class="prob-away" style="width:${awayWP}%;background:linear-gradient(90deg,#c9a227,#a8871d)">${awayWP}%</div><div class="prob-home" style="width:${homeWP}%">${homeWP}%</div></div>
  <div class="prob-labels"><span style="color:var(--accent)">${awA} ${awayWP}%</span><span style="color:var(--accent2)">${hwA} ${homeWP}%</span></div>
  </div>`;}

function renderFBOU(odds,weather,venue){
  const ou=odds?.overUnder;
  const indoor=venue?.indoor;
  const factors=[],ts_cls=d=>`ts-factor ts-factor-${d}`;
  let score=0;
  if(ou){if(ou>=50){score+=2;factors.push({l:`High total (${ou})`,d:'over'});}else if(ou<=38){score-=2;factors.push({l:`Low total set (${ou})`,d:'under'});}}
  if(!indoor&&weather){
    const tmp=weather.temperature||70,wnd=weather.wind?.speed||0;
    if(tmp>82){score+=2;factors.push({l:`${tmp}°F — warm weather boosts scoring`,d:'over'});}
    else if(tmp<38){score-=3;factors.push({l:`${tmp}°F — cold suppresses scoring/kicking`,d:'under'});}
    else if(tmp<52){score-=1;factors.push({l:`${tmp}°F — cool weather`,d:'under'});}
    if(wnd>20){score-=4;factors.push({l:`Strong wind ${wnd}mph — hurts passing game`,d:'under'});}
    else if(wnd>15){score-=2;factors.push({l:`Wind ${wnd}mph — affects kicking range`,d:'under'});}
    else if(wnd>10){score-=1;factors.push({l:`Moderate wind ${wnd}mph`,d:'under'});}
    const precip=weather.precipitation||0;
    if(precip>70){score-=2;factors.push({l:`Rain/snow likely — run-heavy game`,d:'under'});}
  } else if(indoor){factors.push({l:'Indoor dome — weather neutral',d:'neutral'});}
  let lean,cls,icon;
  if(score>=3){lean='Lean OVER';cls='lean-over';icon='⬆️';}
  else if(score<=-4){lean='Strong UNDER';cls='lean-under-strong';icon='📉';}
  else if(score<=-2){lean='Lean UNDER';cls='lean-under';icon='⬇️';}
  else{lean='Toss-Up';cls='lean-neutral';icon='⚖️';}
  $(FBC.p+'OUEl').innerHTML=`<div class="prob-card"><div class="prob-title">📊 O/U Analysis${ou?` · Total ${ou}`:''}</div>
  <div class="ts-factors" style="margin:8px 0">${factors.map(f=>`<span class="${ts_cls(f.d)}">${f.l}</span>`).join('')||'<span style="font-size:11px;color:var(--text3)">Insufficient data</span>'}</div>
  <div class="ts-lean ${cls}" style="display:inline-block;margin-top:4px">${icon} ${lean}</div>
  </div>`;}

function renderFBUpset(home,away,odds){
  const el=$(FBC.p+'UpsetEl');if(!el)return;
  if(!odds?.details){el.innerHTML='';return;}
  const sp=parseFloat(odds.details);if(isNaN(sp)||Math.abs(sp)<4){el.innerHTML='';return;}
  const homeIsFav=sp<0,margin=Math.abs(sp);
  const udAbbr=homeIsFav?away?.team?.abbreviation:home?.team?.abbreviation;
  const favAbbr=homeIsFav?home?.team?.abbreviation:away?.team?.abbreviation;
  const udRec=(homeIsFav?away:home)?.records?.[0]?.summary||'?';
  const favRec=(homeIsFav?home:away)?.records?.[0]?.summary||'?';
  const[udW,udL]=udRec.split('-').map(Number),[favW,favL]=favRec.split('-').map(Number);
  const udWP=(udW||0)/Math.max(1,(udW||0)+(udL||0)),favWP=(favW||0)/Math.max(1,(favW||0)+(favL||0));
  const reasons=[];let pts=0;
  if(udWP>favWP+0.1){reasons.push(`📈 ${udAbbr} has a better record (${udRec} vs ${favRec})`);pts+=3;}
  else if(udWP>0.55){reasons.push(`✅ ${udAbbr} is a winning team (${udRec})`);pts+=2;}
  if(favWP<0.40){reasons.push(`⚠️ ${favAbbr} struggling this season (${favRec})`);pts+=2;}
  if(!homeIsFav){reasons.push(`🏠 ${udAbbr} has home field advantage`);pts+=1;}
  if(margin>=7&&margin<10){reasons.push(`📊 ${margin}-point spread is significant but not insurmountable`);pts+=1;}
  if(pts<2||!reasons.length){el.innerHTML='';return;}
  const level=pts>=4?'high':'medium';
  el.innerHTML=`<div class="upset-card upset-${level}">
  <div class="upset-header"><span class="upset-title">${level==='high'?'🚨 Strong Upset Alert':'⚠️ Upset Watch'}</span><span class="upset-teams">${udAbbr} over ${favAbbr}</span></div>
  <div class="upset-reason-list">${reasons.map(r=>`<div class="upset-reason">• ${r}</div>`).join('')}</div>
  <div class="upset-note">Check current injury reports and line movement before betting.</div>
</div>`;}

function renderFBMatchup(away,home,awStats,hwStats){
  const el=$(FBC.p+'MatchupEl');if(!el)return;
  const awA=away?.team?.abbreviation||'AWY',hwA=home?.team?.abbreviation||'HME';
  function gv(stats,catName,statName){
    const cats=stats?.results?.categories||stats?.splits?.categories||[];
    const cat=cats.find(c=>c.name===catName||c.displayName===catName);
    const st=cat?.stats?.find(s=>s.name===statName||s.displayName===statName);
    return parseFloat((st?.displayValue||'').replace(/,/g,''))||0;
  }
  const rows=[
    {l:'Points/Game',   aw:gv(awStats,'scoring','avgPoints'),   hw:gv(hwStats,'scoring','avgPoints'),   hi:'over'},
    {l:'Pass Yds/G',    aw:gv(awStats,'passing','yardsPerGame'), hw:gv(hwStats,'passing','yardsPerGame'), hi:'over'},
    {l:'Rush Yds/G',    aw:gv(awStats,'rushing','yardsPerGame'), hw:gv(hwStats,'rushing','yardsPerGame'), hi:'over'},
    {l:'Pts Allowed/G', aw:gv(awStats,'scoring','opponentAvgPoints'), hw:gv(hwStats,'scoring','opponentAvgPoints'), hi:'under'},
    {l:'Sacks',         aw:gv(awStats,'defensive','sacks'),      hw:gv(hwStats,'defensive','sacks'),      hi:'over'},
    {l:'TO Diff',       aw:gv(awStats,'turnovers','turnoverRatio'), hw:gv(hwStats,'turnovers','turnoverRatio'), hi:'over'},
  ].filter(r=>r.aw>0||r.hw>0);
  if(!rows.length){el.innerHTML='';return;}
  const rowsHTML=rows.map(r=>{
    const awBetter=r.hi==='over'?r.aw>r.hw:r.aw<r.hw;
    const hwBetter=r.hi==='over'?r.hw>r.aw:r.hw<r.aw;
    return`<div class="nfl-stat-row">
  <div class="nfl-stat-val-l" style="color:${awBetter?'var(--green)':'var(--accent)'}">${r.aw%1===0?r.aw:r.aw.toFixed(1)}</div>
  <div class="nfl-stat-lbl">${r.l}</div>
  <div class="nfl-stat-val-r" style="color:${hwBetter?'var(--green)':'var(--accent2)'}">${r.hw%1===0?r.hw:r.hw.toFixed(1)}</div>
</div>`;
  }).join('');
  el.innerHTML=`<div class="nfl-matchup-card prob-card">
  <div class="prob-title">⚔️ Team Stats Matchup</div>
  <div style="display:flex;justify-content:space-between;font-size:10px;font-weight:800;text-transform:uppercase;margin:8px 0 2px">
    <span style="color:var(--accent)">${awA} (Away)</span><span style="color:var(--accent2)">${hwA} (Home)</span>
  </div>
  <div class="nfl-matchup-rows">${rowsHTML}</div>
  <div style="font-size:9px;color:var(--text3);margin-top:6px">Green = statistical edge · Stats from current season</div>
</div>`;}

function cvScheme(abbr){return COVERAGE[abbr]||{man:33,blitz:26,press:28,style:'Mixed',note:'League-average baseline'};}

// Derive receiver archetype from box-score profile
function cvArchetype(p){
  const ypr=p.rRec>0?p.rRecYds/p.rRec:0;
  const catchRate=p.rTgts>0?p.rRec/p.rTgts:0;
  const tgtVol=p.rTgts;
  if(p.pos==='RB'){
    if(tgtVol>=3.5)return{key:'passRB',label:'Receiving Back',ypr,catchRate,tgtVol};
    return{key:'rushRB',label:'Ground Back',ypr,catchRate,tgtVol};
  }
  if(p.pos==='TE'){
    if(ypr>=13)return{key:'seamTE',label:'Seam Stretcher',ypr,catchRate,tgtVol};
    return{key:'chainTE',label:'Chain-Mover TE',ypr,catchRate,tgtVol};
  }
  if(ypr>=15.5)return{key:'deep',label:'Deep Threat',ypr,catchRate,tgtVol};
  if(ypr>=12.5&&tgtVol>=6)return{key:'alpha',label:'Alpha X Receiver',ypr,catchRate,tgtVol};
  if(catchRate>=0.70&&ypr<11.5)return{key:'slot',label:'Slot / Possession',ypr,catchRate,tgtVol};
  if(ypr<11.5&&tgtVol>=5)return{key:'volume',label:'Volume Underneath',ypr,catchRate,tgtVol};
  return{key:'balanced',label:'Balanced Route Runner',ypr,catchRate,tgtVol};
}

// Grade a player's matchup vs the opposing scheme
function cvGrade(p,arch,scheme,oppPassDefRating){
  let score=50;const notes=[];
  const manLean=scheme.man-33;   // vs league baseline
  const zoneLean=-manLean;
  const blitzLean=scheme.blitz-26;
  const pressLean=scheme.press-28;

  // Archetype vs man/zone
  if(arch.key==='deep'||arch.key==='alpha'||arch.key==='seamTE'){
    if(manLean>3){score+=manLean*1.5;notes.push({t:`Man-heavy defense (${scheme.man}%) leaves single coverage for a vertical threat`,d:'pos'});}
    else if(zoneLean>3){score-=zoneLean*1.2;notes.push({t:`Zone shells (${100-scheme.man}%) put safety help over the top`,d:'neg'});}
  } else if(arch.key==='slot'||arch.key==='volume'||arch.key==='chainTE'||arch.key==='passRB'){
    if(zoneLean>3){score+=zoneLean*1.4;notes.push({t:`Zone-heavy (${100-scheme.man}%) creates soft spots underneath to settle into`,d:'pos'});}
    else if(manLean>3){score-=manLean*1.1;notes.push({t:`Man coverage (${scheme.man}%) travels with him and limits free releases`,d:'neg'});}
  }
  // Blitz interaction
  if(blitzLean>4){
    if(arch.key==='slot'||arch.key==='volume'||arch.key==='passRB'||arch.key==='chainTE'){score+=blitzLean*0.9;notes.push({t:`High blitz rate (${scheme.blitz}%) forces quick game — hot-route target`,d:'pos'});}
    else{score-=blitzLean*0.7;notes.push({t:`Blitz rate ${scheme.blitz}% shortens the clock on deep developing routes`,d:'neg'});}
  } else if(blitzLean<-4&&(arch.key==='deep'||arch.key==='alpha')){
    score-=3;notes.push({t:`Low blitz rate (${scheme.blitz}%) means more coverage bodies downfield`,d:'neg'});
  }
  // Press interaction
  if(pressLean>4){
    if(arch.catchRate>=0.68){score+=2;notes.push({t:`Press-heavy (${scheme.press}%) but his ${Math.round(arch.catchRate*100)}% catch rate shows reliable hands vs contact`,d:'pos'});}
    else{score-=pressLean*0.8;notes.push({t:`Press coverage (${scheme.press}%) can disrupt timing at the line`,d:'neg'});}
  }
  // Volume floor — heavy target share raises the floor regardless of scheme
  if(arch.tgtVol>=8){score+=7;notes.push({t:`Elite target volume (${arch.tgtVol.toFixed(1)}/gm) keeps the floor high in any scheme`,d:'pos'});}
  else if(arch.tgtVol>=6){score+=4;}
  else if(arch.tgtVol<3&&p.pos!=='RB'){score-=6;notes.push({t:`Low target share (${arch.tgtVol.toFixed(1)}/gm) caps the ceiling`,d:'neg'});}
  // Opponent pass defense quality
  if(oppPassDefRating>0){
    const d=oppPassDefRating-225; // league avg pass yds allowed/gm
    if(d>25){score+=6;notes.push({t:`Opponent allows ${Math.round(oppPassDefRating)} pass yds/gm — a leaky secondary`,d:'pos'});}
    else if(d<-25){score-=6;notes.push({t:`Opponent allows only ${Math.round(oppPassDefRating)} pass yds/gm — stingy pass defense`,d:'neg'});}
  }
  score=Math.max(5,Math.min(98,score));
  let letter,cls;
  if(score>=88){letter='A+';cls='grade-a';}
  else if(score>=80){letter='A';cls='grade-a';}
  else if(score>=73){letter='B+';cls='grade-b';}
  else if(score>=66){letter='B';cls='grade-b';}
  else if(score>=58){letter='C+';cls='grade-c';}
  else if(score>=50){letter='C';cls='grade-c';}
  else if(score>=42){letter='D+';cls='grade-d';}
  else if(score>=34){letter='D';cls='grade-d';}
  else{letter='F';cls='grade-f';}
  return{score:Math.round(score),letter,cls,notes:notes.slice(0,3)};
}

// ══════════ NFL PLAYER PROPS ══════════
const SKILL_POS=new Set(['QB','RB','WR','TE','FB']);

// Pull a stat value from ESPN athlete stats payload (most recent season with data)
function athStat(data,catName,statName){
  const cat=(data?.categories||[]).find(c=>c.name===catName);
  if(!cat)return 0;
  const idx=(cat.names||[]).indexOf(statName);
  if(idx<0)return 0;
  const rows=(cat.statistics||[]).filter(r=>r.season?.year);
  if(!rows.length)return 0;
  const row=rows[rows.length-1];
  return parseFloat(String(row.stats?.[idx]??'0').replace(/,/g,''))||0;
}
function athSeasonYear(data){
  for(const c of (data?.categories||[])){
    const rows=(c.statistics||[]).filter(r=>r.season?.year);
    if(rows.length)return rows[rows.length-1].season.year;
  }
  return null;
}

// Team stat helper (reuses team statistics payload)
function tStat(stats,catName,statName){
  const cats=stats?.results?.categories||stats?.splits?.categories||[];
  const cat=cats.find(c=>c.name===catName||c.displayName===catName);
  const st=cat?.stats?.find(s=>s.name===statName||s.displayName===statName);
  return parseFloat(String(st?.displayValue||'').replace(/,/g,''))||0;
}

// Parse "ARI -3.5" → {abbr:'ARI', line:-3.5}
function parseSpread(details){
  if(!details)return null;
  const m=String(details).match(/([A-Z]{2,4})\s*([+-]?\d+(?:\.\d+)?)/);
  if(!m)return null;
  return{abbr:m[1],line:parseFloat(m[2])};
}

async function loadFBProps(away,home,awTeamStats,hwTeamStats,odds){
  const el=$(FBC.p+'PropsEl');if(!el)return;
  el.innerHTML='<div class="day-hr-loading"><div class="spinner"></div>Building player projections…</div>';
  const awId=away?.team?.id,hwId=home?.team?.id;
  const awAbbr=away?.team?.abbreviation||'AWY',hwAbbr=home?.team?.abbreviation||'HME';

  // ── Implied team totals from Vegas ──
  const ou=parseFloat(odds?.overUnder)||44.0;
  const sp=parseSpread(odds?.details);
  let awSpread=0,hwSpread=0;
  if(sp){
    if(sp.abbr===hwAbbr){hwSpread=sp.line;awSpread=-sp.line;}
    else if(sp.abbr===awAbbr){awSpread=sp.line;hwSpread=-sp.line;}
  }
  const awImplied=Math.max(10,ou/2-awSpread/2);
  const hwImplied=Math.max(10,ou/2-hwSpread/2);
  const LG_AVG_PTS=22.5;

  // ── Rosters ──
  const[awR,hwR]=await Promise.all([
    api(`${FBC.api}/teams/${awId}/roster`),
    api(`${FBC.api}/teams/${hwId}/roster`)
  ]);
  const pickSkill=data=>{
    const all=(data?.athletes||[]).flatMap(g=>g.items||[]);
    return all.filter(p=>SKILL_POS.has(p.position?.abbreviation)).slice(0,16);
  };
  const awPlayers=pickSkill(awR),hwPlayers=pickSkill(hwR);
  if(!awPlayers.length&&!hwPlayers.length){el.innerHTML='';return;}

  // ── Fetch season stats for each skill player ──
  const fetchAll=players=>Promise.all(players.map(p=>api(`${FBC.ath}/${p.id}/stats`).catch(()=>null)));
  const[awStatsArr,hwStatsArr]=await Promise.all([fetchAll(awPlayers),fetchAll(hwPlayers)]);

  // ── Opponent defensive strength multipliers ──
  const defMult=(oppTeamStats,fallback=1)=>{
    const ptsAllowed=tStat(oppTeamStats,'scoring','opponentAvgPoints');
    if(!ptsAllowed)return fallback;
    return Math.min(1.30,Math.max(0.75,ptsAllowed/LG_AVG_PTS));
  };
  const awDefFaced=defMult(hwTeamStats); // away offense faces home defense
  const hwDefFaced=defMult(awTeamStats);

  const build=(players,statsArr,teamAbbr,teamId,implied,oppDef,oppAbbr,isHome)=>{
    const paceMult=Math.min(1.35,Math.max(0.70,implied/LG_AVG_PTS));
    const envMult=paceMult*0.65+oppDef*0.35;
    const out=[];
    players.forEach((p,i)=>{
      const d=statsArr[i];if(!d)return;
      const pos=p.position?.abbreviation||'';
      const gp=Math.max(athStat(d,'passing','gamesPlayed'),athStat(d,'rushing','gamesPlayed'),athStat(d,'receiving','gamesPlayed'),athStat(d,'scoring','gamesPlayed'));
      if(gp<1)return;
      const season=athSeasonYear(d);
      // Season totals
      const passYds=athStat(d,'passing','passingYards'),passTD=athStat(d,'passing','passingTouchdowns');
      const passAtt=athStat(d,'passing','passingAttempts'),passInt=athStat(d,'passing','interceptions');
      const rushYds=athStat(d,'rushing','rushingYards'),rushTD=athStat(d,'rushing','rushingTouchdowns');
      const rushAtt=athStat(d,'rushing','rushingAttempts');
      const rec=athStat(d,'receiving','receptions'),recYds=athStat(d,'receiving','receivingYards');
      const recTD=athStat(d,'receiving','receivingTouchdowns'),tgts=athStat(d,'receiving','receivingTargets');
      // Per-game rates
      const pg=v=>gp>0?v/gp:0;
      const rPassYds=pg(passYds),rPassTD=pg(passTD),rRushYds=pg(rushYds),rRushTD=pg(rushTD);
      const rRec=pg(rec),rRecYds=pg(recYds),rRecTD=pg(recTD),rTgts=pg(tgts),rRushAtt=pg(rushAtt);
      // Skip non-contributors
      const usage=rPassYds+rRushYds+rRecYds;
      if(usage<8)return;
      // Projections
      const projPassYds=rPassYds*envMult,projPassTD=rPassTD*paceMult;
      const projRushYds=rRushYds*envMult,projRecYds=rRecYds*envMult;
      const projRec=rRec*(envMult*0.5+0.5); // receptions less volatile than yards
      const projRushTD=rRushTD*paceMult,projRecTD=rRecTD*paceMult;
      const projAnyTD=projRushTD+projRecTD;
      const anyTDPct=Math.round(Math.min(85,(1-Math.exp(-projAnyTD))*100));
      const score=projPassYds*0.045+projRushYds*0.11+projRecYds*0.11+projRec*1.4+projAnyTD*11+projPassTD*4.5;
      out.push({id:p.id,name:p.displayName||p.fullName||'?',pos,teamAbbr,teamId,oppAbbr,isHome,season,gp,
        headshot:p.headshot?.href||'',jersey:p.jersey||'',
        injured:(p.injuries||[]).length>0,injStatus:p.injuries?.[0]?.status||'',
        rPassYds,rPassTD,rRushYds,rRushTD,rRec,rRecYds,rRecTD,rTgts,rRushAtt,
        projPassYds,projPassTD,projRushYds,projRecYds,projRec,projAnyTD,anyTDPct,
        passAtt,passInt,score,envMult,implied});
    });
    return out.sort((a,b)=>b.score-a.score);
  };

  const awProps=build(awPlayers,awStatsArr,awAbbr,awId,awImplied,awDefFaced,hwAbbr,false);
  const hwProps=build(hwPlayers,hwStatsArr,hwAbbr,hwId,hwImplied,hwDefFaced,awAbbr,true);
  if(!awProps.length&&!hwProps.length){el.innerHTML='<div class="prob-card"><div class="prob-title">🎯 Player Props</div><div style="font-size:11px;color:var(--text3);margin-top:6px">No season stats available yet for these rosters.</div></div>';return;}

  // Pass yards allowed per game (for coverage grading)
  const passYdsAllowed=ts=>tStat(ts,'passing','opponentYardsPerGame')||tStat(ts,'passing','netYardsPerGame')||0;
  FBS().props={away:awProps.slice(0,8),home:hwProps.slice(0,8),awAbbr,hwAbbr,awId,hwId,awImplied,hwImplied,ou,awSpread,hwSpread,
    awPassYdsAllowed:passYdsAllowed(awTeamStats),hwPassYdsAllowed:passYdsAllowed(hwTeamStats)};
  renderFBProps();
  go(()=>renderFBCoverage());
}

function propCard(p){
  const rows=[];
  const mk=(lbl,val,avg,unit='')=>{
    const lean=avg>0?(val>avg*1.04?'up':val<avg*0.96?'down':null):null;
    rows.push(`<div class="np-prop-row">

  <span class="np-prop-avg">avg ${avg}</span>
</div>`);
  };
  if(p.pos==='QB'){
    if(p.projPassYds>20)mk('Pass Yds',p.projPassYds.toFixed(1),p.rPassYds.toFixed(1));
    if(p.projPassTD>0.15)mk('Pass TDs',p.projPassTD.toFixed(2),p.rPassTD.toFixed(2));
    if(p.projRushYds>4)mk('Rush Yds',p.projRushYds.toFixed(1),p.rRushYds.toFixed(1));
  } else {
    if(p.projRushYds>4)mk('Rush Yds',p.projRushYds.toFixed(1),p.rRushYds.toFixed(1));
    if(p.projRec>0.4)mk('Receptions',p.projRec.toFixed(1),p.rRec.toFixed(1));
    if(p.projRecYds>4)mk('Rec Yds',p.projRecYds.toFixed(1),p.rRecYds.toFixed(1));
  }
  const tdColor=p.anyTDPct>=55?'#4ea88a':p.anyTDPct>=35?'var(--gold)':'var(--text2)';
  const elite=p.score>=22;
  return`<div class="np-card${elite?' np-elite':''}">
  <div class="np-head">
    ${p.headshot?`<img class="np-hs" src="${p.headshot}" onerror="this.style.visibility='hidden'" alt="">`:'<div class="np-hs"></div>'}
    <div class="np-name-block">
      <div class="np-name">${p.name}${p.injured?`<span class="np-inj">${p.injStatus||'INJ'}</span>`:''}</div>
      <div class="np-sub">${p.pos}${p.jersey?` #${p.jersey}`:''} · ${p.teamAbbr} vs ${p.oppAbbr} · ${p.gp}G${p.season?` '${String(p.season).slice(2)}`:''}</div>
    </div>
    <div class="np-td-badge">
      <div class="np-td-val" style="color:${tdColor}">${p.anyTDPct}%</div>
      <div class="np-td-lbl">Any TD</div>
    </div>
  </div>
  <div class="np-props">${rows.join('')||'<div style="font-size:10px;color:var(--text3);padding:3px">Limited usage data</div>'}</div>
</div>`;
}

function renderFBPassMatchup(d){
  const el=$(FBC.p+'CoverageEl');if(!el)return;
  const rows=[];
  const add=(players,oppPassYds,oppAbbr)=>players.forEach(p=>{
    if(!(p.rTgts>=1.5||p.pos==='RB'))return;

    let score=50;const notes=[];
    if(arch.tgtVol>=8){score+=10;notes.push({t:`Heavy target share (${arch.tgtVol.toFixed(1)}/gm) — offense runs through him`,d:'pos'});}
    else if(arch.tgtVol>=6){score+=5;}
    else if(arch.tgtVol<3&&p.pos!=='RB'){score-=8;notes.push({t:`Light target share (${arch.tgtVol.toFixed(1)}/gm) caps the ceiling`,d:'neg'});}
    if(arch.catchRate>=0.72){score+=6;notes.push({t:`${Math.round(arch.catchRate*100)}% catch rate — reliable hands`,d:'pos'});}
    else if(arch.catchRate>0&&arch.catchRate<0.52){score-=5;notes.push({t:`Only ${Math.round(arch.catchRate*100)}% catch rate — volatile`,d:'neg'});}
    if(arch.ypr>=16){score+=6;notes.push({t:`${arch.ypr.toFixed(1)} yds/rec — explosive-play profile`,d:'pos'});}
    if(oppPassYds>0){
      const diff=oppPassYds-235; // FBS avg pass yds allowed/gm
      if(diff>35){score+=10;notes.push({t:`${oppAbbr} allows ${Math.round(oppPassYds)} pass yds/gm — exploitable secondary`,d:'pos'});}
      else if(diff>15){score+=5;}
      else if(diff<-35){score-=10;notes.push({t:`${oppAbbr} allows only ${Math.round(oppPassYds)} pass yds/gm — lockdown pass defense`,d:'neg'});}
      else if(diff<-15){score-=5;}
    }
    score=Math.max(5,Math.min(98,score));
    let letter,cls;
    if(score>=88){letter='A+';cls='grade-a';}else if(score>=80){letter='A';cls='grade-a';}
    else if(score>=73){letter='B+';cls='grade-b';}else if(score>=66){letter='B';cls='grade-b';}
    else if(score>=58){letter='C+';cls='grade-c';}else if(score>=50){letter='C';cls='grade-c';}
    else if(score>=42){letter='D+';cls='grade-d';}else if(score>=34){letter='D';cls='grade-d';}
    else{letter='F';cls='grade-f';}
    rows.push({p,arch,g:{score:Math.round(score),letter,cls,notes:notes.slice(0,3)}});
  });
  add(d.away,d.hwPassYdsAllowed,d.hwAbbr);
  add(d.home,d.awPassYdsAllowed,d.awAbbr);
  if(!rows.length){el.innerHTML='';return;}
  rows.sort((a,b)=>b.g.score-a.g.score);

    </div>

  </div>
  <div class="cv-arch">${arch.label}</div>

    <div class="cv-split"><div class="cv-split-v">${Math.round(arch.catchRate*100)}%</div><div class="cv-split-l">Catch Rt</div></div>
    <div class="cv-split"><div class="cv-split-v">${arch.tgtVol.toFixed(1)}</div><div class="cv-split-l">Tgts/G</div></div>
    <div class="cv-split"><div class="cv-split-v" style="color:var(--gold)">${p.projRecYds.toFixed(0)}</div><div class="cv-split-l">Proj Yds</div></div>
  </div>
  <div class="cv-notes">${g.notes.map(n=>`<div class="cv-note cv-note-${n.d==='pos'?'pos':'neg'}">${n.d==='pos'?'\u2713':'\u2715'} ${n.t}</div>`).join('')||'<div class="cv-note">Neutral matchup</div>'}</div>
</div>`).join('');
  el.innerHTML=`<div class="props-card">
  <div class="prob-title">\ud83d\udee1\ufe0f Pass Matchup Grades</div>
  <div style="font-size:11px;color:var(--text3);margin-bottom:8px">Receiver profile vs the opposing pass defense</div>
  <div class="cv-grid">${cards}</div>
  <div style="font-size:9px;color:var(--text3);margin-top:8px;line-height:1.5">Graded on target volume, catch rate, yards per reception and opponent pass yards allowed. Unlike the NFL view, no man/zone scheme rates are applied — that data isn't publicly available for FBS, so nothing here is inferred from coverage tendencies.</div>
</div>`;}

// ── College conference filter ──
function fbConfList(){
  const m=new Map();
  (FBS().games||[]).forEach(g=>{
    (g.competitions?.[0]?.competitors||[]).forEach(c=>{
      const id=c.team?.conferenceId,nm=c.team?.conferenceId;
      if(id)m.set(String(id),CFB_CONF[String(id)]||`Conf ${id}`);
    });
  });
  return [...m.entries()].sort((a,b)=>a[1].localeCompare(b[1]));
}
function onFBConf(v){FBS().conf=v;renderFBControls();renderFBGrid();populateSelects();}
const CFB_CONF={'1':'ACC','4':'Big 12','5':'Big Ten','8':'SEC','9':'Pac-12','12':'Conference USA','15':'MAC','17':'Mountain West','18':'Independent','20':'American','21':'Sun Belt','151':'FBS'};

// ══════════ VIDEO HIGHLIGHTS ══════════
// MLB exposes direct MP4s via /game/{pk}/content, so those play inline.
// ESPN's public API returns no video assets for NFL/CFB (rights-gated),
// so football falls back to the event's own highlight links.

// Walk any JSON shape and collect objects that carry a playbacks array.
function collectVideos(node,out,seen){
  out=out||[];seen=seen||new Set();
  if(!node||typeof node!=='object')return out;
  if(Array.isArray(node)){node.forEach(n=>collectVideos(n,out,seen));return out;}
  if(Array.isArray(node.playbacks)&&node.playbacks.length){
    const key=node.id||node.slug||node.headline;
    if(key&&!seen.has(key)){seen.add(key);out.push(node);}
  }
  Object.values(node).forEach(v=>{if(v&&typeof v==='object')collectVideos(v,out,seen);});
  return out;
}
function bestPlayback(v){
  const ps=(v.playbacks||[]).filter(p=>/\.mp4/i.test(p.url||''));
  if(!ps.length)return null;
  const score=p=>{
    const u=p.url||'';
    const m=u.match(/_(\d+)K\.mp4/i);
    const kbps=m?parseInt(m[1]):3000;
    // prefer ~2500-5000K: good quality without a slow start
    return Math.abs(kbps-4000);
  };
  return ps.slice().sort((a,b)=>score(a)-score(b))[0].url;
}
function bestThumb(v){
  const cuts=v.image?.cuts;
  if(Array.isArray(cuts)&&cuts.length){
    const sorted=cuts.slice().sort((a,b)=>Math.abs((a.width||0)-640)-Math.abs((b.width||0)-640));
    return sorted[0].src||'';
  }
  if(cuts&&typeof cuts==='object'){const k=Object.values(cuts)[0];if(k?.src)return k.src;}
  return v.thumbnail||'';
}
function fmtDur(d){
  if(!d)return '';
  const parts=String(d).split(':').map(Number);
  if(parts.length===3)return (parts[0]?parts[0]+':'+String(parts[1]).padStart(2,'0'):parts[1])+':'+String(parts[2]).padStart(2,'0');
  return String(d);
}

function openVideo(url,title){
  const m=$('vidModal'),p=$('vidPlayer');
  if(!m||!p)return;
  p.src=url;$('vidTitle').textContent=title||'';
  m.classList.add('on');document.body.style.overflow='hidden';
  p.play&&p.play().catch(()=>{});
}
function closeVideo(){
  const m=$('vidModal'),p=$('vidPlayer');
  if(!m||!p)return;
  p.pause&&p.pause();p.removeAttribute('src');p.load&&p.load();
  m.classList.remove('on');document.body.style.overflow='';
}
function handleVidModalClick(e){if(e.target===$('vidModal'))closeVideo();}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('vidModal')?.classList.contains('on'))closeVideo();});

function hlCards(vids){
  return vids.map(v=>{
    const url=bestPlayback(v);if(!url)return '';
    const thumb=bestThumb(v);
    const title=(v.headline||v.blurb||'Highlight').replace(/"/g,'&quot;');
    const dur=fmtDur(v.duration);
    const when=v.date?new Date(v.date).toLocaleDateString([],{month:'short',day:'numeric'}):'';
    return`<div class="hl-item" onclick="openVideo('${url}','${title}')" title="${title}">
  <div class="hl-thumb-wrap">
    ${thumb?`<img class="hl-thumb" src="${thumb}" loading="lazy" alt="">`:''}
    <div class="hl-play"><span>▶</span></div>
    ${dur?`<div class="hl-dur">${dur}</div>`:''}
  </div>
  <div class="hl-meta"><div class="hl-title">${v.headline||v.blurb||'Highlight'}</div>${when?`<div class="hl-sub">${when}</div>`:''}</div>
</div>`;
  }).filter(Boolean).join('');
}

// ── MLB ──
async function loadHighlights(game){
  const el=$('highlightsEl');if(!el)return;
  const state=game.status?.abstractGameState;
  if(state==='Preview'){el.innerHTML='';return;}
  el.innerHTML='<div class="day-hr-loading"><div class="spinner"></div>Loading highlights…</div>';
  const data=await api(`${MLB}/game/${game.gamePk}/content`);
  const vids=collectVideos(data).filter(v=>bestPlayback(v));
  if(!vids.length){el.innerHTML='';return;}
  // Condensed game / full highlight reels first, then individual plays
  const rank=v=>{const h=(v.headline||'').toLowerCase();
    return /highlights/.test(h)?0:/condensed/.test(h)?1:2;};
  vids.sort((a,b)=>rank(a)-rank(b)||new Date(b.date||0)-new Date(a.date||0));
  el.innerHTML=`<div class="hl-card">
  <div class="prob-title">🎬 Video Highlights <span style="font-size:10px;color:var(--text3);font-weight:400">${vids.length} clip${vids.length!==1?'s':''}</span></div>
  <div class="hl-row">${hlCards(vids.slice(0,12))}</div>
</div>`;}

// ── Football: link out (ESPN gates highlight video) ──
function renderFBHighlights(g){
  const el=$(FBC.p+'HighlightsEl');if(!el)return;
  const state=g.competitions?.[0]?.status?.type?.state;
  if(state==='pre'){el.innerHTML='';return;}
  const want={highlights:{t:'Watch highlights',i:'🎬'},summary:{t:'Gamecast',i:'📊'},
              boxscore:{t:'Box score',i:'📋'},pbp:{t:'Play-by-play',i:'📝'},recap:{t:'Recap',i:'📰'}};
  const seen=new Set(),links=[];
  (g.links||[]).forEach(l=>{
    const rel=(l.rel||[]).find(r=>want[r]&&!seen.has(r));
    if(rel&&l.href&&!l.isPremium){seen.add(rel);links.push({...want[rel],href:l.href});}
  });
  if(!links.length){el.innerHTML='';return;}
  el.innerHTML=`<div class="hl-card">
  <div class="prob-title">🎬 Highlights &amp; Recap</div>
  <div class="hl-links">${links.map(l=>`<a class="hl-link" href="${l.href}" target="_blank" rel="noopener noreferrer">${l.i} ${l.t} ↗</a>`).join('')}</div>
  <div class="hl-note">Football highlight video is rights-restricted, so these open on ESPN rather than playing here. MLB clips play inline on the baseball tab.</div>
</div>`;}

// ══════════ BOX SCORES ══════════
function bxNum(v){return (v===undefined||v===null||v==='')?'-':v;}

// ── MLB ──
async function loadBoxscore(game){
  const el=$('boxEl');if(!el)return;
  if(game.status?.abstractGameState==='Preview'){el.innerHTML='';return;}
  el.innerHTML='<div class="day-hr-loading"><div class="spinner"></div>Loading box score…</div>';
  const[box,ls]=await Promise.all([
    api(`${MLB}/game/${game.gamePk}/boxscore`),
    api(`${MLB}/game/${game.gamePk}/linescore`)
  ]);
  if(!box?.teams){el.innerHTML='';return;}
  S.box={game,box,ls,tab:'away'};
  renderBoxscore();
}

function lineScoreHTML(game,ls){
  if(!ls?.innings?.length)return'';
  const aw=game.teams?.away?.team,hw=game.teams?.home?.team;
  const n=Math.max(9,ls.innings.length);
  const cur=ls.currentInning;
  const head=Array.from({length:n},(_,i)=>`<th class="${i+1===cur?'ls-cur':''}">${i+1}</th>`).join('');
  const row=(side,team)=>{
    const cells=Array.from({length:n},(_,i)=>{
      const inn=ls.innings[i];
      const v=inn?.[side]?.runs;
      return`<td class="${i+1===cur?'ls-cur':''}">${v===undefined?'':v}</td>`;
    }).join('');
    const t=ls.teams?.[side]||{};
    return`<tr><td class="ls-team"><img src="${LOGO(team?.id)}" onerror="this.style.display='none'">${team?.abbreviation||team?.name||''}</td>${cells}<td class="ls-tot">${bxNum(t.runs)}</td><td>${bxNum(t.hits)}</td><td>${bxNum(t.errors)}</td></tr>`;
  };
  return`<div class="bx-scroll"><table class="ls-table">
  <thead><tr><th style="text-align:left">&nbsp;</th>${head}<th>R</th><th>H</th><th>E</th></tr></thead>
  <tbody>${row('away',aw)}${row('home',hw)}</tbody></table></div>`;
}

function setBoxTab(t){if(S.box){S.box.tab=t;renderBoxscore();}}

function renderBoxscore(){
  const el=$('boxEl');if(!el)return;
  const d=S.box;if(!d){el.innerHTML='';return;}
  const{game,box,ls,tab}=d;
  const side=tab==='home'?'home':'away';
  const t=box.teams?.[side];if(!t){el.innerHTML='';return;}
  const players=t.players||{};
  const awT=game.teams?.away?.team,hwT=game.teams?.home?.team;

  // batting order: "701" -> slot 7, 00 = starter
  const batters=Object.values(players)
    .filter(p=>p.battingOrder&&p.stats?.batting&&Object.keys(p.stats.batting).length)
    .sort((a,b)=>parseInt(a.battingOrder)-parseInt(b.battingOrder));
  const bRows=batters.map(p=>{
    const b=p.stats.batting,sub=p.battingOrder&&p.battingOrder.slice(-2)!=='00';
    const slot=Math.floor(parseInt(p.battingOrder)/100);
    return`<tr><td class="${sub?'bx-sub':''}"><span class="bx-nm">${sub?'':slot+'. '}${p.person?.fullName||'?'}</span><span class="bx-pos">${p.position?.abbreviation||''}</span></td>
    <td>${bxNum(b.atBats)}</td><td>${bxNum(b.runs)}</td><td>${bxNum(b.hits)}</td><td>${bxNum(b.rbi)}</td><td>${bxNum(b.baseOnBalls)}</td><td>${bxNum(b.strikeOuts)}</td><td>${bxNum(b.homeRuns)}</td><td>${p.seasonStats?.batting?.avg??'-'}</td></tr>`;
  }).join('');
  const bt=t.teamStats?.batting||{};

  const pitchers=Object.values(players)
    .filter(p=>p.stats?.pitching&&(p.stats.pitching.inningsPitched!==undefined))
    .sort((a,b)=>(b.gameStatus?.isCurrentPitcher?1:0)-(a.gameStatus?.isCurrentPitcher?1:0));
  const pRows=pitchers.map(p=>{
    const q=p.stats.pitching;
    return`<tr><td><span class="bx-nm">${p.person?.fullName||'?'}</span>${q.note?`<span class="bx-note">${q.note}</span>`:''}</td>
    <td>${bxNum(q.inningsPitched)}</td><td>${bxNum(q.hits)}</td><td>${bxNum(q.runs)}</td><td>${bxNum(q.earnedRuns)}</td><td>${bxNum(q.baseOnBalls)}</td><td>${bxNum(q.strikeOuts)}</td><td>${bxNum(q.homeRuns)}</td><td>${p.seasonStats?.pitching?.era??'-'}</td></tr>`;
  }).join('');

  const tabBtn=(k,team)=>`<button class="bx-tab${tab===k?' active':''}" onclick="setBoxTab('${k}')"><img src="${LOGO(team?.id)}" onerror="this.style.display='none'">${team?.abbreviation||''}</button>`;

  el.innerHTML=`<div class="bx-card">
  <div class="prob-title">📋 Box Score</div>
  ${lineScoreHTML(game,ls)}
  <div class="bx-tabs">${tabBtn('away',awT)}${tabBtn('home',hwT)}</div>
  ${bRows?`<div class="bx-grp">Batting</div><div class="bx-scroll"><table class="bx-table">
    <thead><tr><th>Batter</th><th>AB</th><th>R</th><th>H</th><th>RBI</th><th>BB</th><th>K</th><th>HR</th><th>AVG</th></tr></thead>
    <tbody>${bRows}</tbody>
    <tfoot><tr><td>Team</td><td>${bxNum(bt.atBats)}</td><td>${bxNum(bt.runs)}</td><td>${bxNum(bt.hits)}</td><td>${bxNum(bt.rbi)}</td><td>${bxNum(bt.baseOnBalls)}</td><td>${bxNum(bt.strikeOuts)}</td><td>${bxNum(bt.homeRuns)}</td><td>${bt.avg??'-'}</td></tr></tfoot>
  </table></div>`:''}
  ${pRows?`<div class="bx-grp">Pitching</div><div class="bx-scroll"><table class="bx-table">
    <thead><tr><th>Pitcher</th><th>IP</th><th>H</th><th>R</th><th>ER</th><th>BB</th><th>K</th><th>HR</th><th>ERA</th></tr></thead>
    <tbody>${pRows}</tbody></table></div>`:''}
</div>`;}

// ── Football (NFL + CFB share one renderer) ──
function setFBBoxTab(t){if(FBS().box){FBS().box.tab=t;renderFBBoxscore();}}

async function loadFBBoxscore(g){
  const el=$(FBC.p+'BoxEl');if(!el)return;
  const state=g.competitions?.[0]?.status?.type?.state;
  if(state==='pre'){el.innerHTML='';return;}
  el.innerHTML='<div class="day-hr-loading"><div class="spinner"></div>Loading box score…</div>';
  const sum=await api(`${FBC.api}/summary?event=${g.id}`);
  const bs=sum?.boxscore;
  if(!bs||(!bs.players?.length&&!bs.teams?.length)){el.innerHTML='';return;}
  FBS().box={g,bs,tab:'0'};
  renderFBBoxscore();
}

function renderFBBoxscore(){
  const el=$(FBC.p+'BoxEl');if(!el)return;
  const d=FBS().box;if(!d){el.innerHTML='';return;}
  const{bs,tab}=d;
  const teams=bs.teams||[];
  const players=bs.players||[];

  // team stat comparison
  let teamHTML='';
  if(teams.length===2){
    const a=teams[0],b=teams[1];
    const names=(a.statistics||[]).map(s=>s.label||s.name);
    const rows=names.map((lbl,i)=>{
      const av=a.statistics[i]?.displayValue,bv=(b.statistics||[]).find(s=>(s.label||s.name)===lbl)?.displayValue;
      if(av===undefined&&bv===undefined)return'';
      return`<div class="nfl-stat-row"><div class="nfl-stat-val-l" style="color:var(--accent)">${bxNum(av)}</div><div class="nfl-stat-lbl">${lbl}</div><div class="nfl-stat-val-r" style="color:var(--accent2)">${bxNum(bv)}</div></div>`;
    }).filter(Boolean).join('');
    if(rows)teamHTML=`<div class="bx-grp">Team Stats</div>
    <div style="display:flex;justify-content:space-between;font-size:10px;font-weight:800;text-transform:uppercase;margin:2px 0 4px">
      <span style="color:var(--accent)">${a.team?.abbreviation||''}</span><span style="color:var(--accent2)">${b.team?.abbreviation||''}</span></div>
    <div class="nfl-matchup-rows">${rows}</div>`;
  }

  // per-team player groups
  let playerHTML='';
  const idx=parseInt(tab)||0;
  const tp=players[idx];
  if(tp){
    playerHTML=(tp.statistics||[]).map(grp=>{
      const rows=(grp.athletes||[]).filter(a=>a.stats?.length).map(a=>
        `<tr><td><span class="bx-nm">${a.athlete?.displayName||'?'}</span>${a.athlete?.jersey?`<span class="bx-pos">#${a.athlete.jersey}</span>`:''}</td>${a.stats.map(v=>`<td>${bxNum(v)}</td>`).join('')}</tr>`).join('');
      if(!rows)return'';
      const heads=(grp.labels||[]).map(l=>`<th>${l}</th>`).join('');
      const tot=grp.totals?.length?`<tfoot><tr><td>Total</td>${grp.totals.map(v=>`<td>${bxNum(v)}</td>`).join('')}</tr></tfoot>`:'';
      const label=(grp.text||grp.name||'').replace(/^\S+\s+/,'');
      return`<div class="bx-grp">${label||grp.name}</div><div class="bx-scroll"><table class="bx-table">
        <thead><tr><th>Player</th>${heads}</tr></thead><tbody>${rows}</tbody>${tot}</table></div>`;
    }).filter(Boolean).join('');
  }

  const tabs=players.map((tp2,i)=>`<button class="bx-tab${String(i)===String(tab)?' active':''}" onclick="setFBBoxTab('${i}')"><img src="${fbLogo(tp2,tp2.team?.abbreviation)}" onerror="this.style.display='none'">${tp2.team?.abbreviation||''}</button>`).join('');

  if(!teamHTML&&!playerHTML){el.innerHTML='';return;}
  el.innerHTML=`<div class="bx-card">
  <div class="prob-title">📋 Box Score</div>
  ${teamHTML}
  ${players.length?`<div class="bx-tabs">${tabs}</div>${playerHTML}`:''}
</div>`;}

</script>
