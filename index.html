<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>MLB Outcome Predictor</title>
<style>
:root{
  --bg:#0a0e1a;--surface:#111827;--surface2:#1a2236;--surface3:#1f2d45;
  --border:#2a3a55;--accent:#e8192c;--accent2:#0066cc;--gold:#f0a500;
  --text:#e8edf5;--text2:#8fa3be;--text3:#5a7099;
  --green:#22c55e;--red:#ef4444;--blue:#3b82f6;--purple:#a855f7;--orange:#f97316;
  --radius:12px;--sidebar-w:300px;
}
[data-theme="light"]{
  --bg:#f0f4f8;--surface:#ffffff;--surface2:#e8edf5;--surface3:#d1dce8;
  --border:#c5d0de;--text:#0a0e1a;--text2:#3a4a5c;--text3:#6b7f99;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh;display:flex;flex-direction:column;transition:background .3s,color .3s;}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes livePulse{0%,100%{box-shadow:0 0 0 0 rgba(34,197,94,.4)}70%{box-shadow:0 0 0 6px rgba(34,197,94,0)}}
.header{background:linear-gradient(135deg,#0a0e1a,#0d1829);border-bottom:2px solid var(--accent);padding:12px 16px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:200;box-shadow:0 4px 30px rgba(232,25,44,.15);}
.icon-btn{width:36px;height:36px;border:1px solid rgba(255,255,255,.15);border-radius:8px;background:rgba(255,255,255,.08);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:16px;transition:all .2s;color:#fff;}
.icon-btn:hover{border-color:var(--accent);background:rgba(232,25,44,.2);}
.hamburger{flex-direction:column;gap:4px;}
.hamburger span{display:block;width:16px;height:2px;background:#fff;border-radius:1px;transition:all .3s;}
.hamburger.open span:nth-child(1){transform:rotate(45deg) translate(4px,4px);}
.hamburger.open span:nth-child(2){opacity:0;}
.hamburger.open span:nth-child(3){transform:rotate(-45deg) translate(4px,-4px);}
.logo{display:flex;align-items:center;gap:10px;}
.logo-badge{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--accent),#c0001f);display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:900;color:#fff;box-shadow:0 0 18px rgba(232,25,44,.4);flex-shrink:0;}
.app-title{font-size:17px;font-weight:800;color:#fff;}
.app-title span{color:var(--accent);}
.app-sub{font-size:9px;color:rgba(255,255,255,.5);text-transform:uppercase;letter-spacing:1.5px;}
.header-right{display:flex;gap:6px;align-items:center;margin-left:auto;flex-wrap:wrap;}
.ctrl{display:flex;flex-direction:column;}
.ctrl-lbl{font-size:9px;color:rgba(255,255,255,.5);text-transform:uppercase;letter-spacing:1px;margin-bottom:2px;}
select,input[type=date]{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);color:#fff;padding:6px 10px;border-radius:8px;font-size:12px;cursor:pointer;outline:none;appearance:none;-webkit-appearance:none;}
select:focus,input[type=date]:focus{border-color:var(--accent2);}
select option{background:#1a2236;color:#fff;}
.btn{padding:6px 12px;border:none;border-radius:8px;cursor:pointer;font-size:12px;font-weight:600;display:flex;align-items:center;gap:5px;white-space:nowrap;transition:all .2s;}
.btn-primary{background:var(--accent);color:#fff;}
.btn-primary:hover{background:#c0001f;}
.live-dot{width:8px;height:8px;border-radius:50%;background:var(--green);animation:pulse 1.5s infinite;}
.refresh-timer{font-size:10px;color:rgba(255,255,255,.4);}
.filter-drawer{display:none;}
.body-wrap{display:flex;flex:1;min-height:0;}
.backdrop{display:none;position:fixed;inset:0;z-index:250;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);}
.backdrop.on{display:block;}
.sidebar{width:var(--sidebar-w);background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;overflow-y:auto;transition:transform .3s;}
.sidebar-head{padding:14px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.sidebar-title{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--text2);}
.acc-section{border-bottom:1px solid var(--border);}
.acc-btn{width:100%;padding:12px 16px;background:none;border:none;color:var(--text);cursor:pointer;display:flex;align-items:center;justify-content:space-between;font-size:13px;font-weight:600;text-align:left;transition:background .2s;}
.acc-btn:hover{background:var(--surface2);}
.acc-btn .acc-icon{font-size:14px;transition:transform .3s;}
.acc-btn.open .acc-icon{transform:rotate(180deg);}
.acc-body{display:none;padding:8px 12px 12px;}
.acc-body.open{display:block;}
.leader-card{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin-bottom:8px;animation:fadeIn .3s ease;}
.leader-card:hover{border-color:var(--accent2);}
.lc-top{display:flex;align-items:center;gap:8px;margin-bottom:6px;}
.lc-rank{width:22px;height:22px;border-radius:50%;background:var(--surface3);font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;color:var(--text2);flex-shrink:0;}
.lc-rank.gold{background:var(--gold);color:#000;}
.lc-rank.silver{background:#9ca3af;color:#000;}
.lc-rank.bronze{background:#cd7f32;color:#000;}
.lc-logo{width:28px;height:28px;object-fit:contain;flex-shrink:0;}
.lc-name{font-size:12px;font-weight:700;}
.lc-team{font-size:10px;color:var(--text3);}
.lc-stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px;}
.lc-stat{background:var(--surface3);border-radius:6px;padding:4px 6px;text-align:center;}
.lc-stat-val{font-size:13px;font-weight:700;color:var(--accent);}
.lc-stat-lbl{font-size:9px;color:var(--text3);text-transform:uppercase;}
.lc-today{display:inline-flex;align-items:center;gap:4px;font-size:9px;color:var(--green);background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.3);border-radius:4px;padding:2px 6px;margin-top:6px;}
.main{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:14px;}
.game-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:10px;}
.game-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;cursor:pointer;transition:all .2s;position:relative;}
.game-card:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:0 8px 24px rgba(232,25,44,.15);}
.game-card.active{border-color:var(--accent);background:var(--surface2);}
.game-card.live-game{border-color:rgba(34,197,94,.4);animation:livePulse 2s infinite;}
.gc-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
.gc-time{font-size:11px;color:var(--text3);display:flex;align-items:center;gap:5px;}
.gc-live{color:var(--green);font-weight:700;font-size:10px;}
.gc-fav{background:none;border:none;cursor:pointer;font-size:16px;opacity:.4;transition:opacity .2s;padding:0;}
.gc-fav.starred{opacity:1;}
.gc-teams{display:flex;flex-direction:column;gap:5px;}
.gc-team{display:flex;align-items:center;gap:8px;}
.gc-logo{width:24px;height:24px;object-fit:contain;flex-shrink:0;}
.gc-abbr{font-size:13px;font-weight:800;width:32px;}
.gc-name{font-size:11px;color:var(--text2);flex:1;}
.gc-rec{font-size:10px;color:var(--text3);}
.gc-score{font-size:15px;font-weight:800;}
.gc-vs{text-align:center;font-size:10px;color:var(--text3);padding:1px 0;}
.gc-wp-bar{margin-top:8px;height:4px;background:var(--surface3);border-radius:2px;overflow:hidden;}
.gc-wp-fill{height:100%;background:linear-gradient(90deg,var(--accent2),var(--accent));border-radius:2px;}
.gc-wp-labels{display:flex;justify-content:space-between;font-size:10px;color:var(--text3);margin-top:3px;}
.no-games{text-align:center;padding:60px 20px;color:var(--text3);}
.status-bar{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);padding:12px 16px;display:flex;align-items:center;gap:10px;font-size:13px;color:var(--text2);}
.spinner{width:16px;height:16px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin 0.8s linear infinite;flex-shrink:0;}
.detail{display:none;}
.detail.on{display:flex;flex-direction:column;gap:14px;animation:fadeIn .4s ease;}
.hero{background:linear-gradient(135deg,var(--surface),var(--surface2));border:1px solid var(--border);border-radius:var(--radius);padding:18px;position:relative;overflow:hidden;}
.hero::after{content:'⚾';position:absolute;right:-10px;top:-10px;font-size:80px;opacity:.04;}
.hero-teams{display:flex;align-items:center;justify-content:center;gap:16px;margin-bottom:14px;}
.hero-team{text-align:center;flex:1;}
.hero-logo{width:56px;height:56px;object-fit:contain;margin-bottom:6px;}
.hero-abbr{font-size:26px;font-weight:900;}
.hero-name{font-size:11px;color:var(--text2);margin-top:2px;}
.hero-rec{font-size:10px;color:var(--text3);}
.hero-sp{font-size:10px;color:var(--text2);margin-top:3px;}
.hero-vs{font-size:16px;color:var(--text3);font-weight:300;text-align:center;}
.hero-meta{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;}
.hero-badge{background:var(--surface3);border:1px solid var(--border);border-radius:8px;padding:5px 10px;font-size:11px;color:var(--text2);display:flex;align-items:center;gap:4px;}
.hero-badge.weather{border-color:rgba(59,130,246,.3);background:rgba(59,130,246,.08);}
.hero-badge.park{border-color:rgba(168,85,247,.3);background:rgba(168,85,247,.08);}
.hero-badge.wind{border-color:rgba(20,184,166,.3);background:rgba(20,184,166,.08);}
.context-strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;}
.ctx-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px 14px;}
.ctx-title{font-size:9px;text-transform:uppercase;letter-spacing:1px;color:var(--text3);margin-bottom:6px;}
.ctx-main{font-size:18px;font-weight:700;}
.ctx-sub{font-size:11px;color:var(--text2);margin-top:2px;}
.ctx-detail{font-size:10px;color:var(--text3);margin-top:3px;}
.form-dots{display:flex;gap:3px;margin-top:5px;flex-wrap:wrap;}
.form-dot{width:15px;height:15px;border-radius:50%;font-size:8px;font-weight:700;display:flex;align-items:center;justify-content:center;}
.form-dot.W{background:rgba(34,197,94,.2);border:1px solid var(--green);color:var(--green);}
.form-dot.L{background:rgba(239,68,68,.2);border:1px solid var(--red);color:var(--red);}
.park-factor{display:flex;align-items:center;gap:8px;margin-top:5px;}
.pf-bar{flex:1;height:5px;background:var(--surface3);border-radius:3px;overflow:hidden;}
.pf-fill{height:100%;border-radius:3px;}
.prob-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;}
.prob-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--text2);margin-bottom:10px;}
.prob-bar-wrap{background:var(--surface2);border-radius:8px;overflow:hidden;height:28px;display:flex;margin-bottom:8px;}
.prob-away{height:100%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff;transition:width .8s cubic-bezier(.4,0,.2,1);}
.prob-home{height:100%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff;background:var(--accent2);transition:width .8s cubic-bezier(.4,0,.2,1);}
.prob-labels{display:flex;justify-content:space-between;font-size:12px;color:var(--text2);}
.prob-factors{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-top:10px;}
.pf-item{background:var(--surface2);border-radius:8px;padding:8px 10px;}
.pf-item-lbl{font-size:9px;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px;}
.pf-item-val{font-size:13px;font-weight:700;}
.ps-val.good{color:var(--green);}
.ps-val.bad{color:var(--red);}
.ps-val.avg{color:var(--gold);}
.ou-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;}
.ou-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:10px;}
.ou-item{background:var(--surface2);border-radius:10px;padding:12px;text-align:center;}
.ou-val{font-size:22px;font-weight:800;}
.ou-lbl{font-size:10px;color:var(--text3);text-transform:uppercase;margin-top:3px;}
.ou-sub{font-size:10px;color:var(--text2);margin-top:4px;}
.ou-verdict{margin-top:12px;background:var(--surface2);border-radius:10px;padding:12px 14px;display:flex;align-items:center;gap:10px;}
.ou-verdict-icon{font-size:24px;}
.ou-verdict-text{font-size:13px;font-weight:600;}
.ou-verdict-sub{font-size:11px;color:var(--text2);margin-top:2px;}
.props-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;}
.props-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin-top:10px;}
.prop-item{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:12px;}
.prop-item.hot-prop{border-color:rgba(240,165,0,.4);background:rgba(240,165,0,.06);}
.prop-item.fire-prop{border-color:rgba(239,68,68,.4);background:rgba(239,68,68,.06);}
.prop-top{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.prop-logo{width:22px;height:22px;object-fit:contain;}
.prop-name{font-size:12px;font-weight:700;flex:1;}
.prop-badge{font-size:10px;font-weight:700;padding:2px 7px;border-radius:10px;}
.prop-badge.fire{background:rgba(239,68,68,.15);color:var(--red);border:1px solid rgba(239,68,68,.3);}
.prop-badge.hot{background:rgba(240,165,0,.15);color:var(--gold);border:1px solid rgba(240,165,0,.3);}
.prop-badge.solid{background:rgba(59,130,246,.15);color:var(--blue);border:1px solid rgba(59,130,246,.3);}
.prop-stats{display:grid;grid-template-columns:1fr 1fr;gap:4px;}
.prop-stat{text-align:center;background:var(--surface3);border-radius:6px;padding:4px;}
.prop-stat-val{font-size:13px;font-weight:700;}
.prop-stat-lbl{font-size:9px;color:var(--text3);text-transform:uppercase;}
.prop-reason{font-size:10px;color:var(--text2);margin-top:6px;line-height:1.4;}
.pitch-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.pitch-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;}
.pitch-side{font-size:9px;text-transform:uppercase;letter-spacing:1px;color:var(--text3);margin-bottom:4px;}
.pitch-top{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
.pitch-logo{width:36px;height:36px;object-fit:contain;}
.pitch-name{font-size:15px;font-weight:800;}
.pitch-team{font-size:10px;color:var(--text3);}
.pitch-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;}
.ps{background:var(--surface2);border-radius:8px;padding:6px;text-align:center;}
.ps-val{font-size:13px;font-weight:700;}
.ps-lbl{font-size:9px;color:var(--text3);text-transform:uppercase;}
.lineup-wrap{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;}
.lineup-header{padding:12px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;}
.lineup-title{font-size:14px;font-weight:700;}
.tab-row{display:flex;gap:6px;}
.tab-btn{padding:5px 12px;border-radius:6px;border:1px solid var(--border);background:none;color:var(--text2);font-size:12px;cursor:pointer;transition:all .2s;}
.tab-btn.active{background:var(--accent);border-color:var(--accent);color:#fff;}
.tab-logo{width:16px;height:16px;object-fit:contain;vertical-align:middle;margin-right:4px;}
.ltable{width:100%;border-collapse:collapse;font-size:12px;}
.ltable th{background:var(--surface2);padding:8px 10px;text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:var(--text3);border-bottom:1px solid var(--border);}
.ltable td{padding:8px 10px;border-bottom:1px solid rgba(42,58,85,.5);}
.ltable tr:last-child td{border-bottom:none;}
.ltable tr:hover td{background:var(--surface2);}
.order-num{color:var(--text3);font-weight:700;}
.batter-name{font-weight:600;}
.batter-pos{color:var(--text3);font-size:10px;margin-left:4px;}
.stat-cell{text-align:center;}
.hr-badge{display:inline-flex;align-items:center;justify-content:center;padding:2px 7px;border-radius:10px;font-size:11px;font-weight:700;}
.hr-badge.hot{background:rgba(239,68,68,.15);color:var(--red);border:1px solid rgba(239,68,68,.3);}
.hr-badge.warm{background:rgba(249,115,22,.15);color:var(--orange);border:1px solid rgba(249,115,22,.3);}
.hr-badge.cold{background:rgba(59,130,246,.15);color:var(--blue);border:1px solid rgba(59,130,246,.3);}
.split-badge{font-size:9px;padding:1px 5px;border-radius:4px;font-weight:700;margin-left:3px;}
.split-good{background:rgba(34,197,94,.15);color:var(--green);}
.split-bad{background:rgba(239,68,68,.15);color:var(--red);}
.inj-badge{font-size:9px;padding:1px 5px;border-radius:4px;font-weight:700;margin-left:3px;background:rgba(249,115,22,.15);color:var(--orange);border:1px solid rgba(249,115,22,.3);}
.confirmed-badge{display:inline-flex;align-items:center;gap:3px;font-size:9px;color:var(--green);background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.3);border-radius:4px;padding:2px 6px;margin-left:8px;}
.odds-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;}
.odds-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px;text-align:center;}
.odds-label{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px;}
.odds-val{font-size:20px;font-weight:800;}
.fav-strip{display:flex;gap:8px;flex-wrap:wrap;padding:4px 0;}
.fav-chip{display:inline-flex;align-items:center;gap:5px;background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:4px 10px;font-size:12px;font-weight:600;cursor:pointer;}
.fav-chip:hover{border-color:var(--accent);}
.fav-chip img{width:16px;height:16px;object-fit:contain;}

/* ── Accuracy Tracker ── */
.acc-track-card{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:8px;}
.acc-big{font-size:34px;font-weight:900;line-height:1;}
.acc-meta{font-size:10px;color:var(--text3);margin-top:3px;}
.acc-bar-wrap{height:6px;background:var(--surface3);border-radius:3px;overflow:hidden;margin:8px 0 4px;}
.acc-bar-fill{height:100%;border-radius:3px;transition:width .6s ease;}
.pred-row{display:flex;align-items:center;justify-content:space-between;padding:5px 0;border-bottom:1px solid rgba(42,58,85,.3);font-size:11px;gap:6px;}
.pred-row:last-child{border-bottom:none;}
.pred-matchup{color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;}
.pred-right{display:flex;align-items:center;gap:5px;flex-shrink:0;}
.pred-pick{font-size:10px;font-weight:700;color:var(--text3);}
.pred-tag{font-size:9px;padding:2px 6px;border-radius:4px;font-weight:700;flex-shrink:0;}
.pred-tag.win{background:rgba(34,197,94,.15);color:var(--green);border:1px solid rgba(34,197,94,.3);}
.pred-tag.loss{background:rgba(239,68,68,.15);color:var(--red);border:1px solid rgba(239,68,68,.3);}
.pred-tag.pending{background:rgba(90,112,153,.12);color:var(--text3);}
.notif-row{display:flex;align-items:center;gap:8px;margin-top:8px;padding-top:8px;border-top:1px solid var(--border);}
.notif-btn{display:inline-flex;align-items:center;gap:5px;font-size:10px;padding:5px 10px;border-radius:6px;border:1px solid var(--border);background:var(--surface);color:var(--text2);cursor:pointer;transition:all .2s;flex:1;justify-content:center;}
.notif-btn:hover{border-color:var(--accent2);color:var(--accent2);}
.notif-btn.enabled{border-color:var(--green);color:var(--green);background:rgba(34,197,94,.08);}
.notif-btn.denied{opacity:.5;cursor:default;}

/* ── Share FAB ── */

// ── Push Notifications ──
function requestNotifPermission(){
  if(!('Notification' in window)||Notification.permission==='granted')return;
  if(Notification.permission==='denied'){showToast('🔕 Notifications blocked — check browser settings');return;}
  Notification.requestPermission().then(p=>{
    renderAccuracy();
    if(p==='granted')showToast('🔔 You\'ll be notified when favorite games go live!');
  });
}

function checkFavLiveNotif(){
  if(!('Notification' in window)||Notification.permission!=='granted'||!S.favorites.size)return;
  const favAbbrs=new Set([...S.favorites].map(k=>k.split(':')[0]));
  S.games.forEach(g=>{
    if(g.status?.abstractGameState!=='Live')return;
    const pk=g.gamePk;
    if(S.notifiedGames.has(pk))return;
    const awA=g.teams?.away?.team?.abbreviation||'';
    const hwA=g.teams?.home?.team?.abbreviation||'';
    if(!favAbbrs.has(awA)&&!favAbbrs.has(hwA))return;
    S.notifiedGames.add(pk);
    const awS=g.linescore?.teams?.away?.runs??0;
    const hwS=g.linescore?.teams?.home?.runs??0;
    const inn=g.linescore?.currentInningOrdinal||'';
    try{
      const n=new Notification(`⚾ ${awA} @ ${hwA} is LIVE`,{
        body:`${inn ? inn+' · ' : ''}${awA} ${awS}  –  ${hwS} ${hwA}\nTap to open MLB Predictor`,
        icon:LOGO(g.teams?.home?.team?.id),
        tag:`mlb-live-${pk}`,
        requireInteraction:false,
        silent:false
      });
      n.onclick=()=>{window.focus();onGameChange(pk);n.close();};
      setTimeout(()=>n.close(),12000);
    }catch(e){console.warn('Notification error',e);}
  });
}

// ── Prediction Accuracy Tracker ──
function trackPrediction(game,wp){
  const pk=game.gamePk;
  if(S.predictions.find(p=>p.pk===pk))return; // already tracked
  const goHome=wp.home>=wp.away;
  const predicted=goHome?game.teams?.home?.team?.abbreviation:game.teams?.away?.team?.abbreviation;
  const prob=goHome?wp.home:wp.away;
  S.predictions.push({
    pk,date:S.date,
    away:game.teams?.away?.team?.abbreviation||'?',
    home:game.teams?.home?.team?.abbreviation||'?',
    predicted,prob,result:null
  });
  S.predictions=S.predictions.slice(-100); // keep last 100
  localStorage.setItem('mlb_preds',JSON.stringify(S.predictions));
  renderAccuracy();
}

async function checkPredictionResults(){
  // Only check predictions from past dates with no result yet
  const pending=S.predictions.filter(p=>!p.result&&p.date<S.date);
  if(!pending.length)return;
  for(const p of pending.slice(0,6)){
    const data=await api(`${MLB}/schedule?sportId=1&gamePk=${p.pk}`);
    const g=data?.dates?.[0]?.games?.[0];
    if(g?.status?.abstractGameState==='Final'){
      const awS=g.teams?.away?.score,hwS=g.teams?.home?.score;
      if(awS!==undefined&&hwS!==undefined)
        p.result=awS>hwS?g.teams.away.team.abbreviation:g.teams.home.team.abbreviation;
    }
  }
  localStorage.setItem('mlb_preds',JSON.stringify(S.predictions));
  renderAccuracy();
}

function renderAccuracy(){
  const el=$('accuracyBody');if(!el)return;
  const preds=S.predictions;
  const finished=preds.filter(p=>p.result);
  const correct=finished.filter(p=>p.result===p.predicted);
  const pct=finished.length?Math.round(correct.length/finished.length*100):null;
  const pending=preds.filter(p=>!p.result);
  const notifState=!('Notification' in window)?'unsupported':Notification.permission;
  const notifLabel=notifState==='granted'?'🔔 Live Alerts On':notifState==='denied'?'🔕 Alerts Blocked':'🔔 Enable Live Alerts';
  const notifClass=notifState==='granted'?'enabled':notifState==='denied'?'denied':'';
  const notifClick=notifState==='denied'?'':' onclick="requestNotifPermission()"';
  const notifBtn=`<button class="notif-btn ${notifClass}"${notifClick} title="Get notified when a favorited game goes live">${notifLabel}</button>`;

  if(!preds.length){
    el.innerHTML=`<div style="padding:10px 0 4px;font-size:11px;color:var(--text3)">Predictions auto-save each time you view a game. Results update the next day.</div><div class="notif-row">${notifBtn}</div>`;
    return;
  }

  const pctColor=pct===null?'var(--text2)':pct>=60?'var(--green)':pct>=50?'var(--gold)':'var(--red)';
  const recentRows=preds.slice(-5).reverse().map(p=>{
    const tag=p.result?(p.result===p.predicted?'<span class="pred-tag win">✓ Win</span>':'<span class="pred-tag loss">✗ Miss</span>'):'<span class="pred-tag pending">Pending</span>';
    return`<div class="pred-row"><span class="pred-matchup">${p.away} @ ${p.home}</span><div class="pred-right"><span class="pred-pick">${p.predicted} ${p.prob}%</span>${tag}</div></div>`;
  }).join('');

  el.innerHTML=`
    <div class="acc-track-card">
      ${pct!==null
        ?`<div class="acc-big" style="color:${pctColor}">${pct}%</div>
           <div class="acc-meta">${correct.length} correct · ${finished.length-correct.length} miss · ${pending.length} pending</div>
           <div class="acc-bar-wrap"><div class="acc-bar-fill" style="width:${pct}%;background:${pctColor}"></div></div>`
        :`<div class="acc-big" style="color:var(--text3)">—</div>
           <div class="acc-meta">${pending.length} prediction${pending.length!==1?'s':''} tracked · awaiting results</div>`
      }
    </div>
    <div style="font-size:9px;text-transform:uppercase;letter-spacing:.5px;color:var(--text3);margin-bottom:4px">Recent Picks</div>
    ${recentRows}
    <div class="notif-row">${notifBtn}</div>
  `;
}

        <div class="gc-team"><img class="gc-logo" src="${LOGO(hwId)}" onerror="this.style.display='none'"><span class="gc-abbr">${hwA}</span><span class="gc-name">${hw?.team?.name||''}</span><span class="gc-rec">${hwW}-${hwL}</span>${hwS!==''?`<span class="gc-score">${hwS}</span>`:''}</div>
      </div>
      <div class="gc-wp-bar"><div class="gc-wp-fill" style="width:${hwPct}%"></div></div>
      <div class="gc-wp-labels"><span>${100-hwPct}% ${awA}</span><span>${hwA} ${hwPct}%</span></div>
    </div>`;
  }).join('');
}

function populateSelects(){
  const opts=['<option value="">— Select Game —</option>',...S.games.map(g=>{
    const aw=g.teams?.away?.team?.abbreviation||'?',hw=g.teams?.home?.team?.abbreviation||'?';
    const t=g.gameDate?new Date(g.gameDate).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'}):'TBD';

  })].join('');

  if(S.selPk){$('gameSelect').value=S.selPk;$('gameSelectM').value=S.selPk;}
}

// ── Select Game ──
async function selectGame(pk){
  S.selPk=pk;S.selGame=null;
  S.awayPS=null;S.homePS=null;S.awayBP=null;S.homeBP=null;
  S.awayForm=null;S.homeForm=null;S.weather=null;S.parkFactor=null;
  S.awayTeamStats=null;S.homeTeamStats=null;S.awayLineup=[];S.homeLineup=[];
  document.querySelectorAll('.game-card').forEach(c=>{const m=c.getAttribute('onclick')?.match(/\d+/);if(m)c.classList.toggle('active',parseInt(m[0])===pk);});
  $('gameSelect').value=pk;$('gameSelectM').value=pk;
  const game=S.games.find(g=>g.gamePk===pk);if(!game)return;
  S.selGame=game;
  $('detail').classList.add('on');
  $('shareFab').classList.remove('visible');
  // Stage 1 — instant render from schedule data
  go(()=>renderHero(game,null,null));
  go(()=>renderProb(game));
  $('pitchEl').innerHTML=pitchCard(game,'away',null,null,null)+pitchCard(game,'home',null,null,null);
  go(()=>renderMatchup(game));
  $('contextEl').innerHTML='';$('ouEl').innerHTML='';$('propsEl').innerHTML='';$('oddsEl').innerHTML='';$('advancedEl').innerHTML='';$('evEl').innerHTML='';$('seriesEl').innerHTML='';$('umpEl').innerHTML='';$('bullpenEl').innerHTML='';
  const awId=game.teams?.away?.team?.id,hwId=game.teams?.home?.team?.id;
  const awPId=game.teams?.away?.probablePitcher?.id,hwPId=game.teams?.home?.probablePitcher?.id;
  S.parkFactor=PARK_FACTORS[game.venue?.id]||{name:game.venue?.name||'Unknown',hr:100,run:100,note:'Data unavailable'};
  showStatus('⏳ Fetching matchup data…');
  // Stage 2 — parallel fetch
  const[awPS,hwPS,awBP,hwBP,awForm,hwForm,awTS,hwTS,weather,lineupData,espn]=await Promise.all([
    awPId?api(`${MLB}/people/${awPId}/stats?stats=season&group=pitching&gameType=R&season=${YR}`):null,
    hwPId?api(`${MLB}/people/${hwPId}/stats?stats=season&group=pitching&gameType=R&season=${YR}`):null,
    api(`${MLB}/teams/${awId}/stats?stats=season&group=pitching&gameType=R&season=${YR}`),
    api(`${MLB}/teams/${hwId}/stats?stats=season&group=pitching&gameType=R&season=${YR}`),
    api(`${MLB}/schedule?sportId=1&teamId=${awId}&startDate=${daysAgo(22)}&endDate=${S.date}&hydrate=linescore`),
    api(`${MLB}/schedule?sportId=1&teamId=${hwId}&startDate=${daysAgo(22)}&endDate=${S.date}&hydrate=linescore`),
    api(`${MLB}/teams/${awId}/stats?stats=season&group=hitting&gameType=R&season=${YR}`),
    api(`${MLB}/teams/${hwId}/stats?stats=season&group=hitting&gameType=R&season=${YR}`),
    fetchWeather(game),
    api(`${MLB}/game/${pk}/lineups`),
    api(`https://site.api.espn.com/apis/site/v2/sports/baseball/mlb/scoreboard?dates=${S.date.replace(/-/g,'')}`)
  ]);
  hideStatus();
  S.awayPS=awPS?.stats?.[0]?.splits?.[0]?.stat||null;
  S.homePS=hwPS?.stats?.[0]?.splits?.[0]?.stat||null;
  S.awayBP=awBP?.stats?.[0]?.splits?.[0]?.stat||null;
  S.homeBP=hwBP?.stats?.[0]?.splits?.[0]?.stat||null;
  S.awayFormRaw=awForm;S.homeFormRaw=hwForm;
  S.awayForm=extractForm(awForm,awId);
  S.homeForm=extractForm(hwForm,hwId);
  S.awayTeamStats=awTS?.stats?.[0]?.splits?.[0]?.stat||null;
  S.homeTeamStats=hwTS?.stats?.[0]?.splits?.[0]?.stat||null;
  S.weather=weather;
  if(lineupData?.awayPlayers?.length)S.awayLineup=lineupData.awayPlayers;
  if(lineupData?.homePlayers?.length)S.homeLineup=lineupData.homePlayers;
  // Stage 3 — re-render with full data
  go(()=>renderHero(game,S.weather,S.parkFactor));
  go(()=>renderContext(game));
  go(()=>renderProb(game));
  go(()=>renderAdvanced(game));
  go(()=>renderOU(game));
  $('pitchEl').innerHTML=pitchCard(game,'away',S.awayPS,S.awayBP,S.awayForm)+pitchCard(game,'home',S.homePS,S.homeBP,S.homeForm);
  go(()=>renderMatchup(game));
  go(()=>renderOdds(game,espn));
  go(()=>renderEV(game));
  // Stage 4 — async: series context, umpire, bullpen (separate fetches)
  go(async()=>loadSeriesAndBullpen(game));
  $('shareFab').classList.add('visible');
  go(()=>trackPrediction(game,calcWP(game)));
  $('detail').scrollIntoView({behavior:'smooth',block:'nearest'});
}

function daysAgo(n){const d=new Date();d.setDate(d.getDate()-n);return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function extractForm(data,teamId){const games=[];for(const d of data?.dates||[]){for(const g of d.games||[]){if(g.status?.abstractGameState!=='Final')continue;const isAway=g.teams?.away?.team?.id===teamId;const my=isAway?g.teams.away:g.teams.home,opp=isAway?g.teams.home:g.teams.away;games.push({result:(my?.score??0)>(opp?.score??0)?'W':'L',myR:my?.score??0,oppR:opp?.score??0});}}return games.slice(-10).reverse();}

async function fetchWeather(game){
  try{
    const vn=game.venue?.name||'';
    if(S.parkFactor?.indoor)return{temp:72,precip:0,wind:0,windDir:0,indoor:true};
    const coords=CITY_COORDS[vn]||{lat:39.5,lon:-98.3};
    const d=await api(`https://api.open-meteo.com/v1/forecast?latitude=${coords.lat}&longitude=${coords.lon}&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max,windspeed_10m_max,winddirection_10m_dominant&temperature_unit=fahrenheit&windspeed_unit=mph&start_date=${S.date}&end_date=${S.date}&timezone=auto`);
    if(!d?.daily)return null;
    return{temp:Math.round((d.daily.temperature_2m_max[0]+d.daily.temperature_2m_min[0])/2),precip:d.daily.precipitation_probability_max[0],wind:Math.round(d.daily.windspeed_10m_max[0]),windDir:d.daily.winddirection_10m_dominant[0],indoor:false};
  }catch(e){return null;}
}

function windDirLabel(deg){return['N','NE','E','SE','S','SW','W','NW'][Math.round(deg/45)%8];}
function weatherHRBoost(w){if(!w||w.indoor)return 0;let b=0;if(w.temp>85)b+=8;else if(w.temp>75)b+=4;else if(w.temp>65)b+=2;else if(w.temp<50)b-=8;else if(w.temp<60)b-=4;if(w.wind>15){const d=windDirLabel(w.windDir);if(['N','NE','E'].includes(d))b+=10;else if(['S','SW','W'].includes(d))b-=8;}else if(w.wind>8){const d=windDirLabel(w.windDir);if(['N','NE','E'].includes(d))b+=4;else if(['S','SW','W'].includes(d))b-=4;}return b;}

function renderHero(game,weather,park){const aw=game.teams?.away,hw=game.teams?.home;const awA=aw?.team?.abbreviation||'?',hwA=hw?.team?.abbreviation||'?';const awId=aw?.team?.id,hwId=hw?.team?.id;const awW=aw?.leagueRecord?.wins||0,awL=aw?.leagueRecord?.losses||0;const hwW=hw?.leagueRecord?.wins||0,hwL=hw?.leagueRecord?.losses||0;const awS=game.linescore?.teams?.away?.runs??'',hwS=game.linescore?.teams?.home?.runs??'';const isLive=game.status?.abstractGameState==='Live';const inning=isLive&&game.linescore?.currentInningOrdinal?` ${game.linescore.currentInningOrdinal}`:'';const t=game.gameDate?new Date(game.gameDate).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'}):'TBD';const awP=game.teams?.away?.probablePitcher?.fullName||'TBD',hwP=game.teams?.home?.probablePitcher?.fullName||'TBD';let wb='',wib='',pb='';if(weather){if(weather.indoor)wb=`<div class="hero-badge weather">🏟️ Indoor</div>`;else{wb=`<div class="hero-badge weather">${weather.precip>50?'🌧️':weather.precip>20?'🌦️':'☀️'} ${weather.temp}°F · ${weather.precip}% rain</div>`;wib=`<div class="hero-badge wind">💨 ${weather.wind}mph ${windDirLabel(weather.windDir)}</div>`;}}if(park){const c=park.hr>105?'var(--red)':park.hr<95?'var(--blue)':'var(--gold)';pb=`<div class="hero-badge park">🏟️ HR Factor: <span style="color:${c};font-weight:700">${park.hr}</span></div>`;}const score=isLive?`<div style="font-size:28px;font-weight:900;color:var(--gold)">${awS} - ${hwS} <span style="font-size:12px;color:var(--green)">${inning}</span></div>`:'@';$('heroEl').innerHTML=`<div class="hero"><div class="hero-teams"><div class="hero-team"><img class="hero-logo" src="${LOGO(awId)}" onerror="this.style.display='none'"><div class="hero-abbr" style="color:var(--accent)">${awA}</div><div class="hero-name">${aw?.team?.name||''}</div><div class="hero-rec">${awW}-${awL}</div><div class="hero-sp">${awP}</div></div><div class="hero-vs">${score}</div><div class="hero-team"><img class="hero-logo" src="${LOGO(hwId)}" onerror="this.style.display='none'"><div class="hero-abbr" style="color:var(--accent2)">${hwA}</div><div class="hero-name">${hw?.team?.name||''}</div><div class="hero-rec">${hwW}-${hwL}</div><div class="hero-sp">${hwP}</div></div></div><div class="hero-meta"><div class="hero-badge">🕐 ${t}</div>${wb}${wib}${pb}</div></div>`;}

function renderContext(game){const aw=game.teams?.away,hw=game.teams?.home;const awA=aw?.team?.abbreviation||'?',hwA=hw?.team?.abbreviation||'?';const park=S.parkFactor,weather=S.weather;const awForm=S.awayForm||[],hwForm=S.homeForm||[];const pfPct=park?Math.min(100,Math.max(0,(park.hr-80)/50*100)):50;const pfC=park?.hr>110?'var(--red)':park?.hr>100?'var(--orange)':park?.hr<90?'var(--blue)':'var(--gold)';const parkCard=`<div class="ctx-card"><div class="ctx-title">🏟️ Park Factor</div><div class="ctx-main" style="color:${pfC}">${park?.hr??'—'}</div><div class="ctx-sub">${park?.name||'Unknown'}</div><div class="ctx-detail">${park?.note||''}</div><div class="park-factor"><div class="pf-bar"><div class="pf-fill" style="width:${pfPct}%;background:${pfC}"></div></div><span style="font-size:10px;font-weight:700;color:${pfC}">${park?.hr??''}</span></div></div>`;let wCard='';if(weather){const boost=weatherHRBoost(weather);const bc=boost>5?'var(--red)':boost<-5?'var(--blue)':'var(--gold)';wCard=`<div class="ctx-card"><div class="ctx-title">${weather.indoor?'🏟️ Indoor':'🌤️ Weather'}</div><div class="ctx-main">${weather.indoor?'Dome':weather.temp+'°F'}</div><div class="ctx-sub">${weather.indoor?'Climate controlled':'Precip: '+weather.precip+'%'}</div><div class="ctx-detail">${weather.indoor?'No effect':weather.wind+' mph '+windDirLabel(weather.windDir)}</div><div style="margin-top:5px;font-size:10px;color:${bc}">HR Boost: ${boost>0?'+':''}${boost}%</div></div>`;}function fCard(team,form){const w=form.filter(g=>g.result==='W').length,tot=form.length||1;const rs=form.reduce((a,g)=>a+g.myR,0),ra=form.reduce((a,g)=>a+g.oppR,0);const hot=w/tot>.7?'🔥':w/tot<.4?'🥶':'📈';return`<div class="ctx-card"><div class="ctx-title">${hot} ${team} Last ${form.length}G</div><div class="ctx-main" style="color:${w/tot>.6?'var(--green)':w/tot<.4?'var(--red)':'var(--gold)'}">${w}-${form.length-w}</div><div class="ctx-sub">RS: ${rs} · RA: ${ra} · ${rs-ra>=0?'+':''}${rs-ra}</div><div class="form-dots">${form.slice(0,10).map(g=>`<div class="form-dot ${g.result}">${g.result}</div>`).join('')}</div></div>`;}$('contextEl').innerHTML=`<div class="context-strip">${parkCard}${wCard}${fCard(awA,awForm)}${fCard(hwA,hwForm)}</div>`;}

function calcWP(game){const aw=game.teams?.away,hw=game.teams?.home;const awW=aw?.leagueRecord?.wins||0,awL=aw?.leagueRecord?.losses||0;const hwW=hw?.leagueRecord?.wins||0,hwL=hw?.leagueRecord?.losses||0;const awWP=awW/(awW+awL)||.5,hwWP=hwW/(hwW+hwL)||.5;const awERA=parseFloat(S.awayPS?.era)||4.30,hwERA=parseFloat(S.homePS?.era)||4.30;const awEraS=Math.max(0,Math.min(100,(6-awERA)/4*100)),hwEraS=Math.max(0,Math.min(100,(6-hwERA)/4*100));const awWHIP=parseFloat(S.awayPS?.whip)||1.35,hwWHIP=parseFloat(S.homePS?.whip)||1.35;const awWhipS=Math.max(0,Math.min(100,(2-awWHIP)*100)),hwWhipS=Math.max(0,Math.min(100,(2-hwWHIP)*100));const awBPERA=parseFloat(S.awayBP?.era)||4.00,hwBPERA=parseFloat(S.homeBP?.era)||4.00;const awBPS=Math.max(0,Math.min(100,(5-awBPERA)/3*100)),hwBPS=Math.max(0,Math.min(100,(5-hwBPERA)/3*100));const awFW=S.awayForm?.filter(g=>g.result==='W').length??5,hwFW=S.homeForm?.filter(g=>g.result==='W').length??5;const awFL=S.awayForm?.length||10,hwFL=S.homeForm?.length||10;const awFS=(awFW/awFL)*100,hwFS=(hwFW/hwFL)*100;const awRD=awW-awL,hwRD=hwW-hwL;const pfB=S.parkFactor?.run>105?.02:S.parkFactor?.run<95?-.02:0;const hC=hwWP*.28+(hwEraS/100)*.18+(hwWhipS/100)*.10+(hwBPS/100)*.12+(hwFS/100)*.12+(hwRD>0?.04:0)+.03+pfB;const aC=awWP*.28+(awEraS/100)*.18+(awWhipS/100)*.10+(awBPS/100)*.12+(awFS/100)*.12+(awRD>0?.04:0);const tot=hC+aC||1;const hwF=Math.max(.35,Math.min(.65,.40+(hC/tot-.5)*.50));return{home:Math.round(hwF*100),away:Math.round((1-hwF)*100),awERA,hwERA,awWHIP,hwWHIP,awBPERA,hwBPERA,awFW,hwFW,awFL,hwFL};}

function renderProb(game){const wp=calcWP(game);const aw=game.teams?.away?.team?.abbreviation||'?',hw=game.teams?.home?.team?.abbreviation||'?';const ec=e=>parseFloat(e)<3.5?'good':parseFloat(e)>4.5?'bad':'avg';$('probEl').innerHTML=`<div class="prob-card"><div class="prob-title">⚡ Win Probability</div><div class="prob-bar-wrap"><div class="prob-away" style="width:${wp.away}%;background:linear-gradient(90deg,#dc2626,#b91c1c)">${wp.away}%</div><div class="prob-home" style="width:${wp.home}%">${wp.home}%</div></div><div class="prob-labels"><span style="color:var(--red)">${aw} ${wp.away}%</span><span style="color:var(--accent2)">${hw} ${wp.home}%</span></div><div class="prob-factors"><div class="pf-item"><div class="pf-item-lbl">SP ERA</div><div class="pf-item-val"><span class="ps-val ${ec(wp.awERA)}">${wp.awERA}</span> / <span class="ps-val ${ec(wp.hwERA)}">${wp.hwERA}</span></div></div><div class="pf-item"><div class="pf-item-lbl">WHIP</div><div class="pf-item-val">${wp.awWHIP.toFixed?wp.awWHIP.toFixed(2):wp.awWHIP} / ${wp.hwWHIP.toFixed?wp.hwWHIP.toFixed(2):wp.hwWHIP}</div></div><div class="pf-item"><div class="pf-item-lbl">Bullpen ERA</div><div class="pf-item-val"><span class="ps-val ${ec(wp.awBPERA)}">${wp.awBPERA.toFixed?wp.awBPERA.toFixed(2):wp.awBPERA}</span> / <span class="ps-val ${ec(wp.hwBPERA)}">${wp.hwBPERA.toFixed?wp.hwBPERA.toFixed(2):wp.hwBPERA}</span></div></div><div class="pf-item"><div class="pf-item-lbl">Last ${wp.awFL}G Form</div><div class="pf-item-val">${wp.awFW}-${wp.awFL-wp.awFW} / ${wp.hwFW}-${wp.hwFL-wp.hwFW}</div></div><div class="pf-item"><div class="pf-item-lbl">Park HR Factor</div><div class="pf-item-val" style="color:${S.parkFactor?.hr>105?'var(--red)':S.parkFactor?.hr<95?'var(--blue)':'var(--gold)'}">${S.parkFactor?.hr??'—'}</div></div><div class="pf-item"><div class="pf-item-lbl">Home Field</div><div class="pf-item-val" style="color:var(--green)">+3%</div></div></div></div>`;}

function calcExpectedRuns(ts,oppPS,isHome){const ops=parseFloat(ts?.ops)||0.720;const era=parseFloat(oppPS?.era)||4.30;const parkMult=(S.parkFactor?.run||100)/100;const wMult=1+(weatherHRBoost(S.weather)/200);const baseRuns=((ops-0.600)/0.300)*3+3.0;const pitcherAdj=(era-4.30)*0.35;const homeAdj=isHome?0.15:0;return Math.max(1.5,Math.round((baseRuns+pitcherAdj+homeAdj)*parkMult*wMult*10)/10);}

function renderOU(game){const aw=game.teams?.away,hw=game.teams?.home;const awA=aw?.team?.abbreviation||'?',hwA=hw?.team?.abbreviation||'?';const awRuns=calcExpectedRuns(S.awayTeamStats,S.homePS,false);const hwRuns=calcExpectedRuns(S.homeTeamStats,S.awayPS,true);const total=Math.round((awRuns+hwRuns)*10)/10;const wBoost=weatherHRBoost(S.weather);const parkNote=S.parkFactor?.hr>108?'High-scoring park':S.parkFactor?.hr<93?'Low-scoring park':'Neutral park';const wNote=wBoost>5?'Conditions boost scoring':wBoost<-5?'Conditions suppress scoring':'Normal conditions';let verdict,icon,sub;if(total>9.5){verdict='Lean OVER';icon='📈';sub=`Proj. ${total} runs — high-scoring matchup`;}else if(total<7.5){verdict='Lean UNDER';icon='📉';sub=`Proj. ${total} runs — pitcher-dominant game`;}else{verdict='Toss-Up';icon='⚖️';sub=`Proj. ${total} runs — near the number`;}$('ouEl').innerHTML=`<div class="ou-card"><div class="prob-title">📊 Over/Under Projection</div><div class="ou-grid"><div class="ou-item"><div class="ou-val" style="color:var(--accent)">${awRuns}</div><div class="ou-lbl">${awA} Proj</div><div class="ou-sub">vs ${hwA} SP</div></div><div class="ou-item"><div class="ou-val" style="color:var(--gold)">${total}</div><div class="ou-lbl">Total</div><div class="ou-sub">${parkNote}</div></div><div class="ou-item"><div class="ou-val" style="color:var(--accent2)">${hwRuns}</div><div class="ou-lbl">${hwA} Proj</div><div class="ou-sub">vs ${awA} SP</div></div></div><div style="font-size:10px;color:var(--text3);margin-top:6px">${wNote}</div><div class="ou-verdict"><div class="ou-verdict-icon">${icon}</div><div><div class="ou-verdict-text">${verdict}</div><div class="ou-verdict-sub">${sub}</div></div></div></div>`;}

function pitchCard(game,side,ps,bp,form){const team=game.teams?.[side],pitcher=team?.probablePitcher;const name=pitcher?.fullName||'TBD',teamId=team?.team?.id;const era=ps?.era??'—',whip=ps?.whip??'—',so=ps?.strikeOuts??'—',ip=ps?.inningsPitched??'—',wins=ps?.wins??'—',losses=ps?.losses??'—',hr9=ps?.homeRunsPer9??'—';const ec=e=>ps?parseFloat(e)<3.5?'good':parseFloat(e)>4.5?'bad':'avg':'';const bpEra=bp?.era;const formDots=form?form.slice(0,5).map(g=>`<div class="form-dot ${g.result}">${g.result}</div>`).join(''):'';return`<div class="pitch-card"><div class="pitch-side">${side==='away'?'Away':'Home'} Starter</div><div class="pitch-top"><img class="pitch-logo" src="${LOGO(teamId)}" onerror="this.style.display='none'"><div><div class="pitch-name">${name}</div><div class="pitch-team">${team?.team?.name||''}</div></div></div><div class="pitch-stats"><div class="ps"><div class="ps-val ${ec(era)}">${era}</div><div class="ps-lbl">ERA</div></div><div class="ps"><div class="ps-val ${ec(whip)}">${whip}</div><div class="ps-lbl">WHIP</div></div><div class="ps"><div class="ps-val">${so}</div><div class="ps-lbl">K</div></div><div class="ps"><div class="ps-val">${wins}-${losses}</div><div class="ps-lbl">W-L</div></div><div class="ps"><div class="ps-val">${ip}</div><div class="ps-lbl">IP</div></div><div class="ps"><div class="ps-val">${hr9}</div><div class="ps-lbl">HR/9</div></div></div>${bpEra!=null?`<div style="margin-top:8px;font-size:10px;color:var(--text3)">Bullpen ERA: <span style="font-weight:700;color:${parseFloat(bpEra)<3.8?'var(--green)':parseFloat(bpEra)>4.5?'var(--red)':'var(--gold)'}">${parseFloat(bpEra).toFixed(2)}</span></div>`:''}${formDots?`<div style="margin-top:8px"><div style="font-size:9px;color:var(--text3);text-transform:uppercase;margin-bottom:3px">Team Form</div><div class="form-dots">${formDots}</div></div>`:''}</div>`;}

function switchTab(tab){S.lineupTab=tab;document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));const wrap=$('lineupWrap');if(wrap){const game=S.games.find(g=>g.gamePk===S.selPk);if(game)go(()=>renderLineupTable(game,wrap));}}

function renderLineupTable(game,wrap){if(!wrap)return;const side=S.lineupTab;const roster=side==='away'?S.awayRoster:S.homeRoster;const oppPS=side==='away'?S.homePS:S.awayPS;const oppPitch=side==='away'?game.teams?.home?.probablePitcher:game.teams?.away?.probablePitcher;const confirmed=side==='away'?S.awayLineup:S.homeLineup;const ofPos=new Set(['LF','CF','RF','OF','LF-CF','CF-RF','LF-RF','1B-OF']);
const getOPS=p=>parseFloat(p.person?.stats?.[0]?.splits?.[0]?.stat?.ops)||0;
const nonPit=[...roster].filter(p=>p.position?.type!=='Pitcher'&&p.position?.abbreviation!=='P'&&p.position?.type!=='Two-Way Player');
const buildLineup=()=>{

r,game.teams?.away?.team?.id);analyze(S.homeRoster,S.awayPS,game.teams?.away?.probablePitcher,game.teams?.home?.team?.id);allProps.sort((a,b)=>b.score-a.score);const top=allProps.slice(0,6);if(!top.length){$('propsEl').innerHTML='';return;}const cards=top.map((p,i)=>{const tier=i===0?'fire':i<3?'hot':'solid';const label=i===0?'🔥 Best Bet':i<3?'⭐ Hot Pick':'✓ Solid';const reasons=[];if(p.platoon)reasons.push('platoon advantage');if(p.hrP>=15)reasons.push(`${p.hrP}% HR prob`);if(p.hitP>=45)reasons.push(`${p.hitP}% hit prob`);if(p.slgN>=.480)reasons.push('power hitter');if(p.obpN>=.360)reasons.push('elite OBP');return`<div class="prop-item ${tier}-prop"><div class="prop-top"><img class="prop-logo" src="${LOGO(p.teamId)}" onerror="this.style.display='none'"><span class="prop-name">${p.name}</span><span class="prop-badge ${tier}">${label}</span></div><div class="prop-stats"><div class="prop-stat"><div class="prop-stat-val" style="color:var(--red)">${p.hrP}%</div><div class="prop-stat-lbl">HR Prob</div></div><div class="prop-stat"><div class="prop-stat-val" style="color:var(--green)">${p.hitP}%</div><div class="prop-stat-lbl">Hit Prob</div></div><div class="prop-stat"><div class="prop-stat-val">${p.avgN.toFixed?p.avgN.toFixed(3):p.avgN}</div><div class="prop-stat-lbl">AVG</div></div><div class="prop-stat"><div class="prop-stat-val">${p.slgN.toFixed?p.slgN.toFixed(3):p.slgN}</div><div class="prop-stat-lbl">SLG</div></div></div><div class="prop-reason">${reasons.length?reasons.join(' · '):'Favorable matchup'}</div></div>`;}).join('');$('propsEl').innerHTML=`<div class="props-card"><div class="prob-title">🎯 Top Prop Picks</div><div style="font-size:11px;color:var(--text3);margin-bottom:8px">Best individual player bets based on matchup, park & weather</div><div class="props-grid">${cards}</div></div>`;}

// ── Series Context + Bullpen + Umpire loader ──
async function loadSeriesAndBullpen(game){
  const awId=game.teams?.away?.team?.id;
  const hwId=game.teams?.home?.team?.id;
  const pk=game.gamePk;
  const yest=daysAgo(1);

  // Parallel: yesterday's games, boxscore (for officials), recent team schedules
  const[yestData,boxData,awRecent,hwRecent]=await Promise.all([
    api(`${MLB}/schedule?sportId=1&teamId=${awId}&startDate=${yest}&endDate=${yest}&hydrate=linescore`),
    api(`${MLB}/game/${pk}/boxscore`),
    api(`${MLB}/schedule?sportId=1&teamId=${awId}&startDate=${daysAgo(4)}&endDate=${daysAgo(1)}`),
    api(`${MLB}/schedule?sportId=1&teamId=${hwId}&startDate=${daysAgo(4)}&endDate=${daysAgo(1)}`),
  ]);

  // ── Series & yesterday ──
  const gameNum=game.seriesGameNumber||1;
  const totalGames=game.gamesInSeries||3;
  let yesterdayGame=null;
  for(const d of yestData?.dates||[]){
    for(const g of d.games||[]){
      const ids=[g.teams?.away?.team?.id,g.teams?.home?.team?.id];
      if(ids.includes(awId)&&ids.includes(hwId)&&g.status?.abstractGameState==='Final'){yesterdayGame=g;break;}
    }
  }
  go(()=>renderSeries(game,gameNum,totalGames,yesterdayGame));

  // ── Umpire ──
  const officials=boxData?.officials||[];
  const plateUmp=officials.find(o=>o.officialType==='Home Plate');
  const umpName=plateUmp?.official?.fullName||null;
  S.plateUmpire=umpName?(UMPIRES[umpName]?{...UMPIRES[umpName],name:umpName}:{name:umpName,runFactor:0,zone:'Normal',note:'No historical data'}):null;
  go(()=>renderUmpire());

  // ── Bullpen ──
  const getPks=sched=>{
    const pks=[];
    for(const d of sched?.dates||[])
      for(const g of d.games||[])
        if(g.status?.abstractGameState==='Final')pks.push(g.gamePk);
    return pks.slice(-2);
  };
  const awPks=getPks(awRecent);
  const hwPks=getPks(hwRecent);
  const allUniq=[...new Set([...awPks,...hwPks])];
  if(!allUniq.length){$('bullpenEl').innerHTML='';return;}

  const boxes=await Promise.all(allUniq.map(p=>api(`${MLB}/game/${p}/boxscore`)));

  function buildUsage(teamId,teamPks){
    const usage={};
    teamPks.forEach((pk,pIdx)=>{
      const box=boxes[allUniq.indexOf(pk)];if(!box)return;
      const side=box.teams?.away?.team?.id===teamId?'away':'home';
      const ids=box.teams?.[side]?.pitchers||[];
      const players=box.teams?.[side]?.players||{};
      ids.slice(1).forEach(pid=>{  // skip starter (index 0)
        const p=players[`ID${pid}`];if(!p)return;
        const ip=parseFloat(p.stats?.pitching?.inningsPitched||'0')||0;
        if(ip<0.1)return;
        const rest=teamPks.length-pIdx;
        if(!usage[pid])usage[pid]={name:p.person?.fullName||'?',totalIP:0,appearances:0,minRest:99,era:parseFloat(p.seasonStats?.pitching?.era)||null};
        usage[pid].totalIP+=ip;
        usage[pid].appearances++;
        usage[pid].minRest=Math.min(usage[pid].minRest,rest);
      });
    });
    return Object.values(usage).sort((a,b)=>a.minRest-b.minRest);
  }

  const awUsage=buildUsage(awId,awPks);
  const hwUsage=buildUsage(hwId,hwPks);
  go(()=>renderBullpen(game,awUsage,hwUsage));
}

function renderSeries(game,gameNum,totalGames,yesterdayGame){
  const el=$('seriesEl');if(!el)return;
  const aw=game.teams?.away?.team?.abbreviation||'?';
  const hw=game.teams?.home?.team?.abbreviation||'?';
  const isRubber=(totalGames===3&&gameNum===3)||(totalGames===2&&gameNum===2);
  let yesterdayStr='';
  let seriesRec='';
  if(yesterdayGame){
    const ya=yesterdayGame.teams?.away?.team?.abbreviation||'?';
    const yh=yesterdayGame.teams?.home?.team?.abbreviation||'?';
    const yas=yesterdayGame.teams?.away?.score??0;
    const yhs=yesterdayGame.teams?.home?.score??0;
    const winner=yas>yhs?ya:yh;
    yesterdayStr=`📅 Yesterday: ${ya} ${yas}–${yhs} ${yh} (${winner} won)`;
    if(gameNum===2)seriesRec=`${winner} leads series 1-0`;
    else if(gameNum===3)seriesRec='Series tied 1-1';
  }
  el.innerHTML=`<div class="series-strip">
  <div class="series-info">
    <span class="series-game">🗓 Game ${gameNum} of ${totalGames}</span>
    ${isRubber?`<span class="series-rubber">🏆 ${totalGames===2?'Series Finale':'Rubber Match'}</span>`:''}
    ${seriesRec?`<span class="series-rec">${seriesRec}</span>`:''}
  </div>
  ${yesterdayStr?`<span class="series-yest">${yesterdayStr}</span>`:''}
</div>`;
}

function renderUmpire(){
  const el=$('umpEl');if(!el)return;

  const rf=u.runFactor;

  const rfStr=rf>0?`+${rf}%`:rf<0?`${rf}%`:'Avg';
  const rfLbl=rf>3?'Run-friendly':rf<-3?'Pitcher-friendly':'Neutral zone';
  el.innerHTML=`<div class="ump-strip">
    <span>👨‍⚖️ HP Ump:</span>
    <span class="ump-name">${u.name}</span>
    <span class="ump-factor ${cls}">${rfLbl} (${rfStr})</span>
    <span style="font-size:10px;color:var(--text3)">${u.zone} zone · ${u.note}</span>
  </div>`;
}

function renderBullpen(game,awUsage,hwUsage){
  const el=$('bullpenEl');if(!el)return;
  const aw=game.teams?.away?.team?.abbreviation||'?';
  const hw=game.teams?.home?.team?.abbreviation||'?';
  const awId=game.teams?.away?.team?.id;
  const hwId=game.teams?.home?.team?.id;

  function armRows(arms){
    if(!arms.length)return`<div style="font-size:11px;color:var(--text3);padding:6px 0">✅ Fully rested — no recent appearances</div>`;
    return arms.slice(0,6).map(p=>{
      const rc=p.minRest===1?'var(--red)':p.minRest===2?'var(--gold)':'var(--green)';
      const restLbl=p.minRest===1?'1d rest':p.minRest===2?'2d rest':'3d+ rest';
      const eraStr=p.era!==null?` · ERA ${p.era.toFixed(2)}`:'';
      const lastName=p.name.split(' ').pop();
      return`<div class="bp-arm">
        <span class="bp-name">${lastName}</span>
        <span class="bp-rest" style="color:${rc}">${restLbl} · ${p.totalIP.toFixed(1)} IP in ${p.appearances}g${eraStr}</span>
      </div>`;
    }).join('');
  }

  const awDep=awUsage.filter(p=>p.minRest===1).length;
  const hwDep=hwUsage.filter(p=>p.minRest===1).length;
  const bpStatus=(dep)=>dep>=2?'bp-depleted':dep===1?'bp-mixed':'bp-fresh';
  const bpLbl=(dep)=>dep>=2?'⚡ Taxed':dep===1?'~ Mixed':'✓ Fresh';

  el.innerHTML=`<div class="bp-card">
  <div class="prob-title">💪 Bullpen Availability</div>
  <div style="font-size:11px;color:var(--text3);margin-bottom:10px">Relievers who appeared in last 2 games — sorted by rest days</div>
  <div class="bp-grid">
    <div class="bp-team">
      <div class="bp-team-hd">
        <img class="tab-logo" src="${LOGO(awId)}" onerror="this.style.display='none'">
        <span style="font-weight:700">${aw}</span>
        <span class="bp-status ${bpStatus(awDep)}">${bpLbl(awDep)}</span>
      </div>
      ${armRows(awUsage)}
    </div>
    <div class="bp-team">
      <div class="bp-team-hd">
        <img class="tab-logo" src="${LOGO(hwId)}" onerror="this.style.display='none'">
        <span style="font-weight:700">${hw}</span>
        <span class="bp-status ${bpStatus(hwDep)}">${bpLbl(hwDep)}</span>
      </div>
      ${armRows(hwUsage)}
    </div>
  </div>
</div>`;
}

// ── NRFI / YRFI ──
function calcNRFI(game){
  const awERA=parseFloat(S.awayPS?.era)||4.30;
  const hwERA=parseFloat(S.homePS?.era)||4.30;
  const awOPS=parseFloat(S.awayTeamStats?.ops)||0.720;
  const hwOPS=parseFloat(S.homeTeamStats?.ops)||0.720;
  const parkMult=(S.parkFactor?.run||100)/100;
  // Poisson lambda per half-inning with first-inning premium (1.10)
  const topL=(hwERA/18)*1.10*(awOPS/0.720)*parkMult;
  const botL=(awERA/18)*1.10*(hwOPS/0.720)*parkMult;
  const pTop=Math.exp(-topL);
  const pBot=Math.exp(-botL);
  const pN=pTop*pBot;
  return{nrfi:Math.round(pN*100),yrfi:100-Math.round(pN*100),away0:Math.round(pTop*100),home0:Math.round(pBot*100),awERA,hwERA};
}

// ── F5 Win Probability ──
function calcF5WP(game){
  const aw=game.teams?.away,hw=game.teams?.home;
  const awW=aw?.leagueRecord?.wins||0,awL=aw?.leagueRecord?.losses||0;
  const hwW=hw?.leagueRecord?.wins||0,hwL=hw?.leagueRecord?.losses||0;
  const awWP=awW/(awW+awL)||.5,hwWP=hwW/(hwW+hwL)||.5;
  const awERA=parseFloat(S.awayPS?.era)||4.30;
  const hwERA=parseFloat(S.homePS?.era)||4.30;
  const awWHIP=parseFloat(S.awayPS?.whip)||1.35;
  const hwWHIP=parseFloat(S.homePS?.whip)||1.35;
  const awK9=parseFloat(S.awayPS?.strikeoutsPer9Inn)||8.0;
  const hwK9=parseFloat(S.homePS?.strikeoutsPer9Inn)||8.0;
  const awEraS=Math.max(0,Math.min(100,(6-awERA)/4*100));
  const hwEraS=Math.max(0,Math.min(100,(6-hwERA)/4*100));
  const awWhipS=Math.max(0,Math.min(100,(2-awWHIP)*100));
  const hwWhipS=Math.max(0,Math.min(100,(2-hwWHIP)*100));
  const awK9S=Math.max(0,Math.min(100,(awK9-4)/8*100));
  const hwK9S=Math.max(0,Math.min(100,(hwK9-4)/8*100));
  const awFW=S.awayForm?.filter(g=>g.result==='W').length??5,awFL=S.awayForm?.length||10;
  const hwFW=S.homeForm?.filter(g=>g.result==='W').length??5,hwFL=S.homeForm?.length||10;
  const awFS=(awFW/awFL),hwFS=(hwFW/hwFL);
  // F5: heavy SP weight, smaller home edge
  const hC=hwWP*.18+(hwEraS/100)*.37+(hwWhipS/100)*.18+(hwK9S/100)*.13+(hwFS*.10)+.02;
  const aC=awWP*.18+(awEraS/100)*.37+(awWhipS/100)*.18+(awK9S/100)*.13+(awFS*.10);
  const tot=hC+aC||1;
  const hwF=Math.max(.35,Math.min(.65,.40+(hC/tot-.5)*.50));
  return{home:Math.round(hwF*100),away:Math.round((1-hwF)*100),awERA,hwERA};
}

      <div style="font-size:18px;color:var(--text3);padding-bottom:4px">vs</div>
      <div style="text-align:center"><div class="nrfi-big" style="color:var(--orange)">${nr.yrfi}%</div><div style="font-size:11px;font-weight:700;color:var(--orange)">YRFI</div></div>
    </div>
    <div class="nrfi-bar"><div class="nrfi-n" style="width:${nr.nrfi}%">NRFI</div><div class="nrfi-y" style="width:${nr.yrfi}%">YRFI</div></div>
    <div class="nrfi-row">
      <div class="nrfi-cell"><div class="nrfi-val" style="color:var(--red)">${awERA_d}</div><div class="nrfi-lbl">${aw} SP ERA</div></div>
      <div class="nrfi-cell"><div class="nrfi-val">${nr.away0}%</div><div class="nrfi-lbl">${aw} 0 in T1</div></div>
      <div class="nrfi-cell"><div class="nrfi-val">${nr.home0}%</div><div class="nrfi-lbl">${hw} 0 in B1</div></div>
      <div class="nrfi-cell"><div class="nrfi-val" style="color:var(--accent2)">${hwERA_d}</div><div class="nrfi-lbl">${hw} SP ERA</div></div>
    </div>

    <div style="display:flex;gap:6px;flex-wrap:wrap">

      <button class="parlay-add${ipY?' in-parlay':''}" onclick="toggleParlay({id:'nrfi-y-${game.gamePk}',team:'YRFI',prob:${nr.yrfi},label:'${aw} @ ${hw}',type:'YRFI'})">${ipY?'✓ YRFI Added':'+ Add YRFI ('+nr.yrfi+'%)'}</button>

function switchAdvTab(tab){
  ['nrfi','f5'].forEach(t=>{
    const b=$('advTab-'+t),p=$('advPanel-'+t);
    if(b)b.classList.toggle('active',t===tab);
    if(p)p.style.display=t===tab?'':'none';
  });
}

// ── EV Calculator ──
function calcEV(americanLine,modelPct){
  const l=parseInt(americanLine);if(!l||isNaN(l)||l===0)return null;
  const p=modelPct/100;
  const profit=l>0?l/100:100/Math.abs(l);
  return Math.round((p*profit-(1-p)*1)*1000)/10;
}
function impliedProb(americanLine){
  const l=parseInt(americanLine);if(!l||isNaN(l)||l===0)return null;
  return l>0?Math.round(100/(l+100)*1000)/10:Math.round(Math.abs(l)/(Math.abs(l)+100)*1000)/10;
}

function renderEV(game){
  const el=$('evEl');if(!el)return;
  const wp=calcWP(game);
  const f5=calcF5WP(game);
  const aw=game.teams?.away?.team?.abbreviation||'?';
  const hw=game.teams?.home?.team?.abbreviation||'?';
  el.innerHTML=`
<div class="ev-card">
  <div class="prob-title">💡 Expected Value Calculator</div>
  <div style="font-size:11px;color:var(--text3);margin-bottom:10px">Enter a Vegas moneyline (e.g. <b>-150</b> or <b>+130</b>) to see if there's positive EV</div>
  <div class="ev-inputs">
    <div class="ev-input-group">
      <div class="ev-team" style="color:var(--red)">📤 ${aw} (Away)</div>
      <input class="ev-line-input" id="evLine-aw" type="number" placeholder="-150" oninput="updateEV('aw',${wp.away},'${aw}')">
      <div class="ev-result" id="evResult-aw"><span class="ev-neutral">Enter a line above</span></div>
      <div class="ev-implied" id="evImpl-aw"></div>
    </div>
    <div class="ev-input-group">
      <div class="ev-team" style="color:var(--accent2)">🏠 ${hw} (Home)</div>
      <input class="ev-line-input" id="evLine-hw" type="number" placeholder="+130" oninput="updateEV('hw',${wp.home},'${hw}')">
      <div class="ev-result" id="evResult-hw"><span class="ev-neutral">Enter a line above</span></div>
      <div class="ev-implied" id="evImpl-hw"></div>
    </div>
  </div>
  <div style="font-size:10px;color:var(--text3);margin-top:8px;text-align:center">Model: ${aw} ${wp.away}% ML · ${hw} ${wp.home}% ML · F5: ${aw} ${f5.away}% / ${hw} ${f5.home}%</div>
</div>`;
}

function updateEV(side,modelProb){
  const inp=$('evLine-'+side),res=$('evResult-'+side),impl=$('evImpl-'+side);
  if(!inp||!res)return;
  const line=parseInt(inp.value);
  if(!line||isNaN(line)){res.innerHTML='<span class="ev-neutral">Enter a line above</span>';if(impl)impl.innerHTML='';return;}
  const ev=calcEV(line,modelProb);
  const ip=impliedProb(line);
  const edge=Math.round((modelProb-ip)*10)/10;
  if(ev===null){res.innerHTML='<span class="ev-neutral">—</span>';return;}
  const cls=ev>0?'ev-pos':ev<0?'ev-neg':'ev-neutral';
  const lbl=ev>0?'✅ +EV':'❌ -EV';
  res.innerHTML=`<span class="${cls}">${lbl}: ${ev>0?'+':''}${ev}% per $100</span>`;
  if(impl)impl.innerHTML=`Implied: ${ip}% · Model: ${modelProb}% · Edge: ${edge>0?'+':''}${edge}%`;
}

// ── Parlay Builder ──
function calcParlayOdds(picks){
  if(!picks.length)return{prob:0,american:0,decimal:1};
  const cp=picks.reduce((p,x)=>p*(x.prob/100),1);
  const dec=1/cp;
  const am=dec>=2?Math.round((dec-1)*100):-Math.round(100/(dec-1));
  return{prob:Math.round(cp*1000)/10,american:am,decimal:Math.round(dec*100)/100};
}

function toggleParlay(pick){
  const idx=S.parlay.findIndex(p=>p.id===pick.id);
  if(idx>=0){
    S.parlay.splice(idx,1);
    showToast('🗑️ Removed from parlay');
  }else{
    if(S.parlay.length>=8){showToast('⚠️ Max 8 legs');return;}
    S.parlay.push(pick);
    S.parlayOpen=true;
    showToast('✅ '+pick.team+' added to parlay!');
  }
  localStorage.setItem('mlb_parlay',JSON.stringify(S.parlay));
  renderParlay();
  const game=S.selGame;if(game)go(()=>renderAdvanced(game));
}

function removeFromParlay(i){
  S.parlay.splice(i,1);
  localStorage.setItem('mlb_parlay',JSON.stringify(S.parlay));
  renderParlay();
  const game=S.selGame;if(game)go(()=>renderAdvanced(game));
}

function clearParlay(){
  S.parlay=[];S.parlayOpen=false;
  localStorage.removeItem('mlb_parlay');
  $('parlayTray').innerHTML='';
  const fab=$('shareFab');if(fab)fab.style.bottom='';
  showToast('🗑️ Parlay cleared');
  const game=S.selGame;if(game)go(()=>renderAdvanced(game));
}

function toggleParlayTray(){
  S.parlayOpen=!S.parlayOpen;
  const t=$('parlayTray')?.querySelector('.parlay-tray');
  if(t)t.classList.toggle('open',S.parlayOpen);
}

function copyParlayText(){
  const picks=S.parlay,odds=calcParlayOdds(picks);
  const aStr=odds.american>0?`+${odds.american}`:`${odds.american}`;
  const lines=picks.map((p,i)=>`${i+1}. ${p.team} (${p.type}) — ${p.label} · ${p.prob}% model`);
  const txt=`🎰 MLB Parlay — ${picks.length} Leg${picks.length!==1?'s':''}\n\n${lines.join('\n')}\n\n📊 Combined: ${odds.prob}% win prob · Odds: ${aStr} · ${odds.decimal}x payout\n\ntradercal.github.io/CJ`;
  navigator.clipboard.writeText(txt).then(()=>showToast('📋 Parlay copied!')).catch(()=>showToast('⚠️ Copy failed'));
}

function renderParlay(){
  const tray=$('parlayTray');if(!tray)return;
  const picks=S.parlay;
  const fab=$('shareFab');
  if(!picks.length){tray.innerHTML='';if(fab)fab.style.bottom='';return;}
  if(fab)fab.style.bottom='62px';
  const odds=calcParlayOdds(picks);
  const aStr=odds.american>0?`+${odds.american}`:`${odds.american}`;
  const items=picks.map((p,i)=>`
    <div class="parlay-item">
      <div class="parlay-item-main">
        <div class="parlay-item-team">${p.team}</div>
        <div class="parlay-item-sub">${p.label} · ${p.type}</div>
      </div>
      <div class="parlay-item-prob">${p.prob}%</div>
      <button class="parlay-remove" onclick="removeFromParlay(${i})">✕</button>
    </div>`).join('');
  tray.innerHTML=`
<div class="parlay-tray${S.parlayOpen?' open':''}">
  <div class="parlay-handle" onclick="toggleParlayTray()">
    <div class="parlay-handle-title">🎰 Parlay Builder <span class="parlay-count">${picks.length} leg${picks.length!==1?'s':''}</span></div>
    <div style="display:flex;align-items:center;gap:10px"><span style="font-size:13px;font-weight:800;color:rgba(255,255,255,.85)">${aStr}</span><span class="parlay-chevron">▲</span></div>
  </div>
  <div class="parlay-body">
    ${items}
    <div class="parlay-summary">
      <div><div class="parlay-summary-val" style="color:var(--purple)">${odds.prob}%</div><div class="parlay-summary-lbl">Win Prob</div></div>
      <div><div class="parlay-summary-val" style="color:var(--gold)">${aStr}</div><div class="parlay-summary-lbl">Parlay Odds</div></div>
      <div><div class="parlay-summary-val">${odds.decimal}x</div><div class="parlay-summary-lbl">Payout Mult</div></div>
    </div>
    <div class="parlay-actions">
      <button class="parlay-clear" onclick="clearParlay()">🗑️ Clear All</button>
      <button class="parlay-share" onclick="copyParlayText()">📋 Copy Parlay Card</button>
    </div>
  </div>
</div>`;
}
</script>
