<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MLB Outcome Predictor</title>
<style>
  :root {
    --bg: #0a0e1a;
    --surface: #111827;
    --surface2: #1a2236;
    --surface3: #1f2d45;
    --border: #2a3a55;
    --accent: #e8192c;
    --accent2: #0066cc;
    --gold: #f0a500;
    --text: #e8edf5;
    --text2: #8fa3be;
    --text3: #5a7099;
    --green: #22c55e;
    --red: #ef4444;
    --blue: #3b82f6;
    --purple: #a855f7;
    --radius: 12px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', system-ui, sans-serif; min-height: 100vh; }

  /* HEADER */
  .header {
    background: linear-gradient(135deg, #0a0e1a 0%, #0d1829 50%, #0a1520 100%);
    border-bottom: 2px solid var(--accent);
    padding: 16px 24px;
    display: flex; align-items: center; gap: 20px; flex-wrap: wrap;
    position: sticky; top: 0; z-index: 100;
    box-shadow: 0 4px 30px rgba(232,25,44,0.15);
  }
  .logo-area { display: flex; align-items: center; gap: 12px; }
  .logo-badge {
    width: 48px; height: 48px; border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), #c0001f);
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; font-weight: 900; color: white;
    box-shadow: 0 0 20px rgba(232,25,44,0.4);
  }
  .app-title { font-size: 22px; font-weight: 800; letter-spacing: -0.5px; }
  .app-title span { color: var(--accent); }
  .app-sub { font-size: 11px; color: var(--text3); text-transform: uppercase; letter-spacing: 1.5px; }
  .header-controls { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-left: auto; }
  .ctrl-label { font-size: 11px; color: var(--text3); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 3px; }
  .ctrl-group { display: flex; flex-direction: column; }
  select, input[type=date] {
    background: var(--surface2); border: 1px solid var(--border);
    color: var(--text); padding: 9px 14px; border-radius: 8px;
    font-size: 13px; cursor: pointer; outline: none; min-width: 160px;
    appearance: none; -webkit-appearance: none;
  }
  select:focus, input[type=date]:focus { border-color: var(--accent2); box-shadow: 0 0 0 2px rgba(0,102,204,0.2); }
  select option { background: var(--surface2); }
  .btn {
    padding: 9px 18px; border: none; border-radius: 8px; cursor: pointer;
    font-size: 13px; font-weight: 600; transition: all 0.2s; display: flex; align-items: center; gap: 6px;
  }
  .btn-primary { background: var(--accent); color: white; }
  .btn-primary:hover { background: #c0001f; transform: translateY(-1px); box-shadow: 0 4px 15px rgba(232,25,44,0.35); }
  .btn-secondary { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }
  .btn-secondary:hover { border-color: var(--accent2); }
  .live-badge {
    background: var(--red); color: white; font-size: 10px; font-weight: 700;
    padding: 2px 8px; border-radius: 20px; text-transform: uppercase; letter-spacing: 1px;
    animation: pulse 1.5s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.6} }

  /* MAIN LAYOUT */
  .main { max-width: 1400px; margin: 0 auto; padding: 24px 20px; }

  /* STATUS BANNER */
  .status-banner {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 16px 20px; margin-bottom: 20px; display: flex; align-items: center; gap: 12px;
    font-size: 13px; color: var(--text2);
  }
  .spinner {
    width: 18px; height: 18px; border: 2px solid var(--border);
    border-top-color: var(--accent2); border-radius: 50%; animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .status-icon { font-size: 18px; }

  /* GAME SELECTOR CARDS */
  .game-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; margin-bottom: 24px; }
  .game-card {
    background: var(--surface); border: 2px solid var(--border); border-radius: var(--radius);
    padding: 14px 16px; cursor: pointer; transition: all 0.2s; position: relative; overflow: hidden;
  }
  .game-card:hover { border-color: var(--accent2); transform: translateY(-2px); box-shadow: 0 8px 25px rgba(0,0,0,0.3); }
  .game-card.active { border-color: var(--accent); background: var(--surface2); }
  .game-card::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
    background: linear-gradient(90deg, var(--accent2), var(--accent));
    opacity: 0; transition: opacity 0.2s;
  }
  .game-card.active::before, .game-card:hover::before { opacity: 1; }
  .game-time { font-size: 11px; color: var(--text3); margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
  .game-matchup { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .game-team { display: flex; flex-direction: column; align-items: center; gap: 4px; flex: 1; }
  .team-abbr { font-size: 18px; font-weight: 800; letter-spacing: -0.5px; }
  .team-rec { font-size: 10px; color: var(--text3); }
  .game-sep { font-size: 13px; color: var(--text3); font-weight: 600; }
  .game-venue { font-size: 10px; color: var(--text3); margin-top: 8px; text-align: center; }
  .game-status-badge {
    font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 20px;
    text-transform: uppercase; letter-spacing: 0.5px;
  }
  .status-scheduled { background: rgba(59,130,246,0.15); color: var(--blue); border: 1px solid rgba(59,130,246,0.3); }
  .status-live { background: rgba(239,68,68,0.15); color: var(--red); border: 1px solid rgba(239,68,68,0.3); }
  .status-final { background: rgba(34,197,94,0.15); color: var(--green); border: 1px solid rgba(34,197,94,0.3); }

  /* GAME DETAIL PANEL */
  .detail-panel { display: none; }
  .detail-panel.visible { display: block; }

  /* GAME HERO */
  .game-hero {
    background: linear-gradient(135deg, var(--surface) 0%, var(--surface2) 100%);
    border: 1px solid var(--border); border-radius: var(--radius);
    padding: 28px 32px; margin-bottom: 20px; position: relative; overflow: hidden;
  }
  .game-hero::after {
    content: '⚾'; position: absolute; right: -20px; top: -20px;
    font-size: 120px; opacity: 0.04; transform: rotate(15deg);
  }
  .hero-row { display: flex; justify-content: space-between; align-items: center; gap: 20px; }
  .hero-team { display: flex; flex-direction: column; align-items: center; gap: 8px; flex: 1; }
  .hero-abbr { font-size: 52px; font-weight: 900; letter-spacing: -2px; line-height: 1; }
  .hero-name { font-size: 13px; color: var(--text2); }
  .hero-rec { font-size: 12px; color: var(--text3); }
  .hero-score { font-size: 56px; font-weight: 900; color: var(--text2); }
  .hero-vs { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .vs-text { font-size: 16px; color: var(--text3); font-weight: 600; }
  .hero-meta { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
  .hero-time { font-size: 13px; color: var(--text2); }
  .hero-venue { font-size: 12px; color: var(--text3); }

  /* WIN PROBABILITY */
  .prob-section {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 24px; margin-bottom: 20px;
  }
  .section-title {
    font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 2px;
    color: var(--text3); margin-bottom: 20px; display: flex; align-items: center; gap: 8px;
  }
  .section-title::before { content: ''; flex: none; width: 3px; height: 14px; background: var(--accent); border-radius: 2px; }
  .prob-bar-wrap { position: relative; height: 56px; margin-bottom: 12px; }
  .prob-bar-bg {
    height: 36px; border-radius: 8px; overflow: hidden; display: flex;
    position: absolute; left: 0; right: 0; top: 10px;
    background: var(--surface2);
  }
  .prob-fill-away {
    height: 100%; transition: width 1s cubic-bezier(0.34,1.56,0.64,1);
    background: linear-gradient(90deg, #1d4ed8, #2563eb);
  }
  .prob-fill-home {
    height: 100%; transition: width 1s cubic-bezier(0.34,1.56,0.64,1);
    background: linear-gradient(90deg, #dc2626, #e8192c);
    margin-left: auto;
  }
  .prob-center-line {
    position: absolute; left: 50%; top: 5px; bottom: 0; width: 2px;
    background: var(--bg); transform: translateX(-50%);
  }
  .prob-labels { display: flex; justify-content: space-between; margin-top: 8px; }
  .prob-label { display: flex; flex-direction: column; gap: 2px; }
  .prob-label.right { align-items: flex-end; }
  .prob-pct { font-size: 28px; font-weight: 900; line-height: 1; }
  .prob-team-name { font-size: 12px; color: var(--text2); }
  .prob-factors { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; margin-top: 16px; }
  .prob-factor {
    background: var(--surface2); border: 1px solid var(--border); border-radius: 8px;
    padding: 12px 14px;
  }
  .factor-name { font-size: 10px; color: var(--text3); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; }
  .factor-bar-bg { height: 4px; background: var(--surface3); border-radius: 2px; margin-bottom: 6px; overflow: hidden; }
  .factor-bar-fill { height: 100%; border-radius: 2px; background: linear-gradient(90deg, var(--accent2), var(--accent)); transition: width 1.2s ease; }
  .factor-value { font-size: 12px; font-weight: 600; }

  /* PITCHING MATCHUP */
  .pitching-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 20px; }
  @media(max-width: 768px) { .pitching-grid { grid-template-columns: 1fr; } }
  .pitcher-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px;
  }
  .pitcher-header { display: flex; align-items: center; gap: 14px; margin-bottom: 16px; }
  .pitcher-num {
    width: 44px; height: 44px; border-radius: 50%;
    background: var(--surface2); border: 2px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; font-weight: 800; flex-shrink: 0;
  }
  .pitcher-info { flex: 1; }
  .pitcher-name { font-size: 16px; font-weight: 700; }
  .pitcher-team { font-size: 11px; color: var(--text3); margin-top: 2px; }
  .pitcher-hand {
    background: var(--surface2); border: 1px solid var(--border); border-radius: 6px;
    padding: 4px 10px; font-size: 11px; font-weight: 700; color: var(--gold);
    flex-shrink: 0;
  }
  .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .stat-box {
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: 8px; padding: 10px; text-align: center;
  }
  .stat-val { font-size: 20px; font-weight: 800; color: var(--text); line-height: 1.1; }
  .stat-name { font-size: 9px; color: var(--text3); text-transform: uppercase; letter-spacing: 1px; margin-top: 3px; }
  .stat-val.good { color: var(--green); }
  .stat-val.bad { color: var(--red); }
  .stat-val.avg { color: var(--gold); }
  .pitcher-note { font-size: 11px; color: var(--text3); margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border); font-style: italic; }

  /* BATTER MATCHUP */
  .matchup-section {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 20px; margin-bottom: 20px;
  }
  .matchup-tabs { display: flex; gap: 8px; margin-bottom: 16px; }
  .tab-btn {
    padding: 7px 16px; border-radius: 7px; border: 1px solid var(--border);
    background: var(--surface2); color: var(--text2); font-size: 12px; font-weight: 600;
    cursor: pointer; transition: all 0.2s;
  }
  .tab-btn.active { background: var(--accent); color: white; border-color: var(--accent); }
  .lineup-table { width: 100%; border-collapse: collapse; }
  .lineup-table th {
    text-align: left; font-size: 10px; color: var(--text3); text-transform: uppercase;
    letter-spacing: 1px; padding: 8px 10px; border-bottom: 1px solid var(--border);
  }
  .lineup-table th.right { text-align: right; }
  .lineup-table td { padding: 9px 10px; border-bottom: 1px solid rgba(255,255,255,0.04); font-size: 13px; }
  .lineup-table td.right { text-align: right; }
  .lineup-table tr:hover td { background: rgba(255,255,255,0.03); }
  .batter-order { color: var(--text3); font-size: 12px; width: 24px; font-weight: 600; }
  .batter-name { font-weight: 600; }
  .batter-pos { font-size: 11px; color: var(--text3); margin-left: 6px; }
  .stat-pill {
    display: inline-block; font-size: 11px; font-weight: 700; padding: 2px 8px;
    border-radius: 12px; background: var(--surface2); border: 1px solid var(--border);
  }
  .stat-pill.great { background: rgba(34,197,94,0.12); border-color: rgba(34,197,94,0.3); color: var(--green); }
  .stat-pill.poor { background: rgba(239,68,68,0.12); border-color: rgba(239,68,68,0.3); color: var(--red); }
  .stat-pill.mid { background: rgba(240,165,0,0.12); border-color: rgba(240,165,0,0.3); color: var(--gold); }
  .outcome-bar { width: 60px; height: 6px; background: var(--surface3); border-radius: 3px; overflow: hidden; display: inline-block; vertical-align: middle; margin-left: 6px; }
  .outcome-fill { height: 100%; border-radius: 3px; background: linear-gradient(90deg, var(--accent2), var(--accent)); }
  .no-data { color: var(--text3); font-size: 11px; font-style: italic; }

  /* ODDS SECTION */
  .odds-section {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 20px; margin-bottom: 20px;
  }
  .odds-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; }
  .odds-box {
    background: var(--surface2); border: 1px solid var(--border); border-radius: 10px;
    padding: 14px 16px;
  }
  .odds-label { font-size: 10px; color: var(--text3); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
  .odds-val { font-size: 22px; font-weight: 800; }
  .odds-sub { font-size: 11px; color: var(--text2); margin-top: 4px; }
  .odds-positive { color: var(--green); }
  .odds-negative { color: var(--red); }

  /* STANDINGS */
  .standings-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; margin-bottom: 20px; }
  .standings-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 16px;
  }
  .div-name { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 1.5px; color: var(--text3); margin-bottom: 12px; }
  .stand-row { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-bottom: 1px solid rgba(255,255,255,0.04); font-size: 12px; }
  .stand-row:last-child { border-bottom: none; }
  .stand-pos { color: var(--text3); width: 16px; font-weight: 600; }
  .stand-name { flex: 1; font-weight: 500; }
  .stand-rec { color: var(--text2); width: 50px; text-align: right; }
  .stand-gb { color: var(--text3); width: 36px; text-align: right; font-size: 11px; }
  .stand-pct { color: var(--gold); width: 44px; text-align: right; font-weight: 600; }
  .stand-highlight { background: rgba(232,25,44,0.06); border-radius: 6px; }

  /* EMPTY STATE */
  .empty-state { text-align: center; padding: 60px 20px; color: var(--text3); }
  .empty-icon { font-size: 64px; margin-bottom: 16px; opacity: 0.4; }
  .empty-text { font-size: 18px; font-weight: 600; color: var(--text2); margin-bottom: 8px; }
  .empty-sub { font-size: 13px; }

  /* PREDICTION SUMMARY */
  .prediction-box {
    background: linear-gradient(135deg, rgba(232,25,44,0.08), rgba(0,102,204,0.08));
    border: 1px solid var(--border); border-radius: var(--radius);
    padding: 20px 24px; margin-bottom: 20px; display: flex; align-items: center; gap: 16px;
  }
  .pred-icon { font-size: 28px; }
  .pred-title { font-size: 13px; color: var(--text3); margin-bottom: 4px; text-transform: uppercase; letter-spacing: 1px; font-weight: 600; }
  .pred-winner { font-size: 22px; font-weight: 900; }
  .pred-conf { font-size: 12px; color: var(--text2); margin-top: 4px; }
  .pred-score-est { margin-left: auto; text-align: right; }
  .pred-score-label { font-size: 11px; color: var(--text3); text-transform: uppercase; letter-spacing: 1px; }
  .pred-score-val { font-size: 20px; font-weight: 800; color: var(--text); margin-top: 4px; }

  /* SOURCES */
  .sources-bar {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    font-size: 11px; color: var(--text3); margin-top: 20px; padding: 10px 0;
    border-top: 1px solid var(--border);
  }
  .source-badge {
    background: var(--surface2); border: 1px solid var(--border); border-radius: 6px;
    padding: 3px 10px; color: var(--text2);
  }

  /* RESPONSIVE */
  @media(max-width: 600px) {
    .header-controls { flex-direction: column; width: 100%; }
    .hero-abbr { font-size: 36px; }
    .hero-score { font-size: 40px; }
    .prob-pct { font-size: 22px; }
  }

  /* TOOLTIP */
  [data-tip] { position: relative; cursor: help; }
  [data-tip]:hover::after {
    content: attr(data-tip);
    position: absolute; bottom: 120%; left: 50%; transform: translateX(-50%);
    background: #000; color: white; padding: 5px 10px; border-radius: 6px;
    font-size: 11px; white-space: nowrap; z-index: 999; pointer-events: none;
  }

  /* SCROLLBAR */
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--text3); }
</style>
</head>
<body>

<!-- HEADER -->
<div class="header">
  <div class="logo-area">
    <div class="logo-badge">⚾</div>
    <div>
      <div class="app-title">MLB <span>Predictor</span></div>
      <div class="app-sub">Live Outcome Analysis</div>
    </div>
  </div>
  <div class="header-controls">
    <div class="ctrl-group">
      <div class="ctrl-label">Date</div>
      <input type="date" id="datePicker">
    </div>
    <div class="ctrl-group">
      <div class="ctrl-label">Select Game</div>
      <select id="gameSelect" style="min-width:220px">
        <option value="">— Load games first —</option>
      </select>
    </div>
    <div class="ctrl-group" style="margin-top:18px">
      <button class="btn btn-primary" onclick="loadGames()">⟳ Refresh</button>
    </div>
  </div>
</div>

<!-- MAIN -->
<div class="main">

  <!-- STATUS -->
  <div class="status-banner" id="statusBanner">
    <div class="spinner"></div>
    <span id="statusText">Connecting to MLB Stats API &amp; ESPN…</span>
  </div>

  <!-- GAME GRID -->
  <div class="game-grid" id="gameGrid"></div>

  <!-- DETAIL PANEL -->
  <div class="detail-panel" id="detailPanel">

    <!-- PREDICTION SUMMARY -->
    <div class="prediction-box" id="predBox"></div>

    <!-- GAME HERO -->
    <div class="game-hero" id="gameHero"></div>

    <!-- WIN PROBABILITY -->
    <div class="prob-section" id="probSection"></div>

    <!-- PITCHING MATCHUP -->
    <div class="pitching-grid" id="pitchingGrid"></div>

    <!-- BATTER MATCHUP -->
    <div class="matchup-section" id="matchupSection"></div>

    <!-- ODDS -->
    <div class="odds-section" id="oddsSection" style="display:none"></div>

  </div>

  <!-- STANDINGS -->
  <div id="standingsWrap"></div>

  <!-- EMPTY -->
  <div class="empty-state" id="emptyState" style="display:none">
    <div class="empty-icon">⚾</div>
    <div class="empty-text">No games found for this date</div>
    <div class="empty-sub">Try another date — the MLB season runs April through October</div>
  </div>

  <!-- SOURCES -->
  <div class="sources-bar" id="sourcesBar" style="display:none">
    <span>Data sources:</span>
    <span class="source-badge">MLB Stats API (statsapi.mlb.com)</span>
    <span class="source-badge">ESPN Scoreboard API</span>
    <span class="source-badge">Win probability: multi-factor model</span>
    <span style="margin-left:auto;font-size:10px">Updated: <span id="lastUpdated"></span></span>
  </div>
</div>

<script>
// =============================================
// MLB OUTCOME PREDICTOR - Full JavaScript App
// =============================================

const MLB = 'https://statsapi.mlb.com/api/v1';
const MLB11 = 'https://statsapi.mlb.com/api/v1.1';
const ESPN = 'https://site.api.espn.com/apis/site/v2/sports/baseball/mlb';

let state = {
  date: null,
  games: [],
  espnGames: [],
  selectedGamePk: null,
  standings: [],
  homePitcherStats: null,
  awayPitcherStats: null,
  homeRoster: [],
  awayRoster: [],
  homeLineup: [],
  awayLineup: [],
  liveData: null,
  activeTab: 'home',
  matchupCache: {}
};

// ─── INIT ────────────────────────────────────
async function init() {
  const today = new Date();
  const dateStr = today.toISOString().split('T')[0];
  document.getElementById('datePicker').value = dateStr;
  state.date = dateStr;
  document.getElementById('datePicker').addEventListener('change', e => {
    state.date = e.target.value;
    loadGames();
  });
  document.getElementById('gameSelect').addEventListener('change', e => {
    if (e.target.value) selectGame(parseInt(e.target.value));
  });
  await loadGames();
  await loadStandings();
}

// ─── STATUS ──────────────────────────────────
function setStatus(msg, done=false, error=false) {
  const b = document.getElementById('statusBanner');
  const t = document.getElementById('statusText');
  t.textContent = msg;
  b.querySelector('.spinner')?.remove();
  if (!done) {
    const s = document.createElement('div');
    s.className = 'spinner';
    b.insertBefore(s, t);
  } else {
    const ico = document.createElement('span');
    ico.className = 'status-icon';
    ico.textContent = error ? '⚠️' : '✅';
    b.insertBefore(ico, t);
  }
  if (done) {
    setTimeout(() => { b.style.display = 'none'; document.getElementById('sourcesBar').style.display = 'flex'; }, 2500);
    document.getElementById('lastUpdated').textContent = new Date().toLocaleTimeString();
  }
}

// ─── FETCH HELPER ────────────────────────────
async function fetchJSON(url, label='') {
  try {
    const r = await fetch(url, { headers: { 'Accept': 'application/json' } });
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    return await r.json();
  } catch(e) {
    console.warn(`[${label}] Failed:`, e.message, url);
    return null;
  }
}

// ─── LOAD GAMES ──────────────────────────────
async function loadGames() {
  setStatus('Fetching today\'s schedule from MLB Stats API…');
  document.getElementById('gameGrid').innerHTML = '';
  document.getElementById('detailPanel').classList.remove('visible');
  document.getElementById('emptyState').style.display = 'none';
  document.getElementById('sourcesBar').style.display = 'none';

  const [sched, espnData] = await Promise.all([
    fetchJSON(`${MLB}/schedule?sportId=1&date=${state.date}&hydrate=probablePitcher(note),linescore,team,venue,broadcasts(all),weather`, 'schedule'),
    fetchJSON(`${ESPN}/scoreboard?dates=${state.date.replace(/-/g,'')}`, 'espn')
  ]);

  if (!sched || !sched.dates || sched.dates.length === 0) {
    setStatus('No games found for this date', true);
    document.getElementById('emptyState').style.display = 'block';
    return;
  }

  state.games = sched.dates[0].games || [];
  state.espnGames = espnData?.events || [];

  if (state.games.length === 0) {
    setStatus('No games scheduled for this date', true);
    document.getElementById('emptyState').style.display = 'block';
    return;
  }

  // Populate dropdown
  const sel = document.getElementById('gameSelect');
  sel.innerHTML = '<option value="">— Select a game —</option>';
  state.games.forEach(g => {
    const away = g.teams.away.team.abbreviation || g.teams.away.team.name;
    const home = g.teams.home.team.abbreviation || g.teams.home.team.name;
    const time = formatGameTime(g.gameDate);
    const opt = document.createElement('option');
    opt.value = g.gamePk;
    opt.textContent = `${away} @ ${home}  •  ${time}`;
    sel.appendChild(opt);
  });

  renderGameGrid();
  setStatus(`Loaded ${state.games.length} games`, true);
}

// ─── RENDER GAME GRID ─────────────────────────
function renderGameGrid() {
  const grid = document.getElementById('gameGrid');
  grid.innerHTML = '';
  state.games.forEach(g => {
    const away = g.teams.away;
    const home = g.teams.home;
    const status = g.status?.detailedState || 'Scheduled';
    const isLive = status.toLowerCase().includes('progress') || status.toLowerCase() === 'live';
    const isFinal = status.toLowerCase().includes('final') || status.toLowerCase().includes('completed');
    const awayScore = away.score ?? '';
    const homeScore = home.score ?? '';
    const time = formatGameTime(g.gameDate);

    const statusClass = isLive ? 'status-live' : isFinal ? 'status-final' : 'status-scheduled';
    const statusLabel = isLive ? '🔴 LIVE' : isFinal ? 'FINAL' : time;

    const card = document.createElement('div');
    card.className = `game-card${state.selectedGamePk === g.gamePk ? ' active' : ''}`;
    card.onclick = () => selectGame(g.gamePk);
    card.innerHTML = `
      <div class="game-time">
        <span>${g.venue?.name || ''}</span>
        <span class="game-status-badge ${statusClass}">${statusLabel}</span>
      </div>
      <div class="game-matchup">
        <div class="game-team">
          <div class="team-abbr" style="color:${teamColor(away.team.id, 'away')}">${away.team.abbreviation || away.team.teamName}</div>
          <div class="team-rec">${formatRecord(away.leagueRecord)}</div>
          ${isFinal||isLive ? `<div style="font-size:22px;font-weight:900;margin-top:2px">${awayScore}</div>` : ''}
        </div>
        <div class="game-sep">${isFinal||isLive ? '' : '@'}</div>
        <div class="game-team">
          <div class="team-abbr" style="color:${teamColor(home.team.id, 'home')}">${home.team.abbreviation || home.team.teamName}</div>
          <div class="team-rec">${formatRecord(home.leagueRecord)}</div>
          ${isFinal||isLive ? `<div style="font-size:22px;font-weight:900;margin-top:2px">${homeScore}</div>` : ''}
        </div>
      </div>
      ${g.teams.away.probablePitcher ? `<div class="game-venue" style="margin-top:6px">⚾ ${g.teams.away.probablePitcher.fullName} vs ${g.teams.home.probablePitcher?.fullName||'TBD'}</div>` : ''}
    `;
    grid.appendChild(card);
  });
}

// ─── SELECT GAME ─────────────────────────────
async function selectGame(gamePk) {
  state.selectedGamePk = gamePk;
  document.getElementById('gameSelect').value = gamePk;
  renderGameGrid();

  const game = state.games.find(g => g.gamePk === gamePk);
  if (!game) return;

  setStatus('Loading game details, pitching stats, and lineups…');
  document.getElementById('detailPanel').classList.add('visible');
  document.getElementById('statusBanner').style.display = 'flex';

  // Render hero immediately
  renderGameHero(game);

  // Fetch all data in parallel
  const [liveData, awayRoster, homeRoster, awayPitcherStats, homePitcherStats] = await Promise.all([
    fetchJSON(`${MLB11}/game/${gamePk}/feed/live`, 'live'),
    game.teams.away.team.id ? fetchJSON(`${MLB}/teams/${game.teams.away.team.id}/roster?rosterType=active&season=2026&hydrate=person(stats(type=season,group=hitting,season=2026))`, 'awayRoster') : null,
    game.teams.home.team.id ? fetchJSON(`${MLB}/teams/${game.teams.home.team.id}/roster?rosterType=active&season=2026&hydrate=person(stats(type=season,group=hitting,season=2026))`, 'homeRoster') : null,
    game.teams.away.probablePitcher?.id ? fetchJSON(`${MLB}/people/${game.teams.away.probablePitcher.id}/stats?stats=season&group=pitching&season=2026`, 'awayP') : null,
    game.teams.home.probablePitcher?.id ? fetchJSON(`${MLB}/people/${game.teams.home.probablePitcher.id}/stats?stats=season&group=pitching&season=2026`, 'homeP') : null,
  ]);

  state.liveData = liveData;
  state.awayRoster = awayRoster?.roster || [];
  state.homeRoster = homeRoster?.roster || [];
  state.awayPitcherStats = awayPitcherStats?.stats?.[0]?.splits?.[0]?.stat || null;
  state.homePitcherStats = homePitcherStats?.stats?.[0]?.splits?.[0]?.stat || null;

  // Extract lineups from live feed
  const live = liveData?.liveData;
  state.awayLineup = live?.boxscore?.teams?.away?.battingOrder?.map(id => {
    const p = live.boxscore.teams.away.players['ID'+id];
    return { id, name: p?.person?.fullName, pos: p?.position?.abbreviation, stats: p?.seasonStats?.batting };
  }) || buildLineupFromRoster(state.awayRoster);
  state.homeLineup = live?.liveData?.boxscore?.teams?.home?.battingOrder?.map(id => {
    const p = live.liveData.boxscore.teams.home.players['ID'+id];
    return { id, name: p?.person?.fullName, pos: p?.position?.abbreviation, stats: p?.seasonStats?.batting };
  }) || buildLineupFromRoster(state.homeRoster);

  // Corrected lineup extraction
  if (liveData?.liveData) {
    const ld = liveData.liveData;
    const awayOrder = ld.boxscore?.teams?.away?.battingOrder || [];
    const homeOrder = ld.boxscore?.teams?.home?.battingOrder || [];
    const awayPlayers = ld.boxscore?.teams?.away?.players || {};
    const homePlayers = ld.boxscore?.teams?.home?.players || {};
    state.awayLineup = awayOrder.map(id => {
      const p = awayPlayers['ID'+id];
      return { id, name: p?.person?.fullName||'Unknown', pos: p?.position?.abbreviation||'', stats: p?.seasonStats?.batting };
    });
    state.homeLineup = homeOrder.map(id => {
      const p = homePlayers['ID'+id];
      return { id, name: p?.person?.fullName||'Unknown', pos: p?.position?.abbreviation||'', stats: p?.seasonStats?.batting };
    });
    if (!state.awayLineup.length) state.awayLineup = buildLineupFromRoster(state.awayRoster);
    if (!state.homeLineup.length) state.homeLineup = buildLineupFromRoster(state.homeRoster);
  }

  // Get win probability from live feed
  const liveWinProb = liveData?.liveData?.plays?.allPlays?.slice(-1)?.[0]?.about?.halfInning;
  const mlbWinProb = liveData?.liveData?.winProbability;

  renderWinProbability(game, mlbWinProb);
  renderPitchingMatchup(game);
  renderMatchupSection(game);
  renderPredictionBox(game);
  renderOdds(game);

  setStatus('All data loaded', true);
}

// ─── BUILD LINEUP FROM ROSTER ─────────────────
function buildLineupFromRoster(roster) {
  if (!roster || roster.length === 0) return [];
  // Prioritize position players over pitchers
  const nonPitchers = roster.filter(p => p.position?.abbreviation !== 'P' && p.position?.abbreviation !== 'TWP');
  return nonPitchers.slice(0, 9).map(p => ({
    id: p.person.id,
    name: p.person.fullName,
    pos: p.position?.abbreviation || '',
    stats: p.person.stats?.[0]?.splits?.[0]?.stat || null
  }));
}

// ─── WIN PROBABILITY ──────────────────────────
function renderWinProbability(game, mlbWinProb) {
  const away = game.teams.away;
  const home = game.teams.home;

  // Calculate multi-factor win probability
  const factors = calculateWinProbability(game);
  const homeProb = Math.round(factors.total * 100);
  const awayProb = 100 - homeProb;

  document.getElementById('probSection').innerHTML = `
    <div class="section-title">Win Probability</div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">
      <div style="font-size:12px;color:var(--text3)">${away.team.abbreviation} (Away)</div>
      <div style="font-size:12px;color:var(--text3)">${home.team.abbreviation} (Home)</div>
    </div>
    <div class="prob-bar-wrap">
      <div class="prob-bar-bg">
        <div class="prob-fill-away" id="awayFill" style="width:0%"></div>
        <div class="prob-fill-home" id="homeFill" style="width:0%"></div>
      </div>
      <div class="prob-center-line"></div>
    </div>
    <div class="prob-labels">
      <div class="prob-label">
        <div class="prob-pct" style="color:#2563eb" id="awayProbPct">0%</div>
        <div class="prob-team-name">${away.team.name}</div>
      </div>
      <div class="prob-label right">
        <div class="prob-pct" style="color:var(--accent)" id="homeProbPct">0%</div>
        <div class="prob-team-name">${home.team.name}</div>
      </div>
    </div>
    ${mlbWinProb?.length ? `<div style="font-size:11px;color:var(--green);margin-top:8px">✓ Using live MLB win probability data</div>` : ''}
    <div class="prob-factors">
      ${renderFactors(factors, away, home)}
    </div>
  `;

  // Animate bars
  setTimeout(() => {
    document.getElementById('awayFill').style.width = awayProb + '%';
    document.getElementById('homeFill').style.width = homeProb + '%';
    animateNumber('awayProbPct', awayProb, '%');
    animateNumber('homeProbPct', homeProb, '%');
  }, 150);
}

function renderFactors(f, away, home) {
  const factors = [
    { name: 'Win % Record', away: Math.round(f.awayWinPct*100), home: Math.round(f.homeWinPct*100), higher: f.homeWinPct > f.awayWinPct ? 'home' : 'away' },
    { name: 'Home Field Adv.', away: 0, home: 3, higher: 'home' },
    { name: 'Pitcher ERA', away: f.awayEraScore, home: f.homeEraScore, higher: f.homeEraScore > f.awayEraScore ? 'home' : 'away' },
    { name: 'Run Differential', away: Math.max(0,f.awayRunDiff), home: Math.max(0,f.homeRunDiff), higher: f.homeRunDiff > f.awayRunDiff ? 'home' : 'away' },
    { name: 'WHIP Factor', away: f.awayWhipScore, home: f.homeWhipScore, higher: f.homeWhipScore > f.awayWhipScore ? 'home' : 'away' },
    { name: 'Recent Form', away: f.awayForm, home: f.homeForm, higher: f.homeForm > f.awayForm ? 'home' : 'away' },
  ];
  return factors.map(fac => {
    const total = (fac.away||0) + (fac.home||0) || 100;
    const homePct = Math.min(100, Math.round(((fac.home||0)/total)*100));
    return `
      <div class="prob-factor">
        <div class="factor-name">${fac.name}</div>
        <div class="factor-bar-bg">
          <div class="factor-bar-fill" style="width:${homePct}%"></div>
        </div>
        <div class="factor-value" style="display:flex;justify-content:space-between">
          <span style="color:#2563eb">${away.team.abbreviation}: ${fac.away||0}${fac.name.includes('%')||fac.name.includes('Win')?'%':''}</span>
          <span style="color:var(--accent)">${home.team.abbreviation}: ${fac.home||0}${fac.name.includes('%')||fac.name.includes('Win')?'%':''}</span>
        </div>
      </div>`;
  }).join('');
}

function calculateWinProbability(game) {
  const away = game.teams.away;
  const home = game.teams.home;

  // Win percentage from record
  const awayW = away.leagueRecord?.wins||0, awayL = away.leagueRecord?.losses||1;
  const homeW = home.leagueRecord?.wins||0, homeL = home.leagueRecord?.losses||1;
  const awayWinPct = awayW/(awayW+awayL);
  const homeWinPct = homeW/(homeW+homeL);

  // ERA-based factor (invert so lower ERA = better)
  const awayERA = parseFloat(state.awayPitcherStats?.era) || 4.20;
  const homeERA = parseFloat(state.homePitcherStats?.era) || 4.20;
  const avgERA = (awayERA + homeERA) / 2;
  const awayEraScore = Math.round(Math.max(0, 100 - ((awayERA/8)*100)));
  const homeEraScore = Math.round(Math.max(0, 100 - ((homeERA/8)*100)));

  // WHIP factor
  const awayWHIP = parseFloat(state.awayPitcherStats?.whip) || 1.30;
  const homeWHIP = parseFloat(state.homePitcherStats?.whip) || 1.30;
  const awayWhipScore = Math.round(Math.max(0, 100 - ((awayWHIP/2)*100)));
  const homeWhipScore = Math.round(Math.max(0, 100 - ((homeWHIP/2)*100)));

  // Run differential (approximate from record – not perfect but functional)
  const awayRunDiff = Math.round((awayWinPct - 0.5) * 60);
  const homeRunDiff = Math.round((homeWinPct - 0.5) * 60);

  // Recent form (last 10 – using win pct as proxy)
  const awayForm = Math.round(awayWinPct * 10);
  const homeForm = Math.round(homeWinPct * 10);

  // Composite probability (weighted)
  let homeAdvantage = 0.03;
  let homeComposite = (
    homeWinPct * 0.35 +
    (homeEraScore/100) * 0.25 +
    (homeWhipScore/100) * 0.15 +
    (homeRunDiff > 0 ? 0.05 : 0) +
    homeAdvantage
  );
  let awayComposite = (
    awayWinPct * 0.35 +
    (awayEraScore/100) * 0.25 +
    (awayWhipScore/100) * 0.15 +
    (awayRunDiff > 0 ? 0.05 : 0)
  );

  // Normalize to probability
  const total = homeComposite + awayComposite;
  const normalizedHome = total > 0 ? homeComposite / total : 0.52;

  // Logistic squeeze to keep realistic (40–65% range)
  const squeezed = 0.40 + (normalizedHome * 0.30);

  return {
    total: Math.max(0.38, Math.min(0.65, squeezed)),
    awayWinPct: Math.round(awayWinPct*100),
    homeWinPct: Math.round(homeWinPct*100),
    awayEraScore, homeEraScore,
    awayWhipScore, homeWhipScore,
    awayRunDiff, homeRunDiff,
    awayForm, homeForm,
    awayERA, homeERA
  };
}

// ─── PITCHING MATCHUP ─────────────────────────
function renderPitchingMatchup(game) {
  const awayP = game.teams.away.probablePitcher;
  const homeP = game.teams.home.probablePitcher;
  const awayS = state.awayPitcherStats;
  const homeS = state.homePitcherStats;

  document.getElementById('pitchingGrid').innerHTML = `
    ${renderPitcherCard(awayP, awayS, game.teams.away.team, 'Away')}
    ${renderPitcherCard(homeP, homeS, game.teams.home.team, 'Home')}
  `;
}

function renderPitcherCard(pitcher, stats, team, side) {
  if (!pitcher) {
    return `
      <div class="pitcher-card">
        <div class="section-title">${side} Starter</div>
        <div style="color:var(--text3);font-size:13px;padding:20px 0;text-align:center">
          🤷 Probable pitcher not yet announced
        </div>
      </div>`;
  }

  const era = stats?.era || '—';
  const whip = stats?.whip || '—';
  const k9 = stats?.strikeoutsPer9Inn || (stats && stats.strikeOuts && stats.inningsPitched ? ((stats.strikeOuts/(parseFloat(stats.inningsPitched)||1))*9).toFixed(2) : '—');
  const bb9 = stats?.walksPer9Inn || (stats && stats.baseOnBalls && stats.inningsPitched ? ((stats.baseOnBalls/(parseFloat(stats.inningsPitched)||1))*9).toFixed(2) : '—');
  const ip = stats?.inningsPitched || '—';
  const wins = stats?.wins ?? '—';
  const losses = stats?.losses ?? '—';
  const ks = stats?.strikeOuts ?? '—';
  const gamesStarted = stats?.gamesStarted ?? '—';
  const babip = stats?.babip || '—';
  const note = pitcher.note || '';
  // HR/9 — pull from API or derive from homeRuns allowed / IP
  const hr9Raw = stats?.homeRunsPer9Inn;
  const hrAllowed = stats?.homeRuns ?? stats?.homeruns ?? null;
  const ipNum = parseFloat(stats?.inningsPitched) || null;
  const hr9 = hr9Raw
    ? parseFloat(hr9Raw).toFixed(2)
    : (hrAllowed !== null && ipNum)
      ? ((hrAllowed / ipNum) * 9).toFixed(2)
      : '—';

  function eraClass(e) {
    const n = parseFloat(e);
    if(isNaN(n)) return '';
    return n < 3.0 ? 'good' : n < 4.5 ? 'avg' : 'bad';
  }
  function whipClass(w) {
    const n = parseFloat(w);
    if(isNaN(n)) return '';
    return n < 1.1 ? 'good' : n < 1.35 ? 'avg' : 'bad';
  }

  return `
    <div class="pitcher-card">
      <div class="section-title">${side} Starting Pitcher</div>
      <div class="pitcher-header">
        <div class="pitcher-num">${pitcher.primaryNumber||'—'}</div>
        <div class="pitcher-info">
          <div class="pitcher-name">${pitcher.fullName}</div>
          <div class="pitcher-team">${team.name} · ${stats ? `${wins}-${losses}` : 'No season stats yet'}</div>
        </div>
        <div class="pitcher-hand" data-tip="Pitching hand">${pitcher.pitchHand?.code||'?'}</div>
      </div>
      <div class="stat-grid">
        <div class="stat-box" data-tip="Earned Run Average">
          <div class="stat-val ${eraClass(era)}">${era}</div>
          <div class="stat-name">ERA</div>
        </div>
        <div class="stat-box" data-tip="Walks + Hits per Inning Pitched">
          <div class="stat-val ${whipClass(whip)}">${whip}</div>
          <div class="stat-name">WHIP</div>
        </div>
        <div class="stat-box" data-tip="Strikeouts per 9 innings">
          <div class="stat-val">${k9}</div>
          <div class="stat-name">K/9</div>
        </div>
        <div class="stat-box" data-tip="Innings Pitched">
          <div class="stat-val">${ip}</div>
          <div class="stat-name">IP</div>
        </div>
        <div class="stat-box" data-tip="Total Strikeouts">
          <div class="stat-val">${ks}</div>
          <div class="stat-name">K</div>
        </div>
        <div class="stat-box" data-tip="Games Started">
          <div class="stat-val">${gamesStarted}</div>
          <div class="stat-name">GS</div>
        </div>
        <div class="stat-box" data-tip="Home Runs allowed per 9 innings — lower is better">
          <div class="stat-val ${hr9 !== '—' ? (parseFloat(hr9)<1.0?'good':parseFloat(hr9)<1.5?'avg':'bad') : ''}">${hr9}</div>
          <div class="stat-name">HR/9</div>
        </div>
        <div class="stat-box" data-tip="Batting Average Against — how well batters hit this pitcher">
          <div class="stat-val ${stats?.battersFaced ? (parseFloat(stats?.avg||stats?.battingAvgAgainst)<.230?'good':parseFloat(stats?.avg||stats?.battingAvgAgainst)<.260?'avg':'bad') : ''}">${stats?.avg || stats?.battingAvgAgainst || '—'}</div>
          <div class="stat-name">BAA</div>
        </div>
      </div>
      ${note ? `<div class="pitcher-note">📋 ${note}</div>` : ''}
      ${!stats ? `<div class="pitcher-note">Season stats will appear once the season begins</div>` : ''}
      ${hr9 !== '—' ? `
      <div style="margin-top:14px;padding:10px 12px;background:rgba(168,85,247,0.07);border:1px solid rgba(168,85,247,0.2);border-radius:8px;display:flex;align-items:center;gap:10px">
        <span style="font-size:18px">💣</span>
        <div>
          <div style="font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:1px">HR Vulnerability</div>
          <div style="font-size:13px;font-weight:700;color:${parseFloat(hr9)<1.0?'var(--green)':parseFloat(hr9)<1.5?'var(--gold)':'var(--red)'}">
            ${parseFloat(hr9)<1.0 ? 'Low — difficult to go yard' : parseFloat(hr9)<1.5 ? 'Average — normal HR risk' : 'High — prone to the long ball'}
          </div>
        </div>
        <div style="margin-left:auto;text-align:right">
          <div style="font-size:20px;font-weight:800;color:var(--purple)">${hr9}</div>
          <div style="font-size:10px;color:var(--text3)">HR/9 inn</div>
        </div>
      </div>` : ''}
    </div>`;
}

// ─── MATCHUP SECTION ──────────────────────────
function renderMatchupSection(game) {
  const awayP = game.teams.away.probablePitcher;
  const homeP = game.teams.home.probablePitcher;
  const awayAbbr = game.teams.away.team.abbreviation;
  const homeAbbr = game.teams.home.team.abbreviation;

  document.getElementById('matchupSection').innerHTML = `
    <div class="section-title">Lineup vs Pitcher Matchup Analysis</div>
    <div class="matchup-tabs">
      <button class="tab-btn ${state.activeTab==='home'?'active':''}" onclick="switchTab('home')">
        ${homeAbbr} Lineup vs ${awayAbbr} Starter
      </button>
      <button class="tab-btn ${state.activeTab==='away'?'active':''}" onclick="switchTab('away')">
        ${awayAbbr} Lineup vs ${homeAbbr} Starter
      </button>
    </div>
    <div id="lineupTableWrap"></div>
  `;
  renderLineupTable(game);
}

function switchTab(tab) {
  state.activeTab = tab;
  const game = state.games.find(g => g.gamePk === state.selectedGamePk);
  if (game) {
    const btns = document.querySelectorAll('.tab-btn');
    btns.forEach((b,i) => { b.classList.toggle('active', (i===0&&tab==='home')||(i===1&&tab==='away')); });
    renderLineupTable(game);
  }
}

function renderLineupTable(game) {
  const isHome = state.activeTab === 'home';
  const lineup = isHome ? state.homeLineup : state.awayLineup;
  const vspitcher = isHome ? game.teams.away.probablePitcher : game.teams.home.probablePitcher;
  const vsStats = isHome ? state.awayPitcherStats : state.homePitcherStats;
  const wrap = document.getElementById('lineupTableWrap');
  if (!wrap) return;

  if (!lineup || lineup.length === 0) {
    wrap.innerHTML = `<div class="no-data" style="padding:20px;text-align:center">
      📋 Lineup not yet posted — showing projected roster
    </div>`;
    return;
  }

  const rows = lineup.map((batter, i) => {
    const s = batter.stats || {};
    const avg = s.avg || s.battingAverage || '—';
    const obp = s.obp || '—';
    const slg = s.slg || '—';
    const ops = s.ops || '—';
    const hr = s.homeRuns ?? s.hrs ?? '—';
    const rbi = s.rbi || '—';
    const so = s.strikeOuts ?? '—';

    function avgPill(v) {
      const n = parseFloat(v);
      if(isNaN(n)) return 'stat-pill';
      return n>=.300 ? 'stat-pill great' : n>=.250 ? 'stat-pill mid' : 'stat-pill poor';
    }
    function opsPill(v) {
      const n = parseFloat(v);
      if(isNaN(n)) return 'stat-pill';
      return n>=.850 ? 'stat-pill great' : n>=.720 ? 'stat-pill mid' : 'stat-pill poor';
    }

    // Predict at-bat outcomes based on season stats model
    const opsNum = parseFloat(ops) || 0.720;
    const slgNum = parseFloat(slg) || 0.420;
    const eraNum = parseFloat(vsStats?.era) || 4.20;
    const hitProb = Math.round(Math.min(95, Math.max(5, ((opsNum / 1.0) * 50) - (eraNum * 3) + 30)));
    const kProb = Math.round(Math.min(90, Math.max(5, (parseFloat(vsStats?.strikeoutsPer9Inn||8)/18)*60)));

    // ── HR PROBABILITY MODEL ──────────────────────────────────────────
    // Step 1: batter HR rate (HRs per at-bat this season)
    const hrNum = parseInt(hr) || 0;
    const abNum = parseInt(s.atBats || s.ab) || 0;
    // If no AB data, fall back to SLG-based estimate (higher SLG ≈ more power)
    const batterHRRate = abNum > 0
      ? hrNum / abNum
      : Math.max(0.01, (slgNum - 0.280) * 0.12); // empirical SLG→HR rate proxy

    // Step 2: pitcher HR-allowed factor relative to league avg (1.2 HR/9)
    const pHr9Raw = vsStats?.homeRunsPer9Inn;
    const pHrAllowed = vsStats?.homeRuns ?? vsStats?.homeruns ?? null;
    const pIpNum = parseFloat(vsStats?.inningsPitched) || null;
    const pitcherHR9 = pHr9Raw
      ? parseFloat(pHr9Raw)
      : (pHrAllowed !== null && pIpNum)
        ? (pHrAllowed / pIpNum) * 9
        : 1.20; // league average fallback
    const pitcherHRFactor = pitcherHR9 / 1.20; // >1 = pitcher gives up more HRs than avg

    // Step 3: SLG power boost (slugger vs gap hitter adjustment)
    const slgPowerFactor = slgNum > 0 ? slgNum / 0.420 : 1.0;

    // Step 4: compose & scale to per-PA percentage
    const rawHRProb = batterHRRate * pitcherHRFactor * slgPowerFactor * 100;
    const hrProb = Math.round(Math.min(22, Math.max(1, rawHRProb)));

    // Tier label
    const hrTier = hrProb >= 12 ? 'great' : hrProb >= 6 ? 'mid' : 'poor';
    const hrColor = hrProb >= 12 ? 'var(--purple)' : hrProb >= 6 ? 'var(--gold)' : 'var(--text3)';

    return `
      <tr>
        <td class="batter-order">${i+1}</td>
        <td class="batter-name">${batter.name||'Unknown'} <span class="batter-pos">${batter.pos||''}</span></td>
        <td class="right"><span class="${avgPill(avg)}">${avg}</span></td>
        <td class="right"><span class="${avgPill(obp)}">${obp}</span></td>
        <td class="right"><span class="${opsPill(ops)}">${ops}</span></td>
        <td class="right">${hr}</td>
        <td class="right">${rbi}</td>
        <td class="right" style="white-space:nowrap">
          <span style="font-size:11px;color:var(--green)">Hit ${hitProb}%</span>
          <div class="outcome-bar"><div class="outcome-fill" style="width:${hitProb}%"></div></div>
        </td>
        <td class="right" style="white-space:nowrap">
          <span style="font-size:11px;color:var(--red)">K ${kProb}%</span>
        </td>
        <td class="right" style="white-space:nowrap" data-tip="HR probability per at-bat vs this pitcher">
          <span style="font-size:12px;font-weight:700;color:${hrColor}">💣 ${hrProb}%</span>
          <div class="outcome-bar" style="background:rgba(168,85,247,0.15)"><div class="outcome-fill" style="width:${Math.min(100,hrProb*4.5)}%;background:linear-gradient(90deg,#7c3aed,#a855f7)"></div></div>
        </td>
      </tr>`;
  }).join('');

  const vsName = vspitcher?.fullName || 'TBD';
  const vsEra = vsStats?.era || '—';
  const vsK9 = vsStats?.strikeoutsPer9Inn || '—';
  // Compute pitcher HR/9 for display in info bar
  const vsHr9Raw = vsStats?.homeRunsPer9Inn;
  const vsHrAllowed = vsStats?.homeRuns ?? vsStats?.homeruns ?? null;
  const vsIp = parseFloat(vsStats?.inningsPitched) || null;
  const vsHr9Display = vsHr9Raw
    ? parseFloat(vsHr9Raw).toFixed(2)
    : (vsHrAllowed !== null && vsIp) ? ((vsHrAllowed/vsIp)*9).toFixed(2) : '—';

  wrap.innerHTML = `
    <div style="font-size:11px;color:var(--text3);margin-bottom:10px;padding:8px 10px;background:var(--surface2);border-radius:6px;border:1px solid var(--border)">
      ⚾ Facing: <strong>${vsName}</strong> &nbsp;·&nbsp; ERA: <strong>${vsEra}</strong> &nbsp;·&nbsp; K/9: <strong>${vsK9}</strong> &nbsp;·&nbsp; 💣 HR/9: <strong style="color:${vsHr9Display!=='—'&&parseFloat(vsHr9Display)>=1.5?'var(--red)':vsHr9Display!=='—'&&parseFloat(vsHr9Display)<1.0?'var(--green)':'var(--gold)'}">${vsHr9Display}</strong>
      &nbsp;·&nbsp; <span style="color:var(--text3);font-style:italic">Probabilities based on season stats model</span>
    </div>
    <div style="overflow-x:auto">
    <table class="lineup-table">
      <thead>
        <tr>
          <th>#</th>
          <th>Batter</th>
          <th class="right">AVG</th>
          <th class="right">OBP</th>
          <th class="right">OPS</th>
          <th class="right">HR</th>
          <th class="right">RBI</th>
          <th class="right">Hit Prob</th>
          <th class="right">K Prob</th>
          <th class="right">💣 HR Prob</th>
        </tr>
      </thead>
      <tbody>${rows || '<tr><td colspan="10" style="text-align:center;color:var(--text3);padding:20px">No lineup data available</td></tr>'}</tbody>
    </table>
    </div>
    <div style="font-size:10px;color:var(--text3);margin-top:10px;line-height:1.5">
      * <strong style="color:var(--text2)">HR Prob</strong> = batter HR/AB rate × pitcher HR/9 factor × slugging power index (per at-bat estimate).
      &nbsp;·&nbsp; <strong style="color:var(--text2)">Hit/K Prob</strong> = OPS vs ERA/K-rate model.
      &nbsp;·&nbsp; League avg HR rate ~3–4% per PA. 12%+ = elite power threat vs this pitcher.
    </div>
  `;
}

// ─── PREDICTION BOX ───────────────────────────
function renderPredictionBox(game) {
  const factors = calculateWinProbability(game);
  const homeProb = Math.round(factors.total * 100);
  const awayProb = 100 - homeProb;
  const isHome = homeProb >= awayProb;
  const winner = isHome ? game.teams.home.team : game.teams.away.team;
  const loser = isHome ? game.teams.away.team : game.teams.home.team;
  const prob = isHome ? homeProb : awayProb;
  const conf = prob >= 60 ? 'High Confidence' : prob >= 55 ? 'Moderate Confidence' : 'Lean';

  // Estimate score based on ERA
  const awayERA = parseFloat(state.awayPitcherStats?.era) || 4.5;
  const homeERA = parseFloat(state.homePitcherStats?.era) || 4.5;
  const awayExpectedRuns = Math.round((awayERA / 9) * 9 * 10) / 10;
  const homeExpectedRuns = Math.round((homeERA / 9) * 9 * 10) / 10;
  const homeProjScore = Math.max(1, Math.round(awayExpectedRuns * 10) / 10);
  const awayProjScore = Math.max(1, Math.round(homeERA * 0.9 * 10) / 10);

  document.getElementById('predBox').innerHTML = `
    <div class="pred-icon">🏆</div>
    <div>
      <div class="pred-title">Predicted Winner</div>
      <div class="pred-winner" style="color:${isHome?'var(--accent)':'#2563eb'}">${winner.name}</div>
      <div class="pred-conf">${conf} · ${prob}% win probability</div>
    </div>
    <div class="pred-score-est">
      <div class="pred-score-label">Projected Score</div>
      <div class="pred-score-val">${game.teams.away.team.abbreviation} ${awayProjScore.toFixed(1)} – ${homeProjScore.toFixed(1)} ${game.teams.home.team.abbreviation}</div>
      <div style="font-size:10px;color:var(--text3);margin-top:2px">ERA-based projection</div>
    </div>
  `;
}

// ─── ODDS ─────────────────────────────────────
function renderOdds(game) {
  // Find ESPN game match
  const espnGame = state.espnGames.find(e => {
    const comps = e.competitions?.[0]?.competitors || [];
    return comps.some(c => c.team.abbreviation === game.teams.away.team.abbreviation || c.team.abbreviation === game.teams.home.team.abbreviation);
  });

  const odds = espnGame?.competitions?.[0]?.odds?.[0];
  const section = document.getElementById('oddsSection');

  if (!odds) {
    section.style.display = 'none';
    return;
  }

  section.style.display = 'block';
  const homeML = odds.homeTeamOdds?.moneyLine;
  const awayML = odds.awayTeamOdds?.moneyLine;
  const overUnder = odds.overUnder;
  const provider = odds.provider?.name || 'ESPN';

  section.innerHTML = `
    <div class="section-title">Betting Odds · ${provider}</div>
    <div class="odds-grid">
      <div class="odds-box">
        <div class="odds-label">${game.teams.home.team.abbreviation} Moneyline</div>
        <div class="odds-val ${homeML>0?'odds-positive':'odds-negative'}">${homeML>0?'+':''}${homeML||'—'}</div>
        <div class="odds-sub">Home team odds</div>
      </div>
      <div class="odds-box">
        <div class="odds-label">${game.teams.away.team.abbreviation} Moneyline</div>
        <div class="odds-val ${awayML>0?'odds-positive':'odds-negative'}">${awayML>0?'+':''}${awayML||'—'}</div>
        <div class="odds-sub">Away team odds</div>
      </div>
      <div class="odds-box">
        <div class="odds-label">Over/Under</div>
        <div class="odds-val" style="color:var(--gold)">${overUnder||'—'}</div>
        <div class="odds-sub">Total runs line</div>
      </div>
      ${odds.spread ? `
      <div class="odds-box">
        <div class="odds-label">Run Line</div>
        <div class="odds-val" style="color:var(--purple)">${odds.spread}</div>
        <div class="odds-sub">Point spread</div>
      </div>` : ''}
    </div>
    <div style="font-size:10px;color:var(--text3);margin-top:10px">Odds via ESPN. For informational purposes only.</div>
  `;
}

// ─── STANDINGS ────────────────────────────────
async function loadStandings() {
  const data = await fetchJSON(`${MLB}/standings?leagueId=103,104&season=2026&hydrate=team`, 'standings');
  if (!data?.records) return;

  state.standings = data.records;
  const wrap = document.getElementById('standingsWrap');

  const divs = data.records.map(div => {
    const rows = (div.teamRecords||[]).map((t, i) => {
      const pct = t.wins + t.losses > 0 ? (t.wins/(t.wins+t.losses)).toFixed(3) : '.000';
      const gb = t.gamesBack === '-' ? '—' : t.gamesBack;
      return `
        <div class="stand-row${i===0?' stand-highlight':''}">
          <div class="stand-pos">${i+1}</div>
          <div class="stand-name">${t.team.abbreviation||t.team.teamName}</div>
          <div class="stand-rec">${t.wins}-${t.losses}</div>
          <div class="stand-pct">${pct}</div>
          <div class="stand-gb">${gb}</div>
        </div>`;
    }).join('');

    return `
      <div class="standings-card">
        <div class="div-name">${div.division?.name||'Division'}</div>
        <div style="display:flex;justify-content:flex-end;gap:4px;font-size:9px;color:var(--text3);margin-bottom:6px;padding:0 2px">
          <span style="width:50px;text-align:right">W-L</span>
          <span style="width:44px;text-align:right">PCT</span>
          <span style="width:36px;text-align:right">GB</span>
        </div>
        ${rows}
      </div>`;
  }).join('');

  wrap.innerHTML = `
    <div style="margin-top:8px">
      <div class="section-title" style="margin-bottom:16px">League Standings</div>
      <div class="standings-grid">${divs}</div>
    </div>`;
}

// ─── HELPERS ──────────────────────────────────
function formatGameTime(dateStr) {
  if (!dateStr) return '—';
  const d = new Date(dateStr);
  return d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', timeZoneName: 'short' });
}

function formatRecord(rec) {
  if (!rec) return '';
  return `${rec.wins||0}-${rec.losses||0}`;
}

function inningDisplay(ls) {
  if (!ls) return '';
  const half = ls.isTopInning ? 'Top' : 'Bot';
  return `${half} ${ls.currentInningOrdinal||''} · ${ls.outs||0} out${(ls.outs||0)!==1?'s':''}`;
}

function animateNumber(id, target, suffix='') {
  const el = document.getElementById(id);
  if (!el) return;
  let current = 0;
  const step = target / 30;
  const timer = setInterval(() => {
    current += step;
    if (current >= target) { current = target; clearInterval(timer); }
    el.textContent = Math.round(current) + suffix;
  }, 25);
}
