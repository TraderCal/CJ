<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>408 Sports Hub</title>
<style>
:root{
  /* Midnight & Champagne */
  --bg:#080b14;--surface:#10151f;--surface2:#171d2a;--surface3:#202838;
  --border:#1e2635;--border2:#2a3547;
  --accent:#c9a227;--accent2:#4a7fb5;--gold:#c9a227;--gold-dim:#9c7d1c;
  --text:#eef1f6;--text2:#97a3b8;--text3:#7a8699;
  --green:#4ea88a;--red:#c96a6a;--blue:#5b90c4;--purple:#8b7bb8;--orange:#c08a4a;
  --radius:14px;--sidebar-w:300px;
  --shadow-sm:0 1px 3px rgba(0,0,0,.4);
  --shadow-md:0 4px 20px rgba(0,0,0,.45);
  --shadow-lg:0 10px 40px rgba(0,0,0,.55);
  --glow:0 0 24px rgba(201,162,39,.16);
}
[data-theme="light"]{
  --bg:#f6f7f9;--surface:#ffffff;--surface2:#f0f2f5;--surface3:#e4e7ec;
  --border:#e0e4ea;--border2:#d0d6df;
  --accent:#8f7016;--accent2:#3d6f96;--gold:#8f7016;--gold-dim:#6f560f;
  --text:#111722;--text2:#4a5568;--text3:#5f6c81;
  --green:#2f8168;--red:#a34a4a;--blue:#3d6f96;--purple:#6b5d94;--orange:#9a6c37;
  --shadow-sm:0 1px 3px rgba(16,21,31,.06);
  --shadow-md:0 4px 20px rgba(16,21,31,.08);
  --shadow-lg:0 10px 40px rgba(16,21,31,.12);
  --glow:0 0 24px rgba(143,112,22,.12);
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'Inter','SF Pro Text',-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;font-feature-settings:'tnum' 1,'cv11' 1;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;letter-spacing:-.005em;min-height:100vh;display:flex;flex-direction:column;transition:background .3s,color .3s;}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes livePulse{0%,100%{box-shadow:0 0 0 0 rgba(78,168,138,.4)}70%{box-shadow:0 0 0 6px rgba(78,168,138,0)}}
.header{background:linear-gradient(180deg,rgba(16,21,31,.92),rgba(8,11,20,.92));backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--border);padding:13px 18px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:200;box-shadow:var(--shadow-md);}
.header::after{content:'';position:absolute;left:0;right:0;bottom:-1px;height:1px;background:linear-gradient(90deg,transparent,rgba(201,162,39,.55),transparent);}
.icon-btn{width:36px;height:36px;border:1px solid rgba(255,255,255,.15);border-radius:8px;background:rgba(255,255,255,.08);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:16px;transition:all .2s;color:#fff;}
.icon-btn:hover{border-color:rgba(201,162,39,.5);background:rgba(201,162,39,.12);}
.hamburger{flex-direction:column;gap:4px;}
.hamburger span{display:block;width:16px;height:2px;background:#fff;border-radius:1px;transition:all .3s;}
.hamburger.open span:nth-child(1){transform:rotate(45deg) translate(4px,4px);}
.hamburger.open span:nth-child(2){opacity:0;}
.hamburger.open span:nth-child(3){transform:rotate(-45deg) translate(4px,-4px);}
.logo{display:flex;align-items:center;gap:10px;}
.logo-badge{width:38px;height:38px;border-radius:11px;background:linear-gradient(145deg,#d4ae33,#9c7d1c);display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:900;color:#0b0e16;box-shadow:0 2px 10px rgba(201,162,39,.28),inset 0 1px 0 rgba(255,255,255,.25);flex-shrink:0;}
.app-title{font-size:17px;font-weight:700;color:#fff;letter-spacing:-.02em;}
.app-title span{color:var(--accent);font-weight:600;}
.app-sub{font-size:8.5px;color:rgba(255,255,255,.42);text-transform:uppercase;letter-spacing:2.2px;font-weight:500;}
.header-right{display:flex;gap:6px;align-items:center;margin-left:auto;flex-wrap:wrap;}
.ctrl{display:flex;flex-direction:column;}
.ctrl-lbl{font-size:9px;color:rgba(255,255,255,.5);text-transform:uppercase;letter-spacing:1px;margin-bottom:2px;}
select,input[type=date]{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);color:#fff;padding:6px 10px;border-radius:8px;font-size:12px;cursor:pointer;outline:none;appearance:none;-webkit-appearance:none;}
select:focus,input[type=date]:focus{border-color:var(--accent2);}
select option{background:#171d2a;color:#fff;}
.btn{padding:6px 12px;border:none;border-radius:8px;cursor:pointer;font-size:12px;font-weight:600;display:flex;align-items:center;gap:5px;white-space:nowrap;transition:all .2s;}
.btn-primary{background:var(--accent);color:#fff;}
.btn-primary:hover{background:#9c7d1c;}
.live-dot{width:8px;height:8px;border-radius:50%;background:var(--green);animation:pulse 1.5s infinite;}
.refresh-timer{font-size:10px;color:rgba(255,255,255,.4);}
.filter-drawer{display:none;}
.body-wrap{display:flex;flex:1;min-height:0;}
.backdrop{display:none;position:fixed;inset:0;z-index:250;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);}
.backdrop.on{display:block;}
.sidebar{width:var(--sidebar-w);background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;overflow-y:auto;transition:transform .3s;}
.sidebar-head{padding:14px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.sidebar-title{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--text2);}
.acc-section{border-bottom:1px solid var(--border);}
.acc-btn{width:100%;padding:12px 16px;background:none;border:none;color:var(--text);cursor:pointer;display:flex;align-items:center;justify-content:space-between;font-size:13px;font-weight:600;text-align:left;transition:background .2s;}
.acc-btn:hover{background:var(--surface2);}
.acc-btn .acc-icon{font-size:14px;transition:transform .3s;}
.acc-btn.open .acc-icon{transform:rotate(180deg);}
.acc-body{display:none;padding:8px 12px 12px;}
.acc-body.open{display:block;}
.leader-card{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin-bottom:8px;animation:fadeIn .3s ease;}
.leader-card:hover{border-color:var(--accent2);}
.lc-top{display:flex;align-items:center;gap:8px;margin-bottom:6px;}
.lc-rank{width:22px;height:22px;border-radius:50%;background:var(--surface3);font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;color:var(--text2);flex-shrink:0;}
.lc-rank.gold{background:var(--gold);color:#000;}
.lc-rank.silver{background:#97a3b8;color:#000;}
.lc-rank.bronze{background:#a8763f;color:#000;}
.lc-logo{width:28px;height:28px;object-fit:contain;flex-shrink:0;}
.lc-name{font-size:12px;font-weight:700;}
.lc-team{font-size:10px;color:var(--text3);}
.lc-stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px;}
.lc-stat{background:var(--surface3);border-radius:6px;padding:4px 6px;text-align:center;}
.lc-stat-val{font-size:13px;font-weight:700;color:var(--accent);}
.lc-stat-lbl{font-size:9px;color:var(--text3);text-transform:uppercase;}
.lc-today{display:inline-flex;align-items:center;gap:4px;font-size:9px;color:var(--green);background:rgba(78,168,138,.1);border:1px solid rgba(78,168,138,.3);border-radius:4px;padding:2px 6px;margin-top:6px;}
.main{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:14px;}
.game-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:10px;}
.game-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;cursor:pointer;transition:all .2s;position:relative;}
.game-card:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:0 8px 24px rgba(201,162,39,.15);}
.game-card.active{border-color:var(--accent);background:var(--surface2);}
.game-card.live-game{border-color:rgba(78,168,138,.4);animation:livePulse 2s infinite;}
.gc-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
.gc-time{font-size:11px;color:var(--text3);display:flex;align-items:center;gap:5px;}
.gc-live{color:var(--green);font-weight:700;font-size:10px;}
.gc-teams{display:flex;flex-direction:column;gap:5px;}
.gc-team{display:flex;align-items:center;gap:8px;}
.gc-logo{width:24px;height:24px;object-fit:contain;flex-shrink:0;}
.gc-abbr{font-size:13px;font-weight:800;width:32px;}
.gc-name{font-size:11px;color:var(--text2);flex:1;}
.gc-rec{font-size:10px;color:var(--text3);}
.gc-score{font-size:15px;font-weight:800;}
.gc-vs{text-align:center;font-size:10px;color:var(--text3);padding:1px 0;}
.gc-wp-bar{margin-top:8px;height:4px;background:var(--surface3);border-radius:2px;overflow:hidden;}
.gc-wp-fill{height:100%;background:linear-gradient(90deg,var(--accent2),var(--accent));border-radius:2px;}
.gc-wp-labels{display:flex;justify-content:space-between;font-size:10px;color:var(--text3);margin-top:3px;}
.no-games{text-align:center;padding:60px 20px;color:var(--text3);}
.status-bar{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);padding:12px 16px;display:flex;align-items:center;gap:10px;font-size:13px;color:var(--text2);}
.spinner{width:16px;height:16px;border:1px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin 0.8s linear infinite;flex-shrink:0;}
.detail{display:none;}
.detail.on{display:flex;flex-direction:column;gap:14px;animation:fadeIn .4s ease;}
.hero{background:linear-gradient(135deg,var(--surface),var(--surface2));border:1px solid var(--border);border-radius:var(--radius);padding:18px;position:relative;overflow:hidden;}
.hero::after{content:'⚾';position:absolute;right:-10px;top:-10px;font-size:80px;opacity:.04;}
.hero-teams{display:flex;align-items:center;justify-content:center;gap:16px;margin-bottom:14px;}
.hero-team{text-align:center;flex:1;}
.hero-logo{width:56px;height:56px;object-fit:contain;margin-bottom:6px;}
.hero-abbr{font-size:26px;font-weight:900;}
.hero-name{font-size:11px;color:var(--text2);margin-top:2px;}
.hero-rec{font-size:10px;color:var(--text3);}
.hero-sp{font-size:10px;color:var(--text2);margin-top:3px;}
.hero-vs{font-size:16px;color:var(--text3);font-weight:300;text-align:center;}
.hero-meta{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;}
.hero-badge{background:var(--surface3);border:1px solid var(--border);border-radius:8px;padding:5px 10px;font-size:11px;color:var(--text2);display:flex;align-items:center;gap:4px;}
.hero-badge.weather{border-color:rgba(74,127,181,.3);background:rgba(74,127,181,.08);}
.hero-badge.park{border-color:rgba(139,123,184,.3);background:rgba(139,123,184,.08);}
.hero-badge.wind{border-color:rgba(78,168,138,.3);background:rgba(78,168,138,.08);}
.context-strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;}
.ctx-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px 14px;}
.ctx-title{font-size:9px;text-transform:uppercase;letter-spacing:1px;color:var(--text3);margin-bottom:6px;}
.ctx-main{font-size:18px;font-weight:700;}
.ctx-sub{font-size:11px;color:var(--text2);margin-top:2px;}
.ctx-detail{font-size:10px;color:var(--text3);margin-top:3px;}
.form-dots{display:flex;gap:3px;margin-top:5px;flex-wrap:wrap;}
.form-dot{width:15px;height:15px;border-radius:50%;font-size:8px;font-weight:700;display:flex;align-items:center;justify-content:center;}
.form-dot.W{background:rgba(78,168,138,.2);border:1px solid var(--green);color:var(--green);}
.form-dot.L{background:rgba(192,91,91,.2);border:1px solid var(--red);color:var(--red);}
.park-factor{display:flex;align-items:center;gap:8px;margin-top:5px;}
.pf-bar{flex:1;height:5px;background:var(--surface3);border-radius:3px;overflow:hidden;}
.pf-fill{height:100%;border-radius:3px;}
.prob-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;}
.prob-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--text2);margin-bottom:10px;}
.prob-bar-wrap{background:var(--surface2);border-radius:8px;overflow:hidden;height:28px;display:flex;margin-bottom:8px;}
.prob-away{height:100%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff;transition:width .8s cubic-bezier(.4,0,.2,1);}
.prob-home{height:100%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff;background:var(--accent2);transition:width .8s cubic-bezier(.4,0,.2,1);}
.prob-labels{display:flex;justify-content:space-between;font-size:12px;color:var(--text2);}
.prob-factors{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-top:10px;}
.pf-item{background:var(--surface2);border-radius:8px;padding:8px 10px;}
.pf-item-lbl{font-size:9px;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px;}
.pf-item-val{font-size:13px;font-weight:700;}
.ps-val.good{color:var(--green);}
.ps-val.bad{color:var(--red);}
.ps-val.avg{color:var(--gold);}
.ou-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;}
.ou-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:10px;}
.ou-item{background:var(--surface2);border-radius:10px;padding:12px;text-align:center;}
.ou-val{font-size:22px;font-weight:800;}
.ou-lbl{font-size:10px;color:var(--text3);text-transform:uppercase;margin-top:3px;}
.ou-sub{font-size:10px;color:var(--text2);margin-top:4px;}
.ou-verdict{margin-top:12px;background:var(--surface2);border-radius:10px;padding:12px 14px;display:flex;align-items:center;gap:10px;}
.ou-verdict-icon{font-size:24px;}
.ou-verdict-text{font-size:13px;font-weight:600;}
.ou-verdict-sub{font-size:11px;color:var(--text2);margin-top:2px;}
.props-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;}
.props-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin-top:10px;}
.prop-item{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:12px;}
.prop-item.hot-prop{border-color:rgba(201,162,39,.4);background:rgba(201,162,39,.06);}
.prop-item.fire-prop{border-color:rgba(192,91,91,.4);background:rgba(192,91,91,.06);}
.prop-top{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.prop-logo{width:22px;height:22px;object-fit:contain;}
.prop-name{font-size:12px;font-weight:700;flex:1;}
.prop-badge{font-size:10px;font-weight:700;padding:2px 7px;border-radius:10px;}
.prop-badge.fire{background:rgba(192,91,91,.15);color:var(--red);border:1px solid rgba(192,91,91,.3);}
.prop-badge.hot{background:rgba(201,162,39,.15);color:var(--gold);border:1px solid rgba(201,162,39,.3);}
.prop-badge.solid{background:rgba(74,127,181,.15);color:var(--blue);border:1px solid rgba(74,127,181,.3);}
.prop-stats{display:grid;grid-template-columns:1fr 1fr;gap:4px;}
.prop-stat{text-align:center;background:var(--surface3);border-radius:6px;padding:4px;}
.prop-stat-val{font-size:13px;font-weight:700;}
.prop-stat-lbl{font-size:9px;color:var(--text3);text-transform:uppercase;}
.prop-reason{font-size:10px;color:var(--text2);margin-top:6px;line-height:1.4;}
.pitch-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.pitch-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;}
.pitch-side{font-size:9px;text-transform:uppercase;letter-spacing:1px;color:var(--text3);margin-bottom:4px;}
.pitch-top{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
.pitch-logo{width:36px;height:36px;object-fit:contain;}
.pitch-name{font-size:15px;font-weight:800;}
.pitch-team{font-size:10px;color:var(--text3);}
.pitch-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;}
.ps{background:var(--surface2);border-radius:8px;padding:6px;text-align:center;}
.ps-val{font-size:13px;font-weight:700;}
.ps-lbl{font-size:9px;color:var(--text3);text-transform:uppercase;}
.lineup-wrap{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;}
.lineup-header{padding:12px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;}
.lineup-title{font-size:14px;font-weight:700;}
.tab-row{display:flex;gap:6px;}
.tab-btn{padding:5px 12px;border-radius:6px;border:1px solid var(--border);background:none;color:var(--text2);font-size:12px;cursor:pointer;transition:all .2s;}
.tab-btn.active{background:var(--accent);border-color:var(--accent);color:#fff;}
.tab-logo{width:16px;height:16px;object-fit:contain;vertical-align:middle;margin-right:4px;}
.ltable{width:100%;border-collapse:collapse;font-size:12px;}
.ltable th{background:var(--surface2);padding:8px 10px;text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:var(--text3);border-bottom:1px solid var(--border);}
.ltable td{padding:8px 10px;border-bottom:1px solid rgba(30,38,53,.5);}
.ltable tr:last-child td{border-bottom:none;}
.ltable tr:hover td{background:var(--surface2);}
.order-num{color:var(--text3);font-weight:700;}
.batter-name{font-weight:600;}
.batter-pos{color:var(--text3);font-size:10px;margin-left:4px;}
.stat-cell{text-align:center;}
.hr-badge{display:inline-flex;align-items:center;justify-content:center;padding:2px 7px;border-radius:10px;font-size:11px;font-weight:700;}
.hr-badge.hot{background:rgba(192,91,91,.15);color:var(--red);border:1px solid rgba(192,91,91,.3);}
.hr-badge.warm{background:rgba(192,138,74,.15);color:var(--orange);border:1px solid rgba(192,138,74,.3);}
.hr-badge.cold{background:rgba(74,127,181,.15);color:var(--blue);border:1px solid rgba(74,127,181,.3);}
.split-badge{font-size:9px;padding:1px 5px;border-radius:4px;font-weight:700;margin-left:3px;}
.split-good{background:rgba(78,168,138,.15);color:var(--green);}
.split-bad{background:rgba(192,91,91,.15);color:var(--red);}
.inj-badge{font-size:9px;padding:1px 5px;border-radius:4px;font-weight:700;margin-left:3px;background:rgba(192,138,74,.15);color:var(--orange);border:1px solid rgba(192,138,74,.3);}
.confirmed-badge{display:inline-flex;align-items:center;gap:3px;font-size:9px;color:var(--green);background:rgba(78,168,138,.1);border:1px solid rgba(78,168,138,.3);border-radius:4px;padding:2px 6px;margin-left:8px;}
.odds-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;}
.odds-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px;text-align:center;}
.odds-label{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px;}
.odds-val{font-size:20px;font-weight:800;}
/* ── Share FAB ── */
.share-fab{position:fixed;bottom:24px;right:24px;width:52px;height:52px;border-radius:50%;background:var(--accent2);border:none;cursor:pointer;display:none;align-items:center;justify-content:center;font-size:22px;box-shadow:0 4px 20px rgba(74,127,181,.5);z-index:150;transition:all .25s;}
.share-fab.visible{display:flex;animation:fadeIn .3s ease;}
.share-fab:hover{transform:scale(1.1);box-shadow:0 6px 28px rgba(74,127,181,.7);}

/* ── Share Modal ── */
.bx-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;margin-bottom:8px;}
.bx-scroll{overflow-x:auto;}
.bx-scroll::-webkit-scrollbar{height:6px;}
.bx-scroll::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px;}
.ls-table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;min-width:340px;}
.ls-table th{font-size:10px;font-weight:700;color:var(--text3);padding:5px 7px;text-align:center;border-bottom:1px solid var(--border);}
.ls-table td{font-size:12px;padding:6px 7px;text-align:center;border-bottom:1px solid rgba(30,38,53,.55);}
.ls-table tr:last-child td{border-bottom:none;}

.nfl-hero-logo{width:62px;height:62px;object-fit:contain;}
.nfl-hero-abbr{font-size:24px;font-weight:900;}
.nfl-hero-name{font-size:10px;color:var(--text2);text-align:center;line-height:1.3;}
.nfl-hero-rec{font-size:13px;font-weight:700;}
.nfl-hero-vs{font-size:30px;font-weight:900;color:var(--gold);text-align:center;flex:0 0 60px;}
.nfl-hero-meta{display:flex;flex-wrap:wrap;gap:5px;}
.nfl-meta-badge{font-size:11px;font-weight:600;padding:3px 10px;border-radius:20px;background:var(--surface2);border:1px solid var(--border);color:var(--text2);}
.nfl-odds-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px;}
.nfl-odds-item{text-align:center;background:rgba(0,0,0,.15);border:1px solid rgba(255,255,255,.06);border-radius:8px;padding:8px 4px;}
.nfl-odds-val{font-size:18px;font-weight:900;color:var(--gold);}
.nfl-odds-lbl{font-size:9px;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;margin-top:2px;}
.nfl-matchup-rows{display:flex;flex-direction:column;gap:0;}
.nfl-stat-row{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid rgba(30,38,53,.3);}
.nfl-stat-row:last-child{border-bottom:none;}
.nfl-stat-val-l{font-size:12px;font-weight:800;width:48px;text-align:right;flex-shrink:0;}
.nfl-stat-lbl{font-size:10px;color:var(--text3);flex:1;text-align:center;}
.nfl-stat-val-r{font-size:12px;font-weight:800;width:48px;text-align:left;flex-shrink:0;}
.nfl-controls{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:10px 14px;margin-bottom:10px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.nfl-ctrl{display:flex;align-items:center;gap:6px;}
.nfl-ctrl-lbl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--text3);white-space:nowrap;}
.nfl-controls select{background:var(--surface2);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:6px 10px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;min-width:130px;}
.nfl-controls select:focus{outline:none;border-color:var(--accent);}
.nfl-week-nav{display:flex;gap:4px;}
.nfl-nav-btn{background:var(--surface2);border:1px solid var(--border);color:var(--text2);border-radius:7px;width:30px;height:30px;font-size:13px;font-weight:800;cursor:pointer;transition:all .15s;display:flex;align-items:center;justify-content:center;}
.nfl-nav-btn:hover:not(:disabled){background:var(--accent);color:#fff;border-color:var(--accent);}
.nfl-nav-btn:disabled{opacity:.3;cursor:not-allowed;}
.nfl-toggle{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:700;color:var(--text2);cursor:pointer;user-select:none;padding:6px 11px;background:var(--surface2);border:1px solid var(--border);border-radius:20px;transition:all .2s;}
.nfl-toggle.on{background:rgba(78,168,138,.13);border-color:rgba(78,168,138,.4);color:#4ea88a;}
.nfl-count{font-size:11px;color:var(--text3);margin-left:auto;font-weight:600;white-space:nowrap;}
.fb-rank{font-size:10px;font-weight:900;color:var(--gold);margin-right:3px;vertical-align:super;}
.nfl-week-label{font-size:12px;font-weight:800;color:var(--gold);}
/* ── NFL Player Props ── */
.np-tabs{display:flex;gap:5px;margin:8px 0 10px;flex-wrap:wrap;}
.np-tab{font-size:10px;font-weight:700;padding:4px 11px;border-radius:20px;border:1px solid var(--border);background:var(--surface2);color:var(--text2);cursor:pointer;transition:all .15s;}
.np-tab.active{background:rgba(201,162,39,.15);border-color:var(--gold);color:var(--gold);}
.np-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(255px,1fr));gap:8px;}
.np-card{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:10px 12px;transition:all .2s;}
.np-card:hover{border-color:rgba(201,162,39,.4);}
.np-card.np-elite{border-color:rgba(201,162,39,.45);background:linear-gradient(135deg,var(--surface2),rgba(201,162,39,.04));}
.np-head{display:flex;align-items:center;gap:9px;margin-bottom:8px;}
.np-hs{width:38px;height:38px;border-radius:50%;object-fit:cover;background:var(--surface3);border:1px solid rgba(201,162,39,.3);flex-shrink:0;}
.np-name-block{flex:1;min-width:0;}
.np-name{font-size:13px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.np-sub{font-size:10px;color:var(--text3);}
.np-td-badge{text-align:center;flex-shrink:0;}
.np-td-val{font-size:16px;font-weight:900;line-height:1;}
.np-td-lbl{font-size:7px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;margin-top:2px;}
.np-props{display:flex;flex-direction:column;gap:3px;}
.np-prop-row{display:flex;align-items:center;gap:6px;padding:4px 7px;background:rgba(0,0,0,.18);border-radius:6px;}
.np-prop-lbl{font-size:10px;color:var(--text2);flex:1;font-weight:600;}
.np-prop-val{font-size:13px;font-weight:900;color:var(--gold);}
.np-prop-avg{font-size:9px;color:var(--text3);width:52px;text-align:right;}
.np-lean{font-size:9px;font-weight:800;padding:1px 6px;border-radius:8px;margin-left:2px;}
.np-lean-up{background:rgba(78,168,138,.16);color:#4ea88a;}
.np-lean-down{background:rgba(192,91,91,.14);color:#cf7a7a;}
.np-inj{font-size:8px;font-weight:800;color:var(--red);background:rgba(192,91,91,.13);padding:1px 5px;border-radius:6px;margin-left:4px;}
.np-team-hdr{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.8px;color:var(--text3);margin:10px 0 5px 2px;display:flex;align-items:center;gap:6px;}
.np-team-hdr img{width:18px;height:18px;object-fit:contain;}
.np-implied{font-size:10px;font-weight:700;color:var(--gold);background:rgba(201,162,39,.1);border:1px solid rgba(201,162,39,.25);padding:1px 8px;border-radius:10px;}
@media(max-width:768px){.np-grid{grid-template-columns:1fr;}}
/* ── Coverage Matchup ── */
.cv-scheme-bar{display:flex;gap:8px;margin:8px 0 10px;flex-wrap:wrap;}
.cv-scheme{flex:1;min-width:190px;background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:9px 11px;}
.cv-scheme-hdr{display:flex;align-items:center;gap:6px;margin-bottom:6px;}
.cv-scheme-hdr img{width:20px;height:20px;object-fit:contain;}
.cv-scheme-team{font-size:12px;font-weight:900;}
.cv-scheme-style{font-size:9px;font-weight:700;color:var(--gold);text-transform:uppercase;letter-spacing:.5px;margin-left:auto;}
.cv-mz-bar{height:16px;border-radius:5px;overflow:hidden;display:flex;margin-bottom:5px;}
.cv-mz-man{background:linear-gradient(90deg,#c9a227,#c05b5b);display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:800;color:#fff;}
.cv-mz-zone{background:linear-gradient(90deg,#3d6f96,#6fa8cf);display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:800;color:#fff;}
.cv-scheme-meta{display:flex;gap:5px;flex-wrap:wrap;}
.cv-meta-pill{font-size:9px;font-weight:700;padding:1px 7px;border-radius:9px;background:rgba(0,0,0,.22);border:1px solid var(--border);color:var(--text2);}
.cv-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));gap:8px;}
.cv-card{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:10px 12px;transition:all .2s;position:relative;overflow:hidden;}
.cv-card:hover{border-color:rgba(201,162,39,.4);}
.cv-head{display:flex;align-items:center;gap:9px;margin-bottom:7px;}
.cv-hs{width:38px;height:38px;border-radius:50%;object-fit:cover;background:var(--surface3);border:1px solid rgba(201,162,39,.3);flex-shrink:0;}
.cv-nb{flex:1;min-width:0;}
.cv-name{font-size:13px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.cv-sub{font-size:10px;color:var(--text3);}
.cv-grade{width:46px;height:46px;border-radius:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0;border:2px solid;}
.cv-grade-l{font-size:19px;font-weight:900;line-height:1;}
.cv-grade-s{font-size:7px;font-weight:700;text-transform:uppercase;opacity:.75;margin-top:1px;}
.grade-a{background:rgba(78,168,138,.14);border-color:rgba(78,168,138,.5);color:#4ea88a;}
.grade-b{background:rgba(143,191,114,.13);border-color:rgba(143,191,114,.45);color:#8fbf72;}
.grade-c{background:rgba(201,162,39,.13);border-color:rgba(201,162,39,.42);color:var(--gold);}
.grade-d{background:rgba(192,138,74,.13);border-color:rgba(192,138,74,.42);color:#cf9a5e;}
.grade-f{background:rgba(192,91,91,.14);border-color:rgba(192,91,91,.45);color:#cf7a7a;}
.cv-arch{display:inline-block;font-size:9px;font-weight:800;padding:2px 8px;border-radius:10px;background:rgba(139,143,196,.14);border:1px solid rgba(139,143,196,.3);color:#8b8fc4;margin-bottom:6px;letter-spacing:.3px;}
.cv-splits{display:flex;gap:5px;margin-bottom:6px;}
.cv-split{flex:1;background:rgba(0,0,0,.2);border-radius:6px;padding:4px 6px;text-align:center;}
.cv-split-v{font-size:12px;font-weight:800;}
.cv-split-l{font-size:7px;color:var(--text3);text-transform:uppercase;letter-spacing:.4px;margin-top:1px;}
.cv-notes{display:flex;flex-direction:column;gap:2px;}
.cv-note{font-size:10px;color:var(--text2);line-height:1.45;}
.cv-note-pos{color:#4ea88a;}
.cv-note-neg{color:#cf7a7a;}
@media(max-width:768px){.cv-grid{grid-template-columns:1fr;}.cv-scheme{min-width:0;}}
@media(max-width:768px){.nfl-grid{grid-template-columns:1fr;}.nfl-odds-grid{grid-template-columns:repeat(2,1fr);}.nfl-controls{gap:8px;}.nfl-controls select{min-width:0;flex:1;}.nfl-ctrl{flex:1;min-width:140px;}.nfl-count{margin-left:0;width:100%;}}
.pitch-rating-row{margin:6px 0 4px;}
.pitch-rating{display:inline-block;font-size:11px;font-weight:800;padding:3px 10px;border-radius:20px;letter-spacing:.4px;}
.rating-great{background:rgba(78,168,138,.18);color:#4ea88a;border:1px solid rgba(78,168,138,.35);}
.rating-good{background:rgba(111,168,207,.15);color:#6fa8cf;border:1px solid rgba(111,168,207,.3);}
.rating-fair{background:rgba(201,162,39,.15);color:var(--gold);border:1px solid rgba(201,162,39,.3);}
.rating-below{background:rgba(192,91,91,.15);color:var(--red);border:1px solid rgba(192,91,91,.3);}
.upset-card{border-radius:var(--radius);padding:14px 16px;margin-bottom:4px;border:1px solid;position:relative;overflow:hidden;}
.upset-card::before{content:'';position:absolute;inset:0;opacity:.04;pointer-events:none;}
.upset-high{background:rgba(192,91,91,.09);border-color:rgba(192,91,91,.45);}
.upset-medium{background:rgba(201,162,39,.09);border-color:rgba(201,162,39,.40);}
.upset-low{background:rgba(139,143,196,.09);border-color:rgba(139,143,196,.35);}
.upset-header{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:9px;}
.upset-title{font-size:13px;font-weight:900;letter-spacing:.2px;}
.upset-high .upset-title{color:var(--red);}
.upset-medium .upset-title{color:var(--gold);}
.upset-low .upset-title{color:#8b8fc4;}
.upset-teams{font-size:12px;font-weight:700;color:var(--text2);background:rgba(0,0,0,.25);padding:3px 9px;border-radius:20px;white-space:nowrap;}
.upset-factors{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px;}
.upset-factor{font-size:10px;font-weight:700;padding:3px 8px;border-radius:12px;background:rgba(0,0,0,.2);border:1px solid rgba(255,255,255,.08);color:var(--text2);}
.upset-reason-list{display:flex;flex-direction:column;gap:3px;margin-bottom:7px;}
.upset-reason{font-size:11px;color:var(--text2);padding-left:2px;}
.upset-score-bar{height:4px;border-radius:4px;background:rgba(255,255,255,.08);margin-bottom:6px;overflow:hidden;}
.upset-score-fill{height:100%;border-radius:4px;transition:width .5s;}
.upset-high .upset-score-fill{background:var(--red);}
.upset-medium .upset-score-fill{background:var(--gold);}
.upset-low .upset-score-fill{background:#8b8fc4;}
.upset-note{font-size:10px;color:var(--text3);font-style:italic;}
/* ── Series Strip ── */
.series-strip{background:linear-gradient(90deg,rgba(139,123,184,.08),rgba(139,123,184,.02));border:1px solid rgba(139,123,184,.2);border-radius:10px;padding:10px 14px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;}
.series-info{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.series-game{font-size:13px;font-weight:700;color:var(--purple);}
.series-rubber{font-size:11px;font-weight:700;background:rgba(201,162,39,.15);color:var(--gold);border:1px solid rgba(201,162,39,.3);border-radius:6px;padding:2px 8px;}
.series-rec{font-size:11px;color:var(--text2);background:var(--surface2);border-radius:6px;padding:2px 8px;}
.series-yest{font-size:11px;color:var(--text3);}
/* ── Umpire Badge ── */
.ump-strip{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:9px 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:12px;}
.ump-name{font-weight:700;}
.ump-factor{font-weight:700;padding:2px 8px;border-radius:6px;font-size:11px;}
.ump-pos{background:rgba(192,91,91,.12);color:var(--red);border:1px solid rgba(192,91,91,.25);}
.ump-neg{background:rgba(74,127,181,.12);color:var(--blue);border:1px solid rgba(74,127,181,.25);}
.ump-neu{background:var(--surface3);color:var(--text2);border:1px solid var(--border);}
/* ── Bullpen ── */
.bp-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;}
.bp-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.bp-team{background:var(--surface2);border-radius:10px;padding:12px;}
.bp-team-hd{display:flex;align-items:center;gap:6px;margin-bottom:8px;flex-wrap:wrap;}
.bp-status{font-size:10px;font-weight:700;padding:2px 7px;border-radius:10px;margin-left:auto;}
.bp-fresh{background:rgba(78,168,138,.12);color:var(--green);border:1px solid rgba(78,168,138,.25);}
.bp-mixed{background:rgba(201,162,39,.12);color:var(--gold);border:1px solid rgba(201,162,39,.25);}
.bp-depleted{background:rgba(192,91,91,.12);color:var(--red);border:1px solid rgba(192,91,91,.25);}
.bp-arm{padding:5px 0;border-bottom:1px solid rgba(30,38,53,.3);}
.bp-arm:last-child{border-bottom:none;}
.bp-name{font-size:12px;font-weight:700;display:block;}
.bp-rest{font-size:10px;display:block;margin-top:1px;}
@media(max-width:600px){.bp-grid{grid-template-columns:1fr;}}
/* ── Advanced Bets (NRFI / F5) ── */
.adv-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;}
.adv-tabs{display:flex;gap:6px;margin-bottom:12px;}
.adv-tab{flex:1;padding:7px 0;border:1px solid var(--border);border-radius:8px;background:none;color:var(--text2);font-size:12px;font-weight:600;cursor:pointer;transition:all .2s;text-align:center;}
.adv-tab.active{background:var(--accent);border-color:var(--accent);color:#fff;}
.nrfi-big{font-size:42px;font-weight:900;line-height:1;text-align:center;}
.nrfi-bar{height:14px;background:var(--surface2);border-radius:7px;overflow:hidden;display:flex;margin:10px 0 4px;}
.nrfi-n{height:100%;background:linear-gradient(90deg,#4ea88a,#3f8f74);display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:800;color:#fff;}
.nrfi-y{height:100%;background:linear-gradient(90deg,#c08a4a,#c9a227);display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:800;color:#fff;}
.nrfi-row{display:flex;gap:8px;margin-top:10px;}
.nrfi-cell{flex:1;background:var(--surface2);border-radius:8px;padding:8px;text-align:center;}
.nrfi-val{font-size:16px;font-weight:800;}
.nrfi-lbl{font-size:9px;color:var(--text3);text-transform:uppercase;margin-top:2px;}
.nrfi-verdict{margin-top:10px;padding:10px 14px;border-radius:9px;display:flex;align-items:center;gap:8px;}
.nrfi-verdict.lean-n{background:rgba(78,168,138,.1);border:1px solid rgba(78,168,138,.3);}
.nrfi-verdict.lean-y{background:rgba(192,138,74,.1);border:1px solid rgba(192,138,74,.3);}
.nrfi-verdict.toss{background:var(--surface2);border:1px solid var(--border);}
.parlay-add{display:inline-flex;align-items:center;gap:4px;padding:5px 11px;border-radius:6px;border:1px solid var(--border);background:none;color:var(--text2);font-size:11px;font-weight:700;cursor:pointer;transition:all .2s;margin-top:8px;}
.parlay-add:hover{border-color:var(--purple);color:var(--purple);}
.parlay-add.in-parlay{border-color:var(--purple);background:rgba(139,123,184,.12);color:var(--purple);}
/* ── EV Calculator ── */
.ev-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;}
.ev-inputs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px;}
.ev-input-group{background:var(--surface2);border-radius:10px;padding:10px;}
.ev-team{font-size:11px;font-weight:700;margin-bottom:6px;}
.ev-line-input{width:100%;background:var(--surface3);border:1px solid var(--border);color:var(--text);padding:7px 10px;border-radius:7px;font-size:14px;font-weight:700;text-align:center;outline:none;}
.ev-line-input:focus{border-color:var(--accent2);}
.ev-result{margin-top:6px;font-size:11px;}
.ev-pos{color:var(--green);font-weight:700;}
.ev-neg{color:var(--red);font-weight:700;}
.ev-neutral{color:var(--text3);}
.ev-implied{font-size:10px;color:var(--text3);margin-top:2px;}
/* ── Parlay Tray ── */
.parlay-tray{position:fixed;bottom:0;left:0;right:0;z-index:400;transform:translateY(calc(100% - 44px));transition:transform .35s cubic-bezier(.4,0,.2,1);}
.parlay-tray.open{transform:translateY(0);}
.parlay-handle{background:var(--purple);height:44px;padding:0 16px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;user-select:none;}
.parlay-handle-title{font-size:13px;font-weight:800;color:#fff;display:flex;align-items:center;gap:8px;}
.parlay-count{background:rgba(255,255,255,.25);border-radius:10px;padding:1px 8px;font-size:11px;}
.parlay-chevron{font-size:14px;color:rgba(255,255,255,.7);transition:transform .3s;}
.parlay-tray.open .parlay-chevron{transform:rotate(180deg);}
.parlay-body{background:var(--surface);border-top:1px solid var(--border);padding:12px 16px;max-height:60vh;overflow-y:auto;}
.parlay-item{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid rgba(30,38,53,.4);}
.parlay-item:last-child{border-bottom:none;}
.parlay-item-main{flex:1;}
.parlay-item-team{font-size:13px;font-weight:700;}
.parlay-item-sub{font-size:10px;color:var(--text3);}
.parlay-item-prob{font-size:12px;font-weight:700;color:var(--purple);}
.parlay-remove{background:none;border:none;cursor:pointer;color:var(--text3);font-size:16px;padding:2px 6px;border-radius:4px;transition:color .2s;}
.parlay-remove:hover{color:var(--red);}
.parlay-summary{background:var(--surface2);border-radius:10px;padding:12px 14px;margin-top:10px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;text-align:center;}
.parlay-summary-val{font-size:18px;font-weight:900;}
.parlay-summary-lbl{font-size:9px;color:var(--text3);text-transform:uppercase;margin-top:2px;}
.parlay-actions{display:flex;gap:8px;margin-top:10px;}
.parlay-clear{flex:1;padding:10px;border:1px solid var(--red);border-radius:8px;background:none;color:var(--red);font-size:12px;font-weight:700;cursor:pointer;transition:all .2s;}
.parlay-clear:hover{background:rgba(192,91,91,.1);}
.parlay-share{flex:2;padding:10px;background:var(--purple);border:none;border-radius:8px;color:#fff;font-size:12px;font-weight:700;cursor:pointer;transition:all .2s;}
.parlay-share:hover{opacity:.85;}

@media(max-width:768px){
  .filter-drawer{display:flex;flex-direction:column;gap:8px;padding:10px 12px;background:var(--surface);border-bottom:1px solid var(--border);}
  .filter-drawer .ctrl{flex-direction:row;align-items:center;gap:8px;}
  .filter-drawer select,.filter-drawer input[type=date]{flex:1;font-size:13px;background:var(--surface2);border-color:var(--border);color:var(--text);}

📅 ${S.date}${t?' · '+t:''}

🏆 Win Prob: ${aw} ${wp.away}%  |  ${hw} ${wp.home}%

tradercal.github.io/CJ`;
}

function daysAgo(n){const d=new Date();d.setDate(d.getDate()-n);return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function extractForm(data,teamId){const games=[];for(const d of data?.dates||[]){for(const g of d.games||[]){if(g.status?.abstractGameState!=='Final')continue;const isAway=g.teams?.away?.team?.id===teamId;const my=isAway?g.teams.away:g.teams.home,opp=isAway?g.teams.home:g.teams.away;games.push({result:(my?.score??0)>(opp?.score??0)?'W':'L',myR:my?.score??0,oppR:opp?.score??0});}}return games.slice(-10).reverse();}

async function fetchWeather(game){
  try{
    const vn=game.venue?.name||'';
    if(S.parkFactor?.indoor)return{temp:72,precip:0,wind:0,windDir:0,indoor:true};
    const coords=CITY_COORDS[vn]||{lat:39.5,lon:-98.3};
    const d=await api(`https://api.open-meteo.com/v1/forecast?latitude=${coords.lat}&longitude=${coords.lon}&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max,windspeed_10m_max,winddirection_10m_dominant&temperature_unit=fahrenheit&windspeed_unit=mph&start_date=${S.date}&end_date=${S.date}&timezone=auto`);
    if(!d?.daily)return null;
    return{temp:Math.round((d.daily.temperature_2m_max[0]+d.daily.temperature_2m_min[0])/2),precip:d.daily.precipitation_probability_max[0],wind:Math.round(d.daily.windspeed_10m_max[0]),windDir:d.daily.winddirection_10m_dominant[0],indoor:false};
  }catch(e){return null;}
}

function windDirLabel(deg){return['N','NE','E','SE','S','SW','W','NW'][Math.round(deg/45)%8];}
function weatherHRBoost(w){if(!w||w.indoor)return 0;let b=0;if(w.temp>85)b+=8;else if(w.temp>75)b+=4;else if(w.temp>65)b+=2;else if(w.temp<50)b-=8;else if(w.temp<60)b-=4;if(w.wind>15){const d=windDirLabel(w.windDir);if(['N','NE','E'].includes(d))b+=10;else if(['S','SW','W'].includes(d))b-=8;}else if(w.wind>8){const d=windDirLabel(w.windDir);if(['N','NE','E'].includes(d))b+=4;else if(['S','SW','W'].includes(d))b-=4;}return b;}

le.display='none'"><div class="hero-abbr" style="color:var(--accent2)">${hwA}</div><div class="hero-name">${hw?.team?.name||''}</div><div class="hero-rec">${hwW}-${hwL}</div><div class="hero-sp">${hwP}</div></div></div><div class="hero-meta"><div class="hero-badge">🕐 ${t}</div>${wb}${wib}${pb}</div></div>`;}

function renderUpset(game){
  const el=$('upsetEl');if(!el)return;
  const awPS=S.awayPS,hwPS=S.homePS;
  if(!awPS&&!hwPS){el.innerHTML='';return;}
  const awA=game.teams?.away?.team?.abbreviation||'AWY';
  const hwA=game.teams?.home?.team?.abbreviation||'HME';
  // SP quality
  const awERA=parseFloat(awPS?.era)||4.30,hwERA=parseFloat(hwPS?.era)||4.30;
  const awWHIP=parseFloat(awPS?.whip)||1.35,hwWHIP=parseFloat(hwPS?.whip)||1.35;
  const awK9=parseFloat(awPS?.strikeoutsPer9Inn)||8.0,hwK9=parseFloat(hwPS?.strikeoutsPer9Inn)||8.0;
  // Lineup (team OPS)
  const awOPS=parseFloat(S.awayTeamStats?.ops)||0.720,hwOPS=parseFloat(S.homeTeamStats?.ops)||0.720;
  // Bullpen
  const awBPERA=parseFloat(S.awayBP?.era)||4.00,hwBPERA=parseFloat(S.homeBP?.era)||4.00;
  // Form
  const awFW=S.awayForm?.filter(g=>g.result==='W').length??2,hwFW=S.homeForm?.filter(g=>g.result==='W').length??2;
  const awFL=S.awayForm?.length||5,hwFL=S.homeForm?.length||5;
  // Score each side (higher = better)
  const awScore=(6-awERA)*2+(2-awWHIP)*3+(awK9/9)+(awOPS-.680)*20+(5-awBPERA)+(awFW/awFL*10);
  const hwScore=(6-hwERA)*2+(2-hwWHIP)*3+(hwK9/9)+(hwOPS-.680)*20+(5-hwBPERA)+(hwFW/hwFL*10)+1.8/*home field*/;
  const margin=Math.abs(awScore-hwScore);
  if(margin<1.0){el.innerHTML='';return;}// too close — no clear favorite
  // Underdog = lower scoring side
  const udSide=awScore<hwScore?'away':'home';
  const favSide=udSide==='away'?'home':'away';
  const udAbbr=udSide==='away'?awA:hwA,favAbbr=udSide==='away'?hwA:awA;
  const udERA=udSide==='away'?awERA:hwERA,favERA=udSide==='away'?hwERA:awERA;
  const udWHIP=udSide==='away'?awWHIP:hwWHIP,favWHIP=udSide==='away'?hwWHIP:awWHIP;
  const udK9=udSide==='away'?awK9:hwK9,favK9=udSide==='away'?hwK9:awK9;
  const udOPS=udSide==='away'?awOPS:hwOPS,favOPS=udSide==='away'?hwOPS:awOPS;
  const udBPERA=udSide==='away'?awBPERA:hwBPERA,favBPERA=udSide==='away'?hwBPERA:awBPERA;
  const udFW=udSide==='away'?awFW:hwFW,udFL=udSide==='away'?awFL:hwFL;
  const favFW=udSide==='away'?hwFW:awFW,favFL=udSide==='away'?hwFL:awFL;
  // Collect upset factors that FAVOR the underdog
  const reasons=[];let upsetPts=0;
  // SP ERA advantage
  if(udERA<favERA-0.75){reasons.push(`💪 ${udAbbr} SP ERA ${udERA.toFixed(2)} vs ${favAbbr} ${favERA.toFixed(2)} — significant edge`);upsetPts+=3;}
  else if(udERA<favERA-0.30){reasons.push(`📊 ${udAbbr} SP ERA ${udERA.toFixed(2)} vs ${favAbbr} ${favERA.toFixed(2)}`);upsetPts+=2;}
  // WHIP advantage
  if(udWHIP<favWHIP-0.15){reasons.push(`🎯 ${udAbbr} SP WHIP ${udWHIP.toFixed(2)} — fewer baserunners allowed`);upsetPts+=2;}
  else if(udWHIP<favWHIP-0.08){reasons.push(`📈 ${udAbbr} SP WHIP edge (${udWHIP.toFixed(2)} vs ${favWHIP.toFixed(2)})`);upsetPts+=1;}
  // K/9 advantage
  if(udK9>favK9+1.5){reasons.push(`🔥 ${udAbbr} SP K/9 ${udK9.toFixed(1)} — high strikeout threat`);upsetPts+=1;}
  // Lineup OPS
  if(udOPS>favOPS+0.020){reasons.push(`⚾ ${udAbbr} lineup OPS ${udOPS.toFixed(3)} vs ${favAbbr} ${favOPS.toFixed(3)} — stronger offense`);upsetPts+=2;}
  else if(udOPS>favOPS+0.008){reasons.push(`📋 ${udAbbr} lineup OPS edge (${udOPS.toFixed(3)} vs ${favOPS.toFixed(3)})`);upsetPts+=1;}
  // Bullpen
  if(udBPERA<favBPERA-0.60){reasons.push(`🛡️ ${udAbbr} bullpen ERA ${udBPERA.toFixed(2)} vs ${favAbbr} ${favBPERA.toFixed(2)} — stronger pen`);upsetPts+=2;}
  else if(udBPERA<favBPERA-0.30){reasons.push(`💼 ${udAbbr} bullpen ERA edge (${udBPERA.toFixed(2)})`);upsetPts+=1;}
  // Form
  const udWPct=udFW/udFL,favWPct=favFW/favFL;
  if(udFW>=4){reasons.push(`🔥 ${udAbbr} hot — ${udFW}-${udFL-udFW} in last ${udFL}`);upsetPts+=2;}
  else if(udWPct>favWPct+0.2){reasons.push(`📈 ${udAbbr} better recent form (${udFW}-${udFL-udFW} vs ${favFW}-${favFL-favFW})`);upsetPts+=1;}
  // Park factor boost for underdog's lineup
  const parkHR=S.parkFactor?.hr||100;
  if(parkHR>=107&&udOPS>=favOPS){reasons.push(`🏟️ Hitter-friendly park (HR factor ${parkHR}) amplifies ${udAbbr} lineup`);upsetPts+=1;}
  // Only show alert if underdog has real factors going for them
  if(upsetPts<2||reasons.length<1){el.innerHTML='';return;}
  const level=upsetPts>=6?'high':upsetPts>=3?'medium':'low';
  const levelLabel=level==='high'?'🚨 Strong Upset Alert':level==='medium'?'⚠️ Upset Watch':'👀 Upset Potential';
  const fillPct=Math.min(100,Math.round(upsetPts/8*100));
  const factorTags=[awPS&&`SP ERA: ${udERA.toFixed(2)}`,udOPS>.720&&`OPS: ${udOPS.toFixed(3)}`,udBPERA<4&&`Pen ERA: ${udBPERA.toFixed(2)}`].filter(Boolean);
  el.innerHTML=`<div class="upset-card upset-${level}">
  <div class="upset-header">
    <span class="upset-title">${levelLabel}</span>
    <span class="upset-teams">${udAbbr} over ${favAbbr}</span>
  </div>
  <div class="upset-score-bar"><div class="upset-score-fill" style="width:${fillPct}%"></div></div>
  <div class="upset-reason-list">${reasons.map(r=>`<div class="upset-reason">• ${r}</div>`).join('')}</div>
  ${factorTags.length?`<div class="upset-factors">${factorTags.map(t=>`<span class="upset-factor">${t}</span>`).join('')}</div>`:''}
  <div class="upset-note">Statistical edge suggests ${udAbbr} may be undervalued. Always verify with current odds.</div>
</div>`;}

function renderContext(game){const aw=game.teams?.away,hw=game.teams?.home;const awA=aw?.team?.abbreviation||'?',hwA=hw?.team?.abbreviation||'?';const park=S.parkFactor,weather=S.weather;const awForm=S.awayForm||[],hwForm=S.homeForm||[];const pfPct=park?Math.min(100,Math.max(0,(park.hr-80)/50*100)):50;const pfC=park?.hr>110?'var(--red)':park?.hr>100?'var(--orange)':park?.hr<90?'var(--blue)':'var(--gold)';const parkCard=`<div class="ctx-card"><div class="ctx-title">🏟️ Park Factor</div><div class="ctx-main" style="color:${pfC}">${park?.hr??'—'}</div><div class="ctx-sub">${park?.name||'Unknown'}</div><div class="ctx-detail">${park?.note||''}</div><div class="park-factor"><div class="pf-bar"><div class="pf-fill" style="width:${pfPct}%;background:${pfC}"></div></div><span style="font-size:10px;font-weight:700;color:${pfC}">${park?.hr??''}</span></div></div>`;let wCard='';if(weather){const boost=weatherHRBoost(weather);const bc=boost>5?'var(--red)':boost<-5?'var(--blue)':'var(--gold)';wCard=`<div class="ctx-card"><div class="ctx-title">${weather.indoor?'🏟️ Indoor':'🌤️ Weather'}</div><div class="ctx-main">${weather.indoor?'Dome':weather.temp+'°F'}</div><div class="ctx-sub">${weather.indoor?'Climate controlled':'Precip: '+weather.precip+'%'}</div><div class="ctx-detail">${weather.indoor?'No effect':weather.wind+' mph '+windDirLabel(weather.windDir)}</div><div style="margin-top:5px;font-size:10px;color:${bc}">HR Boost: ${boost>0?'+':''}${boost}%</div></div>`;}function fCard(team,form){const w=form.filter(g=>g.result==='W').length,tot=form.length||1;const rs=form.reduce((a,g)=>a+g.myR,0),ra=form.reduce((a,g)=>a+g.oppR,0);const hot=w/tot>.7?'🔥':w/tot<.4?'🥶':'📈';return`<div class="ctx-card"><div class="ctx-title">${hot} ${team} Last ${form.length}G</div><div class="ctx-main" style="color:${w/tot>.6?'var(--green)':w/tot<.4?'var(--red)':'var(--gold)'}">${w}-${form.length-w}</div><div class="ctx-sub">RS: ${rs} · RA: ${ra} · ${rs-ra>=0?'+':''}${rs-ra}</div><div class="form-dots">${form.slice(0,10).map(g=>`<div class="form-dot ${g.result}">${g.result}</div>`).join('')}</div></div>`;}$('contextEl').innerHTML=`<div class="context-strip">${parkCard}${wCard}${fCard(awA,awForm)}${fCard(hwA,hwForm)}</div>`;}

function calcWP(game){const aw=game.teams?.away,hw=game.teams?.home;const awW=aw?.leagueRecord?.wins||0,awL=aw?.leagueRecord?.losses||0;const hwW=hw?.leagueRecord?.wins||0,hwL=hw?.leagueRecord?.losses||0;const awWP=awW/(awW+awL)||.5,hwWP=hwW/(hwW+hwL)||.5;const awERA=parseFloat(S.awayPS?.era)||4.30,hwERA=parseFloat(S.homePS?.era)||4.30;const awEraS=Math.max(0,Math.min(100,(6-awERA)/4*100)),hwEraS=Math.max(0,Math.min(100,(6-hwERA)/4*100));const awWHIP=parseFloat(S.awayPS?.whip)||1.35,hwWHIP=parseFloat(S.homePS?.whip)||1.35;const awWhipS=Math.max(0,Math.min(100,(2-awWHIP)*100)),hwWhipS=Math.max(0,Math.min(100,(2-hwWHIP)*100));const awBPERA=parseFloat(S.awayBP?.era)||4.00,hwBPERA=parseFloat(S.homeBP?.era)||4.00;const awBPS=Math.max(0,Math.min(100,(5-awBPERA)/3*100)),hwBPS=Math.max(0,Math.min(100,(5-hwBPERA)/3*100));const awFW=S.awayForm?.filter(g=>g.result==='W').length??5,hwFW=S.homeForm?.filter(g=>g.result==='W').length??5;const awFL=S.awayForm?.length||10,hwFL=S.homeForm?.length||10;const awFS=(awFW/awFL)*100,hwFS=(hwFW/hwFL)*100;const awRD=awW-awL,hwRD=hwW-hwL;const pfB=S.parkFactor?.run>105?.02:S.parkFactor?.run<95?-.02:0;const hC=hwWP*.28+(hwEraS/100)*.18+(hwWhipS/100)*.10+(hwBPS/100)*.12+(hwFS/100)*.12+(hwRD>0?.04:0)+.03+pfB;const aC=awWP*.28+(awEraS/100)*.18+(awWhipS/100)*.10+(awBPS/100)*.12+(awFS/100)*.12+(awRD>0?.04:0);const tot=hC+aC||1;const hwF=Math.max(.35,Math.min(.65,.40+(hC/tot-.5)*.50));return{home:Math.round(hwF*100),away:Math.round((1-hwF)*100),awERA,hwERA,awWHIP,hwWHIP,awBPERA,hwBPERA,awFW,hwFW,awFL,hwFL};}

function renderProb(game){const wp=calcWP(game);const aw=game.teams?.away?.team?.abbreviation||'?',hw=game.teams?.home?.team?.abbreviation||'?';const ec=e=>parseFloat(e)<3.5?'good':parseFloat(e)>4.5?'bad':'avg';$('probEl').innerHTML=`<div class="prob-card"><div class="prob-title">⚡ Win Probability</div><div class="prob-bar-wrap"><div class="prob-away" style="width:${wp.away}%;background:linear-gradient(90deg,#c9a227,#a8871d)">${wp.away}%</div><div class="prob-home" style="width:${wp.home}%">${wp.home}%</div></div><div class="prob-labels"><span style="color:var(--red)">${aw} ${wp.away}%</span><span style="color:var(--accent2)">${hw} ${wp.home}%</span></div><div class="prob-factors"><div class="pf-item"><div class="pf-item-lbl">SP ERA</div><div class="pf-item-val"><span class="ps-val ${ec(wp.awERA)}">${wp.awERA}</span> / <span class="ps-val ${ec(wp.hwERA)}">${wp.hwERA}</span></div></div><div class="pf-item"><div class="pf-item-lbl">WHIP</div><div class="pf-item-val">${wp.awWHIP.toFixed?wp.awWHIP.toFixed(2):wp.awWHIP} / ${wp.hwWHIP.toFixed?wp.hwWHIP.toFixed(2):wp.hwWHIP}</div></div><div class="pf-item"><div class="pf-item-lbl">Bullpen ERA</div><div class="pf-item-val"><span class="ps-val ${ec(wp.awBPERA)}">${wp.awBPERA.toFixed?wp.awBPERA.toFixed(2):wp.awBPERA}</span> / <span class="ps-val ${ec(wp.hwBPERA)}">${wp.hwBPERA.toFixed?wp.hwBPERA.toFixed(2):wp.hwBPERA}</span></div></div><div class="pf-item"><div class="pf-item-lbl">Last ${wp.awFL}G Form</div><div class="pf-item-val">${wp.awFW}-${wp.awFL-wp.awFW} / ${wp.hwFW}-${wp.hwFL-wp.hwFW}</div></div><div class="pf-item"><div class="pf-item-lbl">Park HR Factor</div><div class="pf-item-val" style="color:${S.parkFactor?.hr>105?'var(--red)':S.parkFactor?.hr<95?'var(--blue)':'var(--gold)'}">${S.parkFactor?.hr??'—'}</div></div><div class="pf-item"><div class="pf-item-lbl">Home Field</div><div class="pf-item-val" style="color:var(--green)">+3%</div></div></div></div>`;}

function calcExpectedRuns(ts,oppPS,isHome){const ops=parseFloat(ts?.ops)||0.720;const era=parseFloat(oppPS?.era)||4.30;const parkMult=(S.parkFactor?.run||100)/100;const wMult=1+(weatherHRBoost(S.weather)/200);const baseRuns=((ops-0.600)/0.300)*3+3.0;const pitcherAdj=(era-4.30)*0.35;const homeAdj=isHome?0.15:0;return Math.max(1.5,Math.round((baseRuns+pitcherAdj+homeAdj)*parkMult*wMult*10)/10);}

function renderOU(game){const aw=game.teams?.away,hw=game.teams?.home;const awA=aw?.team?.abbreviation||'?',hwA=hw?.team?.abbreviation||'?';const awRuns=calcExpectedRuns(S.awayTeamStats,S.homePS,false);const hwRuns=calcExpectedRuns(S.homeTeamStats,S.awayPS,true);const total=Math.round((awRuns+hwRuns)*10)/10;const wBoost=weatherHRBoost(S.weather);const parkNote=S.parkFactor?.hr>108?'High-scoring park':S.parkFactor?.hr<93?'Low-scoring park':'Neutral park';const wNote=wBoost>5?'Conditions boost scoring':wBoost<-5?'Conditions suppress scoring':'Normal conditions';let verdict,icon,sub;if(total>9.5){verdict='Lean OVER';icon='📈';sub=`Proj. ${total} runs — high-scoring matchup`;}else if(total<7.5){verdict='Lean UNDER';icon='📉';sub=`Proj. ${total} runs — pitcher-dominant game`;}else{verdict='Toss-Up';icon='⚖️';sub=`Proj. ${total} runs — near the number`;}$('ouEl').innerHTML=`<div class="ou-card"><div class="prob-title">📊 Over/Under Projection</div><div class="ou-grid"><div class="ou-item"><div class="ou-val" style="color:var(--accent)">${awRuns}</div><div class="ou-lbl">${awA} Proj</div><div class="ou-sub">vs ${hwA} SP</div></div><div class="ou-item"><div class="ou-val" style="color:var(--gold)">${total}</div><div class="ou-lbl">Total</div><div class="ou-sub">${parkNote}</div></div><div class="ou-item"><div class="ou-val" style="color:var(--accent2)">${hwRuns}</div><div class="ou-lbl">${hwA} Proj</div><div class="ou-sub">vs ${awA} SP</div></div></div><div style="font-size:10px;color:var(--text3);margin-top:6px">${wNote}</div><div class="ou-verdict"><div class="ou-verdict-icon">${icon}</div><div><div class="ou-verdict-text">${verdict}</div><div class="ou-verdict-sub">${sub}</div></div></div></div>`;}

function pitchCard(game,side,ps,bp,form){const team=game.teams?.[side],pitcher=team?.probablePitcher;const name=pitcher?.fullName||'TBD',teamId=team?.team?.id;const era=ps?.era??'—',whip=ps?.whip??'—',so=ps?.strikeOuts??'—',ip=ps?.inningsPitched??'—',wins=ps?.wins??'—',losses=ps?.losses??'—',hr9=ps?.homeRunsPer9??'—';const ec=e=>ps?parseFloat(e)<3.5?'good':parseFloat(e)>4.5?'bad':'avg':'';const bpEra=bp?.era;const _eraV=parseFloat(era),_whipV=parseFloat(whip);let _rpts=0;if(ps&&!isNaN(_eraV)){_rpts+=_eraV<3?4:_eraV<3.75?3:_eraV<4.5?2:1;}if(ps&&!isNaN(_whipV)){_rpts+=_whipV<1.10?4:_whipV<1.25?3:_whipV<1.40?2:1;}const _rInfo=(ps&&!isNaN(_eraV)&&!isNaN(_whipV))?(_rpts>=7?{l:'Great',c:'rating-great',e:'⭐'}:_rpts>=5?{l:'Good',c:'rating-good',e:'✅'}:_rpts>=3?{l:'Fair',c:'rating-fair',e:'⚡'}:{l:'Below Avg',c:'rating-below',e:'⚠️'}):null;const _rHTML=_rInfo?`<div class="pitch-rating-row"><span class="pitch-rating ${_rInfo.c}">${_rInfo.e} ${_rInfo.l}</span></div>`:'';const formDots=form?form.slice(0,5).map(g=>`<div class="form-dot ${g.result}">${g.result}</div>`).join(''):'';return`<div class="pitch-card"><div class="pitch-side">${side==='away'?'Away':'Home'} Starter</div><div class="pitch-top"><img class="pitch-logo" src="${LOGO(teamId)}" onerror="this.style.display='none'"><div><div class="pitch-name">${name}</div><div class="pitch-team">${team?.team?.name||''}</div></div></div>${_rHTML}<div class="pitch-stats"><div class="ps"><div class="ps-val ${ec(era)}">${era}</div><div class="ps-lbl">ERA</div></div><div class="ps"><div class="ps-val ${ec(whip)}">${whip}</div><div class="ps-lbl">WHIP</div></div><div class="ps"><div class="ps-val">${so}</div><div class="ps-lbl">K</div></div><div class="ps"><div class="ps-val">${wins}-${losses}</div><div class="ps-lbl">W-L</div></div><div class="ps"><div class="ps-val">${ip}</div><div class="ps-lbl">IP</div></div><div class="ps"><div class="ps-val">${hr9}</div><div class="ps-lbl">HR/9</div></div></div>${bpEra!=null?`<div style="margin-to function switchTab(tab){S.lineupTab=tab;document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));const wrap=$('lineupWrap');if(wrap){const game=S.games.find(g=>g.gamePk===S.selPk);if(game)go(()=>renderLineupTable(game,wrap));}}

async function renderMatchup(game){const aw=game.teams?.away,hw=game.teams?.home;const awId=aw?.team?.id,hwId=hw?.team?.id;const awA=aw?.team?.abbreviation||'?',hwA=hw?.team?.abbreviation||'?';$('matchupEl').innerHTML=`<div class="lineup-wrap"><div class="lineup-header"><div style="display:flex;align-items:center;gap:8px"><span class="lineup-title">⚾ Lineup Matchups</span>${S.awayLineup.length||S.homeLineup.length?'<span class="confirmed-badge">✓ Confirmed</span>':''}</div><div class="tab-row"><button class="tab-btn ${S.lineupTab==='away'?'active':''}" data-tab="away" onclick="switchTab('away')"><img class="tab-logo" src="${LOGO(awId)}" onerror="this.style.display='none'">${awA}</button><button class="tab-btn ${S.lineupTab==='home'?'active':''}" data-tab="home" onclick="switchTab('home')"><img class="tab-logo" src="${LOGO(hwId)}" onerror="this.style.display='none'">${hwA}</button></div></div><div id="lineupWrap"></div></div>`;const[awR,hwR]=await Promise.all([api(`${MLB}/teams/${awId}/roster?rosterType=active&season=${YR}&hydrate=person(stats(type=season,group=hitting,gameType=R,season=${YR}))`),api(`${MLB}/teams/${hwId}/roster?rosterType=active&season=${YR}&hydrate=person(stats(type=season,group=hitting,gameType=R,season=${YR}))`)]);S.awayRoster=awR?.roster||[];S.homeRoster=hwR?.roster||[];go(()=>renderLineupTable(game,$('lineupWrap')));go(()=>renderProps(game));}

function renderLineupTable(game,wrap){if(!wrap)return;const side=S.lineupTab;const roster=side==='away'?S.awayRoster:S.homeRoster;const oppPS=side==='away'?S.homePS:S.awayPS;const oppPitch=side==='away'?game.teams?.home?.probablePitcher:game.teams?.away?.probablePitcher;const confirmed=side==='away'?S.awayLineup:S.homeLineup;const ofPos=new Set(['LF','CF','RF','OF','LF-CF','CF-RF','LF-RF','1B-OF']);
const getOPS=p=>parseFloat(p.person?.stats?.[0]?.splits?.[0]?.stat?.ops)||0;
const nonPit=[...roster].filter(p=>p.position?.type!=='Pitcher'&&p.position?.abbreviation!=='P'&&p.position?.type!=='Two-Way Player');
const buildLineup=()=>{
  const ifPri={C:1,'1B':2,'2B':3,'3B':4,SS:5,DH:6,'2B-SS':3,'3B-SS':4,'1B-3B':2,IF:4,UT:6};
  const ifers=nonPit.filter(p=>!ofPos.has(p.position?.abbreviation));

  // Deduplicate infield slots — keep best OPS per position

};
const players=confirmed.length?confirmed.map(p=>roster.find(r=>r.person?.id===p.id)||{person:{id:p.id,fullName:p.fullName||p.person?.fullName||'?'}}).slice(0,9):buildLineup();const parkMult=(S.parkFactor?.hr||100)/100;const wBoost=weatherHRBoost(S.weather),wMult=1+(wBoost/100);const rows=players.map((p,i)=>{const st=p.person?.stats?.[0]?.splits?.[0]?.stat||{};const name=p.person?.fullName||'Unknown',pos=p.position?.abbreviation||'',pid=p.person?.id;const ab=parseInt(st.atBats)||0,hrN=parseInt(st.homeRuns)||0;const slgN=parseFloat(st.slugging)||.380,obpN=parseFloat(st.obp)||.320;const avgN=parseFloat(st.avg)||.240,kN=parseInt(st.strikeOuts)||0;const gN=parseInt(st.gamesPlayed)||1,rbiN=parseInt(st.rbi)||0;const pHR9=parseFloat(oppPS?.homeRunsPer9)||1.2;const hrRate=ab>0?hrN/ab:Math.max(.01,(slgN-.28)*.12);const hrP=Math.round(Math.min(28,Math.max(1,hrRate*(pHR9/1.2)*(slgN/.420)*100*parkMult*wMult)));const rbiP=Math.round(Math.min(95,(rbiN/gN||.5)*(1+obpN)*.85*100));const hitP=Math.round(Math.min(75,Math.max(5,avgN*100*(slgN/.420)*.85)));const kP=Math.round(Math.min(50,(ab>0?kN/ab:.22)*100));const hrC=hrP>=15?'hot':hrP>=8?'warm':'cold';const ph=oppPitch?.pitchHand?.code||'R',bh=p.person?.batSide?.code||'R';const platoon=(ph==='L'&&bh==='R')||(ph==='R'&&bh==='L');const inj=S.injuries[pid];return`<tr><td class="order-num stat-cell">${i+1}</td><td><span class="batter-name">${name}</span><span class="batter-pos">${pos}</span><span class="split-badge ${platoon?'split-good':'split-bad'}">${platoon?'Adv':'Dis'}</span>${inj?`<span class="inj-badge">⚠️ ${inj.status}</span>`:''}</td><td class="stat-cell">${avgN.toFixed?avgN.toFixed(3):avgN}</td><td class="stat-cell col-obp">${obpN.toFixed?obpN.toFixed(3):obpN}</td><td class="stat-cell">${hrN}</td><td class="stat-cell"><span class="hr-badge ${hrC}">${hrP}%</span></td><td class="stat-cell col-hitpct">${hitP}%</td><td class="stat-cell col-kpct">${kP}%</td><td class="stat-cell col-rbipct">${rbiP}%</td></tr>`;}).join('');wrap.innerHT // ── Totals Screener ──
async function loadTotalsScreener(){
  const el=$('totalsScreenerEl');if(!el)return;
  const games=S.games.filter(g=>g.status?.abstractGameState!=='Final');
  if(!games.length){el.innerHTML='';return;}
  el.innerHTML='<div class="day-hr-loading"><div class="spinner"></div>Building totals screener…</div>';

  const spIds=[...new Set(games.flatMap(g=>[g.teams?.away?.probablePitcher?.id,g.teams?.home?.probablePitcher?.id].filter(Boolean)))];
  const[spStatsArr,weatherArr]=await Promise.all([
    Promise.all(spIds.map(id=>api(`${MLB}/people/${id}/stats?stats=season&group=pitching&gameType=R&season=${YR}`))),
    Promise.all(games.map(g=>fetchWeather(g)))
  ]);
  const spMap={};
  spIds.forEach((id,i)=>{const s=spStatsArr[i]?.stats?.[0]?.splits?.[0]?.stat;if(s)spMap[id]=s;});

  const scored=games.map((g,gi)=>{
    const weather=weatherArr[gi];
    const park=PARK_FACTORS[g.venue?.id]||{hr:100,run:100,name:g.venue?.name||'Unknown'};
    const indoor=park.indoor||weather?.indoor||false;
    const awSP=spMap[g.teams?.away?.probablePitcher?.id]||null;
    const hwSP=spMap[g.teams?.home?.probablePitcher?.id]||null;
    const awERA=parseFloat(awSP?.era)||4.30,hwERA=parseFloat(hwSP?.era)||4.30;
    const awK9=parseFloat(awSP?.strikeoutsPer9Inn)||8.0,hwK9=parseFloat(hwSP?.strikeoutsPer9Inn)||8.0;
    const awHR9=parseFloat(awSP?.homeRunsPer9)||1.2,hwHR9=parseFloat(hwSP?.homeRunsPer9)||1.2;
    let score=0;
    const factors=[];

    // SP ERA
    [[awERA,'Away',awSP],[hwERA,'Home',hwSP]].forEach(([era,side,sp])=>{
      if(!sp)return;
      if(era>5.5){score+=4;factors.push({l:`${side} SP ERA ${era.toFixed(2)}`,d:'over'});}
      else if(era>4.5){score+=2;factors.push({l:`${side} SP ERA ${era.toFixed(2)}`,d:'over'});}
      else if(era<3.0){score-=3;factors.push({l:`${side} SP ERA ${era.toFixed(2)}`,d:'under'});}
      else if(era<3.75){score-=1;factors.push({l:`${side} SP ERA ${era.toFixed(2)}`,d:'under'});}
    });

    // SP K/9 (strikeouts = fewer balls in play = UNDER lean)
    [[awK9,'Away',awSP],[hwK9,'Home',hwSP]].forEach(([k9,side,sp])=>{
      if(!sp)return;
      if(k9>10.5){score-=3;factors.push({l:`${side} ${k9.toFixed(1)} K/9`,d:'under'});}
      else if(k9>9.0){score-=2;factors.push({l:`${side} ${k9.toFixed(1)} K/9`,d:'under'});}
      else if(k9<6.0){score+=2;factors.push({l:`${side} ${k9.toFixed(1)} K/9`,d:'over'});}
      else if(k9<7.0){score+=1;factors.push({l:`${side} ${k9.toFixed(1)} K/9`,d:'over'});}
    });

    // SP HR/9
    [[awHR9,'Away',awSP],[hwHR9,'Home',hwSP]].forEach(([hr9,side,sp])=>{
      if(!sp)return;
      if(hr9>1.7){score+=2;factors.push({l:`${side} SP ${hr9.toFixed(2)} HR/9`,d:'over'});}
      else if(hr9<0.7){score-=1;factors.push({l:`${side} SP ${hr9.toFixed(2)} HR/9`,d:'under'});}
    });

    // Park factors
    if(park.hr>=110){score+=4;factors.push({l:`HR park ${park.hr}`,d:'over'});}
    else if(park.hr>=106){score+=2;factors.push({l:`HR park ${park.hr}`,d:'over'});}
    else if(park.hr<=88){score-=4;factors.push({l:`Pitcher's park ${park.hr}`,d:'under'});}
    else if(park.hr<=93){score-=2;factors.push({l:`Pitcher's park ${park.hr}`,d:'under'});}
    if(park.run>=105){score+=1;factors.push({l:`Run park ${park.run}`,d:'over'});}
    else if(park.run<=95){score-=1;factors.push({l:`Run park ${park.run}`,d:'under'});}

    // Weather
    if(weather&&!indoor){
      if(weather.temp>88){score+=3;factors.push({l:`${weather.temp}°F heat`,d:'over'});}
      else if(weather.temp>78){score+=1;factors.push({l:`${weather.temp}°F warm`,d:'over'});}
      else if(weather.temp<45){score-=4;factors.push({l:`${weather.temp}°F cold`,d:'under'});}
      else if(weather.temp<57){score-=2;factors.push({l:`${weather.temp}°F cool`,d:'under'});}
      const wBoost=weatherHRBoost(weather);
      if(wBoost>=10){score+=4;factors.push({l:`Wind out ${weather.wind}mph`,d:'over'});}
      else if(wBoost>=4){score+=2;factors.push({l:`Wind out ${weather.wind}mph`,d:'over'});}
      else if(wBoost<=-8){score-=4;factors.push({l:`Wind in ${weather.wind}mph`,d:'under'});}
      else if(wBoost<=-4){score-=2;factors.push({l:`Wind in ${weather.wind}mph`,d:'under'});}
    } else if(indoor){
      factors.push({l:'Dome — weather neutral',d:'neutral'});
    }

    // Day vs night game
    const gameHour=g.gameDate?new Date(g.gameDate).getUTCHours():22;
    const isDayGame=gameHour>=14&&gameHour<=21; // UTC, roughly day game in eastern
    if(isDayGame&&weather&&weather.temp>78&&!indoor){score+=2;factors.push({l:'Day game + heat',d:'over'});}
    else if(!isDayGame&&weather&&weather.temp<60&&!indoor){score-=1;factors.push({l:'Night game + cold',d:'under'});}

    // Lean label
    let lean,leanClass,icon;
    if(score>=6){lean='Strong OVER';leanClass='lean-over-strong';icon='📈';}
    else if(score>=2){lean='Lean OVER';leanClass='lean-over';icon='⬆️';}
    else if(score<=-6){lean='Strong UNDER';leanClass='lean-under-strong';icon='📉';}
    else if(score<=-2){lean='Lean UNDER';leanClass='lean-under';icon='⬇️';}
    else{lean='Toss-Up';leanClass='lean-neutral';icon='⚖️';}

    return{g,score,lean,leanClass,icon,factors,
      awA:g.teams?.away?.team?.abbreviation||'?',hwA:g.teams?.home?.team?.abbreviation||'?',
      t:g.gameDate?new Date(g.gameDate).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'}):'TBD',
      awERA,hwERA,awK9,hwK9,park,weather,indoor};
  });

  scored.sort((a,b)=>Math.abs(b.score)-Math.abs(a.score));
  S.totalsScreener=scored;
  renderTotalsScreener();
}

function renderTotalsScreener(filter='all'){

  const data=S.totalsScreener;if(!data||!data.length){el.innerHTML='';return;}
  let rows=data;
  if(filter==='over')rows=data.filter(d=>d.score>=2);
  else if(filter==='under')rows=data.filter(d=>d.score<=-2);
  else if(filter==='tossup')rows=data.filter(d=>d.score>-2&&d.score<2);

  const rowsHTML=rows.map(d=>{
    const topF=d.factors.slice(0,4);
    const fHTML=topF.map(f=>`<span class="ts-factor ts-factor-${f.d}">${f.l}</span>`).join('');
    const scoreVal=d.score>0?`+${d.score}`:d.score;

  <div class="ts-factors">${fHTML}</div>
  <div style="display:flex;align-items:center;gap:6px">
    <div class="ts-score-pill ${scoreClass}">${scoreVal}</div>
    <div class="ts-lean ${d.leanClass}">${d.icon} ${d.lean}</div>
  </div>
</div>`;
  }).join('');

  const filterBtns=['all','over','under','tossup'].map(f=>`<button class="ts-filter-btn${filter===f?' active':''}" onclick="renderTotalsScreener('${f}')">${f==='all'?'All Games':f==='over'?'⬆️ Overs':f==='under'?'⬇️ Unders':'⚖️ Toss-Ups'}</button>`).join('');

  el.innerHTML=`<div class="ts-card">
  <div class="prob-title">📊 Totals Screener — ${data.length} Games Today</div>
  <div style="font-size:11px;color:var(--text3);margin-bottom:10px">Ranked by over/under lean · click any game to view full analysis</div>
  <div class="ts-filters">${filterBtns}</div>
  <div class="ts-list">${rowsHTML||'<div style="font-size:12px;color:var(--text3);padding:10px 0">No games match this filter</div>'}</div>
</div>`;}

// ── Day Best HR Pick (Top 5) ──
async function loadDayBestHR(){
  const el=$('dayBestHREl');if(!el)return;
  const games=S.games.filter(g=>g.status?.abstractGameState!=='Final');
  if(!games.length){el.innerHTML='';return;}
  el.innerHTML='<div class="day-hr-loading"><div class="spinner"></div>Finding today\'s top HR candidates…</div>';

  // Collect all SP ids
  const spIds=[...new Set(games.flatMap(g=>[
    g.teams?.away?.probablePitcher?.id,
    g.teams?.home?.probablePitcher?.id
  ].filter(Boolean)))];

  // Fetch all SP stats in parallel
  const spStats=await Promise.all(spIds.map(id=>api(`${MLB}/people/${id}/stats?stats=season&group=pitching&gameType=R&season=${YR}`)));
  const spMap={};
  spIds.forEach((id,i)=>{const s=spStats[i]?.stats?.[0]?.splits?.[0]?.stat;if(s)spMap[id]=s;});

  // Score EVERY team's batting matchup, keep top 5 unique teams
  const matchups=[];
  games.forEach(g=>{
    const park=(PARK_FACTORS[g.venue?.id]?.hr||100)/100;
    [{side:'away',spId:g.teams?.home?.probablePitcher?.id,battingTeam:g.teams?.away,oppSP:g.teams?.home?.probablePitcher},{side:'home',spId:g.teams?.away?.probablePitcher?.id,battingTeam:g.teams?.home,oppSP:g.teams?.away?.probablePitcher}]
    .forEach(({side,spId,battingTeam,oppSP})=>{
      const sp=spMap[spId];if(!sp||!battingTeam?.team?.id)return;
      const era=parseFloat(sp.era)||4.30;
      const hr9=parseFloat(sp.homeRunsPer9)||1.2;
      const score=(era/4.30)*(hr9/1.2)*park;
      matchups.push({score,game:g,battingTeamId:battingTeam.team.id,battingTeamAbbr:battingTeam.team.abbreviation,battingTeamName:battingTeam.team.name,sp,spName:oppSP?.fullName||'',oppAbbr:side==='away'?g.teams?.home?.team?.abbreviation:g.teams?.away?.team?.abbreviation,spHand:oppSP?.pitchHand?.code||'R'});
    });
  });

  matchups.sort((a,b)=>b.score-a.score);

  // Keep top 5 unique batting teams
  const seen=new Set();
  const top5matchups=[];
  for(const m of matchups){
    if(!seen.has(m.battingTeamId)){seen.add(m.battingTeamId);top5matchups.push(m);}
    if(top5matchups.length>=5)break;
  }
  if(!top5matchups.length){el.innerHTML='';return;}

  // Fetch all rosters in parallel
  const rosterDatas=await Promise.all(top5matchups.map(m=>api(`${MLB}/teams/${m.battingTeamId}/roster?rosterType=active&season=${YR}&hydrate=person(stats(type=season,group=hitting,gameType=R,season=${YR}))`)));

  // Score every hitter across all teams, combine into global list
  const allPicks=[];
  top5matchups.forEach((m,i)=>{
    const roster=rosterDatas[i]?.roster||[];
    const parkMult=(PARK_FACTORS[m.game.venue?.id]?.hr||100)/100;
    const pHR9=parseFloat(m.sp.homeRunsPer9)||1.2;
    roster
      .filter(p=>p.position?.type!=='Pitcher'&&p.position?.abbreviation!=='P')
      .forEach(p=>{
        const st=p.person?.stats?.[0]?.splits?.[0]?.stat||{};
        const ab=parseInt(st.atBats)||0;if(ab<8)return;
        const hrN=parseInt(st.homeRuns)||0;
        const slg=parseFloat(st.slugging)||.380,ops=parseFloat(st.ops)||.720;
        const avg=parseFloat(st.avg)||.240;
        const hr_rate=ab>20?hrN/ab:Math.max(.01,(slg-.28)*.12);
        const hrP=Math.min(30,Math.max(1,hr_rate*(pHR9/1.2)*(slg/.420)*100*parkMult));
        const pa=parseInt(st.plateAppearances)||ab;
        const iso=Math.max(0,slg-avg);
        const xbh=(parseInt(st.doubles)||0)+(parseInt(st.triples)||0)+hrN;
        const kPct=pa>0?(parseInt(st.strikeOuts)||0)/pa:0.22;
        const bbPct=pa>0?(parseInt(st.baseOnBalls)||0)/pa:0.09;
        const batSide=p.person?.batSide?.code||'R';
        const spHand=m.spHand||'R';
        const platoon=(spHand==='L'&&batSide==='R')||(spHand==='R'&&batSide==='L');
        allPicks.push({...p,hrP,hrN,slg,ops,avg,ab,st,pa,iso,xbh,kPct,bbPct,batSide,spHand,platoon,_matchup:m});
      });
  });

  allPicks.sort((a,b)=>b.hrP-a.hrP);

  // Deduplicate by player id (same player could theoretically appear once)
  const seenP=new Set();
  const picks=[];
  for(const p of allPicks){
    const pid=p.person?.id;
    if(!seenP.has(pid)){seenP.add(pid);picks.push(p);}
    if(picks.length>=5)break;
  }

  if(!picks.length){el.innerHTML='';return;}
  S.dayBestHR=picks;
  renderDayBestHR();
}

function buildHRTags(p,m){
  const tags=[];
  const bh=p.batSide||'R';
  tags.push({l:bh==='L'?'LHB':bh==='S'?'SWB':'RHB',c:'tag-neutral'});
  if(p.platoon)tags.push({l:'PLATOON ✓',c:'tag-platoon'});
  else tags.push({l:'PLATOON ✗',c:'tag-noplat'});
  const iso=p.iso||0;
  if(iso>=0.230)tags.push({l:'ELITE POWER',c:'tag-power'});
  else if(iso>=0.170)tags.push({l:'POWER BAT',c:'tag-power'});
  else if(iso>=0.110)tags.push({l:'GAP HITTER',c:'tag-matchup'});
  const spERA=parseFloat(m.sp.era)||4.30;
  const spHR9=parseFloat(m.sp.homeRunsPer9)||1.2;
  if(spERA>5.0||spHR9>1.6)tags.push({l:'SOFT SP',c:'tag-matchup'});
  else if(spERA<3.0)tags.push({l:'TOUGH SP',c:'tag-noplat'});
  const parkHR=PARK_FACTORS[m.game.venue?.id]?.hr||100;
  if(parkHR>=108)tags.push({l:"HITTER'S PARK",c:'tag-park'});
  else if(parkHR<=88)tags.push({l:"PITCHER'S PARK",c:'tag-neutral'});
  return tags.map(t=>`<span class="hr-cand-tag ${t.c}">${t.l}</span>`).join('');
}

function hrBestLook(p,m){
  const iso=p.iso||0,hrP=p.hrP||0,platoon=p.platoon;
  if(hrP>=18&&platoon&&iso>=0.200)return'HR + ALT';
  if(hrP>=16&&iso>=0.200)return'HOME RUN';
  if(hrP>=12&&platoon)return'HR';
  if(iso>=0.180&&hrP>=10)return'HR + XBH';
  return'OVER 0.5 HR';
}

function generateHRAnalysis(p,m){
  const lastName=(p.person?.fullName||'Player').split(' ').slice(-1)[0];
  const spName=m.spName||(m.oppAbbr+' SP');
  const spERA=parseFloat(m.sp.era)||4.30;
  const spHR9=parseFloat(m.sp.homeRunsPer9)||1.2;
  const spHand=m.spHand||'R';
  const batHand=p.batSide||'R';
  const iso=p.iso||0;
  const parkHR=PARK_FACTORS[m.game.venue?.id]?.hr||100;
  const parkName=PARK_FACTORS[m.game.venue?.id]?.name||'this venue';
  const lines=[];
  lines.push(`${lastName} draws a matchup against ${spName} (${spERA.toFixed(2)} ERA), a ${spHand==='L'?'left-handed':'right-handed'} arm.`);
  if(p.platoon)lines.push(`The platoon split favors ${lastName} — ${batHand==='R'?'right':'left'}-handed bats have historically hit ${spHand==='L'?'lefties':'righties'} at a higher clip.`);
  if(spHR9>1.5)lines.push(`${spName} has been HR-prone this season at ${spHR9.toFixed(2)} HR/9 — a profile that plays right into ${lastName}'s power upside.`);
  else if(spERA>4.8)lines.push(`With a ${spERA.toFixed(2)} ERA, ${spName} has struggled to suppress hitters consistently.`);
  if(iso>=0.230)lines.push(`${lastName} boasts elite raw power — a ${iso.toFixed(3)} ISO puts him among the premier HR threats on today's slate.`);
  else if(iso>=0.160)lines.push(`${lastName} has shown solid pop this season with a ${iso.toFixed(3)} ISO.`);
  if(p.xbh>0)lines.push(`He's accumulated ${p.xbh} XBH in ${p.ab} at-bats, reflecting consistent contact quality.`);
  if(parkHR>=108)lines.push(`${parkName} is one of the most HR-friendly parks in baseball (factor: ${parkHR}), amplifying the ceiling here.`);
  else if(parkHR<=88)lines.push(`One caveat: ${parkName} suppresses home runs (factor: ${parkHR}), which tempers the ceiling slightly.`);
  return lines.join(' ');
}

// ── Series Context + Bullpen + Umpire loader ──
async function loadSeriesAndBullpen(game){
  const awId=game.teams?.away?.team?.id;
  const hwId=game.teams?.home?.team?.id;
  const pk=game.gamePk;
  const yest=daysAgo(1);

  // Parallel: yesterday's games, boxscore (for officials), recent team schedules
  const[yestData,boxData,awRecent,hwRecent]=await Promise.all([
    api(`${MLB}/schedule?sportId=1&teamId=${awId}&startDate=${yest}&endDate=${yest}&hydrate=linescore`),
    api(`${MLB}/game/${pk}/boxscore`),
    api(`${MLB}/schedule?sportId=1&teamId=${awId}&startDate=${daysAgo(4)}&endDate=${daysAgo(1)}`),
    api(`${MLB}/schedule?sportId=1&teamId=${hwId}&startDate=${daysAgo(4)}&endDate=${daysAgo(1)}`),
  ]);

  // ── Series & yesterday ──
  const gameNum=game.seriesGameNumber||1;
  const totalGames=game.gamesInSeries||3;
  let yesterdayGame=null;
  for(const d of yestData?.dates||[]){
    for(const g of d.games||[]){
      const ids=[g.teams?.away?.team?.id,g.teams?.home?.team?.id];
      if(ids.includes(awId)&&ids.includes(hwId)&&g.status?.abstractGameState==='Final'){yesterdayGame=g;break;}
    }
  }
  go(()=>renderSeries(game,gameNum,totalGames,yesterdayGame));

  // ── Umpire ──
  const officials=boxData?.officials||[];
  const plateUmp=officials.find(o=>o.officialType==='Home Plate');
  const umpName=plateUmp?.official?.fullName||null;
  S.plateUmpire=umpName?(UMPIRES[umpName]?{...UMPIRES[umpName],name:umpName}:{name:umpName,runFactor:0,zone:'Normal',note:'No historical data'}):null;
  go(()=>renderUmpire());

  // ── Bullpen ──
  const getPks=sched=>{
    const pks=[];
    for(const d of sched?.dates||[])
      for(const g of d.games||[])
        if(g.status?.abstractGameState==='Final')pks.push(g.gamePk);
    return pks.slice(-2);
  };
  const awPks=getPks(awRecent);
  const hwPks=getPks(hwRecent);
  const allUniq=[...new Set([...awPks,...hwPks])];
  if(!allUniq.length){$('bullpenEl').innerHTML='';return;}

  const boxes=await Promise.all(allUniq.map(p=>api(`${MLB}/game/${p}/boxscore`)));

  function buildUsage(teamId,teamPks){
    const usage={};
    teamPks.forEach((pk,pIdx)=>{
      const box=boxes[allUniq.indexOf(pk)];if(!box)return;
      const side=box.teams?.away?.team?.id===teamId?'away':'home';
      const ids=box.teams?.[side]?.pitchers||[];
      const players=box.teams?.[side]?.players||{};
      ids.slice(1).forEach(pid=>{  // skip starter (index 0)
        const p=players[`ID${pid}`];if(!p)return;
        const ip=parseFloat(p.stats?.pitching?.inningsPitched||'0')||0;
        if(ip<0.1)return;
        const rest=teamPks.length-pIdx;
        if(!usage[pid])usage[pid]={name:p.person?.fullName||'?',totalIP:0,appearances:0,minRest:99,era:parseFloat(p.seasonStats?.pitching?.era)||null};
        usage[pid].totalIP+=ip;
        usage[pid].appearances++;
        usage[pid].minRest=Math.min(usage[pid].minRest,rest);
      });
    });
    return Object.values(usage).sort((a,b)=>a.minRest-b.minRest);
  }

  const awUsage=buildUsage(awId,awPks);
  const hwUsage=buildUsage(hwId,hwPks);
  go(()=>renderBullpen(game,awUsage,hwUsage));
}
