<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>MLB Outcome Predictor</title>
<style>
:root{
  --bg:#0a0e1a;--surface:#111827;--surface2:#1a2236;--surface3:#1f2d45;
  --border:#2a3a55;--accent:#e8192c;--accent2:#0066cc;--gold:#f0a500;
  --text:#e8edf5;--text2:#8fa3be;--text3:#5a7099;
  --green:#22c55e;--red:#ef4444;--blue:#3b82f6;--purple:#a855f7;
  --orange:#f97316;--teal:#14b8a6;
  --radius:12px;--sidebar-w:300px;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh;display:flex;flex-direction:column;}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* HEADER */
.header{background:linear-gradient(135deg,#0a0e1a,#0d1829);border-bottom:2px solid var(--accent);padding:12px 16px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:200;box-shadow:0 4px 30px rgba(232,25,44,.15);}
.icon-btn{width:40px;height:40px;border:1px solid var(--border);border-radius:8px;background:var(--surface2);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:18px;transition:all .2s;color:var(--text);}
.icon-btn:hover{border-color:var(--accent);background:var(--surface3);}
.hamburger{flex-direction:column;gap:5px;}
.hamburger span{display:block;width:18px;height:2px;background:var(--text);border-radius:1px;transition:all .3s;}
.hamburger.open span:nth-child(1){transform:rotate(45deg) translate(5px,5px);}
.hamburger.open span:nth-child(2){opacity:0;}
.hamburger.open span:nth-child(3){transform:rotate(-45deg) translate(5px,-5px);}
.logo{display:flex;align-items:center;gap:10px;}
.logo-badge{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,var(--accent),#c0001f);display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:900;color:#fff;box-shadow:0 0 18px rgba(232,25,44,.4);flex-shrink:0;}
.app-title{font-size:18px;font-weight:800;}
.app-title span{color:var(--accent);}
.app-sub{font-size:9px;color:var(--text3);text-transform:uppercase;letter-spacing:1.5px;}
.header-right{display:flex;gap:8px;align-items:center;margin-left:auto;flex-wrap:wrap;}
.ctrl{display:flex;flex-direction:column;}
.ctrl-lbl{font-size:9px;color:var(--text3);text-transform:uppercase;letter-spacing:1px;margin-bottom:2px;}
select,input[type=date]{background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:7px 10px;border-radius:8px;font-size:13px;cursor:pointer;outline:none;appearance:none;-webkit-appearance:none;}
select:focus,input[type=date]:focus{border-color:var(--accent2);}
select option{background:var(--surface2);}
.btn{padding:7px 14px;border:none;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600;display:flex;align-items:center;gap:5px;white-space:nowrap;}
.btn-primary{background:var(--accent);color:#fff;}
.btn-primary:hover{background:#c0001f;}

/* Mobile filter drawer */
.filter-drawer{display:none;}

/* BODY LAYOUT */
.body-wrap{display:flex;flex:1;min-height:0;}
.backdrop{display:none;position:fixed;inset:0;z-index:250;background:rgba(0,0,0,.55);backdrop-filter:blur(3px);}
.backdrop.on{display:block;}

/* SIDEBAR */
.sidebar{width:var(--sidebar-w);background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;overflow-y:auto;transition:transform .3s;}
.sidebar-head{padding:16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.sidebar-title{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--text2);}
.acc-section{border-bottom:1px solid var(--border);}
.acc-btn{width:100%;padding:13px 16px;background:none;border:none;color:var(--text);cursor:pointer;display:flex;align-items:center;justify-content:space-between;font-size:13px;font-weight:600;text-align:left;transition:background .2s;}
.acc-btn:hover{background:var(--surface2);}
.acc-btn .acc-icon{font-size:16px;transition:transform .3s;}
.acc-btn.open .acc-icon{transform:rotate(180deg);}
.acc-body{display:none;padding:8px 12px 12px;}
.acc-body.open{display:block;}
.leader-card{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin-bottom:8px;transition:border-color .2s;cursor:default;animation:fadeIn .3s ease;}
.leader-card:hover{border-color:var(--accent2);}
.lc-top{display:flex;align-items:center;gap:8px;margin-bottom:6px;}
.lc-rank{width:22px;height:22px;border-radius:50%;background:var(--surface3);font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;color:var(--text2);flex-shrink:0;}
.lc-rank.gold{background:var(--gold);color:#000;}
.lc-rank.silver{background:#9ca3af;color:#000;}
.lc-rank.bronze{background:#cd7f32;color:#000;}
.lc-name{font-size:13px;font-weight:700;flex:1;}
.lc-team{font-size:10px;color:var(--text3);}
.lc-stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px;}
.lc-stat{background:var(--surface3);border-radius:6px;padding:4px 6px;text-align:center;}
.lc-stat-val{font-size:13px;font-weight:700;color:var(--accent);}
.lc-stat-lbl{font-size:9px;color:var(--text3);text-transform:uppercase;}
.lc-today{display:inline-flex;align-items:center;gap:4px;font-size:9px;color:var(--green);background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.3);border-radius:4px;padding:2px 6px;margin-top:6px;}
.lc-proj{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-top:6px;}
.lc-proj-item{background:rgba(232,25,44,.08);border:1px solid rgba(232,25,44,.2);border-radius:6px;padding:4px 8px;text-align:center;}
.lc-proj-val{font-size:12px;font-weight:700;color:var(--accent);}
.lc-proj-lbl{font-size:9px;color:var(--text3);}

/* MAIN */
.main{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:16px;}

/* GAME GRID */
.game-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;}
.game-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;cursor:pointer;transition:all .2s;position:relative;overflow:hidden;}
.game-card::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,transparent,rgba(232,25,44,.04));opacity:0;transition:opacity .2s;}
.game-card:hover::before{opacity:1;}
.game-card:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:0 8px 30px rgba(232,25,44,.15);}
.game-card.active{border-color:var(--accent);background:var(--surface2);}
.gc-time{font-size:11px;color:var(--text3);margin-bottom:8px;display:flex;align-items:center;gap:6px;}
.gc-live{color:var(--green);font-weight:700;animation:pulse 1.5s infinite;}
.gc-teams{display:flex;flex-direction:column;gap:6px;}
.gc-team{display:flex;align-items:center;justify-content:space-between;gap:8px;}
.gc-abbr{font-size:14px;font-weight:800;width:36px;}
.gc-name{font-size:12px;color:var(--text2);flex:1;}
.gc-rec{font-size:11px;color:var(--text3);}
.gc-score{font-size:16px;font-weight:800;}
.gc-vs{text-align:center;font-size:10px;color:var(--text3);padding:2px 0;}
.gc-wp-bar{margin-top:10px;height:4px;background:var(--surface3);border-radius:2px;overflow:hidden;}
.gc-wp-fill{height:100%;background:linear-gradient(90deg,var(--accent2),var(--accent));border-radius:2px;transition:width .6s;}
.gc-wp-labels{display:flex;justify-content:space-between;font-size:10px;color:var(--text3);margin-top:4px;}
.no-games{text-align:center;padding:60px 20px;color:var(--text3);}
.no-games .icon{font-size:48px;margin-bottom:12px;}

/* STATUS */
.status-bar{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);padding:12px 16px;display:flex;align-items:center;gap:10px;font-size:13px;color:var(--text2);}
.spinner{width:18px;height:18px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin 0.8s linear infinite;flex-shrink:0;}

/* DETAIL PANEL */
.detail{display:none;}
.detail.on{display:flex;flex-direction:column;gap:16px;animation:fadeIn .4s ease;}

/* HERO */
.hero{background:linear-gradient(135deg,var(--surface),var(--surface2));border:1px solid var(--border);border-radius:var(--radius);padding:20px;position:relative;overflow:hidden;}
.hero::after{content:'⚾';position:absolute;right:-10px;top:-10px;font-size:80px;opacity:.05;}
.hero-teams{display:flex;align-items:center;justify-content:center;gap:20px;margin-bottom:16px;}
.hero-team{text-align:center;flex:1;}
.hero-abbr{font-size:32px;font-weight:900;}
.hero-name{font-size:12px;color:var(--text2);margin-top:4px;}
.hero-rec{font-size:11px;color:var(--text3);}
.hero-vs{font-size:18px;color:var(--text3);font-weight:300;}
.hero-meta{display:flex;justify-content:center;gap:16px;flex-wrap:wrap;}
.hero-badge{background:var(--surface3);border:1px solid var(--border);border-radius:8px;padding:6px 12px;font-size:11px;color:var(--text2);display:flex;align-items:center;gap:5px;}
.hero-badge.weather{border-color:rgba(59,130,246,.3);background:rgba(59,130,246,.08);}
.hero-badge.park{border-color:rgba(168,85,247,.3);background:rgba(168,85,247,.08);}
.hero-badge.wind{border-color:rgba(20,184,166,.3);background:rgba(20,184,166,.08);}

/* CONTEXT STRIP - weather/park/form */
.context-strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;}
.ctx-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px 14px;}
.ctx-title{font-size:9px;text-transform:uppercase;letter-spacing:1px;color:var(--text3);margin-bottom:8px;}
.ctx-main{font-size:18px;font-weight:700;}
.ctx-sub{font-size:11px;color:var(--text2);margin-top:2px;}
.ctx-detail{font-size:10px;color:var(--text3);margin-top:4px;}
.form-dots{display:flex;gap:4px;margin-top:6px;flex-wrap:wrap;}
.form-dot{width:16px;height:16px;border-radius:50%;font-size:9px;font-weight:700;display:flex;align-items:center;justify-content:center;}
.form-dot.W{background:rgba(34,197,94,.2);border:1px solid var(--green);color:var(--green);}
.form-dot.L{background:rgba(239,68,68,.2);border:1px solid var(--red);color:var(--red);}
.park-factor{display:flex;align-items:center;gap:8px;margin-top:6px;}
.pf-bar{flex:1;height:6px;background:var(--surface3);border-radius:3px;overflow:hidden;}
.pf-fill{height:100%;border-radius:3px;transition:width .6s;}
.pf-label{font-size:10px;font-weight:700;width:32px;text-align:right;}

/* WIN PROB */
.prob-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;}
.prob-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--text2);margin-bottom:12px;}
.prob-bar-wrap{background:var(--surface2);border-radius:8px;overflow:hidden;height:28px;display:flex;margin-bottom:8px;}
.prob-away{height:100%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff;transition:width .8s cubic-bezier(.4,0,.2,1);}
.prob-home{height:100%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff;background:var(--accent2);transition:width .8s cubic-bezier(.4,0,.2,1);}
.prob-labels{display:flex;justify-content:space-between;font-size:12px;color:var(--text2);}
.prob-factors{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-top:12px;}
.pf-item{background:var(--surface2);border-radius:8px;padding:8px 10px;}
.pf-item-lbl{font-size:9px;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px;}
.pf-item-val{font-size:13px;font-weight:700;}

/* PITCHER CARDS */
.pitch-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.pitch-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;}
.pitch-side{font-size:9px;text-transform:uppercase;letter-spacing:1px;color:var(--text3);margin-bottom:6px;}
.pitch-name{font-size:16px;font-weight:800;margin-bottom:8px;}
.pitch-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;}
.ps{background:var(--surface2);border-radius:8px;padding:6px;text-align:center;}
.ps-val{font-size:14px;font-weight:700;}
.ps-lbl{font-size:9px;color:var(--text3);text-transform:uppercase;}
.ps-val.good{color:var(--green);}
.ps-val.bad{color:var(--red);}
.ps-val.avg{color:var(--gold);}
.pitch-form{margin-top:8px;}
.pitch-form-title{font-size:9px;color:var(--text3);text-transform:uppercase;margin-bottom:4px;}
.pitch-recent{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;}
.pr-game{background:var(--surface3);border-radius:6px;padding:4px 6px;text-align:center;}
.pr-game-era{font-size:11px;font-weight:700;}
.pr-game-ip{font-size:9px;color:var(--text3);}

/* LINEUP TABLE */
.lineup-wrap{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;}
.lineup-header{padding:12px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;}
.lineup-title{font-size:14px;font-weight:700;}
.tab-row{display:flex;gap:6px;}
.tab-btn{padding:5px 12px;border-radius:6px;border:1px solid var(--border);background:none;color:var(--text2);font-size:12px;cursor:pointer;transition:all .2s;}
.tab-btn.active{background:var(--accent);border-color:var(--accent);color:#fff;}
.ltable{width:100%;border-collapse:collapse;font-size:12px;}
.ltable th{background:var(--surface2);padding:8px 10px;text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:var(--text3);border-bottom:1px solid var(--border);}
.ltable td{padding:8px 10px;border-bottom:1px solid rgba(42,58,85,.5);}
.ltable tr:last-child td{border-bottom:none;}
.ltable tr:hover td{background:var(--surface2);}
.order-num{color:var(--text3);font-weight:700;width:20px;}
.batter-name{font-weight:600;}
.batter-pos{color:var(--text3);font-size:10px;margin-left:4px;}
.stat-cell{text-align:center;}
.hr-badge{display:inline-flex;align-items:center;justify-content:center;padding:2px 7px;border-radius:10px;font-size:11px;font-weight:700;}
.hr-badge.hot{background:rgba(239,68,68,.15);color:var(--red);border:1px solid rgba(239,68,68,.3);}
.hr-badge.warm{background:rgba(249,115,22,.15);color:var(--orange);border:1px solid rgba(249,115,22,.3);}
.hr-badge.cold{background:rgba(59,130,246,.15);color:var(--blue);border:1px solid rgba(59,130,246,.3);}
.split-badge{font-size:9px;padding:1px 5px;border-radius:4px;font-weight:700;margin-left:4px;}
.split-good{background:rgba(34,197,94,.15);color:var(--green);}
.split-bad{background:rgba(239,68,68,.15);color:var(--red);}
.confirmed-badge{display:inline-flex;align-items:center;gap:3px;font-size:9px;color:var(--green);background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.3);border-radius:4px;padding:2px 6px;margin-left:8px;}

/* ODDS */
.odds-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;}
.odds-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px;text-align:center;}
.odds-label{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px;}
.odds-val{font-size:20px;font-weight:800;}
.odds-sub{font-size:10px;color:var(--text2);margin-top:3px;}

/* RESPONSIVE */
@media(max-width:768px){
  .filter-drawer{display:flex;flex-direction:column;gap:8px;padding:10px 12px;background:var(--surface);border-bottom:1px solid var(--border);}
  .filter-drawer .ctrl{flex-direction:row;align-items:center;gap:8px;}
  .filter-drawer select,.filter-drawer input[type=date]{flex:1;font-size:14px;}
  .filter-drawer .ctrl-lbl{font-size:10px;white-space:nowrap;min-width:40px;}
  .header-right{display:none;}
  .sidebar{position:fixed;top:0;left:0;bottom:0;height:100vh;z-index:300;transform:translateX(-100%);}
  .sidebar.open{transform:translateX(0);}
  .game-grid{grid-template-columns:1fr;}
  .pitch-grid{grid-template-columns:1fr;}
  .ltable .col-obp,.ltable .col-hitpct,.ltable .col-kpct,.ltable .col-rbipct{display:none;}
  .context-strip{grid-template-columns:1fr 1fr;}
  .prob-factors{grid-template-columns:1fr 1fr;}
}
@media(max-width:480px){
  .game-grid{grid-template-columns:1fr;}
  .hero-teams{gap:10px;}
  .hero-abbr{font-size:24px;}
  .ltable .col-rbi{display:none;}
  .context-strip{grid-template-columns:1fr;}
  .odds-grid{grid-template-columns:repeat(2,1fr);}
}
</style>
</head>
<body>

<!-- HEADER -->
<header class="header">
  <button class="icon-btn hamburger" id="menuBtn" onclick="toggleSidebar()" aria-label="Menu">
    <span></span><span></span><span></span>
  </button>
  <div class="logo">
    <div class="logo-badge">⚾</div>
    <div>
      <div class="app-title">MLB <span>Predictor</span></div>
      <div class="app-sub">AI-Powered Outcome Engine</div>
    </div>
  </div>
  <div class="header-right" id="headerRight">
    <div class="ctrl">
      <span class="ctrl-lbl">Date</span>
      <input type="date" id="datePicker" onchange="onDateChange(this.value)">
    </div>
    <div class="ctrl">
      <span class="ctrl-lbl">Game</span>
      <select id="gameSelect" onchange="onGameChange(this.value)">
        <option value="">— Select Game —</option>
      </select>
    </div>
    <button class="btn btn-primary" onclick="loadGames()">🔄 Refresh</button>
  </div>
</header>

<!-- MOBILE FILTER DRAWER -->
<div class="filter-drawer" id="filterDrawer">
  <div class="ctrl">
    <span class="ctrl-lbl">Date</span>
    <input type="date" id="datePickerM" onchange="onDateChange(this.value)">
  </div>
  <div class="ctrl">
    <span class="ctrl-lbl">Game</span>
    <select id="gameSelectM" onchange="onGameChange(this.value)">
      <option value="">— Select Game —</option>
    </select>
  </div>
  <button class="btn btn-primary" onclick="loadGames()" style="align-self:flex-start">🔄 Refresh</button>
</div>

<!-- BACKDROP -->
<div class="backdrop" id="backdrop" onclick="toggleSidebar()"></div>

<div class="body-wrap">

<!-- SIDEBAR -->
<aside class="sidebar" id="sidebar">
  <div class="sidebar-head">
    <span class="sidebar-title">📊 Season Leaders</span>
    <button class="icon-btn" onclick="toggleSidebar()" style="width:30px;height:30px;font-size:14px;">✕</button>
  </div>

  <div class="acc-section">
    <button class="acc-btn open" onclick="toggleAcc(this)">
      <span>💣 Top 5 HR Leaders</span><span class="acc-icon">▼</span>
    </button>
    <div class="acc-body open" id="hrLeaders"><div style="padding:20px;text-align:center;color:var(--text3)">Loading…</div></div>
  </div>

  <div class="acc-section">
    <button class="acc-btn" onclick="toggleAcc(this)">
      <span>🎯 Top 5 Hit Leaders</span><span class="acc-icon">▼</span>
    </button>
    <div class="acc-body" id="hitLeaders"><div style="padding:20px;text-align:center;color:var(--text3)">Loading…</div></div>
  </div>

  <div class="acc-section">
    <button class="acc-btn" onclick="toggleAcc(this)">
      <span>🏃 Top 5 RBI Leaders</span><span class="acc-icon">▼</span>
    </button>
    <div class="acc-body" id="rbiLeaders"><div style="padding:20px;text-align:center;color:var(--text3)">Loading…</div></div>
  </div>
</aside>

<!-- MAIN -->
<main class="main" id="main">
  <div id="statusEl"></div>
  <div class="game-grid" id="gameGrid"></div>
  <div class="detail" id="detail">
    <div id="heroEl"></div>
    <div id="contextEl"></div>
    <div id="probEl"></div>
    <div class="pitch-grid" id="pitchEl"></div>
    <div id="matchupEl"></div>
    <div id="oddsEl"></div>
  </div>
</main>
</div>

<script>
const MLB = 'https://statsapi.mlb.com/api/v1';
const YR = new Date().getFullYear();

// ── PARK FACTORS ─────────────────────────────────────────────
// HR Park Factor: 100 = neutral, >100 = hitter-friendly, <100 = pitcher-friendly
const PARK_FACTORS = {
  108:{name:'Angel Stadium',city:'Anaheim',hr:96,run:97,note:'Pitcher-friendly'},
  117:{name:'Minute Maid Park',city:'Houston',hr:103,run:101,note:'Slightly hitter-friendly'},
  133:{name:'Oakland Coliseum',city:'Oakland',hr:94,run:96,note:'Pitcher-friendly'},

async function loadGames(){
  showStatus('⏳ Loading schedule…');
  const data = await api(`${MLB}/schedule?sportId=1&date=${S.date}&hydrate=team,linescore,probablePitcher`);
  hideStatus();
  S.games = data?.dates?.[0]?.games || [];
  S.todayTeamIds = new Set(S.games.flatMap(g=>[g.teams?.away?.team?.id, g.teams?.home?.team?.id]));
  renderGameGrid();
  populateSelects();
  go(()=>renderLeaderBadges());
}

function renderGameGrid(){
  const grid=$('gameGrid');
  if(!S.games.length){
    grid.innerHTML=`<div class="no-games"><div class="icon">⚾</div><div>No games scheduled for ${S.date}</div></div>`;
    return;
  }
  grid.innerHTML = S.games.map(g=>{
    const aw=g.teams?.away, hw=g.teams?.home;
    const awA=aw?.team?.abbreviation||'?', hwA=hw?.team?.abbreviation||'?';
    const awW=aw?.leagueRecord?.wins||0, awL=aw?.leagueRecord?.losses||0;
    const hwW=hw?.leagueRecord?.wins||0, hwL=hw?.leagueRecord?.losses||0;
    const awS=g.linescore?.teams?.away?.runs??'', hwS=g.linescore?.teams?.home?.runs??'';
    const st=g.status?.abstractGameState||'';
    const t=g.gameDate?new Date(g.gameDate).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'}):'TBD';
    const awWP=awW/(awW+awL)||.5, hwWP=hwW/(hwW+hwL)||.5;
    const hwPct=Math.round((hwWP/(awWP+hwWP))*100);
    const isLive=st==='Live';
    const isActive=g.gamePk===S.selPk;
    return `<div class="game-card${isActive?' active':''}" onclick="onGameChange(${g.gamePk})">
      <div class="gc-time">${isLive?`<span class="gc-live">● LIVE</span>`:'🕐'} ${t}</div>
      <div class="gc-teams">
        <div class="gc-team">
          <span class="gc-abbr">${awA}</span>
          <span class="gc-name">${aw?.team?.name||''}</span>
          <span class="gc-rec">${awW}-${awL}</span>
          ${awS!==''?`<span class="gc-score">${awS}</span>`:''}
        </div>
        <div class="gc-vs">@ </div>
        <div class="gc-team">
          <span class="gc-abbr">${hwA}</span>
          <span class="gc-name">${hw?.team?.name||''}</span>
          <span class="gc-rec">${hwW}-${hwL}</span>
          ${hwS!==''?`<span class="gc-score">${hwS}</span>`:''}
        </div>
      </div>
      <div class="gc-wp-bar"><div class="gc-wp-fill" style="width:${hwPct}%"></div></div>
      <div class="gc-wp-labels"><span>${100-hwPct}% ${awA}</span><span>${hwA} ${hwPct}%</span></div>
    </div>`;
  }).join('');
}

function populateSelects(){
  const opts = ['<option value="">— Select Game —</option>',

      const hw=g.teams?.home?.team?.abbreviation||'?';

// ── SELECT GAME ───────────────────────────────────────────────
async function selectGame(pk){
  S.selPk = pk;
  S.awayPS=null; S.homePS=null;
  S.awayBP=null; S.homeBP=null;
  S.awayForm=null; S.homeForm=null;
  S.weather=null; S.parkFactor=null;
  S.awayLineup=[]; S.homeLineup=[];

  // Update game card highlights
  document.querySelectorAll('.game-card').forEach((c,i)=>{
    c.classList.toggle('active', S.games[i]?.gamePk===pk);
  });
  $('gameSelect').value=pk; $('gameSelectM').value=pk;

  const game = S.games.find(g=>g.gamePk===pk);
  if(!game) return;

  $('detail').classList.add('on');

  // STEP 1: Immediate render from schedule data
  go(()=>renderHero(game, null, null));
  go(()=>renderProb(game));
  $('pitchEl').innerHTML = pitchCard(game,'away',null,null,null) + pitchCard(game,'home',null,null,null);
  go(()=>renderMatchup(game));
  $('contextEl').innerHTML='';
  $('oddsEl').innerHTML='';

  const awId=game.teams?.away?.team?.id;
  const hwId=game.teams?.home?.team?.id;
  const awPitchId=game.teams?.away?.probablePitcher?.id;
  const hwPitchId=game.teams?.home?.probablePitcher?.id;
  const venue=game.venue?.id;

  // Park factor
  S.parkFactor = PARK_FACTORS[venue] || {name:game.venue?.name||'Unknown',hr:100,run:100,note:'Data unavailable'};

  showStatus('⏳ Fetching pitcher stats, weather & lineups…');

  // STEP 2: Parallel fetch everything
  const [liveData, awPS, hwPS, awBPData, hwBPData, awFormData, hwFormData, weatherData, awLineupData, hwLineupData, espnData] = await Promise.all([
    api(`${MLB}/game/${pk}/linescore`),
    awPitchId ? api(`${MLB}/people/${awPitchId}/stats?stats=season&group=pitching&gameType=R&season=${YR}`) : null,
    hwPitchId ? api(`${MLB}/people/${hwPitchId}/stats?stats=season&group=pitching&gameType=R&season=${YR}`) : null,
    // Bullpen: team pitching stats
    api(`${MLB}/teams/${awId}/stats?stats=season&group=pitching&gameType=R&season=${YR}`),
    api(`${MLB}/teams/${hwId}/stats?stats=season&group=pitching&gameType=R&season=${YR}`),
    // Recent form: last 15 games
    api(`${MLB}/schedule?sportId=1&teamId=${awId}&startDate=${daysAgo(20)}&endDate=${S.date}&hydrate=linescore`),
    api(`${MLB}/schedule?sportId=1&teamId=${hwId}&startDate=${daysAgo(20)}&endDate=${S.date}&hydrate=linescore`),
    // Weather via Open-Meteo (free, no key)
    fetchWeather(game),
    // Confirmed lineups
    api(`${MLB}/game/${pk}/lineups`),
    api(`${MLB}/game/${pk}/lineups`),
    // ESPN odds
    api(`https://site.api.espn.com/apis/site/v2/sports/baseball/mlb/scoreboard?dates=${S.date.replace(/-/g,'')}`),
  ]);

  hideStatus();

  // Process pitcher stats
  S.awayPS = awPS?.stats?.[0]?.splits?.[0]?.stat || null;
  S.homePS = hwPS?.stats?.[0]?.splits?.[0]?.stat || null;

  // Process bullpen stats
  S.awayBP = awBPData?.stats?.[0]?.splits?.find(s=>s.position?.code==='P')?.stat ||
             awBPData?.stats?.[0]?.splits?.[0]?.stat || null;
  S.homeBP = hwBPData?.stats?.[0]?.splits?.find(s=>s.position?.code==='P')?.stat ||
             hwBPData?.stats?.[0]?.splits?.[0]?.stat || null;

  // Process recent form (last 10 completed games)
  S.awayForm = extractForm(awFormData, awId);
  S.homeForm = extractForm(hwFormData, hwId);

  // Weather
  S.weather = weatherData;

  // Confirmed lineups
  const awLineup = awLineupData?.homePlayers || awLineupData?.awayPlayers || [];
  const hwLineup = awLineupData?.homePlayers || [];
  if(awLineupData?.awayPlayers?.length) S.awayLineup = awLineupData.awayPlayers;
  if(awLineupData?.homePlayers?.length) S.homeLineup = awLineupData.homePlayers;

  // STEP 3: Re-render with full data
  go(()=>renderHero(game, S.weather, S.parkFactor));
  go(()=>renderContext(game));
  go(()=>renderProb(game));
  $('pitchEl').innerHTML = pitchCard(game,'away',S.awayPS,S.awayBP,S.awayForm) + pitchCard(game,'home',S.homePS,S.homeBP,S.homeForm);
  go(()=>renderMatchup(game));
  go(()=>renderOdds(game, espnData));

  $('detail').scrollIntoView({behavior:'smooth',block:'nearest'});
}

function daysAgo(n){
  const d=new Date(); d.setDate(d.getDate()-n);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function extractForm(data, teamId){
  const games=[];
  const dates=data?.dates||[];
  for(const d of dates){
    for(const g of (d.games||[])){
      if(g.status?.abstractGameState!=='Final') continue;
      const aw=g.teams?.away, hw=g.teams?.home;
      const isAway=aw?.team?.id===teamId;
      const myTeam=isAway?aw:hw;
      const opp=isAway?hw:aw;
      const myR=myTeam?.score??0, oppR=opp?.score??0;
      games.push({result:myR>oppR?'W':'L', myR, oppR, date:d.date});
    }
  }
  return games.slice(-10).reverse(); // most recent first
}

// ── RENDER CONTEXT (weather/park/form strip) ──────────────────
function renderContext(game){
  const aw=game.teams?.away, hw=game.teams?.home;
  const awA=aw?.team?.abbreviation||'?', hwA=hw?.team?.abbreviation||'?';
  const park=S.parkFactor;
  const weather=S.weather;
  const awForm=S.awayForm||[];
  const hwForm=S.homeForm||[];

  // Park factor card
  const pfPct = park ? Math.min(100,Math.max(0,(park.hr-80)/50*100)) : 50;
  const pfColor = park?.hr>110?'var(--red)':park?.hr>100?'var(--orange)':park?.hr<90?'var(--blue)':'var(--gold)';
  const parkCard=`<div class="ctx-card">
    <div class="ctx-title">🏟️ Park Factor</div>
    <div class="ctx-main" style="color:${pfColor}">${park?.hr??'—'}</div>
    <div class="ctx-sub">${park?.name||'Unknown'}</div>
    <div class="ctx-detail">${park?.note||''}</div>
    <div class="park-factor"><div class="pf-bar"><div class="pf-fill" style="width:${pfPct}%;background:${pfColor}"></div></div>
    <span class="pf-label" style="color:${pfColor}">${park?.hr??''}</span></div>
  </div>`;

  // Weather card
  let weatherCard='';
  if(weather){
    const hrBoost = weatherHRBoost(weather, park);
    const boostColor = hrBoost>5?'var(--red)':hrBoost<-5?'var(--blue)':'var(--gold)';
    weatherCard=`<div class="ctx-card">
      <div class="ctx-title">${weather.indoor?'🏟️ Indoor':'🌤️ Weather'}</div>
      <div class="ctx-main">${weather.indoor?'Dome':''+weather.temp+'°F'}</div>
      <div class="ctx-sub">${weather.indoor?'Climate controlled':'Precip: '+weather.precip+'%'}</div>
      <div class="ctx-detail">${weather.indoor?'No weather effect':weather.wind+' mph wind '+windDirLabel(weather.windDir)}</div>
      <div style="margin-top:6px;font-size:10px;color:${boostColor}">HR Boost: ${hrBoost>0?'+':''}${hrBoost}%</div>
    </div>`;
  }

  // Form cards
  function formCard(team, form, label){
    const wins=form.filter(g=>g.result==='W').length;
    const rs=form.reduce((a,g)=>a+g.myR,0);
    const ra=form.reduce((a,g)=>a+g.oppR,0);
    const hot=wins>7?'🔥':wins<4?'🥶':'📈';
    return `<div class="ctx-card">
      <div class="ctx-title">${hot} ${team} — Last ${form.length} Games</div>
      <div class="ctx-main" style="color:${wins>7?'var(--green)':wins<4?'var(--red)':'var(--gold)'}">${wins}-${form.length-wins}</div>
      <div class="ctx-sub">RS: ${rs} · RA: ${ra} · Diff: ${rs-ra>0?'+':''}${rs-ra}</div>
      <div class="form-dots">${form.slice(0,10).map(g=>`<div class="form-dot ${g.result}" title="${g.result} ${g.myR}-${g.oppR}">${g.result}</div>`).join('')}</div>
    </div>`;
  }

  $('contextEl').innerHTML=`<div class="context-strip">${parkCard}${weatherCard}${formCard(awA,awForm,'Away')}${formCard(hwA,hwForm,'Home')}</div>`;
}

function weatherHRBoost(w, park){
  if(w?.indoor) return 0;
  let boost=0;
  // Temperature: warmer = more HRs
  if(w.temp>85) boost+=8;
  else if(w.temp>75) boost+=4;
  else if(w.temp>65) boost+=2;
  else if(w.temp<50) boost-=8;
  else if(w.temp<60) boost-=4;
  // Wind blowing out (roughly N-NE from home plate) = HR boost
  if(w.wind>15){
    const dir=windDirLabel(w.windDir);
    if(['N','NE','E'].includes(dir)) boost+=10;
    else if(['S','SW','W'].includes(dir)) boost-=8;
  } else if(w.wind>8){
    const dir=windDirLabel(w.windDir);
    if(['N','NE','E'].includes(dir)) boost+=4;
    else if(['S','SW','W'].includes(dir)) boost-=4;
  }
  return boost;
}

// ── WIN PROBABILITY ───────────────────────────────────────────
function calcWP(game){
  const aw=game.teams?.away, hw=game.teams?.home;
  const awW=aw?.leagueRecord?.wins||0, awL=aw?.leagueRecord?.losses||0;
  const hwW=hw?.leagueRecord?.wins||0, hwL=hw?.leagueRecord?.losses||0;
  const awWP=awW/(awW+awL)||.5, hwWP=hwW/(hwW+hwL)||.5;

  // Pitcher ERA score
  const awERA=parseFloat(S.awayPS?.era)||4.30;
  const hwERA=parseFloat(S.homePS?.era)||4.30;
  const awEraS=Math.max(0,Math.min(100,(6-awERA)/4*100));
  const hwEraS=Math.max(0,Math.min(100,(6-hwERA)/4*100));

  // WHIP score
  const awWHIP=parseFloat(S.awayPS?.whip)||1.35;
  const hwWHIP=parseFloat(S.homePS?.whip)||1.35;
  const awWhipS=Math.max(0,Math.min(100,(2-awWHIP)/1*100));
  const hwWhipS=Math.max(0,Math.min(100,(2-hwWHIP)/1*100));

  // Bullpen ERA
  const awBPERA=parseFloat(S.awayBP?.era)||4.00;
  const hwBPERA=parseFloat(S.homeBP?.era)||4.00;
  const awBPS=Math.max(0,Math.min(100,(5-awBPERA)/3*100));
  const hwBPS=Math.max(0,Math.min(100,(5-hwBPERA)/3*100));

  // Recent form score
  const awFormW=S.awayForm?S.awayForm.filter(g=>g.result==='W').length:5;
  const hwFormW=S.homeForm?S.homeForm.filter(g=>g.result==='W').length:5;
  const awFormS=(awFormW/(S.awayForm?.length||10))*100;
  const hwFormS=(hwFormW/(S.homeForm?.length||10))*100;

  // Park factor (slight boost to hitter-friendly parks for home team run scoring)
  const pfBoost=S.parkFactor?.run>105?0.03:S.parkFactor?.run<95?-0.02:0;

  // Weather (impacts total runs, not team advantage specifically)
  const wBoost=0; // weather affects totals more than team advantage

  // Composite scores
  const awRD=(aw?.leagueRecord?.wins||0)-(aw?.leagueRecord?.losses||0);
  const hwRD=(hw?.leagueRecord?.wins||0)-(hw?.leagueRecord?.losses||0);
  const awWS=Math.min(10,Math.max(0,(aw?.streak?.streakNumber||0)))*(aw?.streak?.streakCode==='W'?1:-1)+5;
  const hwWS=Math.min(10,Math.max(0,(hw?.streak?.streakNumber||0)))*(hw?.streak?.streakCode==='W'?1:-1)+5;

  const hC = hwWP*.28 + (hwEraS/100)*.18 + (hwWhipS/100)*.10 + (hwBPS/100)*.12 + (hwFormS/100)*.12 + (hwWS/100)*.05 + (hwRD>0?.04:0) + .03 + pfBoost;
  const aC = awWP*.28 + (awEraS/100)*.18 + (awWhipS/100)*.10 + (awBPS/100)*.12 + (awFormS/100)*.12 + (awWS/100)*.05 + (awRD>0?.04:0);
  const tot = hC+aC||1;
  const hwFinal = Math.max(.35,Math.min(.65,.40+(hC/tot-.5)*.50));

  return {
    home: Math.round(hwFinal*100),
    away: Math.round((1-hwFinal)*100),
    awERA, hwERA, awWHIP, hwWHIP, awBPERA, hwBPERA,
    awFormW, hwFormW, awFormLen:S.awayForm?.length||0, hwFormLen:S.homeForm?.length||0
  };
}

      <div class="pf-item"><div class="pf-item-lbl">SP ERA</div><div class="pf-item-val ps-val ${eraColor(wp.awERA)}">${wp.awERA} / <span class="${eraColor(wp.hwERA)}">${wp.hwERA}</span></div></div>
      <div class="pf-item"><div class="pf-item-lbl">SP WHIP</div><div class="pf-item-val">${wp.awWHIP.toFixed?wp.awWHIP.toFixed(2):wp.awWHIP} / ${wp.hwWHIP.toFixed?wp.hwWHIP.toFixed(2):wp.hwWHIP}</div></div>
      <div class="pf-item"><div class="pf-item-lbl">Bullpen ERA</div><div class="pf-item-val ps-val ${eraColor(wp.awBPERA)}">${wp.awBPERA.toFixed?wp.awBPERA.toFixed(2):wp.awBPERA} / <span class="${eraColor(wp.hwBPERA)}">${wp.hwBPERA.toFixed?wp.hwBPERA.toFixed(2):wp.hwBPERA}</span></div></div>
      <div class="pf-item"><div class="pf-item-lbl">Last ${wp.awFormLen||10} Games</div><div class="pf-item-val">${wp.awFormW}-${(wp.awFormLen||10)-wp.awFormW} / ${wp.hwFormW}-${(wp.hwFormLen||10)-wp.hwFormW}</div></div>
      <div class="pf-item"><div class="pf-item-lbl">Park HR Factor</div><div class="pf-item-val" style="color:${S.parkFactor?.hr>105?'var(--red)':S.parkFactor?.hr<95?'var(--blue)':'var(--gold)'}">${S.parkFactor?.hr??'—'}</div></div>
      <div class="pf-item"><div class="pf-item-lbl">Home Field</div><div class="pf-item-val" style="color:var(--green)">+3%</div></div>
    </div>
  </div>`;
}

// ── PITCHER CARDS ─────────────────────────────────────────────
function pitchCard(game, side, ps, bp, form){
  const team=game.teams?.[side];
  const pitcher=team?.probablePitcher;
  const name=pitcher?.fullName||'TBD';
  const abbr=team?.team?.abbreviation||'?';
  const sideLabel=side==='away'?'Away Starter':'Home Starter';

  const era=ps?.era??'—', whip=ps?.whip??'—', so=ps?.strikeOuts??'—';
  const ip=ps?.inningsPitched??'—', wins=ps?.wins??'—', losses=ps?.losses??'—';
  const hr9=ps?.homeRunsPer9??'—', bb9=ps?.walksPer9InningsPitched??'—';
  const bpEra=bp?.era??'—';

  const eraClass=ps?parseFloat(era)<3.5?'good':parseFloat(era)>4.5?'bad':'avg':'';
  const whipClass=ps?parseFloat(whip)<1.2?'good':parseFloat(whip)>1.4?'bad':'avg':'';

  // Recent form mini-games from pitcher game log (simplified — show form dots)
  const formDots = form ? form.slice(0,5).map(g=>`<div class="form-dot ${g.result}">${g.result}</div>`).join('') : '';

  return `<div class="pitch-card">
    <div class="pitch-side">${sideLabel}</div>
    <div class="pitch-name">${name}</div>
    <div class="pitch-stats">
      <div class="ps"><div class="ps-val ${eraClass}">${era}</div><div class="ps-lbl">ERA</div></div>
      <div class="ps"><div class="ps-val ${whipClass}">${whip}</div><div class="ps-lbl">WHIP</div></div>
      <div class="ps"><div class="ps-val">${so}</div><div class="ps-lbl">K</div></div>
      <div class="ps"><div class="ps-val">${wins}-${losses}</div><div class="ps-lbl">W-L</div></div>
      <div class="ps"><div class="ps-val">${ip}</div><div class="ps-lbl">IP</div></div>
      <div class="ps"><div class="ps-val">${hr9}</div><div class="ps-lbl">HR/9</div></div>
    </div>
    ${bpEra!=='—'?`<div style="margin-top:8px;font-size:10px;color:var(--text3)">Team Bullpen ERA: <span style="font-weight:700;color:${parseFloat(bpEra)<3.8?'var(--green)':parseFloat(bpEra)>4.5?'var(--red)':'var(--gold)'}">${typeof bpEra==='number'?bpEra.toFixed(2):bpEra}</span></div>`:''}
    ${formDots?`<div class="pitch-form"><div class="pitch-form-title">Team Recent Form</div><div class="form-dots">${formDots}</div></div>`:''}
  </div>`;
}

// ── LINEUP / MATCHUP TABLE ────────────────────────────────────
function switchTab(tab){
  S.lineupTab=tab;
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));
  const wrap=$('lineupWrap');
  if(wrap){
    const game=S.games.find(g=>g.gamePk===S.selPk);
    if(game) go(()=>renderLineupTable(game, wrap));
  }
}

async function renderMatchup(game){
  const aw=game.teams?.away, hw=game.teams?.home;
  const awA=aw?.team?.abbreviation||'?', hwA=hw?.team?.abbreviation||'?';
  const awId=aw?.team?.id, hwId=hw?.team?.id;
  const awPitch=game.teams?.away?.probablePitcher;
  const hwPitch=game.teams?.home?.probablePitcher;

  $('matchupEl').innerHTML=`<div class="lineup-wrap">
    <div class="lineup-header">
      <div style="display:flex;align-items:center;gap:8px">
        <span class="lineup-title">⚾ Lineup Matchups</span>
        ${S.awayLineup.length||S.homeLineup.length?'<span class="confirmed-badge">✓ Confirmed</span>':''}
      </div>
      <div class="tab-row">
        <button class="tab-btn ${S.lineupTab==='away'?'active':''}" data-tab="away" onclick="switchTab('away')">${awA} (Away)</button>
        <button class="tab-btn ${S.lineupTab==='home'?'active':''}" data-tab="home" onclick="switchTab('home')">${hwA} (Home)</button>
      </div>
    </div>
    <div id="lineupWrap"></div>
  </div>`;

  // Fetch rosters for both teams
  const [awRoster, hwRoster] = await Promise.all([
    api(`${MLB}/teams/${awId}/roster?rosterType=active&season=${YR}&hydrate=person(stats(type=season,group=hitting,gameType=R,season=${YR}))`),
    api(`${MLB}/teams/${hwId}/roster?rosterType=active&season=${YR}&hydrate=person(stats(type=season,group=hitting,gameType=R,season=${YR}))`),
  ]);
  S.awayRoster = awRoster?.roster||[];
  S.homeRoster = hwRoster?.roster||[];

  go(()=>renderLineupTable(game, $('lineupWrap')));
}

function renderLineupTable(game, wrap){
  if(!wrap) return;
  const side=S.lineupTab;
  const roster=side==='away'?S.awayRoster:S.homeRoster;
  const oppPitch=side==='away'?game.teams?.home?.probablePitcher:game.teams?.away?.probablePitcher;
  const oppPS=side==='away'?S.homePS:S.awayPS;
  const confirmedLineup=side==='away'?S.awayLineup:S.homeLineup;

  // Use confirmed lineup order if available, else sort by position
  let players=[];
  if(confirmedLineup.length){
    players=confirmedLineup.map(p=>roster.find(r=>r.person?.id===p.id)||{person:p}).slice(0,9);
  } else {
    const posPriority={C:1,'1B':2,'2B':3,'3B':4,SS:5,LF:6,CF:7,RF:8,DH:9};
    players=[...roster].sort((a,b)=>(posPriority[a.position?.abbreviation]||10)-(posPriority[b.position?.abbreviation]||10)).slice(0,9);
  }

  // Park HR factor multiplier
  const parkMult=(S.parkFactor?.hr||100)/100;
  // Weather HR modifier
  const wBoost=S.weather?weatherHRBoost(S.weather, S.parkFactor):0;
  const wMult=1+(wBoost/100);

  const rows=players.map((p,i)=>{
    const stat=p.person?.stats?.[0]?.splits?.[0]?.stat||{};
    const name=p.person?.fullName||'Unknown';
    const pos=p.position?.abbreviation||'';
    const ab=parseInt(stat.atBats)||0;
    const hrN=parseInt(stat.homeRuns)||0;
    const hitN=parseInt(stat.hits)||0;
    const rbiN=parseInt(stat.rbi)||0;
    const slgN=parseFloat(stat.slugging)||.380;
    const obpN=parseFloat(stat.obp)||.320;
    const avgN=parseFloat(stat.avg)||.240;
    const kN=parseInt(stat.strikeOuts)||0;
    const gN=parseInt(stat.gamesPlayed)||1;

    // HR probability with park + weather adjustments
    const pHR9=parseFloat(oppPS?.homeRunsPer9)||1.2;
    const hrRate=ab>0?hrN/ab:Math.max(.01,(slgN-.28)*.12);
    const hrP=Math.round(Math.min(28,Math.max(1,hrRate*(pHR9/1.2)*(slgN/.420)*100*parkMult*wMult)));

    // RBI probability
    const rbiRate=gN>0?rbiN/gN:.5;
    const rbiP=Math.round(Math.min(95,rbiRate*(1+obpN)*.85*100));

    // Hit probability
    const hitP=Math.round(Math.min(75,Math.max(5,avgN*100*(slgN/.420)*.85)));

    // K probability
    const kRate=ab>0?kN/ab:.22;
    const kP=Math.round(Math.min(50,kRate*100));

    const hrClass=hrP>=15?'hot':hrP>=8?'warm':'cold';

    // vs handedness split (simplified)
    const pitcherHand=oppPitch?.pitchHand?.code||'R';
    const batterHand=p.person?.batSide?.code||'R';
    const platoonAdv = (pitcherHand==='L'&&batterHand==='R')||(pitcherHand==='R'&&batterHand==='L');
    const platoonBadge=platoonAdv?`<span class="split-badge split-good">Adv</span>`:`<span class="split-badge split-bad">Dis</span>`;

    return `<tr>
      <td class="order-num stat-cell">${i+1}</td>
      <td><span class="batter-name">${name}</span><span class="batter-pos">${pos}</span>${platoonBadge}</td>
      <td class="stat-cell">${avgN.toFixed?avgN.toFixed(3):avgN}</td>
      <td class="stat-cell col-obp">${obpN.toFixed?obpN.toFixed(3):obpN}</td>
      <td class="stat-cell">${hrN}</td>
      <td class="stat-cell"><span class="hr-badge ${hrClass}">${hrP}%</span></td>
      <td class="stat-cell col-hitpct">${hitP}%</td>
      <td class="stat-cell col-kpct">${kP}%</td>
      <td class="stat-cell col-rbipct">${rbiP}%</td>
    </tr>`;
  }).join('');

  const pitcherInfo=oppPitch?`vs ${oppPitch.fullName} (${oppPitch.pitchHand?.code==='L'?'LHP':'RHP'})`:' ';
  const hrNote=`<div style="font-size:10px;color:var(--text3);padding:6px 16px;border-top:1px solid var(--border)">
    ⚙️ HR% adjusted for park factor (${S.parkFactor?.hr??'—'}) ${S.weather&&!S.weather.indoor?`+ weather (${wBoost>0?'+':''}${wBoost}%)`:S.weather?.indoor?'(Indoor — no weather effect)':''}
  </div>`;

  wrap.innerHTML=`
    <div style="font-size:11px;color:var(--text3);padding:6px 16px">${pitcherInfo}</div>
    <table class="ltable">
      <thead><tr>
        <th>#</th><th>Batter</th><th>AVG</th>
        <th class="col-obp">OBP</th>
        <th>HR</th><th>HR%</th>
        <th class="col-hitpct">H%</th>
        <th class="col-kpct">K%</th>
        <th class="col-rbipct">RBI%</th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table>${hrNote}`;
}

// ── ODDS ──────────────────────────────────────────────────────
function renderOdds(game, espnData){
  if(!espnData) return;
  const aw=game.teams?.away?.team?.abbreviation||'?';
  const hw=game.teams?.home?.team?.abbreviation||'?';
  try{
    const events=espnData.events||[];
    const match=events.find(e=>{
      const comps=e.competitions?.[0]?.competitors||[];
      return comps.some(c=>c.team?.abbreviation===aw)||comps.some(c=>c.team?.abbreviation===hw);
    });
    const odds=match?.competitions?.[0]?.odds?.[0];
    if(!odds){$('oddsEl').innerHTML='';return;}
    const ml=odds.details||'N/A', ou=odds.overUnder||'N/A';
    const awML=odds.awayTeamOdds?.moneyLine??'—';
    const hwML=odds.homeTeamOdds?.moneyLine??'—';
    $('oddsEl').innerHTML=`<div class="prob-card">
      <div class="prob-title">💰 Vegas Odds</div>
      <div class="odds-grid">
        <div class="odds-card"><div class="odds-label">${aw} Moneyline</div><div class="odds-val" style="color:var(--red)">${awML>0?'+':''}${awML}</div></div>
        <div class="odds-card"><div class="odds-label">${hw} Moneyline</div><div class="odds-val" style="color:var(--accent2)">${hwML>0?'+':''}${hwML}</div></div>
        <div class="odds-card"><div class="odds-label">Over/Under</div><div class="odds-val" style="color:var(--gold)">${ou}</div></div>
        <div class="odds-card"><div class="odds-label">Spread</div><div class="odds-val">${ml}</div></div>
      </div>
    </div>`;
  } catch(e){$('oddsEl').innerHTML='';}
}

// ── LEADERS ───────────────────────────────────────────────────
async function loadLeaders(){
  const base=`${MLB}/stats?stats=season&group=hitting&gameType=R&season=${YR}&playerPool=All&limit=5`;
  const [hrD,hitD,rbiD]=await Promise.all([
    api(`${base}&sortStat=homeRuns`),
    api(`${base}&sortStat=hits`),
    api(`${base}&sortStat=rbi`),
  ]);
  S.leaderData={
    hr: hrD?.stats?.[0]?.splits||[],
    hit: hitD?.stats?.[0]?.splits||[],
    rbi: rbiD?.stats?.[0]?.splits||[]
  };
  renderLeaders();
}

function renderLeaderBadges(){
  renderLeaders();
}

function renderLeaders(){
  const {hr,hit,rbi}=S.leaderData;
  $('hrLeaders').innerHTML = leaderList(hr,'hr','homeRuns','HR','💣');
  $('hitLeaders').innerHTML = leaderList(hit,'hit','hits','H','🎯');
  $('rbiLeaders').innerHTML = leaderList(rbi,'rbi','rbi','RBI','🏃');
}

function leaderList(splits, type, statKey, statLabel, icon){
  if(!splits.length) return '<div style="padding:20px;text-align:center;color:var(--text3)">No data</div>';
  return splits.slice(0,5).map((s,i)=>{
    const p=s.player||{}, st=s.stat||{};
    const teamId=s.team?.id;
    const isPlaying=S.todayTeamIds.has(teamId);
    const rankClass=i===0?'gold':i===1?'silver':i===2?'bronze':'';
    const statVal=st[statKey]??'—';
    const avg=st.avg??'—', ops=st.ops??'—', gp=st.gamesPlayed??'—';

    // Projected today
    const projStat = type==='hr'
      ? `~${(parseFloat(statVal)/(parseInt(gp)||1)*1).toFixed(2)} proj`
      : `~${(parseFloat(statVal)/(parseInt(gp)||1)).toFixed(2)} per G`;

    return `<div class="leader-card">
      <div class="lc-top">
        <div class="lc-rank ${rankClass}">${i+1}</div>
        <div><div class="lc-name">${p.fullName||'—'}</div><div class="lc-team">${s.team?.name||''}</div></div>
      </div>
      <div class="lc-stats">
        <div class="lc-stat"><div class="lc-stat-val">${statVal}</div><div class="lc-stat-lbl">${statLabel}</div></div>
        <div class="lc-stat"><div class="lc-stat-val">${avg}</div><div class="lc-stat-lbl">AVG</div></div>
        <div class="lc-stat"><div class="lc-stat-val">${ops}</div><div class="lc-stat-lbl">OPS</div></div>
      </div>
      ${isPlaying?`<div class="lc-today">⚡ Playing Today <span style="color:var(--text3);margin-left:2px">${projStat}</span></div>`:''}
    </div>`;
  }).join('');
}
